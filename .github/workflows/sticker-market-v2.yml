name: Sticker Market v2 UI Rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sticker-market-v2.yml'
      - 'sticker-market-demo/v2.js'
      - 'sticker-market-demo/v2.css'
      - 'sticker-market-demo/v21.js'
      - 'sticker-market-demo/v21.css'
      - 'sticker-market-demo/v211.js'
      - 'sticker-market-demo/v212.js'
      - 'sticker-market-demo/v212.css'
      - 'sticker-market-demo/scenario_v1_core.js'
      - 'sticker-market-demo/scenario_v1_compat.js'
      - 'sticker-market-demo/scenario_v1_market.js'
      - 'sticker-market-demo/scenario_v1_ops.js'
      - 'sticker-market-demo/scenario_v1_stabilize.js'
      - 'sticker-market-demo/scenario_v1_final.js'
      - 'sticker-market-demo/scenario_v1.css'
      - 'sticker-market-demo/apply_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build single HTML
        run: python sticker-market-demo/apply_v2.py
      - name: Validate JavaScript
        run: node --check sticker-market-demo/v2.built.js
      - name: Validate build markers
        run: |
          grep -q 'Sticker Market — UI Rebuild v2.0 / Interaction v2.1.1' sticker-market-demo/index.html
          grep -q 'Sticker Market v2.1' sticker-market-demo/index.html
          grep -q 'Sticker Market v2.1.1' sticker-market-demo/index.html
          grep -q 'Sticker Market scenario-fit v1.0' sticker-market-demo/index.html
          grep -q 'S1_SCENARIO_VERSION' sticker-market-demo/index.html
          grep -q 's1EnsureManufacturing' sticker-market-demo/index.html
          grep -q 's1DemandRequestsPage' sticker-market-demo/index.html
          grep -q 's1CustomOrderDetailPage' sticker-market-demo/index.html
          grep -q 's1SupportDetailPage' sticker-market-demo/index.html
          grep -q 's1ManufacturerDashboard' sticker-market-demo/index.html
          grep -q 's1AdminAiAnalysis' sticker-market-demo/index.html
          grep -q 's1ApproveCancellation' sticker-market-demo/index.html
          grep -q 's1AdminCreatorApplications' sticker-market-demo/index.html
          grep -q 's1ApplyAiSuggestion' sticker-market-demo/index.html
          grep -q 's1NotificationTarget' sticker-market-demo/index.html
          grep -q 's1SeriesListPage' sticker-market-demo/index.html
          grep -q 'LEGAL_FOOTER_V2' sticker-market-demo/index.html
          grep -q 'creator-dashboard' sticker-market-demo/index.html
          grep -q 'checkout/shipping' sticker-market-demo/index.html
          grep -q 'openHowto' sticker-market-demo/index.html
          grep -q 'salesMetricModal' sticker-market-demo/index.html
          grep -q 'enhanceProductGallery' sticker-market-demo/index.html
          grep -q 'aiStudioQuickFilter' sticker-market-demo/index.html
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sticker-market-demo/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'feat: build Sticker Market scenario-fit v1.0'
            git push
          fi
