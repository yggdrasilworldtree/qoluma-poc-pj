name: Sticker Market v2 UI Rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sticker-market-v2.yml'
      - 'sticker-market-demo/v2.js'
      - 'sticker-market-demo/v2.css'
      - 'sticker-market-demo/v21.js'
      - 'sticker-market-demo/v21.css'
      - 'sticker-market-demo/v211.js'
      - 'sticker-market-demo/v212.js'
      - 'sticker-market-demo/v212.css'
      - 'sticker-market-demo/scenario_v1_core.js'
      - 'sticker-market-demo/scenario_v1_compat.js'
      - 'sticker-market-demo/scenario_v1_market.js'
      - 'sticker-market-demo/scenario_v1_ops.js'
      - 'sticker-market-demo/scenario_v1_stabilize.js'
      - 'sticker-market-demo/scenario_v1_final.js'
      - 'sticker-market-demo/scenario_v1.css'
      - 'sticker-market-demo/commercial_mvp_core.js'
      - 'sticker-market-demo/commercial_mvp_checkout.js'
      - 'sticker-market-demo/commercial_mvp_ops.js'
      - 'sticker-market-demo/commercial_mvp_existing_flows.js'
      - 'sticker-market-demo/commercial_mvp_finalize.js'
      - 'sticker-market-demo/commercial_mvp_hotfix.js'
      - 'sticker-market-demo/commercial_mvp_delta_v1.js'
      - 'sticker-market-demo/commercial_mvp_delta_v1_cancel.js'
      - 'sticker-market-demo/commercial_mvp_delta_v1_admin.js'
      - 'sticker-market-demo/commercial_mvp_delta_v1_review.js'
      - 'sticker-market-demo/commercial_mvp.css'
      - 'sticker-market-demo/commercial_mvp_delta_v1.css'
      - 'sticker-market-demo/commercial_mvp_contract_test.mjs'
      - 'sticker-market-demo/commercial_mvp_delta_contract_test.mjs'
      - 'sticker-market-demo/commercial_mvp_server_contract_test.mjs'
      - 'sticker-market-demo/e2e/**'
      - 'sticker-market-demo/apply_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build single HTML
        run: python sticker-market-demo/apply_v2.py
      - name: Validate JavaScript syntax
        run: |
          node --check sticker-market-demo/v2.built.js
          node --check sticker-market-demo/e2e/demo-regression.spec.mjs
          node --check sticker-market-demo/e2e/staging-mvp.spec.mjs
      - name: Validate commercial MVP contracts
        run: |
          node sticker-market-demo/commercial_mvp_contract_test.mjs
          node sticker-market-demo/commercial_mvp_delta_contract_test.mjs
      - name: Validate deployed server boundaries
        run: node sticker-market-demo/commercial_mvp_server_contract_test.mjs
      - name: Validate build markers
        run: |
          grep -q 'Sticker Market — Commercial MVP v1.0' sticker-market-demo/index.html
          grep -q 'sticker-market-commercial-mvp' sticker-market-demo/index.html
          grep -q 'sticker-market-mvp-delta' sticker-market-demo/index.html
          grep -q 'SM_MVP_DELTA_VERSION' sticker-market-demo/index.html
          grep -q 'Sticker Market scenario-fit v1.0' sticker-market-demo/index.html
          grep -q 'S1_SCENARIO_VERSION' sticker-market-demo/index.html
          grep -q 's1EnsureManufacturing' sticker-market-demo/index.html
          grep -q 's1DemandRequestsPage' sticker-market-demo/index.html
          grep -q 's1CustomOrderDetailPage' sticker-market-demo/index.html
          grep -q 's1SupportDetailPage' sticker-market-demo/index.html
          grep -q 's1ManufacturerDashboard' sticker-market-demo/index.html
          grep -q 's1AdminAiAnalysis' sticker-market-demo/index.html
          grep -q 's1ApproveCancellation' sticker-market-demo/index.html
          grep -q 's1AdminCreatorApplications' sticker-market-demo/index.html
          grep -q 's1ApplyAiSuggestion' sticker-market-demo/index.html
          grep -q 's1NotificationTarget' sticker-market-demo/index.html
          grep -q 's1SeriesListPage' sticker-market-demo/index.html
          grep -q 'LEGAL_FOOTER_V2' sticker-market-demo/index.html
          grep -q 'creator-dashboard' sticker-market-demo/index.html
          grep -q 'checkout/shipping' sticker-market-demo/index.html
          grep -q 'openHowto' sticker-market-demo/index.html
          grep -q 'salesMetricModal' sticker-market-demo/index.html
          grep -q 'enhanceProductGallery' sticker-market-demo/index.html
          grep -q 'aiStudioQuickFilter' sticker-market-demo/index.html
          grep -q 'SM_MVP_CONFIG' sticker-market-demo/index.html
          grep -q 'smMvpEnsureCheckout' sticker-market-demo/index.html
          grep -q 'smMvpUploadAndRegister' sticker-market-demo/index.html
          grep -q 'smMvpOpenUnableModal' sticker-market-demo/index.html
          grep -q 'smMvpSubmitManufacturingRevision' sticker-market-demo/index.html
          grep -q 'smMvpCompleteOrder' sticker-market-demo/index.html
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sticker-market-demo/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'feat: build Sticker Market commercial MVP v1.0'
            git push
          fi