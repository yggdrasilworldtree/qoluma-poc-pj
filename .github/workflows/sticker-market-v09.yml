name: Sticker Market v0.9 UX overhaul
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sticker-market-v09.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch demo
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('sticker-market-demo/index.html')
          s=p.read_text()
          s=s.replace('Public Demo v0.8','Public Demo v0.9')
          css='''
/* v0.9 compact search / quote / admin / seller UX */
.search-simple,.advanced-grid{align-items:end}.field input,.field select,.field textarea{background:var(--card);color:var(--text)}html[data-theme=dark] .field input,html[data-theme=dark] .field select,html[data-theme=dark] .field textarea{background:#202226;color:#fff}.range-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.compact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.active-filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.filter-pill{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 9px;font-size:12px}.quote-float{position:sticky;bottom:78px;z-index:25;background:color-mix(in srgb,var(--card) 96%,transparent);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 12px 32px #0003;display:flex;justify-content:space-between;align-items:center;gap:10px}.quote-sheet{position:fixed;inset:auto 0 0 0;z-index:100;background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);padding:18px;max-height:78vh;overflow:auto;box-shadow:0 -20px 50px #0006}.quote-sheet[hidden]{display:none}.indent{padding-left:18px;color:var(--muted);font-size:12px}.review-card{cursor:pointer}.review-card:hover{background:var(--soft)}.review-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:14px}.message-thread{display:grid;gap:8px}.bubble{padding:10px 12px;border-radius:14px;background:var(--soft)}.bubble.admin{border-left:3px solid var(--accent)}.ai-box{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 8%,var(--card));border-radius:14px;padding:12px}.order-toolbar{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:8px;margin-bottom:12px}.order-list{overflow:auto}.order-table{min-width:980px}.timeline{border-left:2px solid var(--line);padding-left:14px}.timeline div{position:relative;padding:8px 0}.timeline div:before{content:'';position:absolute;left:-20px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--accent)}.seller-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.method-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.insight-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sell-step-mobile{display:none}.sellBodyFix,.sellBodyFix *{min-width:0;max-width:100%}.sellBodyFix input[type=file]{width:100%}.app-header .brand{white-space:nowrap}
@media(max-width:900px){.compact-grid{grid-template-columns:1fr 1fr}.review-layout,.seller-hero{grid-template-columns:1fr}.method-grid{grid-template-columns:1fr}.insight-grid{grid-template-columns:1fr 1fr}.order-toolbar{grid-template-columns:1fr 1fr}.order-toolbar .wide{grid-column:1/-1}.quote-card{position:static}.quote-float{bottom:72px}.stepper{display:none}.sell-step-mobile{display:block;margin-bottom:12px}.app-header .brand{font-size:18px}.topnav .btn{padding:9px 10px}}
@media(max-width:520px){.compact-grid{grid-template-columns:1fr}.range-row{grid-template-columns:1fr auto 1fr}.order-toolbar{grid-template-columns:1fr}.insight-grid{grid-template-columns:1fr 1fr}.quote-float{left:8px;right:8px}.app-header{padding:10px 12px}.app-header .brand{font-size:17px}.searchbar input{padding:10px 12px}}
'''
          s=s.replace('</style>',css+'</style>')

          # Search UI: single extra condition, price range, compact layout, filter chips
          new_search=r'''function renderSearch(){const f=SEARCH_STATE.filters;if(f.minPrice===undefined)f.minPrice='';if(f.maxPrice===undefined)f.maxPrice='';if(!Array.isArray(f.subs))f.subs=[];if(f.subs.length>1)f.subs=f.subs.slice(0,1);const pref=sessionStorage.getItem('prefCat'),gq=sessionStorage.getItem('globalQ');if(pref){f.cat=pref;sessionStorage.removeItem('prefCat')}if(gq){f.q=gq;sessionStorage.removeItem('globalQ')}appShell(`<h1>商品を探す</h1><section class="panel"><div class="search-simple"><div class="field keyword"><label>キーワード</label><input id="sq" value="${esc(f.q)}"></div><div class="field"><label>カテゴリ</label><select id="scat"><option value="">すべて</option>${['アート','動物・ペット','アウトドア','かわいい','和風','ビジネス'].map(x=>`<option ${f.cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>素材</label><select id="smat"><option value="">すべて</option>${['耐水PET','上質紙','透明PET','クラフト紙'].map(x=>`<option ${f.material===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn accent" id="searchDo">検索</button></div><div id="subSearches" class="sub-searches"></div><button class="btn" id="addSub">＋ 条件を追加</button><button class="btn" id="advancedBtn">${SEARCH_STATE.advanced?'詳細検索を閉じる':'詳細検索'}</button><div id="advanced" class="advanced ${SEARCH_STATE.advanced?'':'hidden'}"><div class="compact-grid"><div class="field"><label>用途</label><select id="suse"><option value="">すべて</option><option>PC・スマホ</option><option>ノート</option><option>屋外</option><option>梱包</option></select></div><div class="field"><label>形状</label><select id="sshape"><option value="">すべて</option><option>ダイカット</option><option>円形</option><option>四角</option><option>角丸</option></select></div><div class="field"><label>価格帯</label><div class="range-row"><input id="smin" type="number" min="0" placeholder="下限" value="${esc(f.minPrice)}"><span>〜</span><input id="smax" type="number" min="0" placeholder="上限" value="${esc(f.maxPrice)}"></div></div><div class="field"><label>評価</label><select id="srating"><option value="0">指定なし</option><option value="4">4.0以上</option><option value="4.5">4.5以上</option></select></div><div class="field"><label><input id="sai" type="checkbox" ${f.excludeAi?'checked':''}> AI生成作品を除外</label></div></div><div id="activeFilters" class="active-filters"></div><button class="btn" id="clearFilters">条件をすべてクリア</button></div></section><div id="resultsMeta" class="results-head"></div><div id="pagerTop"></div><div id="results" class="grid"></div><div id="pagerBottom"></div>`);$('#suse').value=f.use||'';$('#sshape').value=f.shape||'';$('#srating').value=String(f.rating||0);const renderSubs=()=>{$('#subSearches').innerHTML=f.subs.length?`<div class="sub-row"><select id="subLogic"><option ${f.subs[0].logic==='AND'?'selected':''}>AND</option><option ${f.subs[0].logic==='OR'?'selected':''}>OR</option></select><input id="subQ" value="${esc(f.subs[0].q||'')}" placeholder="追加キーワード"><button class="btn" id="subDel">×</button></div>`:'';$('#addSub').disabled=f.subs.length>=1;if(f.subs.length){$('#subLogic').onchange=e=>f.subs[0].logic=e.target.value;$('#subQ').oninput=e=>f.subs[0].q=e.target.value;$('#subDel').onclick=()=>{f.subs=[];renderSubs()}}};const renderPills=()=>{const xs=[];if(f.cat)xs.push(['cat',f.cat]);if(f.material)xs.push(['material',f.material]);if(f.use)xs.push(['use',f.use]);if(f.shape)xs.push(['shape',f.shape]);if(f.minPrice||f.maxPrice)xs.push(['price',`${f.minPrice||'0'}〜${f.maxPrice||'上限なし'}円`]);if(+f.rating)xs.push(['rating',`★${f.rating}以上`]);if(f.excludeAi)xs.push(['ai','AI除外']);$('#activeFilters').innerHTML=xs.map(([k,v])=>`<button class="filter-pill" data-fk="${k}">${esc(v)} ×</button>`).join('');$$('[data-fk]').forEach(b=>b.onclick=()=>{const k=b.dataset.fk;if(k==='price'){f.minPrice='';f.maxPrice=''}else if(k==='ai')f.excludeAi=false;else if(k==='rating')f.rating='0';else f[k]='';SEARCH_STATE.page=1;saveSearchState();renderSearch()})};renderSubs();renderPills();$('#addSub').onclick=()=>{f.subs=[{logic:'AND',q:''}];renderSubs()};$('#advancedBtn').onclick=()=>{SEARCH_STATE.advanced=!SEARCH_STATE.advanced;$('#advanced').classList.toggle('hidden');$('#advancedBtn').textContent=SEARCH_STATE.advanced?'詳細検索を閉じる':'詳細検索';saveSearchState()};$('#clearFilters').onclick=()=>{Object.assign(f,{q:'',cat:'',material:'',use:'',shape:'',minPrice:'',maxPrice:'',rating:'0',excludeAi:false,subs:[]});SEARCH_STATE.page=1;saveSearchState();renderSearch()};$('#searchDo').onclick=()=>{Object.assign(f,{q:$('#sq').value,cat:$('#scat').value,material:$('#smat').value,use:$('#suse').value,shape:$('#sshape').value,minPrice:$('#smin').value,maxPrice:$('#smax').value,rating:$('#srating').value,excludeAi:$('#sai').checked});SEARCH_STATE.page=1;saveSearchState();renderPills();renderSearchResults();toast(`${getSearchResults().length}件見つかりました`)};renderSearchResults()}'''
          s=re.sub(r'function renderSearch\(\).*?function renderProduct',new_search+'function renderProduct',s,flags=re.S)
          # pricing filter logic
          s=s.replace("if(f.maxPrice)r=r.filter(p=>Math.min(Number(p.digital||999999),Number(p.physical||999999))<=+f.maxPrice);","if(f.minPrice)r=r.filter(p=>Math.min(Number(p.digital||999999),Number(p.physical||999999))>=+f.minPrice);if(f.maxPrice)r=r.filter(p=>Math.min(Number(p.digital||999999),Number(p.physical||999999))<=+f.maxPrice);")

          # Create screen quote hierarchy
          new_create=r'''function renderCreate(){const draft={file:null,dataUrl:'',shape:'diecut',material:'waterproof',finish:'none',size:50,qty:10,width:0,height:0,address:'東京都新宿区'};const materials={matte:{label:'マット紙',mult:1},gloss:{label:'光沢紙',mult:1.05},waterproof:{label:'耐水PET',mult:1.15},transparent:{label:'透明PET',mult:1.25},holo:{label:'ホログラム',mult:1.4},craft:{label:'クラフト紙',mult:1.1}};const finishes={none:{label:'加工なし',mult:1},matte:{label:'マットラミネート',mult:1.08},gloss:{label:'グロスラミネート',mult:1.1},holo:{label:'ホログラム加工',mult:1.25}};const shapes=[['diecut','ダイカット','✿'],['circle','円形','●'],['square','正方形','■'],['rounded','角丸','▣'],['oval','楕円','⬭'],['heart','ハート','♥'],['star','星','★']];const quote=()=>{const sizeFactor=Math.pow(draft.size/50,1.35),bulk=draft.qty>=500?.48:draft.qty>=100?.62:draft.qty>=50?.72:draft.qty>=20?.84:draft.qty>=10?.92:1;const base=Math.max(50,Math.round(150*sizeFactor*bulk)),mat=Math.round(base*(materials[draft.material].mult-1)),fin=Math.round((base+mat)*(finishes[draft.finish].mult-1)),unit=base+mat+fin,subtotal=unit*draft.qty,shipping=subtotal>=5000?0:350,tax=Math.floor((subtotal+shipping)*.1);return{base,mat,fin,unit,subtotal,shipping,tax,total:subtotal+shipping+tax}};appShell(`<div class="eyebrow">CUSTOM STICKER</div><h1>オリジナルシールを作る</h1><div class="custom-builder"><div class="custom-left"><section class="panel"><h2>1. 画像をアップロード</h2><div class="upload-zone"><input id="customFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><p class="muted">PNG / JPG / WEBP / SVG。高解像度画像を推奨します。</p></div><div id="qualityBox" class="quality-box">画像を選択すると印刷品質の目安を表示します。</div></section><section class="panel" style="margin-top:14px"><h2>2. 仕様を選択</h2><div class="field"><label>形状</label><div class="choice-grid">${shapes.map(([v,l,ic])=>`<button class="choice ${v===draft.shape?'selected':''}" data-shape="${v}"><b>${ic}</b>${l}</button>`).join('')}</div></div><div class="field"><label>素材</label><select id="materialSel">${Object.entries(materials).map(([v,m])=>`<option value="${v}" ${v===draft.material?'selected':''}>${m.label}</option>`).join('')}</select></div><div class="compact-grid"><div class="field"><label>加工</label><select id="finishSel">${Object.entries(finishes).map(([v,m])=>`<option value="${v}">${m.label}</option>`).join('')}</select></div><div class="field"><label>サイズ</label><select id="sizeSel">${[30,50,70,100].map(v=>`<option value="${v}" ${v===50?'selected':''}>${v}mm</option>`).join('')}</select></div><div class="field"><label>数量</label><select id="qtySel">${[1,5,10,20,50,100,500,1000].map(v=>`<option value="${v}" ${v===10?'selected':''}>${v}枚</option>`).join('')}</select></div></div></section></div><aside class="custom-right"><div id="customStage" class="custom-stage"><div id="stickerPreview" class="sticker-preview shape-diecut"><div class="empty-art">＋</div></div></div><div class="panel" style="margin-top:10px"><b>仕上がりイメージ</b><div id="specSummary" class="muted"></div></div></aside></div><div id="quoteFloat" class="quote-float"><div><small>見積合計</small><div class="quote-total" id="qTotal"></div></div><button class="btn" id="quoteDetail">見積詳細</button><button class="btn accent" id="customCart">カートに追加</button></div><div id="quoteSheet" class="quote-sheet" hidden><div class="row"><h2>見積詳細</h2><button class="btn" id="quoteClose">× 閉じる</button></div><div class="row"><span>ステッカー単価（1枚）</span><b id="qUnit"></b></div><div class="row"><div>商品小計<div class="indent" id="qBreakdown"></div></div><b id="qSub"></b></div><div class="row"><div>送料<div class="indent"><button class="link" id="addressEdit"></button></div></div><b id="qShip"></b></div><div class="row"><span>消費税（日本・10%）</span><b id="qTax"></b></div><div class="row"><span>合計</span><span class="quote-total" id="qTotal2"></span></div></div>` ,{hideSearch:true});const shapeLabel=()=>shapes.find(x=>x[0]===draft.shape)?.[1]||draft.shape;const redraw=()=>{const pr=$('#stickerPreview');pr.className=`sticker-preview shape-${draft.shape}`;pr.innerHTML=draft.dataUrl?`<img src="${draft.dataUrl}">`:'<div class="empty-art">＋</div>';$('#specSummary').textContent=`${shapeLabel()} / ${materials[draft.material].label} / ${draft.size}mm / ${draft.qty}枚`;const q=quote();$('#qTotal').textContent=yen(q.total);$('#qTotal2').textContent=yen(q.total);$('#qUnit').textContent=yen(q.unit);$('#qSub').textContent=yen(q.subtotal);$('#qShip').textContent=yen(q.shipping);$('#qTax').textContent=yen(q.tax);$('#qBreakdown').innerHTML=`基本印刷 ${yen(q.base)} × ${draft.qty}枚<br>素材加算 ${yen(q.mat)} × ${draft.qty}枚<br>加工加算 ${yen(q.fin)} × ${draft.qty}枚`;$('#addressEdit').textContent=`${draft.address}へ配送　変更 >`};$('#customFile').onchange=e=>{const f=e.target.files[0];if(!f)return;draft.file=f;const r=new FileReader();r.onload=()=>{draft.dataUrl=r.result;redraw();$('#qualityBox').textContent=`${f.name} を読み込みました。`};r.readAsDataURL(f)};$$('[data-shape]').forEach(b=>b.onclick=()=>{draft.shape=b.dataset.shape;$$('[data-shape]').forEach(x=>x.classList.toggle('selected',x===b));redraw()});$('#materialSel').onchange=e=>{draft.material=e.target.value;redraw()};$('#finishSel').onchange=e=>{draft.finish=e.target.value;redraw()};$('#sizeSel').onchange=e=>{draft.size=+e.target.value;redraw()};$('#qtySel').onchange=e=>{draft.qty=+e.target.value;redraw()};$('#quoteDetail').onclick=()=>$('#quoteSheet').hidden=false;$('#quoteClose').onclick=()=>$('#quoteSheet').hidden=true;$('#addressEdit').onclick=()=>modal(`<h2>お届け先を変更</h2><div class="field"><label>配送先</label><input id="addrInput" value="${esc(draft.address)}"></div><div class="rowBtns"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn accent" onclick="draftAddrSave()">変更する</button></div>`);window.draftAddrSave=()=>{draft.address=$('#addrInput').value||draft.address;closeModal();redraw()};$('#customCart').onclick=()=>{if(!draft.file){toast('先に画像を選択してください');return}const q=quote();state.cart.push({id:'custom'+Date.now(),name:`オリジナルシール / ${shapeLabel()} / ${materials[draft.material].label}`,price:q.total});save();go('cart')};redraw()}'''
          s=re.sub(r'function renderCreate\(\).*?function renderFavorites',new_create+'function renderFavorites',s,flags=re.S)

          # Review management details
          new_review=r'''function renderAdminReview(){adminPage('商品審査',`<section class="panel">${[['r1','星空ステッカー','Haru Creator'],['r2','花束ラベル','sora design'],['r3','黒猫シール','mignon']].map(([id,n,c])=>`<div class="row review-card" onclick="go('admin-review-detail/${id}')"><div><b>${n}</b><div class="muted">${c} / 審査申請中</div></div><span>詳細を見る ›</span></div>`).join('')}</section>`)}function renderAdminReviewDetail(id){const data={r1:['星空ステッカー','Haru Creator'],r2:['花束ラベル','sora design'],r3:['黒猫シール','mignon']}[id]||['商品','Creator'];adminPage('商品審査詳細',`<div class="review-layout"><section class="panel"><div class="eyebrow">APPLICATION</div><h2>${data[0]}</h2><div class="row"><span>出品者</span><b>${data[1]}</b></div><div class="row"><span>申請状態</span><span class="badge">人間審査中</span></div><div class="row"><span>ライセンス</span><b>個人・商用利用</b></div><div class="row"><span>AI生成申告</span><b>なし</b></div><div class="ai-box"><b>AI審査要約</b><p>重大な禁止事項は検出されていません。商品説明に商用利用範囲の追記を推奨します。</p><b>推奨：条件付き承認</b></div><div class="rowBtns" style="margin-top:12px"><button class="btn accent" onclick="toast('承認しました')">承認</button><button class="btn" onclick="toast('差し戻しました')">差し戻し</button><button class="btn" onclick="toast('公開停止しました')">公開停止</button></div></section><section class="panel"><h3>出品者とのメッセージ</h3><div class="message-thread"><div class="bubble admin"><b>管理者</b><br>商用利用範囲の説明を追記してください。</div><div class="bubble"><b>${data[1]}</b><br>説明を修正しました。ご確認ください。</div></div><div class="field"><textarea id="reviewMsg" placeholder="メッセージを入力"></textarea></div><button class="btn accent" onclick="toast('メッセージを送信しました')">送信</button><button class="btn" onclick="$('#reviewMsg').value='商用利用範囲について、対象となる利用方法を明記してください。'">AIで差し戻し文案を作成</button></section></div>`)}'''
          s=re.sub(r'function renderAdminReview\(\).*?function renderAdminOrders',new_review+'function renderAdminOrders',s,flags=re.S)

          # order management
          new_orders=r'''function renderAdminOrders(){adminPage('注文管理',`<div class="order-toolbar"><input class="wide" id="ordQ" placeholder="注文番号・購入者・商品を検索"><select><option>決済状態：すべて</option><option>決済完了</option><option>返金</option></select><select><option>製造状態：すべて</option><option>製造待ち</option><option>製造中</option></select><select><option>配送状態：すべて</option><option>発送準備</option><option>発送済み</option></select><button class="btn accent" onclick="toast('絞り込みました')">検索</button></div><section class="panel order-list"><table class="table order-table"><tr><th>注文番号</th><th>注文日時</th><th>購入者</th><th>商品</th><th>金額</th><th>決済</th><th>製造</th><th>配送</th><th>担当</th></tr>${[['ORD-1001','8/10 12:01','Demo User','星空ステッカー','¥1,903','完了','製造中','発送準備','田中'],['ORD-1002','8/10 11:20','user02','黒猫シール','¥2,320','完了','完了','発送済み','佐藤']].map(r=>`<tr onclick="go('admin-order-detail/${r[0]}')" style="cursor:pointer">${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></section>`)}function renderAdminOrderDetail(id){adminPage('伝票詳細',`<div class="split"><section class="panel"><div class="eyebrow">ORDER</div><h2>${id}</h2><div class="row"><span>購入者</span><b>Demo User</b></div><div class="row"><span>配送先</span><b>東京都新宿区...</b></div><h3>商品</h3><div class="row"><div>星空ステッカー<div class="indent">耐水PET / 50mm / 10枚</div></div><b>¥1,480</b></div><h3>金額</h3><div class="row"><span>商品合計</span><b>¥1,480</b></div><div class="row"><span>送料</span><b>¥250</b></div><div class="row"><span>税</span><b>¥173</b></div><div class="row"><span>総額</span><b>¥1,903</b></div></section><section class="panel"><h3>処理状況</h3><div class="timeline"><div><b>8/10 12:01</b><br>注文受付</div><div><b>8/10 12:02</b><br>決済完了</div><div><b>8/10 13:40</b><br>印刷会社へ発注</div><div><b>8/11 09:20</b><br>製造開始</div></div><h3>配送</h3><div class="field"><label>配送会社</label><input value="ヤマト運輸"></div><div class="field"><label>追跡番号</label><input value="1234-5678-9012"></div><button class="btn accent" onclick="toast('伝票を更新しました')">更新</button></section></div>`)}'''
          s=re.sub(r'function renderAdminOrders\(\).*?function renderAdminUsers',new_orders+'function renderAdminUsers',s,flags=re.S)

          # Creator seller home
          new_cd=r'''function renderCreatorDash(){appShell(`<section class="seller-hero"><div><div class="eyebrow">CREATOR CENTER</div><h1>販売を始める</h1><p class="muted">売り方を選び、デザイン登録から販売開始まで進めます。</p></div><div class="ai-box"><b>AI販売アドバイス</b><p>透明PET × 小型ステッカーの閲覧が増加中です。商品画像3枚以上の作品は購入率が高い傾向があります。</p></div></section><div class="method-grid"><div class="method-card"><h3>デザインデータを販売</h3><p>購入者がデータをダウンロード。</p><button class="btn accent" onclick="go('sell')">この方法で始める</button></div><div class="method-card"><h3>シール商品として販売</h3><p>印刷・配送まで含めて販売。</p><button class="btn" onclick="go('sell')">この方法で始める</button></div><div class="method-card"><h3>データ＋シール</h3><p>両方の販売形式を用意。</p><button class="btn" onclick="go('sell')">この方法で始める</button></div></div><h2>販売サマリ</h2><div class="insight-grid"><div class="panel kpi"><b>¥45,300</b>今月売上</div><div class="panel kpi"><b>32</b>販売件数</div><div class="panel kpi"><b>1,248</b>閲覧</div><div class="panel kpi"><b>2.6%</b>CVR</div></div><div class="split" style="margin-top:14px"><section class="panel"><h3>現在売れているカテゴリ</h3><div class="row"><span>1. かわいい</span><b>28%</b></div><div class="row"><span>2. 動物</span><b>21%</b></div><div class="row"><span>3. ビジネス</span><b>16%</b></div></section><section class="panel"><h3>価格参考</h3><p>同カテゴリ中央値 <b>¥480</b></p><p>あなたの平均 <b>¥620</b></p><button class="btn" onclick="go('creator/c1')">自分の販売ページを見る</button></section></div>`)}'''
          s=re.sub(r'function renderCreatorDash\(\).*?function renderSell',new_cd+'function renderSell',s,flags=re.S)

          # make sell form mobile-safe and mobile step summary
          s=s.replace("appShell(`<h1>商品を販売</h1><div class=\"stepper\">","appShell(`<h1>商品を販売</h1><div class=\"sell-step-mobile panel\"><b>STEP ${sellDraft.step} / 5</b><div class=\"muted\">${['','デザイン登録','基本情報','検索設定','販売設定','確認'][sellDraft.step]}</div></div><div class=\"stepper\">")
          s=s.replace('<section class="panel" id="sellBody"></section>','<section class="panel sellBodyFix" id="sellBody"></section>')

          # route additions
          s=s.replace("'admin-review':renderAdminReview,'admin-orders':renderAdminOrders", "'admin-review':renderAdminReview,'admin-orders':renderAdminOrders")
          s=s.replace("}[page]||(()=>page==='product'?renderProduct(id):page==='creator'?renderCreator(id):renderHome))();", "}[page]||(()=>page==='product'?renderProduct(id):page==='creator'?renderCreator(id):page==='admin-review-detail'?renderAdminReviewDetail(id):page==='admin-order-detail'?renderAdminOrderDetail(id):renderHome))();")
          p.write_text(s)
      - name: Validate
        run: |
          grep -q 'Public Demo v0.9' sticker-market-demo/index.html
          grep -q 'admin-review-detail' sticker-market-demo/index.html
          grep -q 'quote-sheet' sticker-market-demo/index.html
          grep -q '販売を始める' sticker-market-demo/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sticker-market-demo/index.html
          git commit -m 'Upgrade Sticker Market UX to v0.9' || exit 0
