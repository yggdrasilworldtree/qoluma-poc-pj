name: Sticker Market v0.9 legacy notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy workflow retired
        run: |
          echo 'Sticker Market v0.9 patch workflow is retired.'
          echo 'The canonical build is .github/workflows/sticker-market-v2.yml.'
          echo 'Existing v0.9 behavior remains represented in the current v2/scenario source; this workflow must not patch generated index.html.'
