name: Sticker Market v1.6.1 hotfix
on:
  push:
    paths:
      - 'sticker-market-demo/v161.js'
      - 'sticker-market-demo/v161.css'
      - 'sticker-market-demo/apply_v161.py'
      - '.github/workflows/sticker-market-v161.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.6.1
        run: python sticker-market-demo/apply_v161.py
      - name: Validate v1.6.1 JavaScript
        run: node --check sticker-market-demo/v161.js
      - name: Validate focused hotfix markers
        run: |
          grep -q 'Public Demo v1.6.1' sticker-market-demo/index.html
          grep -q 'V161_JS_START' sticker-market-demo/index.html
          grep -q 'V161_CSS_START' sticker-market-demo/index.html
          grep -q 'performLogout' sticker-market-demo/index.html
          grep -q 'data-shopcat' sticker-market-demo/index.html
      - name: Commit v1.6.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sticker-market-demo/index.html
          git diff --cached --quiet || git commit -m "Update Sticker Market demo to v1.6.1"
          git push
