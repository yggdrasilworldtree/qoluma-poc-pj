name: Sticker Market STAGING MVP E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sticker-market-staging-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      SM_E2E_BASE_URL: https://sticker-market-vercel-migration.vercel.app
      SM_FIXTURE_URL: https://oodalamuvycoajdrdszi.supabase.co/functions/v1/sm-staging-fixtures
      SM_PUBLIC_CONFIG_URL: https://oodalamuvycoajdrdszi.supabase.co/functions/v1/sm-public-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect STAGING Stripe runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$(curl -fsSL "$SM_PUBLIC_CONFIG_URL")"
          MODE="$(echo "$CONFIG" | jq -r '.mode // ""')"
          PAYMENT="$(echo "$CONFIG" | jq -r '.paymentConfigured // false')"
          API_READY="$(echo "$CONFIG" | jq -r '.publicApiReady // false')"
          KEY_KIND="$(echo "$CONFIG" | jq -r 'if (.stripePublishableKey // "") | startswith("pk_test_") then "pk_test" elif (.stripePublishableKey // "") | startswith("pk_live_") then "pk_live" else "missing_or_invalid" end')"
          echo "STAGING runtime: mode=$MODE paymentConfigured=$PAYMENT publicApiReady=$API_READY stripeKeyType=$KEY_KIND"
          test "$MODE" = "STAGING"
          test "$API_READY" = "true"
          if [ "$KEY_KIND" = "pk_live" ]; then
            echo "Refusing to run STAGING E2E with a live Stripe publishable key" >&2
            exit 1
          fi
          if [ "$PAYMENT" = "true" ] && [ "$KEY_KIND" = "pk_test" ]; then
            echo "SM_STRIPE_READY=true" >> "$GITHUB_ENV"
          else
            echo "SM_STRIPE_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Provision isolated STAGING fixtures with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BUYER_EMAIL="sm-e2e-buyer+${RUN_KEY}@example.test"
          APPLICANT_EMAIL="sm-e2e-applicant+${RUN_KEY}@example.test"
          ADMIN_EMAIL="sm-e2e-admin+${RUN_KEY}@example.test"
          MANUFACTURER_EMAIL="sm-e2e-manufacturer+${RUN_KEY}@example.test"
          BUYER_PASSWORD="SmE2E-B-$(openssl rand -hex 16)"
          APPLICANT_PASSWORD="SmE2E-A-$(openssl rand -hex 16)"
          ADMIN_PASSWORD="SmE2E-D-$(openssl rand -hex 16)"
          MANUFACTURER_PASSWORD="SmE2E-M-$(openssl rand -hex 16)"
          echo "::add-mask::$BUYER_PASSWORD"
          echo "::add-mask::$APPLICANT_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$MANUFACTURER_PASSWORD"

          OIDC_TOKEN="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sticker-market-staging-fixture" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"

          BODY="$(jq -n \
            --arg runId "$RUN_KEY" \
            --arg buyerEmail "$BUYER_EMAIL" --arg buyerPassword "$BUYER_PASSWORD" \
            --arg applicantEmail "$APPLICANT_EMAIL" --arg applicantPassword "$APPLICANT_PASSWORD" \
            --arg adminEmail "$ADMIN_EMAIL" --arg adminPassword "$ADMIN_PASSWORD" \
            --arg manufacturerEmail "$MANUFACTURER_EMAIL" --arg manufacturerPassword "$MANUFACTURER_PASSWORD" \
            '{runId:$runId,buyer:{email:$buyerEmail,password:$buyerPassword},applicant:{email:$applicantEmail,password:$applicantPassword},admin:{email:$adminEmail,password:$adminPassword},manufacturer:{email:$manufacturerEmail,password:$manufacturerPassword}}')"

          RESPONSE="$(curl -fsSL -X POST "$SM_FIXTURE_URL" -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$BODY")"
          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null
          PRODUCT_ID="$(echo "$RESPONSE" | jq -r '.productId')"
          MANUFACTURER_ID="$(echo "$RESPONSE" | jq -r '.manufacturerId')"
          test -n "$PRODUCT_ID" && test "$PRODUCT_ID" != "null"
          test -n "$MANUFACTURER_ID" && test "$MANUFACTURER_ID" != "null"

          {
            echo "SM_STAGING_BUYER_EMAIL=$BUYER_EMAIL"
            echo "SM_STAGING_BUYER_PASSWORD=$BUYER_PASSWORD"
            echo "SM_STAGING_APPLICANT_EMAIL=$APPLICANT_EMAIL"
            echo "SM_STAGING_APPLICANT_PASSWORD=$APPLICANT_PASSWORD"
            echo "SM_STAGING_ADMIN_EMAIL=$ADMIN_EMAIL"
            echo "SM_STAGING_ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "SM_STAGING_MANUFACTURER_EMAIL=$MANUFACTURER_EMAIL"
            echo "SM_STAGING_MANUFACTURER_PASSWORD=$MANUFACTURER_PASSWORD"
            echo "SM_STAGING_PRODUCT_ID=$PRODUCT_ID"
            echo "SM_STAGING_MANUFACTURER_ID=$MANUFACTURER_ID"
          } >> "$GITHUB_ENV"

      - name: Preflight STAGING fixture contract
        shell: bash
        run: |
          set -euo pipefail
          for k in SM_STAGING_BUYER_EMAIL SM_STAGING_BUYER_PASSWORD SM_STAGING_APPLICANT_EMAIL SM_STAGING_APPLICANT_PASSWORD SM_STAGING_ADMIN_EMAIL SM_STAGING_ADMIN_PASSWORD SM_STAGING_MANUFACTURER_EMAIL SM_STAGING_MANUFACTURER_PASSWORD SM_STAGING_PRODUCT_ID SM_STAGING_MANUFACTURER_ID; do
            if [ -z "${!k:-}" ]; then echo "Missing generated STAGING fixture: $k"; exit 1; fi
          done

      - name: Align Stripe Elements frame discovery for current Stripe.js
        if: env.SM_STRIPE_READY == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sticker-market-demo/e2e/staging-mvp.spec.mjs')
          s=p.read_text()
          old='''async function fillStripeCard(page){const frame=page.frameLocator('iframe[title*="Secure card payment input frame"]').first();await frame.locator('input[name="cardnumber"]').fill('4242424242424242');await frame.locator('input[name="exp-date"]').fill('1234');await frame.locator('input[name="cvc"]').fill('123')}'''
          new='''async function fillStripeCard(page){let cardFrame=null;await expect.poll(async()=>{for(const f of page.frames()){if(await f.locator('input[name="cardnumber"]').count()){cardFrame=f;return true}}return false},{timeout:20000}).toBe(true);await cardFrame.locator('input[name="cardnumber"]').fill('4242424242424242');await cardFrame.locator('input[name="exp-date"]').fill('1234');await cardFrame.locator('input[name="cvc"]').fill('123')}'''
          if old not in s:
              raise SystemExit('expected Stripe card helper not found')
          p.write_text(s.replace(old,new))
          PY

      - name: Validate E2E syntax
        run: node --check sticker-market-demo/e2e/staging-mvp.spec.mjs

      - name: Install Playwright
        working-directory: sticker-market-demo/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run full eight MVP flows against STAGING
        if: env.SM_STRIPE_READY == 'true'
        working-directory: sticker-market-demo/e2e
        run: npm run staging

      - name: Run payment-independent listing and moderation acceptance
        if: env.SM_STRIPE_READY != 'true'
        working-directory: sticker-market-demo/e2e
        run: npx playwright test staging-mvp.spec.mjs --project=chromium-mobile --grep 'E2E-0[23]'

      - name: Formal release gate - Stripe Test Mode required
        if: env.SM_STRIPE_READY != 'true'
        shell: bash
        run: |
          echo "STAGING payment acceptance remains blocked: configure STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET and STRIPE_PUBLISHABLE_KEY (pk_test_*) in Supabase Edge Function secrets." >&2
          exit 1

# one-time push trigger for formal acceptance; post-save route decoupled
