name: Sticker Market v1.1 patch
on:
  push:
    paths:
      - '.github/workflows/sticker-market-v11.yml'
      - '.github/scripts/patch_sticker_v11.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_sticker_v11.py
      - name: Validate
        run: |
          grep -q 'Public Demo v1.1.0' sticker-market-demo/index.html
          grep -q '関連する検索をもっと見る' sticker-market-demo/index.html
          grep -q 'AIによるレビュー要約' sticker-market-demo/index.html
          grep -q 'Sticker Marketで「売りたい」' sticker-market-demo/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('sticker-market-demo/index.html').read_text()
          js=re.search(r'<script>(.*)</script>',s,re.S).group(1)
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Sticker Market Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sticker-market-demo/index.html
          git commit -m 'Upgrade Sticker Market public demo to v1.1.0'
          git push
