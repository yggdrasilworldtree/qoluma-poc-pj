name: Sticker Market v1.6 patch
on:
  push:
    paths:
      - 'sticker-market-demo/v16.js'
      - 'sticker-market-demo/v16.css'
      - 'sticker-market-demo/apply_v16.py'
      - '.github/workflows/sticker-market-v16.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.6
        run: python sticker-market-demo/apply_v16.py
      - name: Validate v1.6 JavaScript
        run: node --check sticker-market-demo/v16.js
      - name: Validate embedded markers
        run: |
          grep -q 'Public Demo v1.6.0' sticker-market-demo/index.html
          grep -q 'V16_JS_START' sticker-market-demo/index.html
          grep -q 'V16_CSS_START' sticker-market-demo/index.html
          grep -q 'v16IsolationPage' sticker-market-demo/index.html
          grep -q 'v16ModerationPage' sticker-market-demo/index.html
          grep -q 'v16IntegrityPage' sticker-market-demo/index.html
      - name: Commit v1.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sticker-market-demo/index.html
          git diff --cached --quiet || git commit -m "Update Sticker Market demo to v1.6.0"
          git push
