name: Temporary Sticker E2E Selector Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-sticker-e2e-selector-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selector and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          p=Path('sticker-market-demo/e2e/staging-mvp.spec.mjs')
          s=p.read_text(encoding='utf-8')
          old="page.getByRole('button',{name:'ログイン',exact:true}).click()"
          new="page.locator('#main').getByRole('button',{name:'ログイン',exact:true}).click()"
          if old not in s:
              raise SystemExit('target selector not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/_tmp-sticker-e2e-selector-fix.yml').unlink()
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sticker-market-demo/e2e/staging-mvp.spec.mjs .github/workflows/_tmp-sticker-e2e-selector-fix.yml
          git commit -m 'test: scope STAGING login selector to form'
          git push