name: Run Sticker Market v0.9 patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sticker-market-v09-run.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute stored patch
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/sticker-market-v09.yml').read_text()
          start=w.index('          from pathlib import Path')
          end=w.index('      - name: Validate')
          block=w[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code,'sticker_v09_patch.py','exec'))
          PY
      - name: Validate requested changes
        run: |
          grep -q 'Public Demo v0.9' sticker-market-demo/index.html
          grep -q 'admin-review-detail' sticker-market-demo/index.html
          grep -q 'quote-sheet' sticker-market-demo/index.html
          grep -q '販売を始める' sticker-market-demo/index.html
      - name: Commit patched demo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sticker-market-demo/index.html
          git commit -m 'Upgrade Sticker Market UX to v0.9' || exit 0
          git push
