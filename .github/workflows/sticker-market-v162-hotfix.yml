name: Sticker Market v1.6.2 one-shot hotfix

on:
  push:
    paths:
      - '.github/workflows/sticker-market-v162-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Sticker Market
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('sticker-market-demo/index.html')
          snippet = Path('sticker-market-demo/v162-hotfix-snippet.html')
          text = index.read_text(encoding='utf-8')
          if 'V162_HOTFIX_START' not in text:
              patch = snippet.read_text(encoding='utf-8')
              needle = '</body></html>'
              if needle not in text:
                  raise SystemExit('closing body/html marker not found')
              text = text.replace(needle, patch + '\n' + needle, 1)
              index.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and clean temporary files
        run: |
          git config user.name "Sticker Market Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/sticker-market-v162-hotfix.yml
          git rm sticker-market-demo/v162-hotfix-snippet.html
          git add sticker-market-demo/index.html
          git commit -m "fix: polish AI studio and mobile text layout"
          git push
