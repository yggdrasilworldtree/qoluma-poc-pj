name: Sticker Market v1.6.2 one-shot hotfix

on:
  push:
    paths:
      - '.github/workflows/sticker-market-v162-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Sticker Market
        shell: python
        run: |
          from pathlib import Path

          path = Path('sticker-market-demo/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'V162_HOTFIX_START'

          if marker not in text:
              injection = r'''
<style>
/* V162_HOTFIX_START */
/* Sticker Market v1.6.2 — AI Studio / busy state / mobile text-layout hotfix */

/* v1.6 process overlay: hidden must always win over display:flex. */
.v16-process[hidden]{display:none!important}

/* AI Studio heading and help actions. */
.v162-ai-header{align-items:flex-start;gap:12px}
.v162-ai-head-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;flex:0 0 auto}
.v162-ai-help{width:44px;min-width:44px;padding:0!important;display:grid;place-items:center;font-size:20px;border-radius:50%}
.v162-ai-help-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.v162-ai-help-card{border:1px solid var(--line);border-radius:13px;background:var(--soft);padding:11px;min-width:0}
.v162-ai-help-card b{display:block;margin-bottom:3px}
.v162-ai-help-steps{margin:12px 0 0;padding-left:1.35em}
.v162-ai-help-steps li{margin:7px 0}

/* Let category labels remain readable instead of clipping in a single strip. */
.ai-cat-tabs{scrollbar-width:none}
.ai-cat-tabs::-webkit-scrollbar{display:none}
.ai-cat-tabs button{min-width:max-content;line-height:1.25}

/* Text-layout audit: never crop controls; allow height to grow when needed. */
button,.btn,.my-link,.v16-area,.admin-tabs button,.work-tabs button{
  text-overflow:clip;
}
.v162-text-risk{
  overflow:visible!important;
  text-overflow:clip!important;
  height:auto!important;
  min-height:44px;
  line-height:1.3;
  text-wrap:balance;
}
.v162-force-break{line-height:1.25;text-align:center;white-space:normal!important}
.v162-force-break span{white-space:nowrap}

@media(max-width:700px){
  .ai-cat-tabs{
    display:grid!important;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    overflow:visible!important;
    padding:8px 0;
  }
  .ai-cat-tabs button{
    width:100%;
    min-width:0!important;
    max-width:100%;
    white-space:normal!important;
    overflow:visible!important;
    padding:10px 7px;
    font-size:13px;
    text-align:center;
    word-break:keep-all;
  }
  .v162-ai-help-grid{grid-template-columns:1fr}
}

@media(max-width:480px){
  .ai-cat-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v162-ai-header{display:block!important}
  .v162-ai-head-actions{margin-top:10px;justify-content:stretch}
  .v162-ai-head-actions>.btn:not(.v162-ai-help){flex:1 1 auto;min-width:0}
  .v162-ai-help{flex:0 0 44px!important}
  .row>.btn.v162-force-break{flex:0 0 auto;min-width:88px;max-width:112px}
  .admin-tabs button,.work-tabs button{white-space:nowrap;flex:0 0 auto}
}
/* V162_HOTFIX_END */
</style>
<script>
/* V162_HOTFIX_START */
(function(){
  const AI_HELP = [
    ['商品制作','商品説明・メリット・用途説明など、商品ページの文章づくりを支援します。'],
    ['SEO・タグ','検索されやすい商品名・タグ・関連キーワードを整理します。'],
    ['価格','現在価格や販売条件を材料に、価格候補や検討ポイントを出します。'],
    ['分析','閲覧・売上・CVRなどから、改善すべき箇所を整理します。'],
    ['広告','SNS投稿文や短い広告コピー、新作告知の案を作ります。'],
    ['顧客対応','購入者からの質問・返品・納期相談への返信案を作ります。'],
    ['審査対応','商品審査の差し戻し理由や、権利確認事項への対応を整理します。'],
    ['トレンド','季節・カテゴリ・需要傾向から、次の商品テーマ候補を考えます。']
  ];

  function openAiHelp(){
    if(typeof modal!=='function')return;
    modal(`<div class="row"><div><h2 style="margin:0">AIスタジオの使い方</h2><p class="muted" style="margin:4px 0 0">目的に合うAIを選び、提案を確認してから必要な内容だけ適用します。</p></div><button class="btn" onclick="closeModal()" aria-label="ヘルプを閉じる">×</button></div>
      <div class="v162-ai-help-grid">${AI_HELP.map(x=>`<div class="v162-ai-help-card"><b>${esc(x[0])}</b><span class="muted">${esc(x[1])}</span></div>`).join('')}</div>
      <h3>基本の流れ</h3>
      <ol class="v162-ai-help-steps">
        <li>カテゴリまたは検索から、目的に合うAIを選ぶ</li>
        <li>「使う」をタップし、対象商品または商品登録中の下書きを選ぶ</li>
        <li>テンプレートを選ぶか、相談内容を入力する</li>
        <li>必要なら「現在の商品情報を使う」で商品情報をAIへ渡す</li>
        <li>「実行（デモ）」で提案を見る</li>
        <li>変更前後を確認し、必要な提案だけ適用する</li>
        <li>合わなければ「直前の適用を元に戻す」で戻す</li>
      </ol>
      <div class="v16-confirm-summary"><b>PUBLIC DEMO</b><br>現在のAI出力は模擬処理です。本番の外部AI/API処理ではありません。</div>`);
  }
  window.v162OpenAiHelp = openAiHelp;

  function enhanceAiStudio(){
    const main=document.querySelector('.app-main');
    if(!main)return;
    const title=[...main.querySelectorAll('h1')].find(x=>(x.textContent||'').trim()==='AIスタジオ');
    if(!title)return;
    const row=title.closest('.row');
    if(row&&!row.classList.contains('v162-ai-header')){
      row.classList.add('v162-ai-header');
      const directButtons=[...row.children].filter(x=>x.matches?.('button.btn'));
      const actions=document.createElement('div');
      actions.className='v162-ai-head-actions';
      directButtons.forEach(b=>actions.appendChild(b));
      const help=document.createElement('button');
      help.type='button';
      help.className='btn v162-ai-help';
      help.setAttribute('aria-label','AIスタジオの使い方');
      help.setAttribute('title','AIスタジオの使い方');
      help.textContent='?';
      help.onclick=openAiHelp;
      actions.appendChild(help);
      row.appendChild(actions);
    }
  }

  function forceKnownBreaks(root=document){
    root.querySelectorAll('button').forEach(b=>{
      if(b.dataset.v162BreakDone==='1')return;
      const text=(b.textContent||'').replace(/\s+/g,'').trim();
      if(text==='管理トップ'){
        b.innerHTML='<span>管理</span><br><span>トップ</span>';
        b.classList.add('v162-force-break');
        b.dataset.v162BreakDone='1';
        return;
      }
      if(text==='直前の適用を元に戻す'){
        b.innerHTML='<span>直前の適用を</span><wbr><span>元に戻す</span>';
        b.classList.add('v162-text-risk');
        b.dataset.v162BreakDone='1';
      }
    });
  }

  function naturalWrapAudit(root=document){
    const candidates=root.querySelectorAll('button,.btn,.my-link,.v16-area,.admin-tabs button,.work-tabs button');
    candidates.forEach(el=>{
      if(el.closest('.mobile-nav'))return;
      const clipped=el.scrollWidth>el.clientWidth+2;
      if(!clipped)return;
      el.classList.add('v162-text-risk');
      if(el.childElementCount===0&&typeof Intl!=='undefined'&&Intl.Segmenter){
        const raw=(el.textContent||'').trim();
        if(raw.length>3){
          try{
            const seg=[...new Intl.Segmenter('ja',{granularity:'word'}).segment(raw)].map(x=>x.segment);
            if(seg.length>1)el.innerHTML=seg.map(x=>esc(x)).join('<wbr>');
          }catch(_){ }
        }
      }
    });
  }

  function auditLayout(){
    enhanceAiStudio();
    forceKnownBreaks(document);
    requestAnimationFrame(()=>naturalWrapAudit(document));
  }

  if(typeof aiStudio==='function'){
    const baseAiStudio=aiStudio;
    aiStudio=function(){
      const result=baseAiStudio();
      requestAnimationFrame(auditLayout);
      return result;
    };
  }

  if(typeof v16PostRender==='function'){
    const basePost=v16PostRender;
    v16PostRender=function(){
      const result=basePost();
      requestAnimationFrame(auditLayout);
      return result;
    };
  }

  const observer=new MutationObserver(()=>{
    clearTimeout(observer._t);
    observer._t=setTimeout(auditLayout,40);
  });
  observer.observe(document.getElementById('root')||document.body,{childList:true,subtree:true});

  requestAnimationFrame(auditLayout);
})();
/* V162_HOTFIX_END */
</script>
'''
              needle = '</body></html>'
              if needle not in text:
                  raise SystemExit('closing body/html marker not found')
              text = text.replace(needle, injection + '\n' + needle, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit patched file and remove one-shot workflow
        run: |
          git config user.name "Sticker Market Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/sticker-market-v162-hotfix.yml
          git add sticker-market-demo/index.html
          git commit -m "fix: polish AI studio and mobile text layout"
          git push
