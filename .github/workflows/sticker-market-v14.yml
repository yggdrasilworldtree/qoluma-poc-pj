name: Sticker Market v1.4 patch

on:
  push:
    branches: [main]
    paths:
      - 'sticker-market-demo/v14.css'
      - 'sticker-market-demo/v14.js'
      - 'sticker-market-demo/apply_v14.py'
      - '.github/workflows/sticker-market-v14.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.4
        run: python sticker-market-demo/apply_v14.py
      - name: Validate v1.4 markers
        run: |
          grep -q 'Public Demo v1.4.0' sticker-market-demo/index.html
          grep -q 'v14ShopAdmin' sticker-market-demo/index.html
          grep -q 'v14NotificationCenter' sticker-market-demo/index.html
          grep -q 'v14AdminWorkbench' sticker-market-demo/index.html
      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('sticker-market-demo/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if not scripts:
              raise SystemExit('no script found')
          Path('/tmp/sticker-market.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sticker-market.js
      - name: Commit v1.4
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sticker-market-demo/index.html
          git commit -m 'Apply Sticker Market v1.4 UX and operations upgrade'
          git push
