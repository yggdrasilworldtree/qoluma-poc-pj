name: Sticker Market v1.0.2 patch
on:
  push:
    paths:
      - '.github/workflows/sticker-market-v102.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HTML
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('sticker-market-demo/index.html')
          s=p.read_text()
          s=s.replace('Public Demo v1.0','Public Demo v1.0.2')
          css='''
          .app-main{overflow-x:hidden}
          .legal-footer{max-width:1180px;margin:26px auto 90px;padding:24px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.1fr repeat(3,1fr);gap:18px;color:var(--muted)}
          .legal-footer b{color:var(--text)}.legal-footer button{display:block;border:0;background:none;padding:4px 0;color:var(--muted);text-align:left;font-size:12px}
          .upload-card,.upload-zone,#sellBody{min-width:0;max-width:100%;overflow:hidden}
          #sellBody *{box-sizing:border-box;min-width:0;max-width:100%}#sellBody input[type=file]{display:block;width:100%;max-width:100%;min-width:0;font-size:13px}
          .public-product-wrap{max-width:1180px;margin:auto;padding:22px 16px 90px}.public-product-head{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}
          @media(max-width:900px){.legal-footer{grid-template-columns:1fr 1fr;margin-bottom:84px}.footer{display:grid!important}.explain-upload{width:100%;max-width:100%}}
          @media(max-width:560px){.legal-footer{grid-template-columns:1fr}.lp-head .hide-sm{display:inline-block}.lp-head .rowBtns{flex-wrap:nowrap}.lp-head .btn{padding:9px 10px;font-size:12px}.explain-upload,.upload-card,.upload-zone{width:100%;max-width:100%}#sellBody{width:100%;padding:14px}.app-main{padding-left:12px;padding-right:12px}}
          '''
          s=s.replace('</style>',css+'</style>')
          s=s.replace('.footer{display:none}', '.footer{display:grid}')
          s=s.replace('<button class="btn hide-sm" onclick="go(\'login\')">ログイン</button>','<button class="btn" onclick="go(\'login\')">ログイン</button>')
          hero_buttons='''<div class="rowBtns"><button class="btn accent" onclick="document.getElementById('popular').scrollIntoView({behavior:'smooth'})">人気作品を見る</button><button class="btn" onclick="go('signup')">無料で始める</button></div>'''
          s=s.replace(hero_buttons,'')
          s=re.sub(r'''function productCard\(p,lp=false\)\{.*?\}\nfunction lp\(''', '''function productCard(p,lp=false){return`<article class="card"><div class="art" style="--c:${p.color}" onclick="go('product/${p.id}')">${p.emoji}</div><div class="pad"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.creator)}</div><span class="badge">${esc(p.category)}</span><div class="row"><b>${yen(Math.min(p.digital,p.physical))}〜</b><span>★${p.rating.toFixed(1)}</span></div></div></article>`}
          function lp(''', s, flags=re.S)
          legal='''function legalFooter(){return`<footer class="legal-footer"><div><b>Sticker Market</b><p>デザインを探す・買う・シールにするマーケットプレイス。</p></div><div><b>法務・安全</b><button>利用規約</button><button>プライバシーポリシー</button><button>セキュリティポリシー</button></div><div><b>取引について</b><button>特定商取引法に基づく表記</button><button>返品・返金について</button><button>著作権・AI生成作品ポリシー</button></div><div><b>サポート</b><button>ご利用ガイド</button><button>よくある質問</button><button>お問い合わせ</button></div></footer>`}
          '''
          idx=s.index('function shell(content,search=true)')
          s=s[:idx]+legal+s[idx:]
          s=s.replace('${nav()}<footer class="footer">利用規約 / プライバシー / セキュリティ / お問い合わせ</footer>`','${nav()}${legalFooter()}`')
          lp_start=s.index('function lp()')
          lp_end=s.index('function nav()',lp_start)
          lp_block=s[lp_start:lp_end]
          lp_block=lp_block.replace('</section></main>`}', '</section></main>${legalFooter()}`}')
          s=s[:lp_start]+lp_block+s[lp_end:]
          m=re.search(r'''function product\(id\)\{.*?\}\nfunction cart\(''',s,re.S)
          product_fn='''function product(id){const p=products.find(x=>x.id===id);if(!p)return go(state.user?'home':'landing');const body=`<button class="btn" onclick="history.back()">← 戻る</button><div class="product"><div><div class="gallery-main" style="--gc:${p.color}">${p.emoji}</div><div class="thumbs"><button class="thumb on">${p.emoji}</button><button class="thumb">✨</button><button class="thumb">🔍</button></div></div><section><h1>${esc(p.name)}</h1><p class="muted">by ${esc(p.creator)}</p><span class="badge">${p.category}</span> <span class="badge">★${p.rating.toFixed(1)}</span><p>デザインデータとして購入するほか、シールとして注文できます。</p><div class="panel"><div class="row"><span>価格</span><b>${yen(p.digital)}〜</b></div><div class="rowBtns"><button class="btn accent" id="addCart">カートに追加</button><button class="btn" id="fav">${state.user&&data().fav.includes(p.id)?'♥':'♡'} お気に入り</button></div>${!state.user?'<p class="muted" style="font-size:12px">商品詳細はログイン不要です。カート追加・お気に入り保存時にログインします。</p>':''}</div></section></div>`;if(state.user)shell(body);else $('#root').innerHTML=`<header class="public-product-head"><div class="brand" onclick="go('landing')">Sticker Market</div><div class="rowBtns"><button class="btn" onclick="go('login')">ログイン</button><button class="btn accent" onclick="go('signup')">無料登録</button></div></header><main class="public-product-wrap">${body}</main>${legalFooter()}`;$('#addCart').onclick=()=>{if(!state.user){sessionStorage.setItem('afterLogin',`product/${p.id}`);go('login');return}data().cart.push({id:p.id,name:p.name,price:p.digital});save();toast('カートに追加しました')};$('#fav').onclick=()=>{if(!state.user){sessionStorage.setItem('afterLogin',`product/${p.id}`);go('login');return}const a=data().fav,i=a.indexOf(p.id);if(i>=0)a.splice(i,1);else a.push(p.id);save();product(id)}}
          function cart('''
          s=s[:m.start()]+product_fn+s[m.end():]
          s=s.replace("!['landing','login','signup'].includes(p)","!['landing','login','signup','product'].includes(p)")
          p.write_text(s)
      - name: Validate
        run: |
          grep -q 'Public Demo v1.0.2' sticker-market-demo/index.html
          grep -q 'プライバシーポリシー' sticker-market-demo/index.html
          grep -q '商品詳細はログイン不要です' sticker-market-demo/index.html
          grep -q "'signup','product'" sticker-market-demo/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('sticker-market-demo/index.html').read_text()
          js=re.search(r'<script>(.*)</script>',s,re.S).group(1)
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sticker-market-demo/index.html
          git commit -m 'Fix LP footer, login and public product flow' || exit 0
          git push
