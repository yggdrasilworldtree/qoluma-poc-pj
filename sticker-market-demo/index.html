als[draft.material].label} / ${draft.size}mm / ${draft.qty}枚`;const q=quote();$('#qTotal').textContent=yen(q.total);$('#qTotal2').textContent=yen(q.total);$('#qUnit').textContent=yen(q.unit);$('#qSub').textContent=yen(q.subtotal);$('#qShip').textContent=yen(q.shipping);$('#qTax').textContent=yen(q.tax);$('#qBreakdown').innerHTML=`基本印刷 ${yen(q.base)} × ${draft.qty}枚<br>素材加算 ${yen(q.mat)} × ${draft.qty}枚<br>加工加算 ${yen(q.fin)} × ${draft.qty}枚`;$('#addressEdit').textContent=`${draft.address}へ配送　変更 >`};$('#customFile').onchange=e=>{const f=e.target.files[0];if(!f)return;draft.file=f;const r=new FileReader();r.onload=()=>{draft.dataUrl=r.result;redraw();$('#qualityBox').textContent=`${f.name} を読み込みました。`};r.readAsDataURL(f)};$$('[data-shape]').forEach(b=>b.onclick=()=>{draft.shape=b.dataset.shape;$$('[data-shape]').forEach(x=>x.classList.toggle('selected',x===b));redraw()});$('#materialSel').onchange=e=>{draft.material=e.target.value;redraw()};$('#finishSel').onchange=e=>{draft.finish=e.target.value;redraw()};$('#sizeSel').onchange=e=>{draft.size=+e.target.value;redraw()};$('#qtySel').onchange=e=>{draft.qty=+e.target.value;redraw()};$('#quoteDetail').onclick=()=>$('#quoteSheet').hidden=false;$('#quoteClose').onclick=()=>$('#quoteSheet').hidden=true;$('#addressEdit').onclick=()=>modal(`<h2>お届け先を変更</h2><div class="field"><label>配送先</label><input id="addrInput" value="${esc(draft.address)}"></div><div class="rowBtns"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn accent" onclick="draftAddrSave()">変更する</button></div>`);window.draftAddrSave=()=>{draft.address=$('#addrInput').value||draft.address;closeModal();redraw()};$('#customCart').onclick=()=>{if(!draft.file){toast('先に画像を選択してください');return}const q=quote();state.cart.push({id:'custom'+Date.now(),name:`オリジナルシール / ${shapeLabel()} / ${materials[draft.material].label}`,price:q.total});save();go('cart')};redraw()}function renderFavorites(){appShell(`<h1>お気に入り</h1><div class="grid">${products.filter(p=> n renderLogout(){appShell(`<section class="panel" style="max-width:520px;margin:auto"><h1>ログアウト</h1><p>このアカウントからログアウトしますか？</p><div class="rowBtns"><button class="btn" onclick="go('account')">キャンセル</button><button class="btn danger" id="logoutDo">ログアウトする</button></div></section>`);$('#logoutDo').onclick=()=>{state.user=null;save();go('landing')}}let settingsDraft=null;function renderSettings(){settingsDraft=JSON.parse(JSON.stringify(state.settings));appShell(`<h1>設定</h1><div class="tree"><details><summary>表示・アクセシビリティ</summary><div class="treebody"><div class="field"><label>テーマ</label><select id="setTheme"><option value="system">端末設定</option><option value="light">ライト</option><option value="dark">ダーク</option></select></div><div class="field"><label>フォントサイズ</label><select id="setSize"><option value="90">小</option><option value="100">標準</option><option value="115">大</option><option value="130">特大</option></select></div><div class="field"><label>アクセントカラー</label><p class="muted">主要ボタン、選択中の項目、通知バッジなどの強調色に適用します。</p><div class="chip-wrap">${['#ff5d72','#4d8dff','#31a36d','#9b64db','#f08b35'].map(c=>`<button class="chip" data-accent="${c}" style="border-color:${c}">${c}</button>`).join('')}</div><button class="btn accent" style="margin-top:8px">プレビュー：主要ボタン</button></div></div></details><details><summary>言語</summary><div class="treebody"><select id="setLang"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="ko">한국어</option></select></div></details><details><summary>通知</summary><div class="treebody">注文・発送・フォロー通知を管理します。</div></details><details><summary>プライバシー</summary><div class="treebody">閲覧履歴・レコメンド設定を管理します。</div></details></div><div class="savebar"><span class="muted" id="unsaved">変更後に「変更する」を押してください</span><button class="btn" id="settingCancel">キャンセル</button><button class="btn accent" id="settingSave">変更する</button></div>`);$('#setTheme').value=settingsDraft.theme;$('#setSize').value=String(settingsDraft.fontSize);$('#setLang').value=settingsDraft.lang;$('#setTheme').onchange=e=>settingsDraft.theme=e.target.value;$('#setSize').onchange=e=>settingsDraft.fontSize=+e.target.value;$('#setLang').onchange=e=>settingsDraft.lang=e.target.value;$$('[data-accent]').forEach(b=>b.onclick=()=>{settingsDraft.accent=b.dataset.accent;$$('[data-accent]').forEach(x=>x.classList.toggle('selected',x===b))});$('#settingCancel').onclick=()=>{settingsDraft=JSON.parse(JSON.stringify(state.settings));toast('変更を破棄しました');renderSettings()};$('#settingSave').onclick=()=>{state.settings=settingsDraft;save();toast('設定を変更しました');renderSettings()}}function renderCreator(id){const c=creators.find(x=>x.id===id)||creators[0];appShell(`<section class="panel"><div class="creator-avatar">${esc(c.name[0])}</div><h1>${esc(c.name)}</h1><p>${esc(c.genre)}</p><b>${esc(c.followers)}</b> followers</section><h2>販売中の商品</h2><div class="grid">${products.filter(p=>p.creatorId===c.id).slice(0,8).map(p=>productCard(p)).join('')}</div>`)}function renderCreatorDash(){appShell(`<section class="seller-hero"><div><div class="eyebrow">CREATOR CENTER</div><h1>販売を始める</h1><p class="muted">売り方を選び、デザイン登録から販売開始まで進めます。</p></div><div class="ai-box"><b>AI販売アドバイス</b><p>透明PET × 小型ステッカーの閲覧が増加中です。商品画像3枚以上の作品は購入率が高い傾向があります。</p></div></section><div class="method-grid"><div class="method-card"><h3>デザインデータを販売</h3><p>購入者がデータをダウンロード。</p><button class="btn accent" onclick="go('sell')">この方法で始める</button></div><div class="method-card"><h3>シール商品として販売</h3><p>印刷・配送まで含めて販売。</p><button class="btn" onclick="go('sell')">この方法で始める</button></div><div class="method-card"><h3>データ＋シール</h3><p>両方の販売形式を用意。</p><button class="btn" onclick="go('sell')">この方法で始める</button></div></div><h2>販売サマリ</h2><div class="insight-grid"><div class="panel kpi"><b>¥45,300</b>今月売上</div><div class="panel kpi"><b>32</b>販売件数</div><div class="panel kpi"><b>1,248</b>閲覧</div><div class="panel kpi"><b>2.6%</b>CVR</div></div><div class="split" style="margin-top:14px"><section class="panel"><h3>現在売れているカテゴリ</h3><div class="row"><span>1. かわいい</span><b>28%</b></div><div class="row"><span>2. 動物</span><b>21%</b></div><div class="row"><span>3. ビジネス</span><b>16%</b></div></section><section class="panel"><h3>価格参考</h3><p>同カテゴリ中央値 <b>¥480</b></p><p>あなたの平均 <b>¥620</b></p><button class="btn" onclick="go('creator/c1')">自分の販売ページを見る</button></section></div>`)}function renderSell(){appShell(`<h1>商品を販売</h1><div class="sell-step-mobile panel"><b>STEP ${sellDraft.step} / 5</b><div class="muted">${['','デザイン登録','基本情報','検索設定','販売設定','確認'][sellDraft.step]}</div></div><div class="stepper">${['デザイン','基本情報','検索設定','販売設定','確認'].map((x,i)=>`<div class="step-item ${sellDraft.step>=i+1?'on':''}"><div class="step-line"></div>${i+1} ${x}</div>`).join('')}</div><section class="panel sellBodyFix" id="sellBody"></section><div class="rowBtns" style="margin-top:12px"><button class="btn" id="sellPrev">戻る</button><button class="btn accent" id="sellNext">次へ</button></div>`);drawSellStep()}function drawSellStep(){const b=$('#sellBody');if(sellDraft.step===1)b.innerHTML=`<h2>STEP 1：デザイン登録</h2><div class="split"><div><h3>公開用商品画像</h3><div class="upload-zone"><input id="publicImages" type="file" accept="image/png,image/jpeg,image/svg+xml" multiple></div></div><div><h3>購入者限定販売データ</h3><div class="upload-zone"><input id="saleFiles" type="file" accept="image/png,image/jpeg,image/svg+xml,application/pdf,.zip" multiple></div></div></div>`;if(sellDraft.step===2)b.innerHTML=`<h2>STEP 2：基本情報</h2><div class="field"><label>商品名</label><input id="sellName" value="${esc(sellDraft.name)}"></div><div class="field"><label>商品説明</label><textarea id="sellDesc">${esc(sellDraft.description)}</textarea></div><div class="field"><label>カテゴリ</label><select id="sellCat"><option>アート</option><option>動物・ペット</option><option>アウトドア</option></select></div>`;if(sellDraft.step===3)b.innerHTML=`<h2>STEP 3：検索設定</h2><div class="field"><label>検索タグ</label><input id="tagInput" placeholder="星空, 山, 夜"><div class="chip-wrap" style="margin-top:8px">${['星空','山','夜','青','キャンプ','風景'].map(t=>`<button class="chip" data-tag="${t}">${t}</button>`).join('')}</div></div><div class="field"><label>検索用キーワード</label><input id="kwInput" placeholder="夜景 星空 山岳 アウトドア"></div><div class="field"><label>色タグ</label><div class="chip-wrap">${['黒','白','赤','青','緑','黄','ピンク','紫'].map(t=>`<button class="chip">${t}</button>`).join('')}</div></div>`;if(sellDraft.step===4)b.innerHTML=`<h2>STEP 4：販売設定</h2><div class="field"><label>販売価格</label><input id="sellPrice" type="number" value="${sellDraft.price}"></div><div class="split"><div class="field"><label>おすすめ素材（任意）</label><select id="recMat"><option value="">設定しない</option><option>耐水PET</option><option>透明PET</option><option>上質紙</option></select></div><div class="field"><label>おすすめ形状（任意）</label><select id="recShape"><option value="">設定しない</option><option>ダイカット</option><option>円形</option><option>角丸</option></select></div></div>`;if(sellDraft.step===5)b.innerHTML=`<h2>STEP 5：確認・審査申請</h2><p><b>${esc(sellDraft.name||'商品名未入力')}</b></p><p>${esc(sellDraft.description||'説明未入力')}</p><button class="btn accent" id="submitSell">審査申請</button>`;$('#sellPrev').disabled=sellDraft.step===1;$('#sellNext').textContent=sellDraft.step===5?'完了':'次へ';$('#sellPrev').onclick=()=>{collectSellStep();sellDraft.step--;renderSell()};$('#sellNext').onclick=()=>{collectSellStep();if(sellDraft.step<5){sellDraft.step++;renderSell()}else go('creatorDash')};$('#publicImages')&&($('#publicImages').onchange=e=>sellDraft.images=[...e.target.files].map(f=>f.name));$('#saleFiles')&&($('#saleFiles').onchange=e=>sellDraft.saleFiles=[...e.target.files].map(f=>f.name));$$('[data-tag]').forEach(x=>x.onclick=()=>{if(!sellDraft.tags.includes(x.dataset.tag))sellDraft.tags.push(x.dataset.tag);x.classList.add('selected')});$('#submitSell')&&($('#submitSell').onclick=()=>{state.created.push({id:'u'+Date.now(),name:sellDraft.name||'新しい作品',creator:state.user.name,creatorId:'c1',category:sellDraft.category,digital:sellDraft.price,physical:sellDraft.price+300,rating:0,favs:0,sales:0,color:'#ffb66e',emoji:'🎨',recommendedMaterial:sellDraft.recommendedMaterial,recommendedShape:sellDraft.recommendedShape});save();toast('審査申請しました');go('creatorDash')})}function collectSellStep(){if(sellDraft.step===2){sellDraft.name=$('#sellName')?.value||sellDraft.name;sellDraft.description=$('#sellDesc')?.value||sellDraft.description;sellDraft.category=$('#sellCat')?.value||sellDraft.category}if(sellDraft.step===3){const t=($('#tagInput')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);sellDraft.tags=[...new Set([...sellDraft.tags,...t])];sellDraft.keywords=($('#kwInput')?.value||'').split(/[,\s]+/).filter(Boolean)}if(sellDraft.step===4){sellDraft.price=+($('#sellPrice')?.value||sellDraft.price);sellDraft.recommendedMaterial=$('#recMat')?.value||'';sellDraft.recommendedShape=$('#recShape')?.value||''}}function renderAdmin(){appShell(`<h1>管理者ダッシュボード</h1><div class="kpis"><div class="panel kpi"><b>1,248</b>ユーザー</div><div class="panel kpi"><b>342</b>今月注文</div><div class="panel kpi"><b>12</b>審査待ち</div><div class="panel kpi"><b>¥1,248,600</b>今月売上</div></div><div class="panel" style="margin-top:14px"><h2>売上推移</h2><svg viewBox="0 0 600 180" style="width:100%;height:220px"><polyline fill="none" stroke="var(--accent)" stroke-width="5" points="20,150 90,130 160,140 230,90 300,105 370,65 440,78 510,35 580,50"/></svg></div><h2>管理メニュー</h2><div class="adminmenu"><button class="btn" onclick="go('admin-review')">商品審査</button><button class="btn" onclick="go('admin-orders')">注文管理</button><button class="btn" onclick="go('admin-users')">ユーザー管理</button><button class="btn" onclick="go('admin-sales')">売上管理</button></div>`)}function adminPage(title,body){if(state.user?.role!=='admin'){go('home');return}appShell(`<button class="btn" onclick="go('admin')">← 管理ダッシュボード</button><h1>${title}</h1>${body}`)}function renderAdminReview(){adminPage('商品審査',`<section class="panel">${[['r1','星空ステッカー','Haru Creator'],['r2','花束ラベル','sora design'],['r3','黒猫シール','mignon']].map(([id,n,c])=>`<div class="row review-card" onclick="go('admin-review-detail/${id}')"><div><b>${n}</b><div class="muted">${c} / 審査申請中</div></div><span>詳細を見る ›</span></div>`).join('')}</section>`)}function renderAdminReviewDetail(id){const data={r1:['星空ステッカー','Haru Creator'],r2:['花束ラベル','sora design'],r3:['黒猫シール','mignon']}[id]||['商品','Creator'];adminPage('商品審査詳細',`<div class="review-layout"><section class="panel"><div class="eyebrow">APPLICATION</div><h2>${data[0]}</h2><div class="row"><span>出品者</span><b>${data[1]}</b></div><div class="row"><span>申請状態</span><span class="badge">人間審査中</span></div><div class="row"><span>ライセンス</span><b>個人・商用利用</b></div><div class="row"><span>AI生成申告</span><b>なし</b></div><div class="ai-box"><b>AI審査要約</b><p>重大な禁止事項は検出されていません。商品説明に商用利用範囲の追記を推奨します。</p><b>推奨：条件付き承認</b></div><div class="rowBtns" style="margin-top:12px"><button class="btn accent" onclick="toast('承認しました')">承認</button><button class="btn" onclick="toast('差し戻しました')">差し戻し</button><button class="btn" onclick="toast('公開停止しました')">公開停止</button></div></section><section class="panel"><h3>出品者とのメッセージ</h3><div class="message-thread"><div class="bubble admin"><b>管理者</b><br>商用利用範囲の説明を追記してください。</div><div class="bubble"><b>${data[1]}</b><br>説明を修正しました。ご確認ください。</div></div><div class="field"><textarea id="reviewMsg" placeholder="メッセージを入力"></textarea></div><button class="btn accent" onclick="toast('メッセージを送信しました')">送信</button><button class="btn" onclick="$('#reviewMsg').value='商用利用範囲について、対象となる利用方法を明記してください。'">AIで差し戻し文案を作成</button></section></div>`)}function renderAdminOrders(){adminPage('注文管理',`<div class="order-toolbar"><input class="wide" id="ordQ" placeholder="注文番号・購入者・商品を検索"><select><option>決済状態：すべて</option><option>決済完了</option><option>返金</option></select><select><option>製造状態：すべて</option><option>製造待ち</option><option>製造中</option></select><select><option>配送状態：すべて</option><option>発送準備</option><option>発送済み</option></select><button class="btn accent" onclick="toast('絞り込みました')">検索</button></div><section class="panel order-list"><table class="table order-table"><tr><th>注文番号</th><th>注文日時</th><th>購入者</th><th>商品</th><th>金額</th><th>決済</th><th>製造</th><th>配送</th><th>担当</th></tr>${[['ORD-1001','8/10 12:01','Demo User','星空ステッカー','¥1,903','完了','製造中','発送準備','田中'],['ORD-1002','8/10 11:20','user02','黒猫シール','¥2,320','完了','完了','発送済み','佐藤']].map(r=>`<tr onclick="go('admin-order-detail/${r[0]}')" style="cursor:pointer">${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></section>`)}function renderAdminOrderDetail(id){adminPage('伝票詳細',`<div class="split"><section class="panel"><div class="eyebrow">ORDER</div><h2>${id}</h2><div class="row"><span>購入者</span><b>Demo User</b></div><div class="row"><span>配送先</span><b>東京都新宿区...</b></div><h3>商品</h3><div class="row"><div>星空ステッカー<div class="indent">耐水PET / 50mm / 10枚</div></div><b>¥1,480</b></div><h3>金額</h3><div class="row"><span>商品合計</span><b>¥1,480</b></div><div class="row"><span>送料</span><b>¥250</b></div><div class="row"><span>税</span><b>¥173</b></div><div class="row"><span>総額</span><b>¥1,903</b></div></section><section class="panel"><h3>処理状況</h3><div class="timeline"><div><b>8/10 12:01</b><br>注文受付</div><div><b>8/10 12:02</b><br>決済完了</div><div><b>8/10 13:40</b><br>印刷会社へ発注</div><div><b>8/11 09:20</b><br>製造開始</div></div><h3>配送</h3><div class="field"><label>配送会社</label><input value="ヤマト運輸"></div><div class="field"><label>追跡番号</label><input value="1234-5678-9012"></div><button class="btn accent" onclick="toast('伝票を更新しました')">更新</button></section></div>`)}function renderAdminUsers(){adminPage('ユーザー管理',`<section class="panel"><table class="table"><tr><th>ユーザー</th><th>権限</th><th>状態</th></tr><tr><td>Demo User</td><td>buyer</td><td>有効</td></tr><tr><td>Haru Creator</td><td>creator</td><td>有効</td></tr></table></section>`)}function renderAdminSales(){adminPage('売上管理',`<div class="kpis"><div class="panel kpi"><b>¥4.8M</b>総売上</div><div class="panel kpi"><b>¥1.2M</b>今月</div><div class="panel kpi"><b>¥620K</b>デジタル</div><div class="panel kpi"><b>¥580K</b>物理</div></div>`)}function route(){closeModal();const [page,id]=(location.hash.slice(2)|| (state.user?'home':'landing')).split('/');if(!state.user&&!['landing','login','signup'].includes(page)){renderLP();return}({landing:renderLP,login:()=>renderLogin(false),signup:()=>renderLogin(true),home:renderHome,search:renderSearch,create:renderCreate,favorites:renderFavorites,cart:renderCart,orders:renderOrders,account:renderAccount,logout:renderLogout,settings:renderSettings,creatorDash:renderCreatorDash,sell:renderSell,admin:renderAdmin,'admin-review':renderAdminReview,'admin-orders':renderAdminOrders,'admin-users':renderAdminUsers,'admin-sales':renderAdminSales}[page]||(()=>page==='product'?renderProduct(id):page==='creator'?renderCreator(id):page==='admin-review-detail'?renderAdminReviewDetail(id):page==='admin-order-detail'?renderAdminOrderDetail(id):renderHome))();scrollTo({top:0,behavior:'instant'})}window.onhashchange=route;applySettings();route();
