function landing(){const top=[...products].sort((a,b)=>b.favs-a.favs);shell(`<section class="hero-v2"><div class="hero-copy"><span class="eyebrow">STICKER MARKETPLACE</span><h1>お気に入りのデザインで、<br>世界にひとつのシールを。</h1><p>デザインデータを買う。シールとして注文する。自分のデザインを形にする。すべてをひとつの場所で。</p><div class="btn-row"><button class="btn primary" onclick="go('search')">シールを探す</button><button class="btn" onclick="go('ai-design')">AIデザインを作る</button></div></div><div class="hero-art">${top.slice(0,4).map(p=>`<div class="hero-tile">${artSvg(p)}</div>`).join('')}</div></section><section class="section"><div class="section-head"><div><span class="eyebrow">CATEGORY</span><h2>人気のカテゴリ</h2></div><button class="link-btn" onclick="go('categories')">すべて見る ›</button></div><div class="category-grid">${categoryItems()}</div></section><section class="section"><div class="section-head"><div><span class="eyebrow">POPULAR</span><h2>おすすめのデザイン</h2></div><button class="link-btn" onclick="go('search')">すべて見る ›</button></div><div class="h-scroll">${top.slice(0,8).map(productCard).join('')}</div></section><section class="section"><div class="section-head"><h2>人気クリエイター</h2><button class="link-btn" onclick="go('creators')">一覧 ›</button></div><div class="creator-strip">${CREATORS.map(creatorMini).join('')}</div></section><section class="section"><div class="panel"><h2>Sticker Marketの使い方</h2><div class="btn-row"><button class="btn" onclick="go('search')">買う</button><button class="btn" onclick="go('create-sticker')">作る</button><button class="btn" onclick="${currentUser()?`go('creator-dashboard')`:`go('signup')`}">売る</button></div><p class="muted">作品を探してデータまたはシールを購入。自分の画像からシールを作成。クリエイターなら販売・分析まで管理できます。</p></div></section>`,{search:true,footer:true,noNav:!currentUser()})}
function home(){landing()}
function categories(){shell(`<div class="section-head"><div><h1>カテゴリ一覧</h1><p>気になるジャンルから作品を探せます。</p></div></div><div class="category-grid">${categoryItems()}</div>`,{title:'カテゴリ一覧',back:true,footer:true})}

function parseQuery(){const s=routePath().split('?')[1]||'';return Object.fromEntries(new URLSearchParams(s))}
const synonym={猫:['猫','ねこ','ネコ','cat'],ねこ:['猫','ねこ','ネコ','cat'],宇宙:['宇宙','星','星空','惑星','space'],花:['花','フラワー','植物'],犬:['犬','いぬ','イヌ','dog']};
function score(p,q){if(!q)return 1;const qs=(synonym[q]||[q]).map(x=>x.toLowerCase());let s=0;for(const k of qs){if(p.name.toLowerCase().includes(k))s+=10;if(p.tags.some(t=>t.toLowerCase()===k))s+=8;if(p.category.toLowerCase().includes(k))s+=6;if(creatorBy(p.creatorId).name.toLowerCase().includes(k))s+=5;if(p.description.toLowerCase().includes(k))s+=2}return s}
function searchPage(){const q=parseQuery(),keyword=q.q||'',cat=q.category||'',ud=userData(),cols=Number(ud?.settings?.columns||2);let list=products.map(p=>[p,score(p,keyword)]).filter(x=>(!keyword||x[1]>0)&&(!cat||x[0].category===cat)).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);const related=keyword?(synonym[keyword]||[products.find(p=>p.name.includes(keyword))?.category,'かわいい','ギフト'].filter(Boolean)):['ねこ','宇宙','花','シンプル'];shell(`<div class="section-head"><div><h1>検索結果</h1><p>${list.length}件の作品</p></div><button class="btn" onclick="filterSheet()">⚙ 絞り込み</button></div><div class="toolbar"><div class="filter-chips">${keyword?`<span class="chip active">${esc(keyword)} ×</span>`:''}${cat?`<span class="chip active">${esc(cat)} ×</span>`:''}${keyword||cat?`<button class="link-btn" onclick="go('search')">すべてクリア</button>`:''}</div><div class="segmented" aria-label="表示列数"><button class="${cols===1?'active':''}" onclick="setCols(1)">1列</button><button class="${cols===2?'active':''}" onclick="setCols(2)">2列</button><button class="${cols===3?'active':''}" onclick="setCols(3)">3列</button></div></div>${list.length?`<div id="searchGrid" class="product-grid" data-cols="${cols}" style="--cols:${cols}">${list.map(productCard).join('')}</div><div class="pager"><button class="btn" disabled>‹ 前へ</button><div class="center"><button class="page-dot active">1</button></div><button class="btn" disabled>次へ ›</button></div>`:`<div class="empty"><div class="emoji">🔎</div><h2>該当する作品がありません</h2><p class="muted">条件を少し変えると見つかるかもしれません。</p><button class="btn primary" onclick="go('search')">条件をクリア</button></div>`}<section class="section"><h2>関連する検索をもっと見る</h2><div class="btn-row">${related.map(x=>`<button class="chip" onclick="go('search?q=${encodeURIComponent(x)}')">${esc(x)}</button>`).join('')}</div></section>`,{title:'検索結果',back:true,search:true,footer:true})}
function setCols(n){if(!currentUser()){localStorage.setItem('sm20_guest_cols',n)}else{userData().settings.columns=n;save()}const g=$('#searchGrid');if(g){g.dataset.cols=n;g.style.setProperty('--cols',n)}$$('.segmented button').forEach((b,i)=>b.classList.toggle('active',i+1===n))}
function filterSheet(){showSheet(`<div class="section-head"><h2>絞り込み</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="field"><label>カテゴリ</label><select id="fCat"><option value="">指定なし</option>${CATEGORIES.map(c=>`<option>${c[0]}</option>`).join('')}</select></div><div class="field"><label>素材</label><select><option>指定なし</option><option>耐水PET</option><option>上質紙</option><option>透明PET</option><option>ホログラム</option></select></div><div class="field"><label>サイズ</label><select><option>指定なし</option><option>〜50mm</option><option>51〜70mm</option><option>71mm〜</option></select></div><div class="field"><label>価格</label><input type="range" min="0" max="5000" value="5000"><div class="small muted">¥0 〜 ¥5,000+</div></div><label class="chip"><input type="checkbox"> AI生成作品を除外</label><div class="btn-row" style="margin-top:18px"><button class="btn" onclick="closeModal();go('search')">条件をクリア</button><button class="btn primary" onclick="const c=$('#fCat').value;closeModal();go('search'+(c?'?category='+encodeURIComponent(c):''))">絞り込む</button></div>`)}

function creatorsPage(){shell(`<div class="section-head"><div><h1>クリエイター一覧</h1><p>人気・新着・フォロー中から探せます。</p></div></div><div class="field"><input placeholder="クリエイターを検索" oninput="filterCreators(this.value)"></div><div class="btn-row"><button class="chip active">人気順</button><button class="chip">新着順</button><button class="chip">フォロー中</button></div><div id="creatorList" class="section">${CREATORS.map(c=>`<article class="card panel" style="margin:8px 0"><div class="creator-inline"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${c.avatar}</div><div><b>${c.name} ${c.verified?'✓':''}</b><div class="small muted">★${c.rating} ・ ${c.followers.toLocaleString()}フォロワー</div></div></div><button class="btn" onclick="followCreator('${c.id}',event)">フォロー</button></div><button class="link-btn" onclick="go('creator/${c.id}')">ショップを見る ›</button></article>`).join('')}</div>`,{title:'クリエイター一覧',back:true})}
function filterCreators(q){const t=q.toLowerCase();$$('#creatorList article').forEach((e,i)=>e.hidden=!(CREATORS[i].name+CREATORS[i].genre).toLowerCase().includes(t))}
function followCreator(id,e){e?.stopPropagation();if(!requireAuth(`creator/${id}`,'クリエイターをフォローするにはログインが必要です。'))return;const u=userData(),i=u.follows.indexOf(id);if(i>=0){u.follows.splice(i,1);toast('フォローを解除しました')}else{u.follows.push(id);toast('フォローしました')}save()}

function creatorPage(id){const c=creatorBy(id),q=parseQuery(),tab=q.tab||'works',plist=products.filter(p=>p.creatorId===id),u=userData();const proposals=db.global.proposals.filter(x=>x.creatorId===id&&x.public!==false);shell(`<section class="shop-cover" style="--primary:${c.accent}"><div class="shop-top"><div class="shop-avatar">${c.avatar}</div><div><h1>${esc(c.name)} ${c.verified?'✓':''}</h1><p>${esc(c.genre)}</p><div class="btn-row"><button class="btn primary" onclick="followCreator('${c.id}')">${u?.follows?.includes(c.id)?'フォロー中':'フォロー'}</button><button class="btn" onclick="messageCreator('${c.id}')">メッセージ</button></div></div></div></section><div class="shop-stats section"><div class="card shop-stat"><b>${plist.length}</b><span class="small muted">作品</span></div><div class="card shop-stat"><b>${plist.reduce((a,p)=>a+p.favs,0)}</b><span class="small muted">いいね</span></div><div class="card shop-stat"><b>${c.sales.toLocaleString()}</b><span class="small muted">販売</span></div><div class="card shop-stat"><b>${c.rating}</b><span class="small muted">評価</span></div></div><div class="tabs"><button class="${tab==='works'?'active':''}" onclick="go('creator/${id}?tab=works')">作品</button><button class="${tab==='profile'?'active':''}" onclick="go('creator/${id}?tab=profile')">プロフィール</button><button class="${tab==='reviews'?'active':''}" onclick="go('creator/${id}?tab=reviews')">レビュー</button><button class="${tab==='proposals'?'active':''}" onclick="go('creator/${id}?tab=proposals')">提案</button></div>${tab==='works'?`<div class="toolbar"><input class="search-input" style="max-width:440px" placeholder="ショップ内を検索" oninput="shopSearch(this.value)"><div class="segmented"><button class="active">人気</button><button>新着</button></div></div><div id="shopProducts" class="product-grid" data-cols="2" style="--cols:2">${plist.map(productCard).join('')}</div>`:''}${tab==='profile'?creatorProfile(c):''}${tab==='reviews'?`<section class="section"><h2>ショップレビュー</h2>${db.global.reviews.slice(0,3).map(reviewCard).join('')}</section>`:''}${tab==='proposals'?proposalTab(c,proposals):''}<section class="section"><h2>似ているクリエイター</h2><div class="creator-strip">${CREATORS.filter(x=>x.id!==id).slice(0,3).map(creatorMini).join('')}</div></section>`,{title:c.name,back:true,footer:true,bell:true})}
function creatorProfile(c){return `<section class="section"><div class="panel"><h2>プロフィール</h2><p>${esc(c.bio)}</p><div class="trust-grid"><div class="card trust-item"><b>✓ 本人確認</b><div class="small muted">${c.verified?'確認済み':'未確認'}</div></div><div class="card trust-item"><b>返信率 ${c.reply}</b><div class="small muted">平均 ${c.response}</div></div><div class="card trust-item"><b>高評価 ${c.positive}</b><div class="small muted">活動開始 ${c.since}</div></div></div><p class="small muted">内部の違反・審査情報は一般ユーザーには公開しません。</p></div></section>`}
function shopSearch(q){const t=q.toLowerCase();$$('#shopProducts .product-card').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(t))}
function proposalTab(c,items){return `<section class="section"><div class="section-head"><div><h2>みんなの提案</h2><p>このクリエイターに作ってほしいデザインを提案できます。</p></div><button class="btn primary" onclick="newProposal('${c.id}')">提案する</button></div>${items.length?items.map(x=>`<article class="card proposal"><span class="status">${x.status||'募集中'}</span><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><div class="vote-row"><button class="btn" onclick="voteProposal('${x.id}','like')">👍 ${x.like||0}</button><button class="btn" onclick="voteProposal('${x.id}','want')">購入したい ${x.want||0}</button><button class="btn" onclick="voteProposal('${x.id}','dislike')">反対 ${x.dislike||0}</button></div></article>`).join(''):`<div class="empty"><div class="emoji">💡</div><h3>まだ提案がありません</h3><p class="muted">最初のアイデアを提案してみましょう。</p><button class="btn primary" onclick="newProposal('${c.id}')">提案する</button></div>`}</section>`}
function newProposal(cid){if(!requireAuth(`creator/${cid}?tab=proposals`,'提案を投稿するにはログインが必要です。'))return;showModal(`<div class="section-head"><h2>デザインを提案</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="field"><label>提案タイトル</label><input id="propTitle" placeholder="例：夜空と猫のステッカー"></div><div class="field"><label>説明</label><textarea id="propBody" placeholder="作ってほしいデザインのイメージ"></textarea></div><div class="field"><label>希望用途</label><select id="propUse"><option>スマホ・PC</option><option>ノート</option><option>ギフト</option></select></div><div class="field"><label>希望価格帯</label><select id="propPrice"><option>〜500円</option><option>500〜1,000円</option><option>1,000円〜</option></select></div><button class="btn primary full" onclick="submitProposal('${cid}')">公開して提案する</button>`)}
function submitProposal(cid){const t=$('#propTitle').value.trim(),b=$('#propBody').value.trim();if(!t||!b){toast('タイトルと説明を入力してください');return}db.global.proposals.push({id:uid('proposal'),proposalId:uid('proposal'),creatorId:cid,userId:currentUser().id,title:t,body:b,status:'募集中',public:true,like:0,want:0,dislike:0,date:now()});save();closeModal();go(`creator/${cid}?tab=proposals`)}
function voteProposal(id,type){if(!requireAuth(routePath(),'投票するにはログインが必要です。'))return;const u=userData(),old=u.votes[id];const p=db.global.proposals.find(x=>x.id===id);if(!p)return;if(old){toast('この提案には投票済みです');return}if(p.userId===currentUser().id){toast('自分の提案には投票できません');return}u.votes[id]=type;p[type]=(p[type]||0)+1;save();render()}
function messageCreator(cid){if(!requireAuth(`creator/${cid}`,'メッセージを送るにはログインが必要です。'))return;showModal(`<div class="section-head"><h2>${creatorBy(cid).name}へメッセージ</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="notice demo">メッセージは公開デモのブラウザ内データです。</div><div class="field"><label>メッセージ</label><textarea id="msgText"></textarea></div><button class="btn primary" onclick="sendMessage('${cid}')">送信</button>`)}
function sendMessage(cid){const t=$('#msgText').value.trim();if(!t)return;userData().messages.push({id:uid('message'),messageThreadId:'thread_'+currentUser().id+'_'+cid,creatorId:cid,text:t,date:now(),read:true});save();closeModal();toast('メッセージを送信しました（デモ）')}

function viewProduct(id){const u=userData();if(u){u.recent=[id,...u.recent.filter(x=>x!==id)].slice(0,8);save()}go('product/'+id)}
function productPage(id){const p=productBy(id),c=creatorBy(p.creatorId),u=userData(),fav=u?.favorites.includes(id);const reviews=db.global.reviews.filter(r=>r.productId===id);shell(`<div class="product-layout"><div class="gallery"><div class="gallery-main">${artSvg(p)}<div class="gallery-actions"><button class="icon-btn" onclick="toggleFav('${id}')" aria-label="お気に入り">${fav?'♥':'♡'}</button><button class="icon-btn" onclick="shareProduct('${id}')" aria-label="共有">↗</button></div></div><div class="gallery-dots"><i class="active"></i><i></i><i></i></div></div><div class="product-summary"><span class="eyebrow">${esc(p.category)}</span><h1>${esc(p.name)}</h1><div class="creator-inline"><div style="display:flex;gap:9px;align-items:center"><div class="avatar" style="width:42px;height:42px">${c.avatar}</div><button class="link-btn" onclick="go('creator/${c.id}')">${esc(c.name)} ›</button></div><button class="btn" onclick="followCreator('${c.id}')">フォロー</button></div><div class="rating-line"><span class="stars">★★★★★</span><b>${p.rating}</b><span class="muted">(${reviews.length||128}) ・ 販売 ${p.sales.toLocaleString()}</span></div><div class="price-big">${yen(p.digital)} <span class="small muted">税込〜</span></div><p>${esc(p.description)}</p><div class="btn-row">${p.tags.map(t=>`<button class="chip" onclick="go('search?q=${encodeURIComponent(t)}')">#${esc(t)}</button>`).join('')}</div><section class="section"><h2>購入方法</h2><div class="panel"><div class="row"><div><b>データを買う</b><div class="small muted">PNG / SVG / PDF / ZIP</div></div><b>${yen(p.digital)}</b></div><div class="btn-row"><button class="btn soft" onclick="selectBuy('${id}','digital')">データを買う</button><button class="btn" onclick="selectBuy('${id}','physical')">シールを買う</button><button class="btn" onclick="go('customize/${id}')">仕様を選んで注文</button></div></div></section><section class="section"><h2>ライセンス</h2><div class="license-grid">${licenseCards()}</div></section><section class="section"><div class="accordion"><details><summary>商品詳細</summary><div class="body">素材：${p.material}<br>形状：${p.shape}<br>おすすめ用途：${p.use}</div></details><details><summary>発送 & 返品ポリシー</summary><div class="body">物理商品の発送目安は5〜7営業日です。デジタル商品は決済完了後に取得できます。</div></details><details><summary>免責事項</summary><div class="body">画面上の色と実際の印刷色には差が生じる場合があります。公開デモのため決済・製造処理は模擬です。</div></details></div></section></div></div><section class="section"><div class="section-head"><div><h2>この商品のレビュー</h2><p>${reviews.length}件の購入者レビュー</p></div><button class="link-btn" onclick="go('review/${id}')">レビューを書く</button></div>${reviews.length>=2?`<div class="ai-summary"><b>AIによる要約（デモ）</b><p>仕上がりのきれいさと使いやすさが高く評価されています。素材や画面によって色味に差が出る点には注意が必要です。</p><div class="small muted">対象 ${reviews.length}件・最終更新 2026/08/13</div></div>`:''}${reviews.slice(0,3).map(reviewCard).join('')}</section><section class="section"><h2>同じクリエイターの商品</h2><div class="h-scroll">${products.filter(x=>x.creatorId===p.creatorId&&x.id!==p.id).map(productCard).join('')}</div></section><section class="section"><h2>関連商品</h2><div class="h-scroll">${products.filter(x=>x.category===p.category&&x.id!==p.id).concat(products.filter(x=>x.id!==p.id)).slice(0,5).map(productCard).join('')}</div></section>${u?.recent?.length?`<section class="section"><h2>最近見た商品</h2><div class="h-scroll">${u.recent.filter(x=>x!==id).slice(0,5).map(x=>productCard(productBy(x))).join('')}</div></section>`:''}<div class="sticky-cta"><div><div class="small muted">${p.name}</div><b>${yen(p.digital)}〜</b></div><button class="btn primary" onclick="selectBuy('${id}','digital')">カートに追加</button></div>`,{title:'商品詳細',back:true,bell:true})}
function licenseCards(){return `<div class="card license-card"><h3>個人利用</h3><div class="yes">✓ 個人制作</div><div class="yes">✓ SNS利用</div><div class="no">× 商品販売</div></div><div class="card license-card"><h3>商用利用</h3><div class="yes">✓ 商用制作</div><div class="yes">✓ 小規模販売</div><div class="no">× 大量生産</div></div><div class="card license-card"><h3>拡張商用</h3><div class="yes">✓ 法人用途</div><div class="yes">✓ 大規模販売</div><div class="yes">✓ 広告利用</div></div>`}
function reviewCard(r){return `<article class="card review-card"><div class="rating-line"><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span>${r.verified?'<span class="status ok">購入済み</span>':''}<span class="status">${r.kind==='digital'?'デジタル':'物理'}</span></div><p>${esc(r.text)}</p><div class="small muted">${fmtDate(r.date)} ・ 役に立った ${r.helpful||0}</div></article>`}
function shareProduct(id){navigator.share?.({title:productBy(id).name,url:location.href}).catch(()=>{})||toast('共有リンクをコピーしました')}
function toggleFav(id){if(!requireAuth(`product/${id}`,'お気に入りを保存するにはログインが必要です。'))return;const a=userData().favorites,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);save();render()}
function selectBuy(id,kind){if(!requireAuth(`product/${id}`,'カートに追加するにはログインが必要です。'))return;if(kind==='physical'){go('customize/'+id);return}addCart(id,'digital',{license:'personal'})}
function addCart(id,kind,opt={}){const p=productBy(id),u=userData();u.cart.push({id:uid('cartItem'),cartItemId:uid('cartItem'),productId:id,kind,qty:opt.qty||1,license:opt.license||null,material:opt.material||p.material,size:opt.size||'50mm',shape:opt.shape||p.shape,price:kind==='digital'?p.digital:p.physical});save();toast('カートに追加しました');setTimeout(()=>go('cart'),500)}

function customizePage(id){const p=productBy(id);shell(`<div class="customizer"><div><div class="custom-preview"><div id="stPreview" class="sticker-preview">${artSvg(p)}</div></div></div><div class="panel"><h1>シールをカスタマイズ</h1><div class="step-block"><div class="step-title"><span class="step-num">1</span>形状を選ぶ</div><div class="option-grid"><button class="option-btn active" onclick="chooseOpt(this,'shape','ダイカット')">カットパス</button><button class="option-btn" onclick="chooseOpt(this,'shape','スクエア')">スクエア</button><button class="option-btn" onclick="chooseOpt(this,'shape','円形')">円形</button><button class="option-btn" onclick="chooseOpt(this,'shape','角丸')">角丸</button></div></div><div class="step-block"><div class="step-title"><span class="step-num">2</span>数量を選ぶ</div><select id="customQty" class="search-input" onchange="updateQuote('${id}')"><option value="10">10枚</option><option value="50">50枚</option><option value="100" selected>100枚</option><option value="500">500枚</option></select><p class="small muted">納期目安：5営業日</p></div><div class="step-block"><div class="step-title"><span class="step-num">3</span>オプションを選ぶ</div><div class="field"><label>素材</label><select id="customMat" onchange="updateQuote('${id}')"><option>耐水PET</option><option>上質紙</option><option>透明PET</option><option>ホログラム</option></select></div><div class="field"><label>表面加工</label><select id="customFinish" onchange="updateQuote('${id}')"><option>なし</option><option>マット</option><option>グロス</option></select></div></div><div class="quote"><div class="quote-row"><span>商品小計</span><b id="qSub">${yen(p.physical)}</b></div><div class="quote-row"><span>送料</span><b>¥300</b></div><div class="quote-row quote-total"><span>合計</span><b id="qTotal">${yen(p.physical+300)}</b></div></div><button class="btn primary full" style="margin-top:14px" onclick="customAdd('${id}')">カートに追加</button></div></div>`,{title:'シールをカスタマイズ',back:true,cart:true})}
let customState={shape:'ダイカット'};
function chooseOpt(btn,key,val){customState[key]=val;btn.parentElement.querySelectorAll('.option-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const s=$('#stPreview');s.className='sticker-preview'+(val==='円形'?' circle':val==='角丸'?' rounded':'')}
function updateQuote(id){const p=productBy(id),q=Number($('#customQty')?.value||100),factor=Math.max(.52,1-Math.log10(q)*.15),sub=Math.round(p.physical*(q/100)*factor);$('#qSub').textContent=yen(sub);$('#qTotal').textContent=yen(sub+300)}
function customAdd(id){if(!requireAuth(`customize/${id}`,'仕様を保存してカートに追加するにはログインが必要です。'))return;addCart(id,'physical',{qty:Number($('#customQty').value),material:$('#customMat').value,shape:customState.shape,size:'50mm'})}

function customSticker(){shell(`<div class="customizer"><div><div class="custom-preview"><div id="uploadPreview" class="sticker-preview rounded"><span class="muted">画像を選択すると<br>ここに表示されます</span></div></div></div><div class="panel"><h1>オリジナルシールを作る</h1><div class="field"><label>デザイン画像</label><input type="file" accept="image/png,image/jpeg,image/svg+xml" onchange="previewUpload(this)"></div><div class="field"><label>形状</label><select id="ownShape"><option>ダイカット</option><option>円形</option><option>スクエア</option><option>角丸</option></select></div><div class="field"><label>素材</label><select id="ownMat"><option>耐水PET</option><option>上質紙</option><option>透明PET</option><option>ホログラム</option></select></div><div class="field"><label>サイズ</label><select><option>30mm</option><option selected>50mm</option><option>70mm</option><option>100mm</option></select></div><div class="field"><label>数量</label><select><option>10枚</option><option>50枚</option><option>100枚</option><option>500枚</option></select></div><div class="notice">見積：商品小計 ¥1,590 + 送料 ¥350 + 消費税（日本・10%）</div><button class="btn primary full" style="margin-top:12px" onclick="if(requireAuth('create-sticker','作成内容をカートに保存するにはログインが必要です。'))toast('オリジナルシールをカートに追加しました（デモ）')">この仕様でカートに追加</button></div></div>`,{title:'オリジナルシールを作る',back:true,cart:true})}
function previewUpload(input){const f=input.files?.[0];if(!f)return;busy('画像を読み込んでいます…');const r=new FileReader();r.onload=()=>{$('#uploadPreview').innerHTML=`<img src="${r.result}" alt="アップロード画像" style="width:100%;height:100%;object-fit:contain">`;done()};r.onerror=()=>{done();toast('画像を読み込めませんでした')};r.readAsDataURL(f)}

function cartPage(){const u=userData();if(!u)return go('login');const digital=u.cart.filter(x=>x.kind==='digital'),physical=u.cart.filter(x=>x.kind==='physical');const sub=u.cart.reduce((a,x)=>a+x.price*x.qty,0),ship=physical.length?300:0,tax=Math.round((sub+ship)*.1),total=sub+ship+tax;const renderItems=a=>a.map(x=>cartItem(x)).join('');shell(`<div class="section-head"><div><h1>カート</h1><p>${u.cart.length}商品</p></div></div>${physical.length?`<div class="shipping-meter">🚚 あと${yen(Math.max(0,5000-sub))}で送料無料！</div>`:''}<div class="cart-layout"><div class="cart-list">${digital.length?`<h2>デジタル商品</h2>${renderItems(digital)}`:''}${physical.length?`<h2>物理シール</h2>${renderItems(physical)}`:''}${!u.cart.length?`<div class="empty"><div class="emoji">🛒</div><h2>カートは空です</h2><p class="muted">気になるデザインを探して追加してみましょう。</p><button class="btn primary" onclick="go('search')">作品を探す</button></div>`:''}</div>${u.cart.length?`<aside class="card summary-card"><h2>注文概要</h2><div class="quote-row"><span>小計</span><b>${yen(sub)}</b></div><div class="quote-row"><span>送料</span><b>${yen(ship)}</b></div><div class="quote-row"><span>税</span><b>${yen(tax)}</b></div><div class="divider"></div><div class="quote-row quote-total"><span>合計</span><b>${yen(total)}</b></div><button class="btn primary full" style="margin-top:14px" onclick="go('checkout/shipping')">購入手続きへ</button></aside>`:''}</div>`,{title:'カート',back:true,cart:false})}
function cartItem(x){const p=productBy(x.productId);return `<article class="card cart-item"><div class="cart-thumb">${artSvg(p)}</div><div><b>${esc(p.name)}</b><div class="small muted">${esc(creatorBy(p.creatorId).name)}</div><div class="small muted">${x.kind==='digital'?`デジタル / ${x.license||'個人利用'}`:`${x.material} / ${x.size} / ${x.shape}`}</div><div class="btn-row" style="margin-top:8px"><div class="qty"><button onclick="cartQty('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="cartQty('${x.id}',1)">＋</button></div><button class="link-btn" onclick="removeCart('${x.id}')">削除</button><button class="link-btn" onclick="saveLater('${x.id}')">あとで買う</button></div></div><b class="cart-price">${yen(x.price*x.qty)}</b></article>`}
function cartQty(id,d){const x=userData().cart.find(x=>x.id===id);if(!x)return;x.qty=Math.max(1,x.qty+d);save();render()}
function removeCart(id){confirmAction('カートから削除','この商品をカートから削除します。','削除',()=>{userData().cart=userData().cart.filter(x=>x.id!==id);save();render()})}
function saveLater(id){const u=userData(),x=u.cart.find(x=>x.id===id);if(x&&!u.favorites.includes(x.productId))u.favorites.push(x.productId);u.cart=u.cart.filter(x=>x.id!==id);save();toast('お気に入りへ移動しました');render()}
function checkoutSteps(n){return `<div class="checkout-steps"><div class="checkout-step ${n>1?'done':n===1?'active':''}">1 配送先</div><div class="checkout-step ${n>2?'done':n===2?'active':''}">2 支払い</div><div class="checkout-step ${n===3?'active':''}">3 確認</div></div>`}
function shippingPage(){const u=userData(),hasPhysical=u.cart.some(x=>x.kind==='physical');if(!u.cart.length)return go('cart');shell(`${checkoutSteps(1)}<h1>配送先を選択</h1>${hasPhysical?u.addresses.map(a=>`<button class="card address-card ${a.default?'active':''}" onclick="selectAddress('${a.id}')" style="width:100%;text-align:left"><b>${a.name}</b><div>〒${a.zip}</div><div>${a.address}</div><div>${a.phone}</div>${a.default?'<span class="status ok">既定の住所</span>':''}</button>`).join(''):`<div class="notice">デジタル商品のみのため配送先入力は不要です。</div>`}<button class="link-btn" onclick="editAddress()">＋ 新しい配送先を追加</button>${hasPhysical?`<div class="field"><label>お届け希望日</label><select><option>最短でお届け</option><option>8月18日</option><option>8月19日</option></select></div><div class="field"><label>お届け時間帯</label><select><option>指定なし</option><option>午前中</option><option>14〜16時</option><option>18〜20時</option></select></div>`:''}<div class="sticky-cta"><span></span><button class="btn primary" onclick="go('checkout/payment')">次へ</button></div>`,{title:'注文手続き（1/3） 配送先',back:true,cart:false})}
function selectAddress(id){userData().addresses.forEach(a=>a.default=a.id===id);save();render()}
function editAddress(){showModal(`<div class="section-head"><h2>配送先を追加</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="field"><label>氏名</label><input id="an"></div><div class="field"><label>郵便番号</label><input id="az"></div><div class="field"><label>住所</label><input id="aa"></div><div class="field"><label>電話番号</label><input id="ap"></div><button class="btn primary" onclick="saveAddress()">保存</button>`)}
function saveAddress(){const a={id:uid('address'),name:$('#an').value,zip:$('#az').value,address:$('#aa').value,phone:$('#ap').value,default:false};userData().addresses.push(a);save();closeModal();render()}
function paymentPage(){const u=userData();shell(`${checkoutSteps(2)}<h1>支払い方法を選択</h1><div class="notice demo">実決済ではありません。公開デモ用の模擬決済です。</div>${[['card','💳 クレジットカード','VISA •••• 4242'],['conveni','🏪 コンビニ払い','店頭支払い'],['paypay','PayPay','QR決済'],['later','あと払い','ペイディ想定']].map(x=>`<button class="card payment-card ${u.payment===x[0]?'active':''}" onclick="uPay('${x[0]}')" style="width:100%;text-align:left"><b>${x[1]}</b><div class="small muted">${x[2]}</div></button>`).join('')}<div class="sticky-cta"><button class="btn" onclick="go('checkout/shipping')">戻る</button><button class="btn primary" onclick="go('checkout/confirm')">次へ</button></div>`,{title:'注文手続き（2/3） 支払い方法',back:true,cart:false})}
function uPay(v){userData().payment=v;save();render()}
function confirmPage(){const u=userData(),sub=u.cart.reduce((a,x)=>a+x.price*x.qty,0),ship=u.cart.some(x=>x.kind==='physical')?300:0,tax=Math.round((sub+ship)*.1),total=sub+ship+tax,a=u.addresses.find(x=>x.default)||u.addresses[0];shell(`${checkoutSteps(3)}<h1>注文内容の確認</h1>${u.cart.some(x=>x.kind==='physical')?`<div class="card panel"><div class="section-head"><h3>お届け先</h3><button class="link-btn" onclick="go('checkout/shipping')">変更 ›</button></div><b>${a.name}</b><div class="small">〒${a.zip}<br>${a.address}<br>${a.phone}</div></div>`:''}<div class="card panel" style="margin-top:10px"><div class="section-head"><h3>お支払い方法</h3><button class="link-btn" onclick="go('checkout/payment')">変更 ›</button></div><b>${paymentLabel(u.payment)}</b></div><section class="section"><h2>注文商品</h2>${u.cart.map(cartItem).join('')}</section><div class="card panel"><div class="quote-row"><span>小計</span><b>${yen(sub)}</b></div><div class="quote-row"><span>送料</span><b>${yen(ship)}</b></div><div class="quote-row"><span>税</span><b>${yen(tax)}</b></div><div class="divider"></div><div class="quote-row quote-total"><span>合計</span><b>${yen(total)}</b></div></div><div class="sticky-cta"><button class="btn" onclick="go('checkout/payment')">戻る</button><button class="btn primary" onclick="placeOrder()">注文を確定する</button></div>`,{title:'注文手続き（3/3） 確認',back:true,cart:false})}
function paymentLabel(v){return{card:'クレジットカード •••• 4242',conveni:'コンビニ払い',paypay:'PayPay',later:'あと払い'}[v]||'クレジットカード'}
function placeOrder(){busy('注文を処理しています…');setTimeout(()=>{const u=userData(),sub=u.cart.reduce((a,x)=>a+x.price*x.qty,0),ship=u.cart.some(x=>x.kind==='physical')?300:0,tax=Math.round((sub+ship)*.1),o={id:'ORD-'+Date.now(),orderId:'order_'+Date.now(),userId:currentUser().id,date:now(),items:u.cart.map(x=>({...x})),shipping:ship,tax,total:sub+ship+tax,status:u.cart.some(x=>x.kind==='physical')?'注文確定':'ダウンロード可能'};u.orders.unshift(o);u.cart.filter(x=>x.kind==='digital').forEach(x=>u.downloads.unshift({id:uid('download'),productId:x.productId,date:new Date().toISOString().slice(0,10),expires:'2027-08-13',count:0,size:'4.2 MB',license:x.license||'personal',updated:false}));u.cart=[];u.notifications.unshift({id:uid('notice'),type:'order',text:`注文 ${o.id} を受け付けました`,read:false,date:now()});save();done();go('checkout/complete')},750)}
function completePage(){const o=userData()?.orders?.[0];shell(`<div class="complete"><div class="complete-check">✓</div><h1 style="margin-top:40px">ご注文が完了しました！</h1><p class="muted">ご注文ありがとうございます。注文確認メールを送信した想定です。</p><div class="card panel" style="max-width:460px;margin:24px auto"><div class="small muted">注文番号</div><b>${o?.id||'ORD-DEMO'}</b></div>${o?.items?.some(x=>x.kind==='digital')?`<div class="notice" style="max-width:460px;margin:auto">デジタル商品はマイページのダウンロードから取得できます。</div>`:''}<div class="btn-row" style="justify-content:center;margin-top:22px"><button class="btn primary" onclick="go('orders')">注文履歴を見る</button><button class="btn" onclick="go('home')">トップへ戻る</button></div></div>`,{title:'注文完了',cart:false,noNav:false})}

function myPage(){const u=currentUser(),d=userData();shell(`<div class="member-card"><div class="small">MEMBER</div><h1 style="margin:5px 0">${esc(u.name)}</h1><div class="small">会員ID：${esc(u.id)}</div><div style="font-size:22px;font-weight:900;margin-top:12px">${u.points.toLocaleString()} pt</div><div class="quick-grid"><button onclick="go('orders')">注文履歴</button><button onclick="go('downloads')">ダウンロード</button><button onclick="go('favorites')">お気に入り</button><button onclick="go('reviews')">レビュー</button><button onclick="go('coupons')">クーポン</button></div></div><section class="section card panel"><div class="menu-list"><button class="menu-row" onclick="accountModal()"><span>プロフィール編集</span><span>›</span></button><button class="menu-row" onclick="go('addresses')"><span>配送先リスト</span><span>›</span></button><button class="menu-row" onclick="go('settings')"><span>表示・テーマ・通知設定</span><span>›</span></button><button class="menu-row" onclick="go('notifications')"><span>通知 ${unread()?`<span class="badge-count" style="position:static;display:inline-grid">${unread()}</span>`:''}</span><span>›</span></button><button class="menu-row" onclick="legal('contact')"><span>ヘルプ・お問い合わせ</span><span>›</span></button>${u.role==='creator'?`<button class="menu-row" onclick="go('creator-dashboard')"><span>クリエイター管理</span><span>›</span></button>`:''}${u.role==='admin'?`<button class="menu-row" onclick="go('admin')"><span>管理画面</span><span>›</span></button>`:''}<button class="menu-row" onclick="logoutConfirm()"><span>ログアウト</span><span>›</span></button></div></section>`,{title:'マイページ',bell:true,footer:true})}
function accountModal(){const u=currentUser();showModal(`<div class="section-head"><h2>プロフィール</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="field"><label>表示名</label><input id="profileName" value="${esc(u.name)}"></div><div class="field"><label>メール</label><input value="${esc(u.email)}" disabled></div><button class="btn primary" onclick="currentUser().name=$('#profileName').value;save();closeModal();render()">変更する</button>`)}
function logoutConfirm(){confirmAction('ログアウトしますか？','現在のアカウントからログアウトします。ブラウザ内のアカウントデータは保持されます。','ログアウト',()=>{db.session.userId=null;save();go('landing',{replace:true})})}
function ordersPage(){const d=userData();shell(`<div class="section-head"><div><h1>注文履歴</h1><p>デジタル商品と物理商品をまとめて確認できます。</p></div></div><div class="tabs"><button class="active">すべて</button><button>デジタル商品</button><button>物理商品</button></div>${d.orders.length?d.orders.map(orderCard).join(''):`<div class="empty"><div class="emoji">📦</div><h2>注文履歴はまだありません</h2><p class="muted">気になる作品を探してみましょう。</p><button class="btn primary" onclick="go('search')">作品を探す</button></div>`}`,{title:'注文履歴',back:true,footer:true})}
function orderCard(o){return `<article class="card order-card"><div class="order-head"><div><b>${o.id}</b><div class="small muted">${fmtDate(o.date)}</div></div><span class="status ${o.status.includes('発送')?'warn':'ok'}">${o.status}</span></div><div class="order-products">${o.items.slice(0,5).map(x=>`<div class="mini">${artSvg(productBy(x.productId))}</div>`).join('')}</div><div class="quote-row"><span>${o.items.length}商品</span><b>${yen(o.total)}</b></div><div class="btn-row" style="margin-top:9px">${o.items.some(x=>x.kind==='digital')?`<button class="btn" onclick="go('downloads')">データDL</button>`:''}${o.items.some(x=>x.kind==='physical')?`<button class="btn" onclick="toast('配送状況：発送準備中（デモ）')">配送追跡</button>`:''}<button class="btn" onclick="reorder('${o.id}')">再注文</button><button class="btn" onclick="go('review/${o.items[0].productId}')">レビュー</button><button class="btn" onclick="toast('問い合わせ画面を開きました（デモ）')">問い合わせ</button></div></article>`}
function reorder(id){const o=userData().orders.find(x=>x.id===id);o?.items.forEach(x=>userData().cart.push({...x,id:uid('cartItem')}));save();go('cart')}
function downloadsPage(){const a=userData().downloads;shell(`<div class="section-head"><div><h1>ダウンロード</h1><p>購入済みデジタル商品</p></div></div><div class="tabs"><button class="active">すべて</button><button>ダウンロード可能</button><button>期限切れ</button></div>${a.length?a.map(d=>{const p=productBy(d.productId);return `<article class="card download-card"><div>${artSvg(p)}</div><div><b>${p.name}</b><div class="small muted">購入日 ${d.date}<br>有効期限 ${d.expires}<br>${d.size} ・ DL ${d.count}回</div>${d.updated?'<span class="status warn">ファイル更新あり</span>':''}</div><button class="btn primary" onclick="downloadDemo('${d.id}')">ダウンロード</button></article>`}).join(''):`<div class="empty"><div class="emoji">⬇️</div><h2>ダウンロードできる商品はありません</h2><button class="btn primary" onclick="go('search')">デジタル商品を探す</button></div>`}`,{title:'ダウンロード',back:true})}
function downloadDemo(id){const d=userData().downloads.find(x=>x.id===id);d.count++;d.updated=false;save();toast('ダウンロードを開始しました（デモ）');render()}
function favoritesPage(){const ids=userData()?.favorites||[];shell(`<div class="section-head"><div><h1>お気に入り</h1><p>${ids.length}件</p></div></div>${ids.length?`<div class="product-grid" style="--cols:2">${ids.map(x=>productCard(productBy(x))).join('')}</div>`:`<div class="empty"><div class="emoji">♡</div><h2>お気に入りはまだありません</h2><p class="muted">気になる作品を保存して、あとからまとめて見られます。</p><button class="btn primary" onclick="go('search')">作品を探す</button></div>`}`,{title:'お気に入り',back:true})}
function reviewPage(id){const p=productBy(id);shell(`<div class="review-form"><div class="card panel"><div style="display:flex;gap:12px;align-items:center"><div style="width:90px">${artSvg(p)}</div><div><b>${p.name}</b><div class="small muted">${p.material} / 50mm</div></div></div></div><h1>レビュー投稿</h1><div class="stars" id="reviewStars">${[1,2,3,4,5].map(n=>`<button onclick="setStars(${n})">★</button>`).join('')}</div><div class="field"><label>タイトル（任意）</label><input id="reviewTitle" placeholder="とても可愛いステッカーでした！"></div><div class="field"><label>レビュー</label><textarea id="reviewText"></textarea></div><div class="field"><label>写真（任意）</label><input type="file" accept="image/*" multiple></div><button class="btn primary full" onclick="submitReview('${id}')">投稿する</button></div>`,{title:'レビュー投稿',back:true})}
let reviewStars=5;function setStars(n){reviewStars=n;$$('#reviewStars button').forEach((b,i)=>b.classList.toggle('on',i<n))}
function submitReview(id){if(!requireAuth(`review/${id}`,'レビュー投稿にはログインが必要です。'))return;const t=$('#reviewText').value.trim();if(!t){toast('レビュー本文を入力してください');return}db.global.reviews.unshift({id:uid('review'),productId:id,userId:currentUser().id,rating:reviewStars,text:t,date:now(),kind:'physical',verified:true,helpful:0});save();toast('レビューを投稿しました');go('product/'+id)}

mpty"><div class="emoji">🔎</div><h2>該当する作品がありません</h2><p class="muted">条件を少し変えると見つかるかもしれません。</p><button class="btn primary" onclick="go('search')">条件をクリア</button></div>`}<section class="section"><h2>関連する検索をもっと見る</h2><div class="btn-row">${rel.map(x=>`<button class="chip" onclick="go('search?q=${encodeURIComponent(x)}')">${esc(x)}</button>`).join('')}</div></section>`,{title:'検索結果',back:true,search:true,footer:true});

function v21Related(keyword,cat,list){const found=list[0]||products.find(p=>p.category===cat);const base=[...(found?.tags||[]),found?.category,keyword].filter(Boolean);const map={'動物':['かわいい動物','猫ステッカー','ペットステッカー'],'食べ物':['カフェステッカー','スイーツ','レトロ喫茶'],'風景・自然':['星空','山と湖','アウトドア'],'花・植物':['花ステッカー','ボタニカル','ギフト'],'Y2K・トレンド':['宇宙','ポップ','Y2K']};return [...new Set([...(map[found?.category]||[]),...base])].filter(x=>x!==keyword).slice(0,7)}

  updatedAt:now(),
  draft:{},
  timeline:pending?
   [{id:uid('workEvent'),type:'submit',label:'審査申請',text:'商品情報を審査へ提出しました。',date:'2026-08-13T11:20:00Z'}]:
   [{id:uid('workEvent'),type:'publish',label:'公開開始',text:'商品が公開されました。',date:'2026-08-10T08:00:00Z'}],

 };

/* Sticker Market scenario-fit patch v1.0 — additive core only. */

const S1_SCENARIO_VERSION=1;
const S1_USE_CASES=['PC・スマホ','手帳','文具','車','屋外','店舗','ギフト'];
const S1_MFG_FLOW=['注文受付','製造中','検品','発送済み','配送完了'];
const S1_PAYOUT_FLOW=['未確定','確定','支払予定','支払済み','調整済み'];

function s1Scenario(){db.scenario??={};return db.scenario}
function s1CreatorUser(creatorId){return db.users.find(u=>u.creatorId===creatorId)||null}
function s1UserData(userId){db.userData[userId]??=baseUserData();return db.userData[userId]}
function s1AllOrders(){const rows=[];Object.entries(db.userData||{}).forEach(([userId,d])=>(d.orders||[]).forEach(o=>rows.push({userId,order:o})));return rows}
function s1FindOrder(id){for(const row of s1AllOrders())if(row.order.id===id||row.order.orderId===id)return row;return null}
function s1FindManufacturingByOrder(orderId){return (s1Scenario().manufacturingOrders||[]).find(x=>x.orderId===orderId)||null}
function s1FindManufacturer(id){return (s1Scenario().manufacturers||[]).find(x=>x.id===id)||null}
function s1Date(v){try{return new Date(v).toLocaleString('ja-JP')}catch(e){return String(v||'—')}}
function s1StatusClass(v){return /完了|済み|確定|公開|承認|正常/.test(v)?'ok':/差し戻し|停止|返金|不良|取消|却下|高/.test(v)?'danger':/中|待ち|予定|受付|保留|検品/.test(v)?'warn':''}
function s1ProductCurrentPrice(item){const p=productBy(item.productId);if(!p)return item.price||0;if(item.kind==='digital')return Number(p.digital||0);return Number(p.physical||item.price||0)}
function s1OrderHasProduct(order,productId){return (order.items||[]).some(x=>x.productId===productId)}
function s1PurchasedProduct(userId,productId){const d=db.userData[userId];return !!d?.orders?.some(o=>s1OrderHasProduct(o,productId)&&!String(o.status).includes('キャンセル')&&!String(o.status).includes('返金'))}

function s1Notify(userId,type,text,ref={}){
 const d=s1UserData(userId),cfg=d.settings?.notify||{};
 if(cfg[type]===false)return;
 d.notifications??=[];
 d.notifications.unshift({id:uid('notice'),type,text,ref,read:false,date:now()});
}
function s1NotifyCreator(creatorId,type,text,ref={}){const u=s1CreatorUser(creatorId);if(u)s1Notify(u.id,type,text,ref)}
function s1Track(type,data={}){
 const sc=s1Scenario();sc.analytics??={events:[]};sc.analytics.events??=[];
 sc.analytics.events.push({id:uid('event'),type,userId:currentUser()?.id||null,date:now(),...data});
 if(sc.analytics.events.length>1200)sc.analytics.events=sc.analytics.events.slice(-1200);
 save();
}
function s1Audit(action,before,after,source='scenario-fit'){
 db.admin.audit??=[];
 db.admin.audit.unshift({id:uid('audit'),date:now(),userId:currentUser()?.id||'system',action,before,after,source});
}

function s1UseCasesForProduct(p,i){
 const text=[p.category,p.use,...(p.tags||[])].filter(Boolean).join(' ');
 const out=[];
 if(/PC|スマホ|宇宙|Y2K|文字|ロゴ/.test(text))out.push('PC・スマホ');
 if(/手帳|花|植物|かわいい|シンプル/.test(text))out.push('手帳','文具');
 if(/屋外|アウトドア|風景|自然|山|耐水/.test(text))out.push('屋外');
 if(/店舗|ビジネス|ロゴ|食べ物|カフェ/.test(text))out.push('店舗');
 if(/ギフト|花|かわいい|動物|ペット/.test(text))out.push('ギフト');
 if(/車|カー/.test(text))out.push('車');
 if(!out.length)out.push(S1_USE_CASES[i%S1_USE_CASES.length]);
 return [...new Set(out)];
}
function s1SeriesSeed(){
 return [

function s1CustomOrderNewPage(creatorId){
 const c=creatorBy(creatorId);if(!c)return go('creators');if(!requireAuth(`custom-order/new/${creatorId}`,'オーダーメイドを依頼するにはログインが必要です。'))return;

}
function s1CreateCustomOrder(creatorId){const title=$('#coTitle').value.trim(),body=$('#coBody').value.trim();if(!title||!body){toast('タイトルと希望内容を入力してください');return}const x={id:uid('customOrder'),caseId:uid('customOrder'),userId:currentUser().id,creatorId,title,body,useCase:$('#coUse').value,budget:Number($('#coBudget').value),status:'依頼',date:now(),updatedAt:now(),messages:[],draftNote:'',revisionCount:0,approvedProductId:null};s1Scenario().customOrders.unshift(x);s1NotifyCreator(creatorId,'order',`新しいオーダーメイド依頼「${title}」が届きました`,{customOrderId:x.id});save();go(`custom-order/${x.id}`)}

function s1CustomOrderDetailPage(id){
 const x=s1Scenario().customOrders.find(v=>v.id===id);if(!x||!s1CanAccessCustom(x))return go('custom-orders');const u=currentUser(),isCreator=u.role==='creator'&&u.creatorId===x.creatorId,isBuyer=x.userId===u.id;
 shell(`<div class="section-head"><div><span class="status ${s1StatusClass(x.status)}">${x.status}</span><h1>${esc(x.title)}</h1><p>${esc(creatorBy(x.creatorId).name)}とのオーダーメイド案件</p></div></div><div class="management-grid"><div><div class="card panel"><h2>依頼内容</h2><p>${esc(x.body)}</p><div class="detail-list"><div><span>用途</span><b>${esc(x.useCase)}</b></div><div><span>希望予算</span><b>${yen(x.budget)}</b></div><div><span>修正回数</span><b>${x.revisionCount}</b></div></div>${x.draftNote?`<div class="notice" style="margin-top:12px"><b>現在の初稿・提案</b><p>${esc(x.draftNote)}</p></div>`:''}<div class="btn-row" style="margin-top:14px">${isCreator&&x.status==='依頼'?`<button class="btn primary" onclick="s1CustomTransition('${id}','受注')">受注する</button>`:''}${isCreator&&['受注','制作中','修正'].includes(x.status)?`<button class="btn" onclick="s1CustomDraftModal('${id}')">初稿を提出</button>`:''}${isBuyer&&x.status==='初稿'?`<button class="btn" onclick="s1CustomTransition('${id}','修正')">修正を依頼</button><button class="btn primary" onclick="s1ApproveCustomOrder('${id}')">承認して購入へ</button>`:''}</div></div></div><div><div class="card panel"><h2>メッセージ</h2><div class="message-thread">${x.messages.length?x.messages.map(m=>`<div class="message-bubble ${m.userId===u.id?'mine':'admin'}"><b>${esc(m.sender)}</b><p>${esc(m.text)}</p><small>${s1Date(m.date)}</small></div>`).join(''):'<p class="muted">案件について確認したい内容を送れます。</p>'}</div><div class="field"><textarea id="coMsg" placeholder="メッセージ"></textarea></div><button class="btn primary full" onclick="s1CustomSendMessage('${id}')">送信</button></div></div></div>`,{title:'オーダーメイド詳細',back:true,bell:true,cart:false});
}
function s1CustomTransition(id,status){const x=s1Scenario().customOrders.find(v=>v.id===id);if(!x||!s1CanAccessCustom(x))return;const before=x.status;x.status=status;x.updatedAt=now();if(status==='受注')x.status='制作中';if(status==='修正')x.revisionCount++;s1Audit('オーダーメイド状態更新',before,x.status,'オーダーメイド');s1Notify(x.userId,'order',`オーダーメイド「${x.title}」：${x.status}`,{customOrderId:id});s1NotifyCreator(x.creatorId,'order',`オーダーメイド「${x.title}」：${x.status}`,{customOrderId:id});save();render()}
function s1CustomDraftModal(id){showModal(`<div class="section-head"><h2>初稿を提出</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="field"><label>初稿・制作内容</label><textarea id="coDraft" placeholder="デザインの方向性、修正ポイントなど"></textarea></div><div class="field"><label>参考画像（任意）</label><input type="file" accept="image/*"></div><button class="btn primary" onclick="s1SubmitCustomDraft('${id}')">購入者へ提出</button>`)}
function s1SubmitCustomDraft(id){const x=s1Scenario().customOrders.find(v=>v.id===id),t=$('#coDraft').value.trim();if(!x||!t)return toast('初稿内容を入力してください');x.draftNote=t;x.status='初稿';x.updatedAt=now();s1Notify(x.userId,'order',`オーダーメイド「${x.title}」の初稿が届きました`,{customOrderId:id});save();closeModal();render()}
function s1CustomSendMessage(id){const x=s1Scenario().customOrders.find(v=>v.id===id),t=$('#coMsg').value.trim();if(!x||!t)return;x.messages.push({id:uid('message'),userId:currentUser().id,sender:currentUser().name,text:t,date:now()});const target=currentUser().id===x.userId?s1CreatorUser(x.creatorId)?.id:x.userId;if(target)s1Notify(target,'support',`オーダーメイド「${x.title}」に新しいメッセージ`,{customOrderId:id});save();render()}
function s1ApproveCustomOrder(id){
 const x=s1Scenario().customOrders.find(v=>v.id===id);if(!x||x.userId!==currentUser()?.id)return;let p=products.find(p=>p.privateCustomOrderId===id);
 if(!p){const src=products.find(p=>p.creatorId===x.creatorId)||products[0];p={...src,id:uid('customProduct'),name:`オーダーメイド：${x.title}`,description:x.body,digital:x.budget,physical:x.budget,price:x.budget,sales:0,favs:0,views:0,rating:0,updated:new Date().toISOString().slice(0,10),hidden:true,privateCustomOrderId:id,tags:[...(src.tags||[]),'オーダーメイド']};products.push(p)}
 x.status='承認';x.approvedProductId=p.id;x.updatedAt=now();save();addCart(p.id,'digital',{license:'personal'});
}

function s1SupportDetailPage(id){const x=s1Scenario().supportCases.find(v=>v.id===id),u=currentUser();if(!x||!u||(u.role!=='admin'&&x.userId!==u.id))return go('support');const row=s1FindOrder(x.orderId),m=s1FindManufacturingByOrder(x.orderId);shell(`<div class="section-head"><div><span class="status ${s1StatusClass(x.status)}">${x.status}</span><h1>${esc(x.type)}</h1><p>${esc(x.orderId)}</p></div></div><div class="management-grid"><div><div class="card panel"><h2>申告内容</h2><p>${esc(x.body)}</p>${x.attachment?`<div class="status">添付：${esc(x.attachment)}</div>`:''}<div class="detail-list"><div><span>注文状態</span><b>${esc(row?.order.status||'—')}</b></div><div><span>製造状態</span><b>${esc(m?.status||'対象外')}</b></div><div><span>解決内容</span><b>${esc(x.resolution||'対応中')}</b></div></div>${u.role==='admin'?`<div class="btn-row" style="margin-top:14px"><button class="btn" onclick="s1SupportResolve('${id}','回答済み')">回答済みにする</button>${['印刷不良','破損','誤配送'].includes(x.type)?`<button class="btn primary" onclick="s1CreateRemanufacture('${id}')">再製造を手配</button>`:''}<button class="btn danger" onclick="s1SupportRefund('${id}')">返金処理</button></div>`:''}</div></div><div><div class="card panel"><h2>サポートメッセージ</h2><div class="message-thread">${x.messages.map(m=>`<div class="message-bubble ${m.userId===u.id?'mine':'admin'}"><b>${esc(m.sender)}</b><p>${esc(m.text)}</p><small>${s1Date(m.date)}</small></div>`).join('')}</div><div class="field"><textarea id="supMsg"></textarea></div><button class="btn primary full" onclick="s1SupportMessage('${id}')">送信</button></div></div></div>`,{title:'問い合わせ詳細',back:true,bell:true,cart:false});}
function s1SupportMessage(id){const x=s1Scenario().supportCases.find(v=>v.id===id),t=$('#supMsg').value.trim();if(!x||!t)return;x.messages.push({id:uid('message'),userId:currentUser().id,sender:currentUser().role==='admin'?'Sticker Market運営':currentUser().name,text:t,date:now()});x.updatedAt=now();const target=currentUser().role==='admin'?x.userId:'user_admin_001';s1Notify(target,'support',`問い合わせ ${x.orderId} に新しい返信があります`,{supportCaseId:id});save();render()}
function s1SupportResolve(id,status){const x=s1Scenario().supportCases.find(v=>v.id===id);if(!x)return;x.status=status;x.resolution='運営回答済み';x.updatedAt=now();s1Notify(x.userId,'support',`問い合わせ ${x.orderId} が更新されました：${status}`,{supportCaseId:id});save();render()}
function s1CreateRemanufacture(id){const x=s1Scenario().supportCases.find(v=>v.id===id),orig=s1FindManufacturingByOrder(x?.orderId);if(!x||!orig)return toast('製造注文が見つかりません');const m={...orig,id:uid('mfgOrder'),manufacturingOrderId:uid('mfgOrder'),status:'注文受付',createdAt:now(),updatedAt:now(),reproductionOf:orig.id,history:[{date:now(),status:'注文受付',note:`サポート案件 ${x.id} から再製造`}],inspection:{status:'未実施',note:''},tracking:{carrier:'',number:'',shippedAt:null,deliveredAt:null}};s1Scenario().manufacturingOrders.push(m);x.remanufacturingOrderId=m.id;x.status='再製造手配済み';x.resolution='元注文の売上を維持したまま再製造注文を作成';s1Notify(x.userId,'support',`注文 ${x.orderId} の再製造を手配しました`,{supportCaseId:id,manufacturingOrderId:m.id});save();render()}
function s1SupportRefund(id){const x=s1Scenario().supportCases.find(v=>v.id===id),row=s1FindOrder(x?.orderId);if(!x||!row)return;confirmAction('返金処理を記録しますか？','公開デモでは実送金せず、注文と報酬の調整状態を記録します。','返金を記録',()=>{x.status='返金済み';x.refundAmount=row.order.total;x.resolution=`${yen(row.order.total)}を返金記録`;row.order.status='返金済み';s1Scenario().payouts.filter(p=>p.orderId===row.order.id).forEach(p=>p.status='調整済み');s1Notify(x.userId,'support',`注文 ${x.orderId} の返金処理を記録しました`,{supportCaseId:id});save();render()})}

/* D-11: common report mechanism. */
function s1ReportOpen(type,targetId){if(!requireAuth(routePath(),'通報を送信するにはログインが必要です。'))return;const names={product:'商品',creator:'クリエイター',user:'ユーザー',review:'レビュー'};showModal(`<div class="section-head"><h2>${names[type]||type}を通報</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="field"><label>理由</label><select id="repReason"><option>権利侵害の疑い</option><option>迷惑・スパム</option><option>不適切な内容</option><option>誤解を招く表示</option><option>その他</option></select></div><div class="field"><label>詳細（任意）</label><textarea id="repBody"></textarea></div><button class="btn danger" onclick="s1SubmitReport('${type}','${targetId}')">通報する</button>`)}
function s1SubmitReport(type,targetId){const r={id:uid('report'),reportId:uid('report'),reporterId:currentUser().id,targetType:type,targetId,reason:$('#repReason').value,body:$('#repBody').value.trim(),status:'確認待ち',date:now(),history:[]};s1Scenario().reports.unshift(r);s1Notify('user_admin_001','moderation',`${type}への新しい通報：${r.reason}`,{reportId:r.id});save();closeModal();toast('通報を受け付けました')}


/* Sticker Market scenario-fit patch v1.0 — creator, manufacturing, admin and lifecycle operations. */

function s1CreatePayoutsForOrder(order){

moderation=function(){if(currentUser()?.role!=='admin')return go('home');const rows=s1Scenario().reports;adminWorkbench('通報・モデレーション',`<div class="notice">商品・クリエイター・ユーザー・レビューを共通キューで管理します。</div>${rows.length?rows.map(r=>`<article class="card panel" style="margin:9px 0"><div class="section-head"><div><span class="status ${s1StatusClass(r.status)}">${r.status}</span><h3>${esc(r.targetType)} / ${esc(r.targetId)}</h3></div><small>${s1Date(r.date)}</small></div><p><b>${esc(r.reason)}</b> ${esc(r.body||'')}</p><div class="btn-row"><button class="btn" onclick="s1ModerationAction('${r.id}','確認済み')">問題なし</button><button class="btn danger" onclick="s1ModerationAction('${r.id}','非表示')">非表示・停止</button></div></article>`).join(''):`<div class="empty"><h2>確認待ちの通報はありません</h2></div>`}`,'admin-moderation')}

/* Central post-render enhancer: additive DOM only. */
function s1EnhanceCurrentPage(){
 const path=routePath().split('?')[0],seg=path.split('/');
 if(seg[0]==='product'&&seg[1])s1EnhanceProductPage(seg[1]);
 if(seg[0]==='creator'&&seg[1])s1EnhanceCreatorPage(seg[1]);
 if(seg[0]==='work'&&seg[1])s1EnhanceWorkDetail();
 if(path==='settings')s1EnhanceSettingsPage();
 if(path==='mypage')s1EnhanceMyPage();
 if(path==='ai-studio')s1EnhanceAiStudio();
 if(path==='sales')s1EnhanceSalesPage();
 if(path==='admin')s1EnhanceAdminPage();
 if(path==='admin-menu')s1EnhanceAdminMenu();
}
const s1BaseShell=shell;
shell=function(content,opts={}){s1BaseShell(content,opts);setTimeout(s1EnhanceCurrentPage,0)};

/* Route layer only adds new paths; all existing URLs continue through the prior renderer. */
const s1BaseRender=render;
render=function(){
 const raw=routePath(),path=raw.split('?')[0],seg=path.split('/');
 if(seg[0]==='series'&&seg[1])return s1SeriesPage(seg[1]);
 if(path==='demand-requests')return currentUser()?s1DemandRequestsPage():go('login');
 if(path==='creator-demand')return s1CreatorDemandPage();
 if(path==='custom-orders')return s1CustomOrdersPage();
 if(seg[0]==='custom-order'&&seg[1]==='new'&&seg[2])return s1CustomOrderNewPage(seg[2]);
 if(seg[0]==='custom-order'&&seg[1])return s1CustomOrderDetailPage(seg[1]);
 if(path==='support')return s1SupportListPage();
 if(path==='support/new')return s1SupportNewPage();
 if(seg[0]==='support'&&seg[1])return s1SupportDetailPage(seg[1]);

function s1EnhanceHomeFeatures(){const path=routePath().split('?')[0];if(!['landing','home'].includes(path)||$('#main .s1-feature-home'))return;const feature=s1Scenario().features.find(x=>x.status==='公開');if(!feature)return;const ps=feature.productIds.map(productBy).filter(Boolean).filter(p=>!p.hidden);if(!ps.length)return;const sec=document.createElement('section');sec.className='section s1-feature-home';sec.innerHTML=`<div class="section-head"><div><span class="eyebrow">FEATURE</span><h2>${esc(feature.title)}</h2></div></div><div class="h-scroll">${ps.map(productCard).join('')}</div>`;const usage=[...$('#main section')].find(x=>x.textContent.includes('Sticker Marketの使い方'));if(usage)$('#main').insertBefore(sec,usage);else $('#main').appendChild(sec)}

/* Common analytics: visible product impressions share the same event store as search, views and purchases. */
function s1TrackImpressions(){const path=routePath();if(!path.startsWith('search'))return;const ids=$$('#main .product-card[data-product-id]').map(x=>x.dataset.productId).filter(Boolean),key='s1_imp_'+path+'_'+ids.join(',');if(!ids.length||sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1');s1Track('product_impression',{productIds:ids})}

/* Admin review detail gets rights/evidence without altering the existing review form. */
function s1EnhanceAdminWorkRights(){const path=routePath().split('?')[0],seg=path.split('/');if(seg[0]!=='admin-work'||!seg[1]||$('#main .s1-admin-rights-summary'))return;const p=productBy(seg[1]);if(!p)return;const sec=document.createElement('section');sec.className='section card panel s1-admin-rights-summary';sec.innerHTML=`<h2>権利・入稿申告</h2><div class="detail-list"><div><span>権利保有・許諾</span><b>${p.rights?.ownerDeclared?'申告済み':'未申告'}</b></div><div><span>AI利用</span><b>${p.rights?.aiUsed?'あり':'なし'}</b></div><div><span>証明資料</span><b>${esc((p.rights?.evidence||[]).join('、')||'なし')}</b></div><div><span>違反警告</span><b>${esc(p.rights?.warning||'なし')}</b></div></div>`;$('#main').appendChild(sec)}

/* Login help for the newly-added manufacturing business actor. */
function s1EnhanceLogin(){if(routePath().split('?')[0]!=='login'||$('#main .s1-mfg-login'))return;const notices=$$('#main .notice');if(!notices.length)return;const p=document.createElement('div');p.className='small s1-mfg-login';p.style.marginTop='8px';p.innerHTML='<b>製造事業者</b> mfg@example.test / demo';notices[0].appendChild(p)}

/* Extend already-added admin menu, not the main navigation. */
function s1EnhanceAdminScenarioMenu(){if(routePath().split('?')[0]!=='admin-menu'||$('#main .s1-admin-creator-app'))return;const extra=$('#main .s1-admin-menu-extra')||$('#main .btn-row');if(!extra)return;const b=document.createElement('button');b.className='btn s1-admin-creator-app';b.textContent='クリエイター登録審査';b.onclick=()=>go('admin-creator-apps');extra.appendChild(b)}

/* One enhancer coordinates only additive UI fragments. */
const s1StableEnhanceCurrent=s1EnhanceCurrentPage;
s1EnhanceCurrentPage=function(){s1StableEnhanceCurrent();s1EnhanceSupportCase();s1EnhanceRightsAdmin();s1EnhanceManufacturerOrder();s1EnhanceAdminCategories();s1EnhanceHomeFeatures();s1TrackImpressions();s1EnhanceAdminWorkRights();s1EnhanceLogin();s1EnhanceAdminScenarioMenu()};

/* Add one route to the existing additive router. */
const s1StableRender=render;
render=function(){const path=routePath().split('?')[0];if(path==='admin-creator-apps')return s1AdminCreatorApplications();return s1StableRender()};

save();setTimeout(()=>{done();render()},0);

</script>
</body>
</html>
