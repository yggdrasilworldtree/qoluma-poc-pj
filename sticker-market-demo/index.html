tyle="max-width:520px;margin:40px auto"><button class="btn" onclick="go('lp')">← 戻る</button><h1>ログイン</h1><div class="field"><label>デモアカウント</label><select id="role"><option value="buyer">購入者</option><option value="creator">クリエイター</option><option value="admin">管理者</option></select></div><div class="field"><label>メール</label><input value="demo@example.test"></div><div class="field"><label>パスワード</label><input type="password" value="Demo123!"></div><button class="btn accent" onclick="loginDo()">ログイン</button><p><button class="btn" onclick="go('signup')">新規登録はこちら</button></p></section></main>`}function signup(){root.innerHTML=`<main class="lpwrap"><section class="panel" style="max-width:520px;margin:40px auto"><button class="btn" onclick="go('lp')">← 戻る</button><h1>新規登録</h1><div class="field"><label>表示名</label><input id="sn" value="Demo User"></div><div class="field"><label>メール</label><input value="new@example.test"></div><div class="field"><label>パスワード</label><input type="password" value="Demo123!"></div><label><input type="checkbox" checked> 利用規約に同意する</label><p><button class="btn accent" onclick="signupDo()">無料登録</button></p></section></main>`}function authDone(user){S.user=user;save();let target=sessionStorage.getItem('afterAuth');sessionStorage.removeItem('afterAuth');go(target||'home')}function loginDo(){let r=$('#role').value;authDone({role:r,name:r==='admin'?'管理者':r==='creator'?'Haru Creator':'Demo User'})}function signupDo(){authDone({role:'buyer',name:$('#sn').value||'Demo User'})}function home(){let extra=['アート','動物・ペット','アウトドア','かわいい'].map(c=>section(`${c}で人気`,P.filter(x=>x.cat===c).slice(0,12))).join('');appShell(`<section class="homehero"><h1>あなたのホーム</h1><p>人気作品や分野別ランキングから新しいデザインを探せます。</p></section>${section('人気のデザイン',P.slice(0,12))}${extra}`)}function searchText(p){return[p.name,p.creator,p.cat,...p.tags].join(' ').toLowerCase()}function filtered(){let q=S.search.q.trim().toLowerCase(),r=P.filter(p=>(!q||searchText(p).includes(q))&&(!S.search.cat||p.cat===S.search.cat));for(const sub of S.search.subs){let v=(sub.q||'').trim().toLowerCase();if(!v)continue;if(sub.logic==='AND')r=r.filter(p=>searchText(p).includes(v));else{let add=P.filter(p=>searchText(p).includes(v));r=[...new Map([...r,...add].map(p=>[p.id,p])).values()]}}if(S.search.sort==='popular')r.sort((a,b)=>b.favs-a.favs);if(S.search.sort==='sales')r.sort((a,b)=>b.sales-a.sales);if(S.search.sort==='rating')r.sort((a,b)=>b.rating-a.rating);if(S.search.sort==='priceLow')r.sort((a,b)=>a.price-b.price);if(S.search.sort==='priceHigh')r.sort((a,b)=>b.price-a.price);return r}function resultCard(p){return`<article class="card"><div class="art" style="--x:${p.c}" onclick="go('product/${p.id}')">${p.e}</div><div class="pad"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.creator)}</div><div>${p.tags.slice(0,3).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div><div class="row"><b>${yen(p.price)}〜</b><span>★${p.rating.toFixed(1)}</span></div></div></article>`}function pager(total){let pages=Math.max(1,Math.ceil(total/S.search.size)),p=Math.min(S.search.page,pages);S.search.page=p;let nums=[];for(let i=Math.max(1,p-2);i<=Math.min(pages,p+2);i++)nums.push(i);return`<div class="pager"><div class="pagergroup"><button class="btn" ${p<=1?'disabled':''} onclick="setPage(${p-1})">‹ 前へ</button>${nums.map(n=>`<button class="btn ${n===p?'current':''}" onclick="setPage(${n})">${n}</button>`).join('')}<button class="btn" ${p>=pages?'disabled':''} onclick="setPage(${p+1})">次へ ›</button></div><div class="jump"><input id="jumpPage" type="number" min="1" max="${pages}" value="${p}"><button class="btn" onclick="jumpPage(${pages})">ページへ移動</button></div></div>`}function drawResults(showToast=false){let r=filtered(),start=(S.search.page-1)*S.search.size,part=r.slice(start,start+S.search.size);$('#resultCount').textContent=`${r.length}件の作品が見つかりました`;$('#resultGrid').innerHTML=part.map(resultCard).join('')||'<div class="panel">該当する作品がありません。</div>';$('#pagerTop').innerHTML=pager(r.length);$('#pagerBottom').innerHTML=pager(r.length);save();if(showToast)toast(`${r.length}件見つかりました`)}function search(){appShell(`<h1>商品を探す</h1><section class="panel"><div class="searchsimple"><div class="field kw"><label>キーワード</label><input id="sq" value="${esc(S.search.q)}"></div><div class="field"><label>カテゴリ</label><select id="scat"><option value="">すべて</option>${['アート','動物・ペット','アウトドア','かわいい','和風','ビジネス'].map(x=>`<option ${S.search.cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>並び順</label><select id="ssort"><option value="popular">人気順</option><option value="sales">売れ筋順</option><option value="rating">評価順</option><option value="priceLow">価格が安い順</option><option value="priceHigh">価格が高い順</option></select></div><button class="btn accent" onclick="runSearch()">検索</button></div><div id="subs">${S.search.subs.map((s,i)=>`<div class="subrow"><select onchange="subSet(${i},'logic',this.value)"><option ${s.logic==='AND'?'selected':''}>AND</option><option ${s.logic==='OR'?'selected':''}>OR</option></select><input value="${esc(s.q)}" oninput="subSet(${i},'q',this.value)" placeholder="サブキーワード"><button class="btn" onclick="removeSub(${i})">削除</button></div>`).join('')}</div><button class="btn" onclick="addSub()">＋ サブ検索バーを追加</button><p><button class="btn" onclick="$('#adv').classList.toggle('hidden')">詳細検索</button></p><div id="adv" class="advanced hidden"><div class="advgrid"><div class="field"><label>用途</label><select><option>すべて</option><option>屋外</option><option>PC・スマホ</option></select></div><div class="field"><label>評価</label><select><option>指定なし</option><option>4.5以上</option></select></div><div class="field"><label>AI作品</label><select><option>含む</option><option>除外</option></select></div></div></div></section><div class="resultshead"><b id="resultCount"></b><div><label>1ページ表示 <select id="pageSize" onchange="changeSize(this.value)">${[12,24,48,96].map(n=>`<option value="${n}" ${S.search.size===n?'selected':''}>${n}件</option>`).join('')}</select></label></div></div><div id="pagerTop"></div><div class="grid" id="resultGrid"></div><div id="pagerBottom"></div>`);$('#ssort').value=S.search.sort;drawResults(false)}function runSearch(){S.search.q=$('#sq').value;S.search.cat=$('#scat').value;S.search.sort=$('#ssort').value;S.search.page=1;drawResults(true)}function setPage(n){S.search.page=Math.max(1,n);drawResults(false);document.querySelector('.resultshead').scrollIntoView({block:'start'})}function jumpPage(max){let n=Math.max(1,Math.min(max,Number($('#jumpPage').value)||1));setPage(n)}function changeSize(v){S.search.size=Number(v);S.search.page=1;drawResults(false)}function addSub(){S.search.subs.push({logic:'AND',q:''});save();search()}function subSet(i,k,v){S.search.subs[i][k]=v;save()}function removeSub(i){S.search.subs.splice(i,1);save();search()}function gsearch(){S.search.q=$('#gq').value;S.search.page=1;save();go('search')}function product(id){let p=P.find(x=>x.id===id);appShell(`<button class="btn" onclick="history.back()">← 戻る</button><section class="product"><div class="art" style="--x:${p.c}">${p.e}</div><div><h1>${esc(p.name)}</h1><p class="muted">by ${esc(p.creator)}</p><div>${p.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div><h2>${yen(p.price)}〜</h2><button class="btn accent" onclick="S.cart.push('${p.id}');save();toast('カートに追加しました')">カートに追加</button></div></section>`)}function create(){appShell(`<h1>オリジナルシールを作る</h1><section class="panel"><div class="upload"><b>画像をアップロード</b><p><input type="file" accept="image/png,image/jpeg,image/svg+xml,application/pdf"></p></div><div class="split"><div class="field"><label>サイズ</label><select><option>50mm</option><option>70mm</option><option>100mm</option></select></div><div class="field"><label>数量</label><select><option>10枚</option><option>50枚</option><option>100枚</option></select></div></div><button class="btn accent" onclick="toast('見積を作成しました')">見積を確認</button></section>`)}function favorites(){let r=P.filter(p=>S.fav.includes(p.id));appShell(`<h1>お気に入り</h1><div class="grid">${r.length?r.map(resultCard).join(''):'<div class="panel">お気に入りはまだありません。</div>'}</div>`)}function account(){appShell(`<button class="btn" onclick="history.back()">× 閉じる</button><h1>アカウント</h1><section class="panel"><div class="row"><span>表示名</span><b>${esc(S.user.name)}</b></div><div class="row"><span>権限</span><b>${esc(S.user.role)}</b></div><p><button class="btn danger" onclick="S.user=null;save();go('lp')">ログアウト</button></p></section>`)}function settings(){appShell(`<h1>設定</h1><section class="tree"><details><summary>表示・アクセシビリティ</summary><div class="treebody"><div class="field"><label>テーマ</label><select id="theme"><option value="system">端末設定</option><option value="light">ライト</option><option value="dark">ダーク</option></select></div><div class="field"><label>文字サイズ</label><select id="size"><option value="90">小</option><option value="100">標準</option><option value="115">大</option></select></div><div class="field"><label>アクセントカラー</label><input id="accent" type="color" value="${S.settings.accent}"><div class="muted">主要ボタン、選択状態、通知などの強調表示に適用されます。</div></div></div></details><details><summary>言語</summary><div class="treebody">日本語 / English / 中文 / 한국어</div></details><details><summary>通知</summary><div class="treebody">注文・発送・お気に入り通知</div></details><details><summary>プライバシー</summary><div class="treebody">閲覧履歴・レコメンド設定</div></details></section><div class="savebar"><button class="btn" onclick="settings()">キャンセル</button><button class="btn accent" onclick="saveSettings()">変更する</button></div>`);$('#theme').value=S.settings.theme;$('#size').value=String(S.settings.size)}function saveSettings(){S.settings.theme=$('#theme').value;S.settings.size=Number($('#size').value);S.settings.accent=$('#accent').value;save();toast('設定を変更しました');settings()}function admin(){appShell(`<h1>管理者ダッシュボード</h1><div class="kpis"><div class="panel kpi"><b>1,248</b>ユーザー</div><div class="panel kpi"><b>342</b>今月注文</div><div class="panel kpi"><b>12</b>審査待ち</div><div class="panel kpi"><b>¥1.24M</b>今月売上</div></div><section class="panel" style="margin-top:14px"><h2>全体サマリ</h2><svg viewBox="0 0 600 180" style="width:100%;height:200px"><polyline fill="none" stroke="var(--accent)" stroke-width="6" points="10,150 90,120 170,130 250,85 330,95 410,55 490,70 590,25"/><line x1="10" y1="160" x2="590" y2="160" stroke="var(--line)"/></svg><div class="muted">売上・注文・ユーザー推移のサマリ</div></section><section class="panel" style="margin-top:14px"><h2>管理メニュー</h2><div class="adminmenu"><button class="btn" onclick="go('review')">商品審査</button><button class="btn" onclick="go('orders')">注文管理</button><button class="btn" onclick="go('users')">ユーザー管理</button><button class="btn" onclick="go('sales')">売上管理</button></div></section>`)}function creator(){appShell(`<h1>クリエイターダッシュボード</h1><div class="kpis"><div class="panel kpi"><b>¥45,300</b>売上</div><div class="panel kpi"><b>320</b>DL</div><div class="panel kpi"><b>1,248</b>お気に入り</div><div class="panel kpi"><b>18</b>商品</div></div><p><button class="btn accent" onclick="go('sell')">新しい商品を販売する</button></p>`)}function sell(){appShell(`<h1>商品を販売する</h1><div class="steps">${['デザイン','基本情報','検索設定','販売設定','確認'].map((x,i)=>`<div class="step ${i<2?'on':''}"><i></i>${i+1}. ${x}</div>`).join('')}</div><section class="panel"><h2>販売するデザイン</h2><div class="upload"><b>公開用商品画像</b><p><input type="file" accept="image/*" multiple></p></div><div class="upload" style="margin-top:10px"><b>購入者向け販売データ</b><p><input type="file" accept=".png,.jpg,.jpeg,.svg,.pdf,.zip"></p></div><div class="field"><label>商品名</label><input placeholder="星空と山の風景ステッカー"></div><div class="field"><label>商品説明</label><textarea rows="5"></textarea></div><div class="field"><label>検索タグ</label><input id="tags" placeholder="星空, 山, 夜"></div><div class="chips">${['星空','山','夜','青','キャンプ','アウトドア'].map(x=>`<button class="chip" onclick="addTag('${x}')">${x}</button>`).join('')}</div><div class="field"><label>検索用キーワード</label><input placeholder="夜景 星空 山岳 アウトドア"></div><div class="split"><div class="field"><label>おすすめ素材（任意）</label><select><option>設定しない</option><option>耐水PET</option><option>透明PET</option><option>上質紙</option></select></div><div class="field"><label>おすすめ形状（任意）</label><select><option>設定しない</option><option>ダイカット</option><option>円形</option><option>角丸</option></select></div></div><button class="btn accent" onclick="toast('審査申請しました')">確認して審査申請</button></section>`)}function addTag(t){let e=$('#tags');let a=e.value.split(',').map(x=>x.trim()).filter(Boolean);if(!a.includes(t))a.push(t);e.value=a.join(', ')}function review(){adminSub('商品審査','審査待ちの商品を確認・承認・差し戻しできます。')}function orders(){adminSub('注文管理','注文番号・決済・製造・発送状況を管理します。')}function users(){adminSub('ユーザー管理','購入者・クリエイター・管理者の状態を確認します。')}function sales(){adminSub('売上管理','総売上・手数料・原価・クリエイター支払額を確認します。')}function adminSub(title,desc){appShell(`<button class="btn" onclick="go('admin')">← 管理へ戻る</button><h1>${title}</h1><section class="panel"><p>${desc}</p><table class="table"><tr><th>ID</th><th>状態</th><th>金額/件数</th></tr>${Array.from({length:8},(_,i)=>`<tr><td>#${1001+i}</td><td>${i%2?'処理済み':'確認待ち'}</td><td>${i%2?yen(1200+i*300):3+i}</td></tr>`).join('')}</table></section>`)}function cart(){appShell(`<h1>カート</h1><section class="panel">${S.cart.length?S.cart.map(id=>{let p=P.find(x=>x.id===id);return`<div class="row"><span>${esc(p?.name||id)}</span><b>${yen(p?.price||0)}</b></div>`}).join(''):'カートは空です。'}</section>`)}function route(){let parts=(location.hash.slice(2)|| (S.user?'home':'lp')).split('/'),p=parts[0];pageTop();if(!S.user&&!['lp','login','signup'].includes(p)){gate(p);return}({lp,login,signup,home,search,create,favorites,account,settings,admin,creator,sell,review,orders,users,sales,cart}[p]||(()=>p==='product'&&product(parts[1])))()}window.addEventListener('hashchange',route);save();route();</script></body></html>
