function hashId(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}function uid(role,email){return`user_${role}_${hashId((email||'demo').toLowerCase())}`}

function applyTheme(){const st=data()?.settings||defaultSettings();let k=st.colorTheme;if(k==='system')k=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';const t=themes[k]||themes.light;for(const n of ['bg','card','soft','text','muted','line','accent'])document.documentElement.style.setProperty('--'+n,t[n]);document.documentElement.style.setProperty('--fs',(st.fontSize||100)/100);let css='none';if(st.background.kind==='free')css=(freeBgs.find(x=>x.id===st.background.id)||freeBgs[0]).css;else{const p=products.find(x=>x.id===st.background.id);if(p)css=`radial-gradient(circle at 35% 30%,${p.color} 0 12%,transparent 13%),linear-gradient(135deg,${p.color},var(--soft))`}$('#bg').style.backgroundImage=css;$('#bg').style.filter=`blur(${st.background.blur||0}px)`;$('#tint').style.opacity=String(1-Math.min(.55,(st.background.opacity||12)/100))}

function signup(isSignup){const lang=navigator.language||'ja-JP',tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';const country=lang.startsWith('ja')||tz==='Asia/Tokyo'?'日本':'';$('#root').innerHTML=`<main class="lp-main"><button class="btn" onclick="go('landing')">← 戻る</button><section class="panel" style="max-width:640px;margin:30px auto"><h1>${isSignup?'無料アカウント作成':'ログイン'}</h1>${isSignup?`<p class="muted">必須項目だけでも登録できます。任意項目は後から変更できます。</p><div class="signup-section"><h3>必須情報</h3><div class="field"><label>表示名 <span class="required">必須</span></label><input id="nm"></div><div class="field"><label>メール <span class="required">必須</span></label><input id="em" type="email"></div><div class="split"><div class="field"><label>パスワード <span class="required">必須</span></label><input id="pw" type="password" value="Demo123!"></div><div class="field"><label>確認 <span class="required">必須</span></label><input id="pw2" type="password" value="Demo123!"></div></div><label><input id="terms" type="checkbox"> 利用規約等に同意 <span class="required">必須</span></label></div><div class="signup-section"><h3>任意情報 <span class="optional">後から設定できます</span></h3><div class="split"><div class="field"><label>国・地域</label><input id="country" value="${country}"></div><div class="field"><label>都道府県・地域</label><input id="pref"></div></div><button class="btn" id="geo">現在地を地域候補に利用</button><div id="geoSt" class="muted" style="font-size:11px">ブラウザ言語・タイムゾーンから初期候補を設定しています。</div><div class="split"><div class="field"><label>生年月日</label><input id="birth" type="date"></div><div class="field"><label>性別</label><select id="gender"><option value="">回答しない</option><option>女性</option><option>男性</option><option>その他</option></select></div></div><div class="field"><label>興味分野</label><input id="interests" placeholder="アート, 動物, アウトドア"></div><label><input id="creatorIntent" type="checkbox"> クリエイターとして販売したい</label></div>`:`<div class="field"><label>デモ権限</label><select id="role"><option value="buyer">購入者</option><option value="creator">クリエ function home(){shell(`<section class="panel"><h1>今日の「好き」を見つけよう。</h1><p class="muted">ランキングやカテゴリから探せます。</p></section><section class="section"><h2>人気のデザイン</h2><div class="carousel">${products.slice(0,10).map(p=>productCard(p)).join('')}</div></section>${['アート','動物・ペット','アウトドア'].map(c=>`<section class="section"><h2>${c}で人気</h2><div class="carousel">${products.filter(p=>p.category===c).slice(0,8).map(p=>productCard(p)).join('')}</div></section>`).join('')}`)}
let searchState={page:1,size:12,q:'',cat:'',material:'',shape:'',min:'',max:'',rating:'0',excludeAi:false,sub:'',logic:'AND',advanced:false};
function results(){let r=products.filter(p=>{const txt=(p.name+' '+p.creator+' '+p.category).toLowerCase();if(searchState.q&&!txt.includes(searchState.q.toLowerCase()))return false;if(searchState.cat&&p.category!==searchState.cat)return false;if(searchState.material&&p.material!==searchState.material)return false;if(searchState.shape&&p.shape!==searchState.shape)return false;if(searchState.min&&Math.min(p.digital,p.physical)<+searchState.min)return false;if(searchState.max&&Math.min(p.digital,p.physical)>+searchState.max)return false;if(+searchState.rating&&p.rating<+searchState.rating)return false;if(searchState.excludeAi&&p.ai)return false;if(searchState.sub){const ok=txt.includes(searchState.sub.toLowerCase());if(searchState.logic==='AND'&&!ok)return false}return true});return r}
function search(){const g=sessionStorage.getItem('q');if(g){searchState.q=g;sessionStorage.removeItem('q')}shell(`<h1>商品を探す</h1><section class="panel"><div class="search-simple"><div class="field keyword"><label>キーワード</label><input id="sq" value="${esc(searchState.q)}"></div><div class="field"><label>カテゴリ</label><select id="sc"><option value="">すべて</option>${['アート','動物・ペット','アウトドア','かわいい','和風','ビジネス'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>素材</label><select id="sm"><option value="">すべて</option>${['耐水PET','上質紙','透明PET','クラフト紙'].map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn accent" id="sdo">検索</button></div><div id="sub"></div><button class="btn" id="addSub">＋ 条件を追加</button><button class="btn" id="advBtn">詳細検索</button><div id="adv" class="${searchState.advanced?'':'hidden'}"><div class="compact-grid"><div class="field"><label>形状</label><select id="ssh"><option value="">すべて</option><option>ダイカット</option><option>円形</option><option>角丸</option><option>四角</option></select></div><div class="field"><label>評価</label><select id="srt"><option value="0">指定なし</option><option value="4">4.0以上</option><option value="4.5">4.5以上</option></select></div><div class="field"><label>価格帯</label><div class="range-row"><input id="smin" type="number" placeholder="下限" value="${searchState.min}"><span>〜</span><input id="smax" type="number" placeholder="上限" value="${searchState.max}"></div></div><div class="field"><label><input id="sai" type="checkbox" ${searchState.excludeAi?'checked':''}> AI生成作品を除外</label></div></div></div></section><div id="meta"></div><div id="pager1"></div><div id="res" class="grid"></div><div id="pager2"></div>`);$('#sc').value=searchState.cat;$('#sm').value=searchState.material;$('#ssh').value=searchState.shape;$('#srt').value=searchState.rating;const renderSub=()=>{$('#sub').innerHTML=searchState.sub!==''?`<div class="sub-row"><select id="logic"><option>AND</option><option>OR</option></select><input id="subq" value="${esc(searchState.sub)}" placeholder="追加キーワード"><button class="btn" id="delSub">×</button></div>`:'';$('#addSub').disabled=searchState.sub!=='';if($('#logic')){$('#logic').value=searchState.logic;$('#logic').onchange=e=>searchState.logic=e.target.value;$('#subq').oninput=e=>searchState.sub=e.target.value;$('#delSub').onclick=()=>{searchState.sub='';renderSub()}}};renderSub();$('#addSub').onclick=()=>{searchState.sub=' ';renderSub();$('#subq').value='';searchState.sub=''};$('#advBtn').onclick=()=>{searchState.advanced=!searchState.advanced;search()};$('#sdo').onclick=()=>{Object.assign(searchState,{q:$('#sq').value,cat:$('#sc').value,material:$('#sm').value,shape:$('#ssh').value,min:$('#smin').value,max:$('#smax').value,rating:$('#srt').value,excludeAi:$('#sai').checked,page:1});drawResults();toast(results().length+'件見つかりました')};drawResults()}
function drawResults(){const all=results(),pages=Math.max(1,Math.ceil(all.length/searchState.size));searchState.page=Math.min(searchState.page,pages);const items=all.slice((searchState.page-1)*searchState.size,searchState.page*searchState.size);$('#meta').innerHTML=`<div class="row"><b>${all.length}件</b><label>表示件数 <select id="ps"><option>12</option><option>24</option><option>48</option></select></label></div>`;$('#ps').value=searchState.size;$('#ps').onchange=e=>{searchState.size=+e.target.value;searchState.page=1;drawResults()};const pager=`<div class="pager"><div><button class="btn" onclick="setPage(${searchState.page-1})">‹ 前へ</button> ${Array.from({length:pages},(_,i)=>`<button class="btn ${i+1===searchState.page?'current':''}" onclick="setPage(${i+1})">${i+1}</button>`).slice(0,7).join(' ')} <button class="btn" onclick="setPage(${searchState.page+1})">次へ ›</button></div><div>ページ <input id="jump" type="number" min="1" max="${pages}" value="${searchState.page}" style="width:64px"> <button class="btn" onclick="setPage(+$('#jump').value)">移動</button></div></div>`;$('#pager1').innerHTML=pager;$('#pager2').innerHTML=pager;$('#res').innerHTML=items.map(p=>productCard(p)).join('')}

function createSticker(){let d={shape:'circle',material:'耐水PET',finish:'加工なし',size:50,qty:10,file:null};const q=()=>{const base=Math.round(138*(d.size/50)),mat=d.material==='耐水PET'?21:d.material==='ホログラム'?48:0,fin=d.finish==='加工なし'?0:18,unit=base+mat+fin,sub=unit*d.qty,ship=sub>=5000?0:350,tax=Math.floor((sub+ship)*.1);return{base,mat,fin,unit,sub,ship,tax,total:sub+ship+tax}};shell(`<h1>オリジナルシールを作る</h1><div class="custom-builder"><section><div class="panel"><div class="field"><label>画像</label><input id="cf" type="file" accept="image/*,.svg"></div><div class="compact-grid"><div class="field"><label>形状</label><select id="csh"><option value="circle">円形</option><option value="rounded">角丸</option><option value="star">星型</option></select></div><div class="field"><label>素材</label><select id="cm"><option>耐水PET</option><option>マット紙</option><option>透明PET</option><option>ホログラム</option></select></div><div class="field"><label>加工</label><select id="cfi"><option>加工なし</option><option>マットラミネート</option><option>グロスラミネート</option></select></div><div class="field"><label>サイズ</label><select id="cs"><option>30</option><option selected>50</option><option>70</option><option>100</option></select></div><div class="field"><label>数量</label><select id="cq"><option>1</option><option selected>10</option><option>50</option><option>100</option></select></div></div></div></section><aside><div class="stage"><div id="st" class="sticker shape-circle"><span style="font-size:64px;color:#aaa">＋</span></div></div><div class="quote-float"><div><small>見積合計</small><br><b id="qt"></b></div><button class="btn" id="qd">見積詳細</button><button class="btn accent" id="qc">カートに追加</button></div></aside></div>`,false);const redraw=()=>{const qq=q();$('#qt').textContent=yen(qq.total);$('#st').className='sticker shape-'+d.shape};for(const [id,key] of [['csh','shape'],['cm','material'],['cfi','finish']])$('#'+id).onchange=e=>{d[key]=e.target.value;redraw()};$('#cs').onchange=e=>{d.size=+e.target.value;redraw()};$('#cq').onchange=e=>{d.qty=+e.target.value;redraw()};$('#cf').onchange=e=>{const f=e.target.files[0];if(!f)return;d.file=f;const r=new FileReader();r.onload=()=>$('#st').innerHTML=`<img src="${r.result}" style="width:100%;height:100%;object-fit:cover">`;r.readAsDataURL(f)};$('#qd').onclick=()=>{const qq=q(),a=data().addresses.find(x=>x.isDefault)||{};$('#modal').innerHTML=`<div class="sheet"><div class="row"><h2>見積詳細</h2><button class="btn" onclick="closeModal()">× 閉じる</button></div><div class="row"><span>ステッカー単価（1枚）</span><b>${yen(qq.unit)}</b></div><div class="row"><div>商品小計<div class="muted" style="font-size:12px">基本印刷 ${yen(qq.base)} × ${d.qty}枚<br>素材加算 ${yen(qq.mat)} × ${d.qty}枚<br>加工加算 ${yen(qq.fin)} × ${d.qty}枚</div></div><b>${yen(qq.sub)}</b></div><div class="row"><div>送料<div class="muted" style="font-size:12px">${esc(a.pref||'')} ${esc(a.city||'')}へ配送 <button class="btn" onclick="addressEditor()">変更</button></div></div><b>${yen(qq.ship)}</b></div><div class="row"><span>消費税（日本・10%）</span><b>${yen(qq.tax)}</b></div><div class="row"><span>合計</span><b style="font-size:28px;color:var(--accent)">${yen(qq.total)}</b></div></div>`;$('#modal').hidden=false};$('#qc').onclick=()=>{if(!d.file)return toast('画像を選択してください');const qq=q();data().cart.push({id:'custom'+Date.now(),name:`オリジナルシール ${d.size}mm×${d.qty}枚`,price:qq.total});save();go('cart')};redraw()}
function settings(){let draft=JSON.parse(JSON.stringify(data().settings)),bought=[...new Set(data().orders.flatMap(o=>(o.items||[]).map(i=>i.id)))].map(id=>products.find(p=>p.id===id)).filter(Boolean);shell(`<h1>設定</h1><div class="tree"><details open><summary>テーマ・カラー</summary><div class="treebody"><p class="muted">背景・項目背景・文字色・境界線・ボタン色を1セットで変更します。</p><div class="theme-grid">${Object.entries(themes).map(([k,t])=>`<button class="theme-card ${draft.colorTheme===k?'on':''}" data-th="${k}"><b>${t.label}</b>${k!=='system'?`<div class="swatches"><i style="background:${t.bg}"></i><i style="background:${t.card}"></i><i style="background:${t.text}"></i><i style="background:${t.accent}"></i></div>`:''}</button>`).join('')}</div></div></details><details><summary>背景デザイン</summary><div class="treebody"><h4>無料背景</h4><div class="bg-grid">${freeBgs.map(b=>`<button class="bg-card" data-bg="${b.id}" style="background-image:${b.css}"><b>${b.name}</b></button>`).join('')}</div><h4>購入済みデザイン</h4>${bought.length?`<div class="bg-grid">${bought.map(p=>`<button class="bg-card" data-buy="${p.id}" style="background:linear-gradient(135deg,${p.color},var(--soft))"><b>${esc(p.name)}</b><div>${p.emoji}</div></button>`).join('')}</div>`:'<p class="muted">購入済みデザインはまだありません。</p>'}<div class="split"><div class="field"><label>背景の濃さ</label><input id="bo" type="range" min="0" max="50" value="${draft.background.opacity}"></div><div class="field"><label>ぼかし</label><input id="bb" type="range" min="0" max="12" value="${draft.background.blur}"></div></div></div></details><details><summary>表示・アクセシビリティ</summary><div class="treebody"><select id="fs"><option value="90">小</option><option value="100">標準</option><option value="115">大</option><option value="130">特大</option></select></div></details><details><summary>言語</summary><div class="treebody"><select id="lg"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="ko">한국어</option></select></div></details><details><summary>通知</summary><div class="treebody">注文・発送・フォロー・AI完了通知を管理します。</div></details><details><summary>プライバシー</summary><div class="treebody">閲覧履歴・位置情報利用・レコメンド設定を管理します。</div></details></div><div class="savebar"><button class="btn" onclick="settings()">キャンセル</button><button class="btn accent" id="ss">変更する</button></div>`);$('#fs').value=draft.fontSize;$('#lg').value=draft.lang;$$('[data-th]').forEach(x=>x.onclick=()=>{draft.colorTheme=x.dataset.th;$$('[data-th]').forEach(y=>y.classList.toggle('on',y===x))});$$('[data-bg]').forEach(x=>x.onclick=()=>draft.background={...draft.background,kind:'free',id:x.dataset.bg});$$('[data-buy]').forEach(x=>x.onclick=()=>draft.background={...draft.background,kind:'purchase',id:x.dataset.buy});$('#bo').oninput=e=>draft.background.opacity=+e.target.value;$('#bb').oninput=e=>draft.background.blur=+e.target.value;$('#fs').onchange=e=>draft.fontSize=+e.target.value;$('#lg').onchange=e=>draft.lang=e.target.value;$('#ss').onclick=()=>{data().settings=draft;save();toast('設定を変更しました');settings()}}

>`);$('#ba').value=b.audiences[0];$('#bs').onclick=()=>{const n={...b,name:$('#bn').value,icon:$('#bi').value,category:$('#bc').value,description:$('#bd').value,audiences:[$('#ba').value],version:$('#bv').value,permissions:$('#bp').value.split(',').map(x=>x.trim()).filter(Boolean),enabled:$('#be').checked};if(id)state.aiBots[state.aiBots.findIndex(x=>x.id===id)]=n;else state.aiBots.push(n);state.aiBotLogs.push({action:id?'edit':'create',botId:n.id,actorUserId:state.user.id,at:new Date().toISOString()});save();closeModal();bots()}};$('#newBot').onclick=()=>editor();$$('[data-edit]').forEach(x=>x.onclick=()=>editor(x.dataset.edit));$$('[data-toggle]').forEach(x=>x.onclick=()=>{const b=state.aiBots.find(z=>z.id===x.dataset.toggle);b.enabled=!b.enabled;state.aiBotLogs.push({action:'toggle',botId:b.id,actorUserId:state.user.id,at:new Date().toISOString()});save();bots()})}

function v11PriceSlider(){const lo=$('#smin'),hi=$('#smax');if(!lo||!hi||lo.type==='range')return;const min=searchState.min===''?0:+searchState.min,max=searchState.max===''?5000:+searchState.max,wrap=lo.closest('.field');if(!wrap)return;wrap.innerHTML=`<label>価格</label><div class="price-slider-box"><div class="price-range-labels"><span id="priceLow">${yen(min)}</span><span id="priceHigh">${max>=5000?'¥5,000+':yen(max)}</span></div><div class="price-slider"><div class="price-track"><div class="price-fill" id="priceFill"></div></div><input id="smin" type="range" min="0" max="5000" step="100" value="${min}"><input id="smax" type="range" min="0" max="5000" step="100" value="${max}"></div></div>`;const a=$('#smin'),b=$('#smax'),fill=$('#priceFill'),l=$('#priceLow'),h=$('#priceHigh');const sync=from=>{let x=+a.value,y=+b.value;if(y-x<100){if(from==='a')x=y-100;else y=x+100}x=Math.max(0,x);y=Math.min(5000,y);a.value=x;b.value=y;l.textContent=yen(x);h.textContent=y>=5000?'¥5,000+':yen(y);fill.style.left=(x/50)+'%';fill.style.right=(100-y/50)+'%';searchState.min=x||'';searchState.max=y>=5000?'':y};a.oninput=()=>sync('a');b.oninput=()=>sync('b');sync()}

function relatedSmartTerms(p){
  const map={アート:['アートステッカー','抽象デザイン','イラストステッカー','ギャラリー風'], '動物・ペット':['猫ステッカー','犬ステッカー','ペットステッカー','かわいい動物'],アウトドア:['キャンプステッカー','山ステッカー','自然モチーフ','旅行ステッカー'],かわいい:['かわいいステッカー','パステルステッカー','ワンポイント','ギフト向け'],和風:['和風ステッカー','日本モチーフ','伝統柄','和モダン'],ビジネス:['仕事用ステッカー','ラベル','シンプルデザイン','整理用']};
  let out=[];
  if(p){out=[...(map[p.category]||[]),`${p.material} ステッカー`,`${p.shape} ステッカー`,`${p.creator} の作品`]}
  else{
    const q=(searchState.q||'').toLowerCase(),cat=searchState.cat;
    if(cat&&map[cat])out.push(...map[cat]);
    const keywordRules=[['宇宙',['宇宙ステッカー','星空ステッカー','惑星ステッカー','夜空デザイン']],['星',['星空ステッカー','夜空ステッカー','宇宙デザイン']],['猫',['猫ステッカー','黒猫ステッカー','動物ステッカー']],['花',['花ステッカー','植物ステッカー','ボタニカル']],['キャンプ',['キャンプステッカー','アウトドア','山ステッカー']],['かわいい',['かわいいステッカー','パステル','ワンポイント']]];
    for(const [k,a] of keywordRules)if(q.includes(k))out.push(...a);
    if(!out.length)out=['人気ステッカー','新着ステッカー','高評価ステッカー','ギフト向け'];
  }
  return [...new Set(out)].slice(0,8)
}
