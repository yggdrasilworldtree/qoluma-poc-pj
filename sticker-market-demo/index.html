<script>

const products=Array.from({length:60},(_,i)=>({id:'p'+(i+1),name:['星空と山の風景','まるねこ日和','花束のワンポイント','宇宙のかけら','キャンプの輪郭','コーヒータイム','旅するトラック','レトロゲーム'][i%8]+' '+(i+1),creator:['Haru Creator','mignon','sora design','Petit Atelier'][i%4],creatorId:'c'+(i%4+1),category:['アート','動物・ペット','アウトドア','かわいい','和風','ビジネス'][i%6],material:['耐水PET','上質紙','透明PET','クラフト紙'][i%4],shape:['ダイカット','円形','角丸','四角'][i%4],rating:4+(i%10)/10,digital:300+(i%5)*70,physical:480+(i%6)*90,favs:80+i*6,sales:50+i*5,color:['#9fd7d0','#c9b2f1','#f8b36a','#a9d68d','#ffc6d7','#82b7ff'][i%6],emoji:['🌌','🐱','🌸','🪐','⛺','☕','🚚','🎮'][i%8],ai:i%9===0}));

const themes={system:{label:'端末に合わせる'},light:{label:'ライト',bg:'#fffaf7',card:'#ffffff',soft:'#f3efeb',text:'#1b1b1d',muted:'#777',line:'#ddd6d1',accent:'#e891a6'},dark:{label:'ダーク',bg:'#101113',card:'#191b1e',soft:'#25272b',text:'#f6f3f1',muted:'#aaa',line:'#3b3d41',accent:'#ff7c8d'},blue:{label:'パステルブルー',bg:'#f3f8ff',card:'#fbfdff',soft:'#e6f0fb',text:'#223047',muted:'#708098',line:'#ccdaeb',accent:'#79aee8'},orange:{label:'パステルオレンジ',bg:'#fff8f1',card:'#fffdf9',soft:'#faeadb',text:'#443126',muted:'#8a7464',line:'#ecd7c4',accent:'#e9a064'},pink:{label:'パステルピンク',bg:'#fff6f8',card:'#fffdfd',soft:'#f9e7ec',text:'#472c35',muted:'#8b7179',line:'#ecd3da',accent:'#e792a8'},purple:{label:'パステルパープル',bg:'#faf7ff',card:'#fefcff',soft:'#eee8f8',text:'#382e49',muted:'#7e728e',line:'#ded3eb',accent:'#aa8bd4'},charcoal:{label:'チャコール',bg:'#202225',card:'#292c30',soft:'#34383d',text:'#f4f1ee',muted:'#b6b1ad',line:'#474b50',accent:'#d5a0a9'}};
const freeBgs=[{id:'none',name:'背景なし',css:'none'},{id:'pastel',name:'パステル',css:'linear-gradient(135deg,#ffdfe7,#dcecff,#e7f4dc)'},{id:'dots',name:'ソフトドット',css:'radial-gradient(circle at 8px 8px,#fff9 2px,transparent 3px),linear-gradient(135deg,#e8e1ff,#dff4ef)'},{id:'night',name:'淡い夜空',css:'linear-gradient(160deg,#27304d,#6e7aa2,#d9c8d8)'},{id:'paper',name:'ペーパー',css:'linear-gradient(120deg,#f5eee4,#efe3d3)'},{id:'peach',name:'ピーチ',css:'linear-gradient(135deg,#ffe5d0,#ffd8df)'}];

let state=JSON.parse(localStorage.getItem('sm10')||'null')||{user:null,users:{},userData:{},aiBots:defaultBots,aiBotLogs:[]};
const defaultSettings=()=>({colorTheme:'system',fontSize:100,lang:'ja',background:{kind:'free',id:'none',opacity:12,blur:0}});
function hashId(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}function uid(role,email){return`user_${role}_${hashId((email||'demo').toLowerCase())}`}
function newData(){return{cart:[],orders:[],fav:[],settings:defaultSettings(),addresses:[{id:'a1',recipient:'Demo User',postal:'160-0022',pref:'東京都',city:'新宿区',line1:'新宿1-1-1',line2:'',phone:'090-0000-0000',isDefault:true}],created:[],downloads:[],viewHistory:[],searchHistory:[],follows:[],reviews:[],customProjects:[],aiHistory:[],profile:{}}}function data(){if(!state.user)return null;state.userData[state.user.id]=state.userData[state.user.id]||newData();return state.userData[state.user.id]}function save(){localStorage.setItem('sm10',JSON.stringify(state));applyTheme()}
function applyTheme(){const st=data()?.settings||defaultSettings();let k=st.colorTheme;if(k==='system')k=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';const t=themes[k]||themes.light;for(const n of ['bg','card','soft','text','muted','line','accent'])document.documentElement.style.setProperty('--'+n,t[n]);document.documentElement.style.setProperty('--fs',(st.fontSize||100)/100);let css='none';if(st.background.kind==='free')css=(freeBgs.find(x=>x.id===st.background.id)||freeBgs[0]).css;else{const p=products.find(x=>x.id===st.background.id);if(p)css=`radial-gradient(circle at 35% 30%,${p.color} 0 12%,transparent 13%),linear-gradient(135deg,${p.color},var(--soft))`}$('#bg').style.backgroundImage=css;$('#bg').style.filter=`blur(${st.background.blur||0}px)`;$('#tint').style.opacity=String(1-Math.min(.55,(st.background.opacity||12)/100))}
function toast(m,d=1200){const e=$('#toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),d)}function modal(html){$('#modal').innerHTML=`<div class="modal"><div class="modalbox">${html}</div></div>`;$('#modal').hidden=false}function closeModal(){$('#modal').hidden=true}function go(p){location.hash='#/'+p}function afterAuth(){const a=sessionStorage.getItem('afterLogin');sessionStorage.removeItem('afterLogin');return a}function requireLogin(target){if(state.user)go(target);else{sessionStorage.setItem('afterLogin',target);go('login')}}
function productCard(p,lp=false){return`<article class="card"><div class="art" style="--c:${p.color}" onclick="go('product/${p.id}')">${p.emoji}</div><div class="pad"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.creator)}</div><span class="badge">${esc(p.category)}</span><div class="row"><b>${yen(Math.min(p.digital,p.physical))}〜</b><span>★${p.rating.toFixed(1)}</span></div></div></article>`}
function lp(){const pop=[...products].sort((a,b)=>b.favs-a.favs).slice(0,10);$('#root').innerHTML=`<header class="lp-head"><div class="brand">Sticker Market</div><div class="rowBtns"><button class="btn" onclick="go('login')">ログイン</button><button class="btn accent" onclick="go('signup')">無料登録</button></div></header><main class="lp-main"><section class="hero"><div><div class="muted">DESIGN × STICKER MARKETPLACE</div><h1>デザインを探す。<br>買う。シールにする。</h1><p>世界中のクリエイターと、あなたの「好き」をつなぐマーケットプレイス。</p></div><div class="collage"><div class="st" style="background:#ffd486">🐶</div><div class="st" style="background:#dbe7ff">🌌</div><div class="st" style="background:#def0d7">⛺</div><div class="st" style="background:#eadbff">🪐</div></div></section><section class="section" id="popular"><h2>人気の作品</h2><div class="carousel">${pop.map(p=>productCard(p,true)).join('')}</div></section><section class="section"><h2>売れ筋ランキング</h2><div class="carousel">${[...products].sort((a,b)=>b.sales-a.sales).slice(0,10).map(p=>productCard(p,true)).join('')}</div></section>${['アート','動物・ペット','アウトドア','かわいい'].map(c=>`<section class="section"><h2>${c}で人気</h2><div class="carousel">${products.filter(p=>p.category===c).slice(0,8).map(p=>productCard(p,true)).join('')}</div></section>`).join('')}<section class="section"><h2>人気クリエイター</h2><div class="creator-row">${creators.map(c=>`<div class="creator-card"><h3>${c.name}</h3><div class="muted">${c.genre}</div></div>`).join('')}</div></section><section class="section"><h2>Sticker Marketの使い方</h2><div class="ux-grid"><div class="panel"><h3>買う</h3><p>作品を探してデータまたはシールを購入。</p></div><div class="panel"><h3>作る</h3><p>自分の画像からオリジナルシールを作成。</p></div><div class="panel"><h3>売る</h3><p>クリエイターとしてデザインを販売。</p></div></div></section></main>${legalFooter()}`}

function shell(content,search=true){$('#root').innerHTML=`<header class="app-head"><div class="brand" onclick="go('home')">Sticker Market</div>${search?`<div class="searchbar"><input id="gq" placeholder="キーワードで検索"><button id="ggo">⌕</button></div>`:'<div></div>'}<div class="rowBtns"><button class="btn" onclick="go('account')">${esc(state.user.name)}</button><button class="btn" onclick="go('cart')">カート ${data().cart.length}</button></div></header><main class="app-main">${content}</main>${nav()}${legalFooter()}`;if(search)$('#ggo').onclick=()=>{sessionStorage.setItem('q',$('#gq').value);go('search')}}
function signup(isSignup){const lang=navigator.language||'ja-JP',tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';const country=lang.startsWith('ja')||tz==='Asia/Tokyo'?'日本':'';$('#root').innerHTML=`<main class="lp-main"><button class="btn" onclick="go('landing')">← 戻る</button><section class="panel" style="max-width:640px;margin:30px auto"><h1>${isSignup?'無料アカウント作成':'ログイン'}</h1>${isSignup?`<p class="muted">必須項目だけでも登録できます。任意項目は後から変更できます。</p><div class="signup-section"><h3>必須情報</h3><div class="field"><label>表示名 <span class="required">必須</span></label><input id="nm"></div><div class="field"><label>メール <span class="required">必須</span></label><input id="em" type="email"></div><div class="split"><div class="field"><label>パスワード <span class="required">必須</span></label><input id="pw" type="password" value="Demo123!"></div><div class="field"><label>確認 <span class="required">必須</span></label><input id="pw2" type="password" value="Demo123!"></div></div><label><input id="terms" type="checkbox"> 利用規約等に同意 <span class="required">必須</span></label></div><div class="signup-section"><h3>任意情報 <span class="optional">後から設定できます</span></h3><div class="split"><div class="field"><label>国・地域</label><input id="country" value="${country}"></div><div class="field"><label>都道府県・地域</label><input id="pref"></div></div><button class="btn" id="geo">現在地を地域候補に利用</button><div id="geoSt" class="muted" style="font-size:11px">ブラウザ言語・タイムゾーンから初期候補を設定しています。</div><div class="split"><div class="field"><label>生年月日</label><input id="birth" type="date"></div><div class="field"><label>性別</label><select id="gender"><option value="">回答しない</option><option>女性</option><option>男性</option><option>その他</option></select></div></div><div class="field"><label>興味分野</label><input id="interests" placeholder="アート, 動物, アウトドア"></div><label><input id="creatorIntent" type="checkbox"> クリエイターとして販売したい</label></div>`:`<div class="field"><label>デモ権限</label><select id="role"><option value="buyer">購入者</option><option value="creator">クリエ function sell(){if(!sellStep)sellStep=1;shell(`<h1>商品を販売</h1><div class="muted">STEP ${sellStep} / 5</div><div class="panel" id="sellBody"></div><div class="rowBtns" style="margin-top:12px"><button class="btn" onclick="sellStep=Math.max(1,sellStep-1);sell()">戻る</button><button class="btn accent" id="next">${sellStep===5?'審査申請':'次へ'}</button></div>`);let h='';if(sellStep===1)h=`<h2>STEP 1：デザイン登録</h2><p class="muted">「商品ページに見せる画像」と「購入後に渡すファイル」は別物です。</p><div class="explain-upload"><div class="upload-card"><span class="access public">誰でも見られる</span><h3>商品ページに表示する画像</h3><p>購入前に作品の見た目を伝えるサンプル画像です。商品一覧・詳細に表示されます。</p><div class="upload-zone"><input id="pub" type="file" accept="image/*,.svg" multiple></div></div><div class="upload-card"><span class="access private">購入者だけ</span><h3>購入後に渡すデータ</h3><p>決済完了後に購入者だけが取得する元データです。購入前には公開しません。</p><div class="upload-zone"><input id="files" type="file" accept="image/*,.svg,.pdf,.zip" multiple></div></div></div>`;if(sellStep===2)h=`<h2>STEP 2：基本情報</h2><div class="field"><label>商品名</label><input id="sn" value="${esc(sellDraft.name)}"></div><div class="field"><label>カテゴリ</label><select id="scat"><option>アート</option><option>動物・ペット</option><option>アウトドア</option></select></div>`;if(sellStep===3)h=`<h2>STEP 3：検索設定</h2><div class="field"><label>検索タグ</label><input id="stags" value="${sellDraft.tags.join(', ')}"><div class="rowBtns" style="margin-top:8px">${['星空','山','夜','青','キャンプ','風景'].map(t=>`<button class="btn" data-t="${t}">${t}</button>`).join('')}</div></div>`;if(sellStep===4)h=`<h2>STEP 4：販売設定</h2><div class="field"><label>価格</label><input id="sp" type="number" value="${sellDraft.price}"></div><div class="split"><div class="field"><label>おすすめ素材（任意）</label><select><option>設定しない</option><option>耐水PET</option><option>透明PET</option></select></div><div class="field"><label>おすすめ形状（任意）</label><select><option>設定しない</option><option>ダイカット</option><option>円形</option></select></div></div>`;if(sellStep===5)h=`<h2>STEP 5：確認</h2><p><b>${esc(sellDraft.name||'商品名未入力')}</b></p><p>価格 ${yen(sellDraft.price)}</p>`;$('#sellBody').innerHTML=h;if($('#pub'))$('#pub').onchange=e=>sellDraft.images=[...e.target.files].map(f=>f.name);if($('#files'))$('#files').onchange=e=>sellDraft.files=[...e.target.files].map(f=>f.name);$$('[data-t]').forEach(x=>x.onclick=()=>{if(!sellDraft.tags.includes(x.dataset.t))sellDraft.tags.push(x.dataset.t);toast('タグを追加しました')});$('#next').onclick=()=>{if(sellStep===2){sellDraft.name=$('#sn').value;sellDraft.category=$('#scat').value}if(sellStep===3)sellDraft.tags=[...new Set([...sellDraft.tags,...$('#stags').value.split(',').map(x=>x.trim()).filter(Boolean)])];if(sellStep===4)sellDraft.price=+$('#sp').value;if(sellStep<5){sellStep++;sell()}else{toast('審査申請しました');sellStep=0;go('creator')}}}
function aiStudio(){const bots=state.aiBots.filter(b=>b.enabled&&b.audiences.includes(state.user.role));shell(`<h1>AIスタジオ</h1><p class="muted">管理者が公開した専門AIボットを利用できます。</p><div class="ai-grid">${bots.map(b=>`<div class="bot-card"><div class="bot-icon">${b.icon}</div><h3>${b.name}</h3><span class="badge">${b.category}</span><p>${b.description}</p><button class="btn accent" data-run="${b.id}">使う</button></div>`).join('')||'利用可能なAIボットはありません'}</div>`);$$('[data-run]').forEach(x=>x.onclick=()=>{const b=state.aiBots.find(z=>z.id===x.dataset.run);modal(`<h2>${b.icon} ${b.name}</h2><textarea id="bp" style="width:100%;min-height:100px" placeholder="相談内容"></textarea><button class="btn accent" id="br">実行（デモ）</button><div id="bout" class="ai-result" style="margin-top:10px">結果はここに表示されます。</div>`);$('#br').onclick=()=>{const q=$('#bp').value||'商品を改善したい';$('#bout').textContent=`【${b.name}】\n「${q}」について、商品情報と販売状況をもとに改善案を3件提示します。\n※公開デモのため模擬出力です。`;data().aiHistory.push({botId:b.id,userId:state.user.id,at:new Date().toISOString()});state.aiBotLogs.push({botId:b.id,userId:state.user.id,at:new Date().toISOString(),status:'success'});save()}})}
function admin(){shell(`<h1>管理者ダッシュボード</h1><div class="kpis"><div class="panel kpi"><b>1,248</b>ユーザー</div><div class="panel kpi"><b>342</b>今月注文</div><div class="panel kpi"><b>12</b>審査待ち</div><div class="panel kpi"><b>¥1.2M</b>今月売上</div></div><div class="panel" style="margin-top:14px"><h2>運営サマリ</h2><svg viewBox="0 0 600 160" style="width:100%;height:180px"><polyline fill="none" stroke="var(--accent)" stroke-width="5" points="20,140 90,125 160,132 230,80 300,95 370,55 440,70 520,30 580,44"/></svg></div><h2>管理メニュー</h2><div class="adminmenu"><button class="btn" onclick="go('review')">商品審査</button><button class="btn" onclick="go('adminorders')">注文管理</button><button class="btn" onclick="go('users')">ユーザー管理</button><button class="btn" onclick="go('sales')">売上管理</button><button class="btn" onclick="go('bots')">AIボット管理</button></div>`)}
function review(){shell(`<button class="btn" onclick="go('admin')">← 管理</button><h1>商品審査</h1><section class="panel">${['星空ステッカー','花束ラベル','黒猫シール'].map((x,i)=>`<div class="row" onclick="go('reviewdetail/${i}')"><div><b>${x}</b><div class="muted">審査申請中</div></div><span>詳細 ›</span></div>`).join('')}</section>`)}
function reviewDetail(id){shell(`<button class="btn" onclick="go('review')">← 審査一覧</button><h1>審査詳細</h1><div class="split"><section class="panel"><h2>商品情報</h2><p>商品：${['星空ステッカー','花束ラベル','黒猫シール'][id]||'商品'}</p><p>出品者：Haru Creator</p><p>申請状態：人間審査中</p><button class="btn accent">承認</button> <button class="btn">差し戻し</button></section><aside><div class="panel"><h3>AI審査要約</h3><p>重大な問題は検出されていません。ライセンス説明の追記を推奨します。</p></div><div class="panel" style="margin-top:10px"><h3>出品者とのメッセージ</h3><p><b>管理者：</b>商用利用範囲を確認してください。</p><p><b>Haru Creator：</b>説明を追記しました。</p><textarea style="width:100%" placeholder="メッセージ"></textarea></div></aside></div>`)}
function adminOrders(){shell(`<button class="btn" onclick="go('admin')">← 管理</button><h1>注文管理</h1><div class="tablewrap"><table class="table"><tr><th>注文番号</th><th>日時</th><th>購入者</th><th>商品</th><th>金額</th><th>決済</th><th>製造</th><th>配送</th></tr>${['1001','1002','1003'].map((n,i)=>`<tr onclick="go('orderdetail/${n}')"><td>ORD-${n}</td><td>2026/08/${10-i}</td><td>buyer${i+1}</td><td>シール商品</td><td>${yen(1903+i*500)}</td><td>完了</td><td>${i?'製造中':'待ち'}</td><td>${i===2?'発送済':'準備中'}</td></tr>`).join('')}</table></div>`)}
function orderDetail(id){shell(`<button class="btn" onclick="go('adminorders')">← 注文一覧</button><h1>伝票 ${id}</h1><div class="split"><section class="panel"><h3>基本情報</h3><p>注文番号：${id}</p><p>購入者：Demo User</p><p>配送先：東京都新宿区</p><h3>商品明細</h3><div class="row"><span>ステッカー商品 × 2</span><b>¥1,200</b></div><div class="row"><span>送料・税</span><b>¥703</b></div></section><aside class="panel"><h3>処理タイムライン</h3><div class="timeline"><div>注文受付</div><div>決済完了</div><div>印刷会社へ発注</div><div>発送準備中</div></div><div class="field"><label>配送会社</label><input value="ヤマト運輸"></div><div class="field"><label>追跡番号</label><input value="1234-5678-9012"></div></aside></div>`)}
function bots(){if(state.user.role!=='admin')return shell('<div class="panel">アクセス権限がありません。</div>');shell(`<button class="btn" onclick="go('admin')">← 管理</button><h1>AIボット管理</h1><div class="rowBtns"><button class="btn accent" id="newBot">＋ AIボット追加</button><button class="btn" onclick="go('botlogs')">利用ログ</button></div><div class="tablewrap"><table class="table"><tr><th>ボット</th><th>カテゴリ</th><th>対象</th><th>Version</th><th>状態</th><th></th></tr>${state.aiBots.map(b=>`<tr><td>${b.icon} <b>${b.name}</b><div class="muted">${b.id}</div></td><td>${b.category}</td><td>${b.audiences.join(',')}</td><td>v${b.version}</td><td>${b.enabled?'公開中':'停止'}</td><td><button class="btn" data-edit="${b.id}">編集</button> <button class="btn" data-toggle="${b.id}">${b.enabled?'停止':'有効化'}</button></td></tr>`).join('')}</table></div>`);const editor=id=>{const b=id?state.aiBots.find(x=>x.id===id):{id:'bot_'+Date.now(),name:'',icon:'🤖',category:'商品制作',audiences:['creator'],version:'1.0',enabled:false,permissions:['product:read'],description:''};modal(`<h2>${id?'AIボット編集':'AIボット追加'}</h2><div class="field"><label>名前</label><input id="bn" value="${esc(b.name)}"></div><div class="split"><div class="field"><label>アイコン</label><input id="bi" value="${esc(b.icon)}"></div><div class="field"><label>カテゴリ</label><input id="bc" value="${esc(b.category)}"></div></div><div class="field"><label>説明</label><textarea id="bd">${esc(b.description)}</textarea></div><div class="split"><div class="field"><label>対象</label><select id="ba"><option>creator</option><option>buyer</option><option>admin</option></select></div><div class="field"><label>Version</label><input id="bv" value="${b.version}"></div></div><div class="field"><label>データ権限</label><input id="bp" value="${b.permissions.join(', ')}"></div><label><input id="be" type="checkbox" ${b.enabled?'checked':''}> 公開</label><div class="rowBtns" style="margin-top:12px"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn accent" id="bs">保存</button></div>`);$('#ba').value=b.audiences[0];$('#bs').onclick=()=>{const n={...b,name:$('#bn').value,icon:$('#bi').value,category:$('#bc').value,description:$('#bd').value,audiences:[$('#ba').value],version:$('#bv').value,permissions:$('#bp').value.split(',').map(x=>x.trim()).filter(Boolean),enabled:$('#be').checked};if(id)state.aiBots[state.aiBots.findIndex(x=>x.id===id)]=n;else state.aiBots.push(n);state.aiBotLogs.push({action:id?'edit':'create',botId:n.id,actorUserId:state.user.id,at:new Date().toISOString()});save();closeModal();bots()}};$('#newBot').onclick=()=>editor();$$('[data-edit]').forEach(x=>x.onclick=()=>editor(x.dataset.edit));$$('[data-toggle]').forEach(x=>x.onclick=()=>{const b=state.aiBots.find(z=>z.id===x.dataset.toggle);b.enabled=!b.enabled;state.aiBotLogs.push({action:'toggle',botId:b.id,actorUserId:state.user.id,at:new Date().toISOString()});save();bots()})}
function botlogs(){if(state.user.role!=='admin')return go('home');shell(`<button class="btn" onclick="go('bots')">← AIボット管理</button><h1>AI利用・変更ログ</h1><section class="panel">${state.aiBotLogs.slice().reverse().map(l=>`<div class="row"><div><b>${l.botId||'AI'}</b><div class="muted">${l.action||l.status||'run'} / ${l.userId||l.actorUserId||''}</div></div><span>${new Date(l.at).toLocaleString('ja-JP')}</span></div>`).join('')||'ログはまだありません'}</section>`)}
function account(){const p=data().profile||{};shell(`<button class="btn" onclick="history.back()">× 閉じる</button><h1>アカウント</h1><section class="panel"><div class="row"><span>表示名</span><b>${esc(state.user.name)}</b></div><div class="row"><span>ユーザーID</span><b>${esc(state.user.id)}</b></div><div class="row"><span>メール</span><b>${esc(state.user.email)}</b></div><div class="row"><span>地域</span><b>${esc([p.country,p.pref].filter(Boolean).join(' / ')||'未設定')}</b></div><div class="rowBtns"><button class="btn" onclick="go('orders')">購入履歴</button><button class="btn danger" id="logout">ログアウト</button></div></section>`);$('#logout').onclick=()=>{state.user=null;save();go('landing')}}
function route(){closeModal();applyTheme();const [p,id]=(location.hash.slice(2)||(state.user?'home':'landing')).split('/');if(!state.user&&!['landing','login','signup','product'].includes(p)){requireLogin(p+(id?'/'+id:''));return}({landing:lp,login:()=>signup(false),signup:()=>signup(true),home,search,create:createSticker,favorites,cart,orders,settings,account,creator:creatorCenter,sell,ai:aiStudio,admin,review,adminorders:adminOrders,bots,botlogs}[p]||(()=>p==='product'?product(id):p==='reviewdetail'?reviewDetail(id):p==='orderdetail'?orderDetail(id):home))();scrollTo(0,0)}
window.onhashchange=route;route();

/* v1.1 enhanced marketplace UX */
function v11Guide(){return `<section class="market-guide"><details><summary>Sticker Marketで「売りたい」</summary><div class="market-guide-body"><button class="guide-link" onclick="state.user?go('sell'):go('signup')"><b>デザインを販売</b><br><span class="muted">デジタルデータを登録して販売</span></button><button class="guide-link" onclick="state.user?go('sell'):go('signup')"><b>シールとして販売</b><br><span class="muted">印刷商品として届ける</span></button><button class="guide-link" onclick="state.user&&state.user.role==='creator'?go('creator'):go('signup')"><b>販売を伸ばす</b><br><span class="muted">分析・AI支援・タグ改善</span></button></div></details><details><summary>Sticker Marketで「買いたい」</summary><div class="market-guide-body"><button class="guide-link" onclick="go('search')"><b>作品を探す</b><br><span class="muted">カテゴリ・タグ・価格から検索</span></button><button class="guide-link" onclick="go('search')"><b>データを買う</b><br><span class="muted">購入後にデザインデータを取得</span></button><button class="guide-link" onclick="state.user?go('create'):go('signup')"><b>自分で作る</b><br><span class="muted">画像からオリジナルシールを作成</span></button></div></details><details><summary>サポート・お問い合わせ</summary><div class="market-guide-body"><div class="guide-link"><b>ご利用ガイド</b><br><span class="muted">購入・販売・ライセンスの基本</span></div><div class="guide-link"><b>よくある質問</b><br><span class="muted">注文・配送・ダウンロードについて</span></div><div class="guide-link"><b>お問い合わせ</b><br><span class="muted">運営への連絡窓口</span></div></div></details></section>`}
function v11Tags(p){return [...new Set([p.category,p.material,p.shape,p.creator.includes('Haru')?'風景':'デザイン',p.digital?'デジタル':'',p.physical?'ステッカー':'','ギフト'].filter(Boolean))]}
function v11Terms(p){const b=p?[`${p.category} ステッカー`,`${p.material} ステッカー`,`${p.shape} ステッカー`,`${p.creator} 作品`]:['かわいいステッカー','アートステッカー','ギフトステッカー','防水ステッカー'];return [...new Set([...b,'日本のステッカー','コレクション用ステッカー','ノート用ステッカー'])].slice(0,8)}
function v11Quick(term){searchState.q=term;searchState.page=1;go('search')}
function v11Related(p){return `<section class="related-search"><h2>関連する検索をもっと見る</h2><div class="related-chips">${v11Terms(p).map(t=>`<button class="related-chip" onclick="v11Quick('${esc(t)}')">${esc(t)}</button>`).join('')}</div></section>`}
function v11Disclaimer(){return `<details class="disclaimer"><summary>免責事項</summary><p>商品説明、画像、ライセンス条件などの出品情報はクリエイターが登録した内容を含みます。購入前に商品仕様・利用条件・配送条件をご確認ください。権利侵害や不適切な商品を見つけた場合は運営へ報告できます。</p></details>`}
function v11Reviews(p){const n=13+(parseInt(p.id.slice(1))%18),score=Math.max(4,Math.min(5,p.rating)).toFixed(1),rs=[['画像どおりの雰囲気で、印刷もきれいでした。','Mika','2026/08/03',5],['デザインが使いやすく、データも整理されていました。','Camille','2026/08/01',5],['仕上がりは満足です。別サイズも試してみたいです。','Bee','2026/07/21',4]];return `<section class="review-section"><h2>この商品のレビュー</h2><div class="review-summary"><div class="review-score">${score}<span style="font-size:28px;color:#e9aa34">★</span></div><div><b>商品平均評価</b><div class="muted">${n}件のレビュー</div><div class="ai-review"><b>AIによるレビュー要約（デモ）</b><br>✓ デザインの見た目が好評　✓ 印刷・データ品質への評価が高い　✓ リピート意向の声があります</div></div></div>${rs.map(r=>`<article class="review-card"><div class="stars">${'★'.repeat(r[3])}${'☆'.repeat(5-r[3])}</div><p>${esc(r[0])}</p><div class="review-meta"><b>${r[1]}</b><span>${r[2]}</span></div><button class="review-translate" onclick="toast('日本語表示に切り替えました（デモ）')">日本語に翻訳する</button></article>`).join('')}</section>`}

function relatedSmartTerms(p){
  const map={アート:['アートステッカー','抽象デザイン','イラストステッカー','ギャラリー風'], '動物・ペット':['猫ステッカー','犬ステッカー','ペットステッカー','かわいい動物'],アウトドア:['キャンプステッカー','山ステッカー','自然モチーフ','旅行ステッカー'],かわいい:['かわいいステッカー','パステルステッカー','ワンポイント','ギフト向け'],和風:['和風ステッカー','日本モチーフ','伝統柄','和モダン'],ビジネス:['仕事用ステッカー','ラベル','シンプルデザイン','整理用']};
  let out=[];
  if(p){out=[...(map[p.category]||[]),`${p.material} ステッカー`,`${p.shape} ステッカー`,`${p.creator} の作品`]}
  else{
    const q=(searchState.q||'').toLowerCase(),cat=searchState.cat;

    for(const [k,a] of keywordRules)if(q.includes(k))out.push(...a);
    if(!out.length)out=['人気ステッカー','新着ステッカー','高評価ステッカー','ギフト向け'];

const v13Normalize=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　_-]+/g,'');
const v13Synonyms=[['猫','ねこ','ネコ','cat'],['犬','いぬ','イヌ','dog'],['宇宙','星空','星','惑星','space'],['花','フラワー','植物','ボタニカル'],['キャンプ','アウトドア','山','自然'],['かわいい','可愛い','カワイイ','cute'],['防水','耐水','waterproof'],['仕事','ビジネス','business'],['和風','日本','和モダン','japan']];
const v13PopularSearches=['猫','星空','かわいい','耐水PET','キャンプ','ギフト'];
function v13ExpandToken(t){const n=v13Normalize(t);const g=v13Synonyms.find(a=>a.some(x=>v13Normalize(x)===n));return g?g.map(v13Normalize):[n]}
function v13EditDistance(a,b){a=v13Normalize(a);b=v13Normalize(b);if(Math.abs(a.length-b.length)>1)return 9;const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function v13ProductTags(p){return [...new Set([...(typeof v11Tags==='function'?v11Tags(p):[]),p.category,p.material,p.shape,p.creator])].filter(Boolean)}
function v13Description(p){return `${p.category}の${p.material}作品。${p.shape}のシールやデジタルデータとして使える${p.creator}のデザインです。`}
function v13Score(p,q){if(!q)return 0;const raw=String(q).trim().split(/[\s　]+/).filter(Boolean);let score=0,hit=0;const name=v13Normalize(p.name),creator=v13Normalize(p.creator),cat=v13Normalize(p.category),mat=v13Normalize(p.material),shape=v13Normalize(p.shape),desc=v13Normalize(v13Description(p)),tags=v13ProductTags(p).map(v13Normalize);for(const token of raw){const alts=v13ExpandToken(token);let best=0;for(const t of alts){if(!t)continue;if(name===t)best=Math.max(best,120);else if(name.includes(t))best=Math.max(best,80);if(tags.includes(t))best=Math.max(best,65);else if(tags.some(x=>x.includes(t)))best=Math.max(best,48);if(cat===t||cat.includes(t))best=Math.max(best,42);if(creator.includes(t))best=Math.max(best,36);if(mat.includes(t)||shape.includes(t))best=Math.max(best,30);if(desc.includes(t))best=Math.max(best,18);if(t.length>=3&&name.split(/[\s　]/).some(w=>v13EditDistance(w,t)<=1))best=Math.max(best,12)}if(best>0)hit++;score+=best}return raw.length&&hit===raw.length?score:score-(raw.length-hit)*60}
function v13RecentSearches(){if(state.user){const arr=data().searchHistory||[];return arr.map(x=>typeof x==='string'?x:x.q).filter(Boolean).slice(0,7)}try{return JSON.parse(sessionStorage.getItem('sm_guest_searches')||'[]').slice(0,7)}catch{return[]}}
function v13RecordSearch(q){q=String(q||'').trim();if(!q)return;if(state.user){data().searchHistory=data().searchHistory||[];data().searchHistory=[{q,at:new Date().toISOString()},...data().searchHistory.filter(x=>(typeof x==='string'?x:x.q)!==q)].slice(0,20);save()}else{const a=[q,...v13RecentSearches().filter(x=>x!==q)].slice(0,12);sessionStorage.setItem('sm_guest_searches',JSON.stringify(a))}}
function v13ClearSearchHistory(){if(state.user){data().searchHistory=[];save()}else sessionStorage.removeItem('sm_guest_searches');$$('.suggest-box').forEach(x=>x.remove());toast('検索履歴を削除しました')}
function v13Suggestions(q){const n=v13Normalize(q),out=[];if(!n)return out;products.filter(p=>v13Normalize(p.name).includes(n)||v13Score(p,q)>20).slice(0,4).forEach(p=>out.push({type:'商品',label:p.name,term:p.name}));creators.filter(c=>v13Normalize(c.name).includes(n)||v13Normalize(c.genre).includes(n)).slice(0,3).forEach(c=>out.push({type:'クリエイター',label:c.name,term:c.name}));[...new Set(products.map(p=>p.category))].filter(x=>v13Normalize(x).includes(n)).slice(0,3).forEach(x=>out.push({type:'カテゴリ',label:x,term:x}));[...new Set(products.flatMap(v13ProductTags))].filter(x=>v13Normalize(x).includes(n)||v13ExpandToken(q).some(t=>v13Normalize(x).includes(t))).slice(0,4).forEach(x=>out.push({type:'タグ',label:x,term:x}));return out.slice(0,10)}
function v13ExecuteSearch(term){term=String(term||'').trim();searchState.q=term;searchState.page=1;v13RecordSearch(term);sessionStorage.setItem('q',term);if(location.hash.startsWith('#/search'))search();else go('search')}
function v13AttachSuggest(input){if(!input)return;const host=input.closest('.searchbar,.field')||input.parentElement;host.classList.add('suggest-host');const render=()=>{host.querySelector('.suggest-box')?.remove();const q=input.value.trim(),recent=v13RecentSearches(),items=v13Suggestions(q);const box=document.createElement('div');box.className='suggest-box';if(q){box.innerHTML=`<div class="suggest-head"><span>候補</span></div>${items.map(x=>`<button class="suggest-item" data-term="${esc(x.term)}"><span class="suggest-type">${x.type}</span><span>${esc(x.label)}</span></button>`).join('')||'<div class="muted" style="padding:10px">候補はありません</div>'}`}else{box.innerHTML=`${recent.length?`<div class="suggest-head"><span>最近の検索</span><button class="clear-all" data-clear-history>履歴を削除</button></div>${recent.map(x=>`<button class="suggest-item" data-term="${esc(x)}"><span class="suggest-type">履歴</span><span>${esc(x)}</span></button>`).join('')}`:''}<div class="suggest-head"><span>人気の検索</span></div>${v13PopularSearches.map(x=>`<button class="suggest-item" data-term="${esc(x)}"><span class="suggest-type">人気</span><span>${esc(x)}</span></button>`).join('')}`};host.appendChild(box);box.querySelectorAll('[data-term]').forEach(b=>b.onclick=e=>{e.preventDefault();input.value=b.dataset.term;v13ExecuteSearch(b.dataset.term)});box.querySelector('[data-clear-history]')?.addEventListener('click',e=>{e.preventDefault();v13ClearSearchHistory()})};input.addEventListener('focus',render);input.addEventListener('input',render);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();v13ExecuteSearch(input.value)}})}
if(!window.__v13SuggestClose){window.__v13SuggestClose=true;document.addEventListener('pointerdown',e=>{if(!e.target.closest('.suggest-host'))$$('.suggest-box').forEach(x=>x.remove())})}
function v13AuthGate(reason,target){sessionStorage.setItem('afterLogin',target);sessionStorage.setItem('authReason',reason);modal(`<div class="row"><h2>ログインが必要です</h2><button class="btn" onclick="closeModal()">× 閉じる</button></div><div class="auth-reason"><b>${esc(reason)}</b><p class="muted" style="margin-bottom:0">閲覧はログイン不要です。アカウントへ保存・送信する操作のため、本人確認が必要です。</p></div><div class="rowBtns"><button class="btn accent" onclick="closeModal();go('login')">ログイン</button><button class="btn" onclick="closeModal();go('signup')">無料登録</button></div>`)}

function v13BindRange(){const a=$('#smin'),b=$('#smax'),fill=$('#priceFill'),l=$('#priceLow'),h=$('#priceHigh');if(!a)return;let x=searchState.min===''?0:+searchState.min,y=searchState.max===''?5000:+searchState.max;a.value=x;b.value=y;const sync=from=>{x=+a.value;y=+b.value;if(y-x<100){if(from==='a')x=Math.max(0,y-100);else y=Math.min(5000,x+100)}a.value=x;b.value=y;l.textContent=yen(x);h.textContent=y>=5000?'¥5,000+':yen(y);fill.style.left=(x/50)+'%';fill.style.right=(100-y/50)+'%'};a.oninput=()=>sync('a');b.oninput=()=>sync('b');sync()}

drawResults=function(){const all=results(),pages=Math.max(1,Math.ceil(all.length/searchState.size));searchState.page=Math.max(1,Math.min(searchState.page,pages));const items=all.slice((searchState.page-1)*searchState.size,searchState.page*searchState.size),filters=v13ActiveFilters();$('#activeFilters').innerHTML=filters.length?`<div class="search-toolbar"><div class="filter-chips">${filters.map(([k,v])=>`<button class="filter-chip" onclick="clearFilter('${k}')">${esc(v)} ×</button>`).join('')}</div><button class="clear-all" onclick="clearAllSearch()">すべてクリア</button></div>`:'';$('#meta').innerHTML=`<div class="search-toolbar"><b>${all.length}件</b><label style="display:flex;align-items:center;gap:6px">表示 <select id="ps" style="width:auto"><option>12</option><option>24</option><option>48</option></select>件</label></div>`;$('#ps').value=searchState.size;$('#ps').onchange=e=>{searchState.size=+e.target.value;searchState.page=1;drawResults()};const pager=v13Pager(pages);$('#pager1').innerHTML=pager;$('#pager2').innerHTML=all.length?pager:'';if(items.length){$('#res').innerHTML=items.map(productCard).join('');$('#zeroRelated').innerHTML=''}else{const rel=v13RelatedFromSearch();$('#res').innerHTML='';$('#pager1').innerHTML='';$('#zeroRelated').innerHTML=`<section class="panel empty-state"><h2>条件に合う作品が見つかりませんでした</h2><p class="muted">条件を減らすか、関連候補から探してみてください。</p><button class="btn" onclick="clearAllSearch()">条件をすべてクリア</button><div class="zero-related">${rel.map(x=>`<button class="btn" onclick="v13ExecuteSearch('${esc(x)}')">${esc(x)}</button>`).join('')}</div></section>`}}

product=function(id){const p=products.find(x=>x.id===id);if(!p)return go(state.user?'home':'landing');v13RecordView(id);const related=products.filter(x=>x.id!==id&&x.category===p.category).sort((a,b)=>b.sales-a.sales).slice(0,8),same=products.filter(x=>x.id!==id&&x.creatorId===p.creatorId).slice(0,8),recent=v13RecentProducts(id);const body=`<div class="ec-product"><div class="ec-product-top"><div><div class="gallery-main" style="--gc:${p.color}">${p.emoji}</div><div class="thumbs"><button class="thumb on">${p.emoji}</button><button class="thumb">✨</button><button class="thumb">🔍</button></div></div><section class="ec-summary"><div class="ec-rating"><span>★ ${p.rating.toFixed(1)}</span><span class="muted">レビュー ${13+(+p.id.slice(1)%18)}件</span></div><h1>${esc(p.name)}</h1><button class="title-link" onclick="go('shop/${p.creatorId}')">by ${esc(p.creator)} → ショップを見る</button><p>${esc(v13Description(p))}</p><div class="ec-price">${yen(Math.min(p.digital,p.physical))}〜</div><div id="buyOptions" class="buy-options"><button class="buy-option" onclick="v13AddCart(products.find(x=>x.id==='${p.id}'),'digital')"><span><b>データを買う</b><small>購入後すぐダウンロード可能</small></span><b>${yen(p.digital)}</b></button><button class="buy-option" onclick="v13AddCart(products.find(x=>x.id==='${p.id}'),'physical')"><span><b>シールを買う</b><small>${esc(p.material)} / ${esc(p.shape)} の基本仕様</small></span><b>${yen(p.physical)}〜</b></button><button class="buy-option" onclick="${state.user?`go('create')`:`v13AuthGate('仕様を保存して見積・注文へ進むため、ログインが必要です。','product/${p.id}')`}"><span><b>仕様を選んで注文</b><small>素材・形状・サイズ・数量をカスタマイズ</small></span><span>→</span></button></div><div class="ec-action-row"><button class="btn" onclick="v13ToggleFav(products.find(x=>x.id==='${p.id}'))">${state.user&&data().fav.includes(p.id)?'♥':'♡'} お気に入り</button><button class="btn" onclick="go('shop/${p.creatorId}')">クリエイターを見る</button></div>${!state.user?'<p class="muted" style="font-size:12px">商品情報・レビュー・ショップはログインなしで閲覧できます。保存・購入・連絡時のみ認証します。</p>':''}</s function v15HexRgb(h){h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
