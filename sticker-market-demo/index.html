<style>
:root{--bg:#fffaf7;--card:#fff;--soft:#f3efeb;--text:#1b1b1d;--muted:#777;--line:#ddd6d1;--accent:#e891a6;--danger:#d94f63;--fs:1}*{box-sizing:border-box}html{font-size:calc(16px*var(--fs))}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 13px;font-weight:800}.accent{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{background:var(--danger);color:#fff;border-color:var(--danger)}.muted{color:var(--muted)}.brand{font-weight:950;font-size:22px}.panel{background:color-mix(in srgb,var(--card) 96%,transparent);border:1px solid var(--line);border-radius:18px;padding:18px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.rowBtns{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:200;background:#151515;color:#fff;padding:10px 14px;border-radius:999px;box-shadow:0 10px 30px #0004}.lp-head,.app-head{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}.lp-main,.app-main{max-width:1180px;margin:auto;padding:22px 16px 100px}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:center;min-height:460px}.hero h1{font-size:clamp(46px,7vw,80px);line-height:.95;margin:8px 0 18px}.collage{display:grid;grid-template-columns:1fr 1fr;gap:12px}.st{aspect-ratio:1;border:10px solid #fff;border-radius:24px;display:grid;place-items:center;font-size:64px;box-shadow:0 18px 40px #0002}.section{margin:42px 0}.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}.carousel::-webkit-scrollbar{display:none}.card{flex:0 0 220px;min-width:220px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);scroll-snap-align:start}.art{aspect-ratio:1;display:grid;place-items:center;font-size:54px;background:linear-gradient(145deg,var(--c),var(--soft))}.pad{padding:12px}.creator-row{display:flex;gap:12px;overflow-x:auto}.creator-card{flex:0 0 230px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card)}.ux-grid,.benefit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.app-head{display:grid;grid-template-columns:auto minmax(160px,1fr) auto}.searchbar{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--soft);overflow:hidden}.searchbar input{border:0;background:none;flex:1;padding:10px 13px}.searchbar button{border:0;background:none;padding:0 12px}.mobile-nav{display:none}.app-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.app-art{aspect-ratio:1;display:grid;place-items:center;font-size:48px;background:linear-gradient(145deg,var(--c),var(--soft))}.search-simple{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}.compact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sub-row{display:grid;grid-template-columns:90px 1fr auto;gap:8px;margin:8px 0}.range-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.pager{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.pager .current{background:var(--accent);color:#fff}.product{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.gallery-main{aspect-ratio:1;border:1px solid var(--line);border-radius:20px;display:grid;place-items:center;font-size:clamp(90px,20vw,180px);background:linear-gradient(145deg,var(--gc),var(--soft))}.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.thumb{width:70px;height:70px;border:2px solid transparent;border-radius:12px;background:var(--soft);font-size:30px}.thumb.on{border-color:var(--accent)}.tree details{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:9px 0;overflow:hidden}.tree summary{padding:14px;font-weight:900}.treebody{padding:14px;border-top:1px solid var(--line)}.savebar{position:sticky;bottom:78px;z-index:30;display:flex;justify-content:flex-end;gap:8px;background:color-mix(in srgb,var(--card) 95%,transparent);border:1px solid var(--line);border-radius:13px;padding:12px}.theme-grid,.bg-grid,.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.theme-card,.bg-card,.bot-card{border:1px solid var(--line);border-radius:15px;padding:12px;background:var(--card);text-align:left}.theme-card.on,.bg-card.on{outline:2px solid var(--accent)}.swatches{display:flex;gap:4px;margin-top:8px}.swatches i{width:24px;height:24px;border-radius:7px;border:1px solid #0002}.background-overlay,.background-tint{position:fixed;inset:0;z-index:-2;pointer-events:none;background-size:cover;background-position:center}.background-tint{z-index:-1;background:var(--bg);opacity:.88}.custom-builder{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.stage{border:1px solid var(--line);border-radius:18px;min-height:380px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 15px,var(--card) 15px,var(--card) 30px)}.sticker{width:min(72%,310px);aspect-ratio:1;background:#fff;border:8px solid white;display:grid;place-items:center;overflow:hidden;box-shadow:0 20px 45px #0002}.shape-circle{border-radius:50%}.shape-rounded{border-radius:24%}.shape-star{clip-path:polygon(50% 2%,61% 35%,96% 35%,68% 55%,79% 91%,50% 70%,21% 91%,32% 55%,4% 35%,39% 35%)}.quote-float{position:sticky;bottom:78px;z-index:35;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 12px;background:color-mix(in srgb,var(--card) 96%,transparent);border:1px solid var(--line);border-radius:15px}.sheet{position:fixed;inset:auto 0 0 0;z-index:120;background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);padding:18px;max-height:78vh;overflow:auto}.modal{position:fixed;inset:0;z-index:150;background:#0008;display:grid;place-items:center;padding:18px}.modalbox{width:min(94vw,620px);max-height:88vh;overflow:auto;background:var(--card);border-radius:20px;border:1px solid var(--line);padding:18px}.explain-upload{display:grid;grid-template-columns:1fr 1fr;gap:12px}.upload-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:var(--soft)}.access{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.access.public{background:#e8f5ff;color:#27628a}.access.private{background:#fff0f3;color:#94394c}.upload-zone{border:2px dashed var(--line);border-radius:14px;padding:16px;background:var(--soft)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi b{display:block;font-size:28px}.adminmenu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tablewrap{overflow:auto}.table{width:100%;min-width:760px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.timeline{border-left:2px solid var(--line);padding-left:14px}.timeline div{padding:7px 0}.required{color:#d95062;font-weight:900}.optional{font-size:11px;color:var(--muted)}.signup-section{padding:14px 0;border-top:1px solid var(--line)}.bot-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:var(--soft);font-size:24px}.ai-result{white-space:pre-wrap;border:1px solid var(--line);border-radius:13px;background:var(--soft);padding:12px;min-height:80px}.footer{padding:30px 16px 110px;border-top:1px solid var(--line);color:var(--muted)}
@media(max-width:900px){.hero,.product,.custom-builder{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.ux-grid,.benefit-grid{grid-template-columns:1fr}.theme-grid,.bg-grid,.ai-grid{grid-template-columns:1fr 1fr}.search-simple{grid-template-columns:1fr 1fr}.search-simple .keyword{grid-column:1/-1}.app-head{grid-template-columns:1fr auto}.searchbar{grid-column:1/-1;grid-row:2}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(var(--n),1fr);bottom:0;left:0;right:0;z-index:60;background:color-mix(in srgb,var(--card) 96%,transparent);border-top:1px solid var(--line);padding:7px 2px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;font-size:10px}.mobile-nav b{display:block;font-size:19px}.footer{display:none}.savebar,.quote-float{bottom:74px}.adminmenu{grid-template-columns:1fr 1fr}.explain-upload{grid-template-columns:1fr}}
@media(max-width:560px){.theme-grid,.bg-grid,.ai-grid,.split,.compact-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.card{flex-basis:68vw;min-width:68vw}.lp-head .hide-sm{display:none}.hero h1{font-size:46px}.app-head .brand{font-size:18px}.kpis{grid-template-columns:1fr 1fr}.sub-row{grid-template-columns:80px 1fr auto}}
</style></head>
<body><div id="bg" class="background-overlay"></div><div id="tint" class="background-tint"></div><div id="root"></div><div id="toast" class="toast hidden"></div><div id="modal" hidden></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const products=Array.from({length:60},(_,i)=>({id:'p'+(i+1),name:['星空と山の風景','まるねこ日和','花束のワンポイント','宇宙のかけら','キャンプの輪郭','コーヒータイム','旅するトラック','レトロゲーム'][i%8]+' '+(i+1),creator:['Haru Creator','mignon','sora design','Petit Atelier'][i%4],creatorId:'c'+(i%4+1),category:['アート','動物・ペット','アウトドア','かわいい','和風','ビジネス'][i%6],material:['耐水PET','上質紙','透明PET','クラフト紙'][i%4],shape:['ダイカット','円形','角丸','四角'][i%4],rating:4+(i%10)/10,digital:300+(i%5)*70,physical:480+(i%6)*90,favs:80+i*6,sales:50+i*5,color:['#9fd7d0','#c9b2f1','#f8b36a','#a9d68d','#ffc6d7','#82b7ff'][i%6],emoji:['🌌','🐱','🌸','🪐','⛺','☕','🚚','🎮'][i%8],ai:i%9===0}));
const creators=[{id:'c1',name:'Haru Creator',genre:'風景・夜空'},{id:'c2',name:'mignon',genre:'動物・かわいい'},{id:'c3',name:'sora design',genre:'宇宙・抽象'},{id:'c4',name:'Petit Atelier',genre:'花・雑貨'}];
const themes={system:{label:'端末に合わせる'},light:{label:'ライト',bg:'#fffaf7',card:'#ffffff',soft:'#f3efeb',text:'#1b1b1d',muted:'#777',line:'#ddd6d1',accent:'#e891a6'},dark:{label:'ダーク',bg:'#101113',card:'#191b1e',soft:'#25272b',text:'#f6f3f1',muted:'#aaa',line:'#3b3d41',accent:'#ff7c8d'},blue:{label:'パステルブルー',bg:'#f3f8ff',card:'#fbfdff',soft:'#e6f0fb',text:'#223047',muted:'#708098',line:'#ccdaeb',accent:'#79aee8'},orange:{label:'パステルオレンジ',bg:'#fff8f1',card:'#fffdf9',soft:'#faeadb',text:'#443126',muted:'#8a7464',line:'#ecd7c4',accent:'#e9a064'},pink:{label:'パステルピンク',bg:'#fff6f8',card:'#fffdfd',soft:'#f9e7ec',text:'#472c35',muted:'#8b7179',line:'#ecd3da',accent:'#e792a8'},purple:{label:'パステルパープル',bg:'#faf7ff',card:'#fefcff',soft:'#eee8f8',text:'#382e49',muted:'#7e728e',line:'#ded3eb',accent:'#aa8bd4'},charcoal:{label:'チャコール',bg:'#202225',card:'#292c30',soft:'#34383d',text:'#f4f1ee',muted:'#b6b1ad',line:'#474b50',accent:'#d5a0a9'}};
const freeBgs=[{id:'none',name:'背景なし',css:'none'},{id:'pastel',name:'パステル',css:'linear-gradient(135deg,#ffdfe7,#dcecff,#e7f4dc)'},{id:'dots',name:'ソフトドット',css:'radial-gradient(circle at 8px 8px,#fff9 2px,transparent 3px),linear-gradient(135deg,#e8e1ff,#dff4ef)'},{id:'night',name:'淡い夜空',css:'linear-gradient(160deg,#27304d,#6e7aa2,#d9c8d8)'},{id:'paper',name:'ペーパー',css:'linear-gradient(120deg,#f5eee4,#efe3d3)'},{id:'peach',name:'ピーチ',css:'linear-gradient(135deg,#ffe5d0,#ffd8df)'}];
const defaultBots=[{id:'bot_desc',name:'商品説明AI',icon:'✍️',category:'商品制作',audiences:['creator'],version:'1.0',enabled:true,permissions:['product:read'],description:'商品説明を改善します。'},{id:'bot_tags',name:'タグ最適化AI',icon:'🏷️',category:'商品制作',audiences:['creator'],version:'1.0',enabled:true,permissions:['product:read'],description:'検索タグを提案します。'},{id:'bot_price',name:'価格戦略AI',icon:'📈',category:'販売最適化',audiences:['creator'],version:'1.0',enabled:true,permissions:['product:read','sales:read'],description:'価格戦略を提案します。'},{id:'bot_review',name:'審査支援AI',icon:'🛡️',category:'管理',audiences:['admin'],version:'1.0',enabled:true,permissions:['product:read','review:read'],description:'審査内容を要約します。'}];
let state=JSON.parse(localStorage.getItem('sm10')||'null')||{user:null,users:{},userData:{},aiBots:defaultBots,aiBotLogs:[]};
const defaultSettings=()=>({colorTheme:'system',fontSize:100,lang:'ja',background:{kind:'free',id:'none',opacity:12,blur:0}});
function hashId(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}function uid(role,email){return`user_${role}_${hashId((email||'demo').toLowerCase())}`}
function newData(){return{cart:[],orders:[],fav:[],settings:defaultSettings(),addresses:[{id:'a1',recipient:'Demo User',postal:'160-0022',pref:'東京都',city:'新宿区',line1:'新宿1-1-1',line2:'',phone:'090-0000-0000',isDefault:true}],created:[],downloads:[],viewHistory:[],searchHistory:[],follows:[],reviews:[],customProjects:[],aiHistory:[],profile:{}}}function data(){if(!state.user)return null;state.userData[state.user.id]=state.userData[state.user.id]||newData();return state.userData[state.user.id]}function save(){localStorage.setItem('sm10',JSON.stringify(state));applyTheme()}
function applyTheme(){const st=data()?.settings||defaultSettings();let k=st.colorTheme;if(k==='system')k=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';const t=themes[k]||themes.light;for(const n of ['bg','card','soft','text','muted','line','accent'])document.documentElement.style.setProperty('--'+n,t[n]);document.documentElement.style.setProperty('--fs',(st.fontSize||100)/100);let css='none';if(st.background.kind==='free')css=(freeBgs.find(x=>x.id===st.background.id)||freeBgs[0]).css;else{const p=products.find(x=>x.id===st.background.id);if(p)css=`radial-gradient(circle at 35% 30%,${p.color} 0 12%,transparent 13%),linear-gradient(135deg,${p.color},var(--soft))`}$('#bg').style.backgroundImage=css;$('#bg').style.filter=`blur(${st.background.blur||0}px)`;$('#tint').style.opacity=String(1-Math.min(.55,(st.background.opacity||12)/100))}
function toast(m,d=1200){const e=$('#toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),d)}function modal(html){$('#modal').innerHTML=`<div class="modal"><div class="modalbox">${html}</div></div>`;$('#modal').hidden=false}function closeModal(){$('#modal').hidden=true}function go(p){location.hash='#/'+p}function afterAuth(){const a=sessionStorage.getItem('afterLogin');sessionStorage.removeItem('afterLogin');return a}function requireLogin(target){if(state.user)go(target);else{sessionStorage.setItem('afterLogin',target);go('login')}}
function productCard(p,lp=false){return`<article class="card"><div class="art" style="--c:${p.color}" onclick="${lp?`requireLogin('product/${p.id}')`:`go('product/${p.id}')`}">${p.emoji}</div><div class="pad"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.creator)}</div><span class="badge">${esc(p.category)}</span><div class="row"><b>${yen(Math.min(p.digital,p.physical))}〜</b><span>★${p.rating.toFixed(1)}</span></div></div></article>`}
function lp(){const pop=[...products].sort((a,b)=>b.favs-a.favs).slice(0,10);$('#root').innerHTML=`<header class="lp-head"><div class="brand">Sticker Market</div><div class="rowBtns"><button class="btn hide-sm" onclick="go('login')">ログイン</button><button class="btn accent" onclick="go('signup')">無料登録</button></div></header><main class="lp-main"><section class="hero"><div><div class="muted">DESIGN × STICKER MARKETPLACE</div><h1>デザインを探す。<br>買う。シールにする。</h1><p>世界中のクリエイターと、あなたの「好き」をつなぐマーケットプレイス。</p><div class="rowBtns"><button class="btn accent" onclick="document.getElementById('popular').scrollIntoView({behavior:'smooth'})">人気作品を見る</button><button class="btn" onclick="go('signup')">無料で始める</button></div></div><div class="collage"><div class="st" style="background:#ffd486">🐶</div><div class="st" style="background:#dbe7ff">🌌</div><div class="st" style="background:#def0d7">⛺</div><div class="st" style="background:#eadbff">🪐</div></div></section><section class="section" id="popular"><h2>人気の作品</h2><div class="carousel">${pop.map(p=>productCard(p,true)).join('')}</div></section><section class="section"><h2>売れ筋ランキング</h2><div class="carousel">${[...products].sort((a,b)=>b.sales-a.sales).slice(0,10).map(p=>productCard(p,true)).join('')}</div></section>${['アート','動物・ペット','アウトドア','かわいい'].map(c=>`<section class="section"><h2>${c}で人気</h2><div class="carousel">${products.filter(p=>p.category===c).slice(0,8).map(p=>productCard(p,true)).join('')}</div></section>`).join('')}<section class="section"><h2>人気クリエイター</h2><div class="creator-row">${creators.map(c=>`<div class="creator-card"><h3>${c.name}</h3><div class="muted">${c.genre}</div></div>`).join('')}</div></section><section class="section"><h2>Sticker Marketの使い方</h2><div class="ux-grid"><div class="panel"><h3>買う</h3><p>作品を探してデータまたはシールを購入。</p></div><div class="panel"><h3>作る</h3><p>自分の画像からオリジナルシールを作成。</p></div><div class="panel"><h3>売る</h3><p>クリエイターとしてデザインを販売。</p></div></div></section></main>`}
function nav(){const role=state.user?.role,items=[['home','⌂','ホーム'],['search','⌕','探す'],['create','＋','作る'],['favorites','♡','お気に入り']];if(role==='creator')items.push(['creator','売','販売']);if(role==='admin')items.push(['admin','▦','管理']);items.push(['settings','⚙','設定']);return`<nav class="mobile-nav" style="--n:${items.length}">${items.map(x=>`<button onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}
function shell(content,search=true){$('#root').innerHTML=`<header class="app-head"><div class="brand" onclick="go('home')">Sticker Market</div>${search?`<div class="searchbar"><input id="gq" placeholder="キーワードで検索"><button id="ggo">⌕</button></div>`:'<div></div>'}<div class="rowBtns"><button class="btn" onclick="go('account')">${esc(state.user.name)}</button><button class="btn" onclick="go('cart')">カート ${data().cart.length}</button></div></header><main class="app-main">${content}</main>${nav()}<footer class="footer">利用規約 / プライバシー / セキュリティ / お問い合わせ</footer>`;if(search)$('#ggo').onclick=()=>{sessionStorage.setItem('q',$('#gq').value);go('search')}}
function signup(isSignup){const lang=navigator.language||'ja-JP',tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';const country=lang.startsWith('ja')||tz==='Asia/Tokyo'?'日本':'';$('#root').innerHTML=`<main class="lp-main"><button class="btn" onclick="go('landing')">← 戻る</button><section class="panel" style="max-width:640px;margin:30px auto"><h1>${isSignup?'無料アカウント作成':'ログイン'}</h1>${isSignup?`<p class="muted">必須項目だけでも登録できます。任意項目は後から変更できます。</p><div class="signup-section"><h3>必須情報</h3><div class="field"><label>表示名 <span class="required">必須</span></label><input id="nm"></div><div class="field"><label>メール <span class="required">必須</span></label><input id="em" type="email"></div><div class="split"><div class="field"><label>パスワード <span class="required">必須</span></label><input id="pw" type="password" value="Demo123!"></div><div class="field"><label>確認 <span class="required">必須</span></label><input id="pw2" type="password" value="Demo123!"></div></div><label><input id="terms" type="checkbox"> 利用規約等に同意 <span class="required">必須</span></label></div><div class="signup-section"><h3>任意情報 <span class="optional">後から設定できます</span></h3><div class="split"><div class="field"><label>国・地域</label><input id="country" value="${country}"></div><div class="field"><label>都道府県・地域</label><input id="pref"></div></div><button class="btn" id="geo">現在地を地域候補に利用</button><div id="geoSt" class="muted" style="font-size:11px">ブラウザ言語・タイムゾーンから初期候補を設定しています。</div><div class="split"><div class="field"><label>生年月日</label><input id="birth" type="date"></div><div class="field"><label>性別</label><select id="gender"><option value="">回答しない</option><option>女性</option><option>男性</option><option>その他</option></select></div></div><div class="field"><label>興味分野</label><input id="interests" placeholder="アート, 動物, アウトドア"></div><label><input id="creatorIntent" type="checkbox"> クリエイターとして販売したい</label></div>`:`<div class="field"><label>デモ権限</label><select id="role"><option value="buyer">購入者</option><option value="creator">クリエイター</option><option value="admin">管理者</option></select></div><div class="field"><label>メール</label><input id="em" value="demo@example.test"></div><div class="field"><label>パスワード</label><input id="pw" type="password" value="Demo123!"></div>`}<button class="btn accent" id="auth" style="width:100%;margin-top:14px">${isSignup?'登録して始める':'ログイン'}</button><p style="text-align:center">${isSignup?'すでにアカウントをお持ちですか？ <button class="btn" onclick="go(\'login\')">ログイン</button>':'初めての方は <button class="btn" onclick="go(\'signup\')">無料で新規登録</button>'}</p></section></main>`;if(isSignup)$('#geo').onclick=()=>{if(!navigator.geolocation){$('#geoSt').textContent='位置情報は利用できません。';return}$('#geoSt').textContent='位置情報の許可を待っています…';navigator.geolocation.getCurrentPosition(p=>$('#geoSt').textContent=`位置情報を取得しました（${p.coords.latitude.toFixed(2)}, ${p.coords.longitude.toFixed(2)}）。補助情報として保存します。`,()=>$('#geoSt').textContent='位置情報は利用せず手入力で続行できます。')};$('#auth').onclick=()=>{const role=isSignup?($('#creatorIntent')?.checked?'creator':'buyer'):$('#role').value,email=($('#em').value||'demo@example.test').trim();if(isSignup&&(!$('#nm').value.trim()||!email||!$('#pw').value||$('#pw').value!==$('#pw2').value||!$('#terms').checked)){toast('必須項目を確認してください');return}const id=uid(role,email);state.user={id,role,name:isSignup?$('#nm').value.trim():(role==='admin'?'管理者':role==='creator'?'Haru Creator':'Demo User'),email};state.users[id]=state.user;state.userData[id]=state.userData[id]||newData();if(isSignup)state.userData[id].profile={country:$('#country').value,pref:$('#pref').value,birth:$('#birth').value,gender:$('#gender').value,interests:$('#interests').value,language:lang,timezone:tz};save();go(afterAuth()||(role==='admin'?'admin':role==='creator'?'creator':'home'))}}
function home(){shell(`<section class="panel"><h1>今日の「好き」を見つけよう。</h1><p class="muted">ランキングやカテゴリから探せます。</p></section><section class="section"><h2>人気のデザイン</h2><div class="carousel">${products.slice(0,10).map(p=>productCard(p)).join('')}</div></section>${['アート','動物・ペット','アウトドア'].map(c=>`<section class="section"><h2>${c}で人気</h2><div class="carousel">${products.filter(p=>p.category===c).slice(0,8).map(p=>productCard(p)).join('')}</div></section>`).join('')}`)}
let searchState={page:1,size:12,q:'',cat:'',material:'',shape:'',min:'',max:'',rating:'0',excludeAi:false,sub:'',logic:'AND',advanced:false};
function results(){let r=products.filter(p=>{const txt=(p.name+' '+p.creator+' '+p.category).toLowerCase();if(searchState.q&&!txt.includes(searchState.q.toLowerCase()))return false;if(searchState.cat&&p.category!==searchState.cat)return false;if(searchState.material&&p.material!==searchState.material)return false;if(searchState.shape&&p.shape!==searchState.shape)return false;if(searchState.min&&Math.min(p.digital,p.physical)<+searchState.min)return false;if(searchState.max&&Math.min(p.digital,p.physical)>+searchState.max)return false;if(+searchState.rating&&p.rating<+searchState.rating)return false;if(searchState.excludeAi&&p.ai)return false;if(searchState.sub){const ok=txt.includes(searchState.sub.toLowerCase());if(searchState.logic==='AND'&&!ok)return false}return true});return r}
function search(){const g=sessionStorage.getItem('q');if(g){searchState.q=g;sessionStorage.removeItem('q')}shell(`<h1>商品を探す</h1><section class="panel"><div class="search-simple"><div class="field keyword"><label>キーワード</label><input id="sq" value="${esc(searchState.q)}"></div><div class="field"><label>カテゴリ</label><select id="sc"><option value="">すべて</option>${['アート','動物・ペット','アウトドア','かわいい','和風','ビジネス'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>素材</label><select id="sm"><option value="">すべて</option>${['耐水PET','上質紙','透明PET','クラフト紙'].map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn accent" id="sdo">検索</button></div><div id="sub"></div><button class="btn" id="addSub">＋ 条件を追加</button><button class="btn" id="advBtn">詳細検索</button><div id="adv" class="${searchState.advanced?'':'hidden'}"><div class="compact-grid"><div class="field"><label>形状</label><select id="ssh"><option value="">すべて</option><option>ダイカット</option><option>円形</option><option>角丸</option><option>四角</option></select></div><div class="field"><label>評価</label><select id="srt"><option value="0">指定なし</option><option value="4">4.0以上</option><option value="4.5">4.5以上</option></select></div><div class="field"><label>価格帯</label><div class="range-row"><input id="smin" type="number" placeholder="下限" value="${searchState.min}"><span>〜</span><input id="smax" type="number" placeholder="上限" value="${searchState.max}"></div></div><div class="field"><label><input id="sai" type="checkbox" ${searchState.excludeAi?'checked':''}> AI生成作品を除外</label></div></div></div></section><div id="meta"></div><div id="pager1"></div><div id="res" class="grid"></div><div id="pager2"></div>`);$('#sc').value=searchState.cat;$('#sm').value=searchState.material;$('#ssh').value=searchState.shape;$('#srt').value=searchState.rating;const renderSub=()=>{$('#sub').innerHTML=searchState.sub!==''?`<div class="sub-row"><select id="logic"><option>AND</option><option>OR</option></select><input id="subq" value="${esc(searchState.sub)}" placeholder="追加キーワード"><button class="btn" id="delSub">×</button></div>`:'';$('#addSub').disabled=searchState.sub!=='';if($('#logic')){$('#logic').value=searchState.logic;$('#logic').onchange=e=>searchState.logic=e.target.value;$('#subq').oninput=e=>searchState.sub=e.target.value;$('#delSub').onclick=()=>{searchState.sub='';renderSub()}}};renderSub();$('#addSub').onclick=()=>{searchState.sub=' ';renderSub();$('#subq').value='';searchState.sub=''};$('#advBtn').onclick=()=>{searchState.advanced=!searchState.advanced;search()};$('#sdo').onclick=()=>{Object.assign(searchState,{q:$('#sq').value,cat:$('#sc').value,material:$('#sm').value,shape:$('#ssh').value,min:$('#smin').value,max:$('#smax').value,rating:$('#srt').value,excludeAi:$('#sai').checked,page:1});drawResults();toast(results().length+'件見つかりました')};drawResults()}
function drawResults(){const all=results(),pages=Math.max(1,Math.ceil(all.length/searchState.size));searchState.page=Math.min(searchState.page,pages);const items=all.slice((searchState.page-1)*searchState.size,searchState.page*searchState.size);$('#meta').innerHTML=`<div class="row"><b>${all.length}件</b><label>表示件数 <select id="ps"><option>12</option><option>24</option><option>48</option></select></label></div>`;$('#ps').value=searchState.size;$('#ps').onchange=e=>{searchState.size=+e.target.value;searchState.page=1;drawResults()};const pager=`<div class="pager"><div><button class="btn" onclick="setPage(${searchState.page-1})">‹ 前へ</button> ${Array.from({length:pages},(_,i)=>`<button class="btn ${i+1===searchState.page?'current':''}" onclick="setPage(${i+1})">${i+1}</button>`).slice(0,7).join(' ')} <button class="btn" onclick="setPage(${searchState.page+1})">次へ ›</button></div><div>ページ <input id="jump" type="number" min="1" max="${pages}" value="${searchState.page}" style="width:64px"> <button class="btn" onclick="setPage(+$('#jump').value)">移動</button></div></div>`;$('#pager1').innerHTML=pager;$('#pager2').innerHTML=pager;$('#res').innerHTML=items.map(p=>productCard(p)).join('')}

function createSticker(){let d={shape:'circle',material:'耐水PET',finish:'加工なし',size:50,qty:10,file:null};const q=()=>{const base=Math.round(138*(d.size/50)),mat=d.material==='耐水PET'?21:d.material==='ホログラム'?48:0,fin=d.finish==='加工なし'?0:18,unit=base+mat+fin,sub=unit*d.qty,ship=sub>=5000?0:350,tax=Math.floor((sub+ship)*.1);return{base,mat,fin,unit,sub,ship,tax,total:sub+ship+tax}};shell(`<h1>オリジナルシールを作る</h1><div class="custom-builder"><section><div class="panel"><div class="field"><label>画像</label><input id="cf" type="file" accept="image/*,.svg"></div><div class="compact-grid"><div class="field"><label>形状</label><select id="csh"><option value="circle">円形</option><option value="rounded">角丸</option><option value="star">星型</option></select></div><div class="field"><label>素材</label><select id="cm"><option>耐水PET</option><option>マット紙</option><option>透明PET</option><option>ホログラム</option></select></div><div class="field"><label>加工</label><select id="cfi"><option>加工なし</option><option>マットラミネート</option><option>グロスラミネート</option></select></div><div class="field"><label>サイズ</label><select id="cs"><option>30</option><option selected>50</option><option>70</option><option>100</option></select></div><div class="field"><label>数量</label><select id="cq"><option>1</option><option selected>10</option><option>50</option><option>100</option></select></div></div></div></section><aside><div class="stage"><div id="st" class="sticker shape-circle"><span style="font-size:64px;color:#aaa">＋</span></div></div><div class="quote-float"><div><small>見積合計</small><br><b id="qt"></b></div><button class="btn" id="qd">見積詳細</button><button class="btn accent" id="qc">カートに追加</button></div></aside></div>`,false);const redraw=()=>{const qq=q();$('#qt').textContent=yen(qq.total);$('#st').className='sticker shape-'+d.shape};for(const [id,key] of [['csh','shape'],['cm','material'],['cfi','finish']])$('#'+id).onchange=e=>{d[key]=e.target.value;redraw()};$('#cs').onchange=e=>{d.size=+e.target.value;redraw()};$('#cq').onc ils><summary>通知</summary><div class="treebody">注文・発送・フォロー・AI完了通知を管理します。</div></details><details><summary>プライバシー</summary><div class="treebody">閲覧履歴・位置情報利用・レコメンド設定を管理します。</div></details></div><div class="savebar"><button class="btn" onclick="settings()">キャンセル</button><button class="btn accent" id="ss">変更する</button></div>`);$('#fs').value=draft.fontSize;$('#lg').value=draft.lang;$$('[data-th]').forEach(x=>x.onclick=()=>{draft.colorTheme=x.dataset.th;$$('[data-th]').forEach(y=>y.classList.toggle('on',y===x))});$$('[data-bg]').forEach(x=>x.onclick=()=>draft.background={...draft.background,kind:'free',id:x.dataset.bg});$$('[data-buy]').forEach(x=>x.onclick=()=>draft.background={...draft.background,kind:'purchase',id:x.dataset.buy});$('#bo').oninput=e=>draft.background.opacity=+e.target.value;$('#bb').oninput=e=>draft.background.blur=+e.target.value;$('#fs').onchange=e=>draft.fontSize=+e.target.value;$('#lg').onchange=e=>draft.lang=e.target.value;$('#ss').onclick=()=>{data().settings=draft;save();toast('設定を変更しました');settings()}}
let sellStep=0,sellDraft={images:[],files:[],name:'',category:'アート',price:500,tags:[]};
function creatorCenter(){shell(`<div class="rowBtns"><button class="btn accent" onclick="go('ai')">🤖 AIスタジオ</button></div><h1>販売センター</h1><div class="kpis"><div class="panel kpi"><b>¥45,300</b>今月売上</div><div class="panel kpi"><b>32</b>販売件数</div><div class="panel kpi"><b>1,248</b>閲覧</div><div class="panel kpi"><b>2.6%</b>CVR</div></div><section class="section"><h2>販売を始める</h2><div class="ux-grid"><button class="panel" onclick="sellStep=1;go('sell')"><h3>デザインデータを販売</h3><p>購入者がデータをダウンロード。</p></button><button class="panel" onclick="sellStep=1;go('sell')"><h3>シール商品として販売</h3><p>印刷・配送まで含めて販売。</p></button><button class="panel" onclick="sellStep=1;go('sell')"><h3>両方を販売</h3><p>データとシールを同時販売。</p></button></div></section><section class="panel"><h2>販売戦略サマリ</h2><p>売れ筋：かわいい / 動物 / ビジネス</p><p>同カテゴリ価格中央値：¥480</p><p>AI提案：商品画像を3枚以上にすると購入率改善が期待できます。</p></section>`)}
function sell(){if(!sellStep)sellStep=1;shell(`<h1>商品を販売</h1><div class="muted">STEP ${sellStep} / 5</div><div class="panel" id="sellBody"></div><div class="rowBtns" style="margin-top:12px"><button class="btn" onclick="sellStep=Math.max(1,sellStep-1);sell()">戻る</button><button class="btn accent" id="next">${sellStep===5?'審査申請':'次へ'}</button></div>`);let h='';if(sellStep===1)h=`<h2>STEP 1：デザイン登録</h2><p class="muted">「商品ページに見せる画像」と「購入後に渡すファイル」は別物です。</p><div class="explain-upload"><div class="upload-card"><span class="access public">誰でも見られる</span><h3>商品ページに表示する画像</h3><p>購入前に作品の見た目を伝えるサンプル画像です。商品一覧・詳細に表示されます。</p><div class="upload-zone"><input id="pub" type="file" accept="image/*,.svg" multiple></div></div><div class="upload-card"><span class="access private">購入者だけ</span><h3>購入後に渡すデータ</h3><p>決済完了後に購入者だけが取得する元データです。購入前には公開しません。</p><div class="upload-zone"><input id="files" type="file" accept="image/*,.svg,.pdf,.zip" multiple></div></div></div>`;if(sellStep===2)h=`<h2>STEP 2：基本情報</h2><div class="field"><label>商品名</label><input id="sn" value="${esc(sellDraft.name)}"></div><div class="field"><label>カテゴリ</label><select id="scat"><option>アート</option><option>動物・ペット</option><option>アウトドア</option></select></div>`;if(sellStep===3)h=`<h2>STEP 3：検索設定</h2><div class="field"><label>検索タグ</label><input id="stags" value="${sellDraft.tags.join(', ')}"><div class="rowBtns" style="margin-top:8px">${['星空','山','夜','青','キャンプ','風景'].map(t=>`<button class="btn" data-t="${t}">${t}</button>`).join('')}</div></div>`;if(sellStep===4)h=`<h2>STEP 4：販売設定</h2><div class="field"><label>価格</label><input id="sp" type="number" value="${sellDraft.price}"></div><div class="split"><div class="field"><label>おすすめ素材（任意）</label><select><option>設定しない</option><option>耐水PET</option><option>透明PET</option></select></div><div class="field"><label>おすすめ形状（任意）</label><select><option>設定しない</option><option>ダイカット</option><option>円形</option></select></div></div>`;if(sellStep===5)h=`<h2>STEP 5：確認</h2><p><b>${esc(sellDraft.name||'商品名未入力')}</b></p><p>価格 ${yen(sellDraft.price)}</p>`;$('#sellBody').innerHTML=h;if($('#pub'))$('#pub').onchange=e=>sellDraft.images=[...e.target.files].map(f=>f.name);if($('#files'))$('#files').onchange=e=>sellDraft.files=[...e.target.files].map(f=>f.name);$$('[data-t]').forEach(x=>x.onclick=()=>{if(!sellDraft.tags.includes(x.dataset.t))sellDraft.tags.push(x.dataset.t);toast('タグを追加しました')});$('#next').onclick=()=>{if(sellStep===2){sellDraft.name=$('#sn').value;sellDraft.category=$('#scat').value}if(sellStep===3)sellDraft.tags=[...new Set([...sellDraft.tags,...$('#stags').value.split(',').map(x=>x.trim()).filter(Boolean)])];if(sellStep===4)sellDraft.price=+$('#sp').value;if(sellStep<5){sellStep++;sell()}else{toast('審査申請しました');sellStep=0;go('creator')}}}
function aiStudio(){const bots=state.aiBots.filter(b=>b.enabled&&b.audiences.includes(state.user.role));shell(`<h1>AIスタジオ</h1><p class="muted">管理者が公開した専門AIボットを利用できます。</p><div class="ai-grid">${bots.map(b=>`<div class="bot-card"><div class="bot-icon">${b.icon}</div><h3>${b.name}</h3><span class="badge">${b.category}</span><p>${b.description}</p><button class="btn accent" data-run="${b.id}">使う</button></div>`).join('')||'利用可能なAIボットはありません'}</div>`);$$('[data-run]').forEach(x=>x.onclick=()=>{const b=state.aiBots.find(z=>z.id===x.dataset.run);modal(`<h2>${b.icon} ${b.name}</h2><textarea id="bp" style="width:100%;min-height:100px" placeholder="相談内容"></textarea><button class="btn accent" id="br">実行（デモ）</button><div id="bout" class="ai-result" style="margin-top:10px">結果はここに表示されます。</div>`);$('#br').onclick=()=>{const q=$('#bp').value||'商品を改善したい';$('#bout').textContent=`【${b.name}】\n「${q}」について、商品情報と販売状況をもとに改善案を3件提示します。\n※公開デモのため模擬出力です。`;data().aiHistory.push({botId:b.id,userId:state.user.id,at:new Date().toISOString()});state.aiBotLogs.push({botId:b.id,userId:state.user.id,at:new Date().toISOString(),status:'success'});save()}})}
function admin(){shell(`<h1>管理者ダッシュボード</h1><div class="kpis"><div class="panel kpi"><b>1,248</b>ユーザー</div><div class="panel kpi"><b>342</b>今月注文</div><div class="panel kpi"><b>12</b>審査待ち</div><div class="panel kpi"><b>¥1.2M</b>今月売上</div></div><div class="panel" style="margin-top:14px"><h2>運営サマリ</h2><svg viewBox="0 0 600 160" style="width:100%;height:180px"><polyline fill="none" stroke="var(--accent)" stroke-width="5" points="20,140 90,125 160,132 230,80 300,95 370,55 440,70 520,30 580,44"/></svg></div><h2>管理メニュー</h2><div class="adminmenu"><button class="btn" onclick="go('review')">商品審査</button><button class="btn" onclick="go('adminorders')">注文管理</button><button class="btn" onclick="go('users')">ユーザー管理</button><button class="btn" onclick="go('sales')">売上管理</button><button class="btn" onclick="go('bots')">AIボット管理</button></div>`)}
function review(){shell(`<button class="btn" onclick="go('admin')">← 管理</button><h1>商品審査</h1><section class="panel">${['星空ステッカー','花束ラベル','黒猫シール'].map((x,i)=>`<div class="row" onclick="go('reviewdetail/${i}')"><div><b>${x}</b><div class="muted">審査申請中</div></div><span>詳細 ›</span></div>`).join('')}</section>`)}
function reviewDetail(id){shell(`<button class="btn" onclick="go('review')">← 審査一覧</button><h1>審査詳細</h1><div class="split"><section class="panel"><h2>商品情報</h2><p>商品：${['星空ステッカー','花束ラベル','黒猫シール'][id]||'商品'}</p><p>出品者：Haru Creator</p><p>申請状態：人間審査中</p><button class="btn accent">承認</button> <button class="btn">差し戻し</button></section><aside><div class="panel"><h3>AI審査要約</h3><p>重大な問題は検出されていません。ライセンス説明の追記を推奨します。</p></div><div class="panel" style="margin-top:10px"><h3>出品者とのメッセージ</h3><p><b>管理者：</b>商用利用範囲を確認してください。</p><p><b>Haru Creator：</b>説明を追記しました。</p><textarea style="width:100%" placeholder="メッセージ"></textarea></div></aside></div>`)}
function adminOrders(){shell(`<button class="btn" onclick="go('admin')">← 管理</button><h1>注文管理</h1><div class="tablewrap"><table class="table"><tr><th>注文番号</th><th>日時</th><th>購入者</th><th>商品</th><th>金額</th><th>決済</th><th>製造</th><th>配送</th></tr>${['1001','1002','1003'].map((n,i)=>`<tr onclick="go('orderdetail/${n}')"><td>ORD-${n}</td><td>2026/08/${10-i}</td><td>buyer${i+1}</td><td>シール商品</td><td>${yen(1903+i*500)}</td><td>完了</td><td>${i?'製造中':'待ち'}</td><td>${i===2?'発送済':'準備中'}</td></tr>`).join('')}</table></div>`)}
function orderDetail(id){shell(`<button class="btn" onclick="go('adminorders')">← 注文一覧</button><h1>伝票 ${id}</h1><div class="split"><section class="panel"><h3>基本情報</h3><p>注文番号：${id}</p><p>購入者：Demo User</p><p>配送先：東京都新宿区</p><h3>商品明細</h3><div class="row"><span>ステッカー商品 × 2</span><b>¥1,200</b></div><div class="row"><span>送料・税</span><b>¥703</b></div></section><aside class="panel"><h3>処理タイムライン</h3><div class="timeline"><div>注文受付</div><div>決済完了</div><div>印刷会社へ発注</div><div>発送準備中</div></div><div class="field"><label>配送会社</label><input value="ヤマト運輸"></div><div class="field"><label>追跡番号</label><input value="1234-5678-9012"></div></aside></div>`)}
function bots(){if(state.user.role!=='admin')return shell('<div class="panel">アクセス権限がありません。</div>');shell(`<button class="btn" onclick="go('admin')">← 管理</button><h1>AIボット管理</h1><div class="rowBtns"><button class="btn accent" id="newBot">＋ AIボット追加</button><button class="btn" onclick="go('botlogs')">利用ログ</button></div><div class="tablewrap"><table class="table"><tr><th>ボット</th><th>カテゴリ</th><th>対象</th><th>Version</th><th>状態</th><th></th></tr>${state.aiBots.map(b=>`<tr><td>${b.icon} <b>${b.name}</b><div class="muted">${b.id}</div></td><td>${b.category}</td><td>${b.audiences.join(',')}</td><td>v${b.version}</td><td>${b.enabled?'公開中':'停止'}</td><td><button class="btn" data-edit="${b.id}">編集</button> <button class="btn" data-toggle="${b.id}">${b.enabled?'停止':'有効化'}</button></td></tr>`).join('')}</table></div>`);const editor=id=>{const b=id?state.aiBots.find(x=>x.id===id):{id:'bot_'+Date.now(),name:'',icon:'🤖',category:'商品制作',audiences:['creator'],version:'1.0',enabled:false,permissions:['product:read'],description:''};modal(`<h2>${id?'AIボット編集':'AIボット追加'}</h2><div class="field"><label>名前</label><input id="bn" value="${esc(b.name)}"></div><div class="split"><div class="field"><label>アイコン</label><input id="bi" value="${esc(b.icon)}"></div><div class="field"><label>カテゴリ</label><input id="bc" value="${esc(b.category)}"></div></div><div class="field"><label>説明</label><textarea id="bd">${esc(b.description)}</textarea></div><div class="split"><div class="field"><label>対象</label><select id="ba"><option>creator</option><option>buyer</option><option>admin</option></select></div><div class="field"><label>Version</label><input id="bv" value="${b.version}"></div></div><div class="field"><label>データ権限</label><input id="bp" value="${b.permissions.join(', ')}"></div><label><input id="be" type="checkbox" ${b.enabled?'checked':''}> 公開</label><div class="rowBtns" style="margin-top:12px"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn accent" id="bs">保存</button></div>`);$('#ba').value=b.audiences[0];$('#bs').onclick=()=>{const n={...b,name:$('#bn').value,icon:$('#bi').value,category:$('#bc').value,description:$('#bd').value,audiences:[$('#ba').value],version:$('#bv').value,permissions:$('#bp').value.split(',').map(x=>x.trim()).filter(Boolean),enabled:$('#be').checked};if(id)state.aiBots[state.aiBots.findIndex(x=>x.id===id)]=n;else state.aiBots.push(n);state.aiBotLogs.push({action:id?'edit':'create',botId:n.id,actorUserId:state.user.id,at:new Date().toISOString()});save();closeModal();bots()}};$('#newBot').onclick=()=>editor();$$('[data-edit]').forEach(x=>x.onclick=()=>editor(x.dataset.edit));$$('[data-toggle]').forEach(x=>x.onclick=()=>{const b=state.aiBots.find(z=>z.id===x.dataset.toggle);b.enabled=!b.enabled;state.aiBotLogs.push({action:'toggle',botId:b.id,actorUserId:state.user.id,at:new Date().toISOString()});save();bots()})}
function botlogs(){if(state.user.role!=='admin')return go('home');shell(`<button class="btn" onclick="go('bots')">← AIボット管理</button><h1>AI利用・変更ログ</h1><section class="panel">${state.aiBotLogs.slice().reverse().map(l=>`<div class="row"><div><b>${l.botId||'AI'}</b><div class="muted">${l.action||l.status||'run'} / ${l.userId||l.actorUserId||''}</div></div><span>${new Date(l.at).toLocaleString('ja-JP')}</span></div>`).join('')||'ログはまだありません'}</section>`)}
function account(){const p=data().profile||{};shell(`<button class="btn" onclick="history.back()">× 閉じる</button><h1>アカウント</h1><section class="panel"><div class="row"><span>表示名</span><b>${esc(state.user.name)}</b></div><div class="row"><span>ユーザーID</span><b>${esc(state.user.id)}</b></div><div class="row"><span>メール</span><b>${esc(state.user.email)}</b></div><div class="row"><span>地域</span><b>${esc([p.country,p.pref].filter(Boolean).join(' / ')||'未設定')}</b></div><div class="rowBtns"><button class="btn" onclick="go('orders')">購入履歴</button><button class="btn danger" id="logout">ログアウト</button></div></section>`);$('#logout').onclick=()=>{state.user=null;save();go('landing')}}
function route(){closeModal();applyTheme();const [p,id]=(location.hash.slice(2)||(state.user?'home':'landing')).split('/');if(!state.user&&!['landing','login','signup'].includes(p)){requireLogin(p+(id?'/'+id:''));return}({landing:lp,login:()=>signup(false),signup:()=>signup(true),home,search,create:createSticker,favorites,cart,orders,settings,account,creator:creatorCenter,sell,ai:aiStudio,admin,review,adminorders:adminOrders,bots,botlogs}[p]||(()=>p==='product'?product(id):p==='reviewdetail'?reviewDetail(id):p==='orderdetail'?orderDetail(id):home))();scrollTo(0,0)}
window.onhashchange=route;route();
</script></body></html>
