<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STICKER COMMONS — Mobile Demo</title>
<style>
:root{--bg:#f5f3ee;--ink:#171717;--muted:#6f6b63;--line:#d9d4ca;--card:#fff;--accent:#ff5a36;--admin:#1d2433}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(245,243,238,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:-.04em}.brand b{color:var(--accent)}nav{display:flex;gap:6px;overflow:auto}nav button,.iconbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap}.cartdot{background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px}main{max-width:1180px;margin:auto;padding:18px 16px 92px}.hero{display:grid;gap:18px;padding:32px 0}.hero h1{font-size:clamp(40px,10vw,86px);line-height:.92;letter-spacing:-.07em;margin:4px 0}.hero p{max-width:620px;color:var(--muted);font-size:17px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:.15em;font-weight:800;color:var(--muted)}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:8px;margin:10px 0 22px}.filters input,.filters select,.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 15px;font-weight:700}.btn.primary,.btn.accent{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.accent{background:var(--accent);border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.035)}.art{aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden}.shape{width:52%;height:52%;border-radius:30% 70% 55% 45%;background:rgba(255,255,255,.88);box-shadow:0 18px 50px rgba(0,0,0,.16);transform:rotate(-12deg)}.art span{position:absolute;font-size:13px;font-weight:900;letter-spacing:.15em}.pad{padding:14px}.pad h3{margin:6px 0;font-size:17px}.muted{color:var(--muted)}.price{font-weight:900;font-size:20px;margin-top:10px}.badges{display:flex;gap:5px;flex-wrap:wrap}.badge{font-size:10px;font-weight:900;padding:5px 7px;border:1px solid var(--line);border-radius:999px}.product{display:grid;grid-template-columns:1.08fr .92fr;gap:28px}.product .art{border-radius:24px;min-height:480px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tabs .active{background:var(--ink);color:#fff}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.empty{text-align:center;padding:60px 20px}.notice{padding:12px;border:1px solid #ffd2c8;background:#fff3ef;border-radius:12px;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.admin{background:var(--admin);color:#fff;border-color:#3b4558}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#171717;color:#fff;padding:12px 18px;border-radius:999px;z-index:50;box-shadow:0 10px 40px #0005}.bottom{display:none}.count{font-size:34px;font-weight:900}.status{color:var(--accent);font-weight:800}footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}
@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}.product,.split{grid-template-columns:1fr}.product .art{min-height:auto}header nav button[data-hide-mobile]{display:none}.bottom{position:fixed;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));backdrop-filter:blur(18px)}.bottom button{background:transparent;border:0;padding:7px 2px;font-size:11px}.bottom strong{display:block;font-size:19px}.hero{padding-top:18px}}
@media(max-width:420px){main{padding-left:12px;padding-right:12px}.grid{gap:9px}.pad{padding:11px}.pad h3{font-size:14px}.price{font-size:16px}.filters{grid-template-columns:1fr 1fr}.hero p{font-size:15px}}
</style>
</head>
<body>
<header><div class="brand" onclick="go('market')">STICKER <b>COMMONS</b></div><nav><button data-hide-mobile onclick="go('market')">探す</button><button data-hide-mobile onclick="go('creator')">出品</button><button data-hide-mobile onclick="go('admin')">管理</button><button id="account" onclick="go('login')">ログイン</button><button onclick="go('cart')">カート <span class="cartdot" id="cartCount">0</span></button></nav></header>
<main id="app"></main><footer>公開操作デモ / 模擬決済のみ。実際の請求・販売・ファイル送信は行われません。</footer>
<div class="bottom"><button onclick="go('market')"><strong>⌕</strong>探す</button><button onclick="go('orders')"><strong>▤</strong>注文</button><button onclick="go('creator')"><strong>＋</strong>出品</button><button onclick="go('cart')"><strong>▣</strong>カート</button></div>
<script>
const products=Array.from({length:24},(_,i)=>({id:i+1,name:['夜の植物標本','静かな宇宙船','透明な休日','コーヒー惑星','雨の日の標識','小さな怪獣'][i%6]+(i>5?' '+(i+1):''),creator:['mori design','NAMI LAB','paper orbit'][i%3],category:['アート','雑貨','ビジネス','キッズ'][i%4],material:['耐水PET','上質紙','透明フィルム','クラフト紙'][i%4],use:['屋外','ノート','梱包','PC・スマホ'][i%4],rating:4+(i%10)/10,digital:280+(i%4)*120,physical:520+(i%5)*160,color:['#ffb36b','#8ecae6','#cdb4db','#90be6d','#f28482','#84a59d'][i%6],ai:i%7===0,status:i===21?'draft':i===22?'review':i===23?'stopped':'published'}));
let state=JSON.parse(localStorage.getItem('stickerDemo')||'null')||{user:null,cart:[],orders:[],favorites:[],created:[]};
const app=document.querySelector('#app'),yen=n=>'¥'+n.toLocaleString('ja-JP'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('stickerDemo',JSON.stringify(state));document.querySelector('#cartCount').textContent=state.cart.reduce((a,x)=>a+x.qty,0);document.querySelector('#account').textContent=state.user?state.user.name:'ログイン'}
function go(x){location.hash='#/'+x} window.onhashchange=route;
function art(p,big=false){return `<div class="art" style="background:linear-gradient(145deg,${p.color},#f8f4ea)"><div class="shape"></div><span>${esc(p.name.slice(0,9))}</span></div>`}
function card(p){return `<article class="card" onclick="go('product/${p.id}')">${art(p)}<div class="pad"><div class="eyebrow">${p.category} · ★${p.rating.toFixed(1)}</div><h3>${esc(p.name)}</h3><div class="badges"><span class="badge">DATA</span><span class="badge">STICKER</span>${p.ai?'<span class="badge">AI</span>':''}</div><div class="muted">${p.creator}</div><div class="price">${yen(Math.min(p.digital,p.physical))}〜</div></div></article>`}
function market(){app.innerHTML=`<section class="hero"><div class="eyebrow">Design files + printed stickers</div><h1>貼る前から、<br>選ぶのが楽しい。</h1><p>デザインデータと、そのデザインから作るシールを同じ場所で。素材・用途・加工から必要な一枚を探せます。</p></section><form class="filters" id="filters"><input name="q" placeholder="キーワードで検索"><select name="material"><option value="">素材</option><option>耐水PET</option><option>上質紙</option><option>透明フィルム</option><option>クラフト紙</option></select><select name="use"><option value="">用途</option><option>屋外</option><option>ノート</option><option>梱包</option><option>PC・スマホ</option></select><select name="sort"><option>新着順</option><option>価格順</option><option>評価順</option></select><button class="btn primary">検索</button></form><div class="grid" id="grid">${products.filter(p=>p.status==='published').map(card).join('')}</div>`;document.querySelector('#filters').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),q=f.q.toLowerCase();let r=products.filter(p=>p.status==='published'&&(!q||p.name.toLowerCase().includes(q)||p.creator.toLowerCase().includes(q))&&(!f.material||p.material===f.material)&&(!f.use||p.use===f.use));if(f.sort==='価格順')r.sort((a,b)=>a.digital-b.digital);if(f.sort==='評価順')r.sort((a,b)=>b.rating-a.rating);document.querySelector('#grid').innerHTML=r.map(card).join('')||'<div class="empty">該当商品がありません</div>'}}
function detail(id){const p=products.find(x=>x.id==id)||state.created.find(x=>x.id==id);if(!p)return market();app.innerHTML=`<div class="product">${art(p,true)}<section><div class="eyebrow">${p.category} / ${p.creator}</div><h1>${esc(p.name)}</h1><p class="muted">暮らしの中に小さな違和感と余白をつくる、オリジナルデザインです。データ購入と印刷済みシールを選べます。</p><div class="badges"><span class="badge">${p.material}</span><span class="badge">商用利用可</span><span class="badge">防水対応</span></div><p>サイズ: 50×50mm / 形状: ダイカット / 加工: マット</p><div class="tabs"><button class="btn active" data-mode="digital">データを買う</button><button class="btn" data-mode="physical">シールを買う</button><button class="btn" data-mode="custom">仕様を選ぶ</button></div><div class="panel" id="buy"></div><h3>レビュー</h3><p>★★★★★ 色も質感もイメージ通りでした。</p></section></div>`;let mode='digital';function draw(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let price=mode==='digital'?p.digital:mode==='physical'?p.physical:p.physical+400;document.querySelector('#buy').innerHTML=`<div class="notice">これは模擬購入です。実際の請求はありません。</div><div class="field"><label>ライセンス</label><select id="license"><option value="個人利用">個人利用</option><option value="商用利用">商用利用 +¥800</option><option value="拡張商用">拡張商用 +¥2,000</option></select></div><div class="price">基本価格 ${yen(price)}</div><button class="btn accent" id="add">カートへ追加</button>`;document.querySelector('#add').onclick=()=>{state.cart.push({id:p.id,name:p.name,mode,license:document.querySelector('#license').value,price,qty:1});save();toast('カートに追加しました');go('cart')}}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});draw()}
function login(){app.innerHTML=`<div class="split"><section class="panel"><div class="eyebrow">Demo account</div><h1>ログイン</h1><div class="field"><label>役割</label><select id="role"><option value="buyer">購入者</option><option value="creator">クリエイター</option><option value="admin">管理者</option></select></div><div class="field"><label>メール</label><input value="buyer@example.test"></div><div class="field"><label>パスワード</label><input type="password" value="Demo123!"></div><button class="btn primary" id="loginBtn">デモログイン</button></section><section class="panel"><h2>この公開版について</h2><p class="muted">入力内容と操作結果は、このSafariのlocalStorageだけに保存されます。実サービスの認証・決済・ファイル配信ではありません。</p><button class="btn" id="reset">デモデータを初期化</button></section></div>`;document.querySelector('#loginBtn').onclick=()=>{const role=document.querySelector('#role').value;state.user={role,name:role==='admin'?'管理者':role==='creator'?'mori design':'デモ購入者'};save();toast('ログインしました');go('market')};document.querySelector('#reset').onclick=()=>{localStorage.removeItem('stickerDemo');location.reload()}}
function cart(){if(!state.cart.length){app.innerHTML='<div class="empty"><h2>カートは空です</h2><button class="btn" onclick="go(\'market\')">商品を探す</button></div>';return}let sub=state.cart.reduce((a,x)=>a+x.price*x.qty,0),shipping=state.cart.some(x=>x.mode!=='digital')?350:0,tax=Math.floor((sub+shipping)*.1),total=sub+shipping+tax;app.innerHTML=`<div class="eyebrow">Cart</div><h1>カート</h1><div class="split"><section class="panel">${state.cart.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b><div class="muted">${x.mode} / ${x.license}</div></div><div>${yen(x.price)} <button class="btn" data-del="${i}">削除</button></div></div>`).join('')}</section><section class="panel"><div class="row"><span>小計</span><b>${yen(sub)}</b></div><div class="row"><span>送料</span><b>${yen(shipping)}</b></div><div class="row"><span>税</span><b>${yen(tax)}</b></div><div class="row"><span>合計</span><span class="price">${yen(total)}</span></div><div class="notice">価格はデモ内で再計算されます。</div><button class="btn accent" id="checkout" style="width:100%;margin-top:12px">注文を作成</button></section></div>`;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.cart.splice(+b.dataset.del,1);save();cart()});document.querySelector('#checkout').onclick=()=>{if(!state.user)return go('login');app.innerHTML=`<section class="panel"><div class="eyebrow">Mock payment</div><h1>模擬決済</h1><p>合計 ${yen(total)}</p><div class="notice">実決済ではありません。カード番号の入力も不要です。</div><div class="tabs"><button class="btn accent" data-pay="success">決済成功を再現</button><button class="btn" data-pay="fail">失敗を再現</button><button class="btn" data-pay="cancel">キャンセル</button></div></section>`;document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const ok=b.dataset.pay==='success';state.orders.unshift({id:'ORD-'+Date.now().toString().slice(-7),status:ok?'支払い完了・DL可能':b.dataset.pay==='fail'?'決済失敗':'キャンセル',total,items:[...state.cart],date:new Date().toLocaleDateString('ja-JP')});if(ok)state.cart=[];save();go('orders')})}}
function orders(){if(!state.user)return go('login');app.innerHTML=`<div class="eyebrow">Orders</div><h1>注文履歴</h1><section class="panel">${state.orders.length?state.orders.map(o=>`<div class="row"><div><b>${o.id}</b><div class="muted">${o.date} · ${o.items.length}商品</div><span class="status">${o.status}</span></div><div><b>${yen(o.total)}</b>${o.status.includes('DL可能')?'<br><button class="btn" onclick="toast(\'購入者限定ダウンロードを再現しました\')">DL</button>':''}</div></div>`).join(''):'<div class="empty">注文はまだありません</div>'}</section>`}
function creator(){if(!state.user||!['creator','admin'].includes(state.user.role)){app.innerHTML='<div class="empty"><h2>クリエイター権限が必要です</h2><button class="btn" onclick="go(\'login\')">役割を選んでログイン</button></div>';return}const mine=products.filter(p=>p.creator==='mori design').concat(state.created);app.innerHTML=`<div class="eyebrow">Creator dashboard</div><h1>出品管理</h1><div class="split"><section class="panel"><h2>商品一覧</h2>${mine.map(p=>`<div class="row"><b>${esc(p.name)}</b><span class="badge">${p.status}</span></div>`).join('')}</section><section class="panel"><h2>新規商品</h2><div class="field"><label>商品名</label><input id="newName" placeholder="例：小さな星座"></div><div class="field"><label>説明</label><textarea></textarea></div><div class="field"><label>データ価格</label><input id="newPrice" type="number" value="500"></div><button class="btn primary" id="submitProduct">審査申請</button></section></div>`;document.querySelector('#submitProduct').onclick=()=>{const name=document.querySelector('#newName').value.trim();if(!name)return toast('商品名を入力してください');state.created.push({id:1000+Date.now(),name,creator:state.user.name,category:'アート',material:'耐水PET',use:'ノート',rating:0,digital:+document.querySelector('#newPrice').value||500,physical:900,color:'#ffb36b',status:'review'});save();toast('審査申請しました');creator()}}
function admin(){if(!state.user||state.user.role!=='admin'){app.innerHTML='<div class="empty"><h2>管理者権限が必要です</h2><p>公開デモでも役割を確認しています。</p><button class="btn" onclick="go(\'login\')">管理者でログイン</button></div>';return}const review=products.filter(p=>p.status==='review').concat(state.created.filter(p=>p.status==='review'));app.innerHTML=`<section class="panel admin"><div class="eyebrow">Admin console</div><h1>管理ダッシュボード</h1><div class="grid"><div><div class="count">${products.length+state.created.length}</div>商品</div><div><div class="count">${state.orders.length}</div>注文</div><div><div class="count">${review.length}</div>審査待ち</div><div><div class="count">6</div>ユーザー</div></div></section><div class="split" style="margin-top:16px"><section class="panel"><h2>商品審査</h2>${review.length?review.map(p=>`<div class="row"><b>${esc(p.name)}</b><button class="btn primary" data-approve="${p.id}">承認</button></div>`).join(''):'<p>審査待ちはありません</p>'}</section><section class="panel"><h2>製造・発送</h2><div class="row"><div><b>ORD-DEMO01</b><div class="muted">耐水PET / 50枚</div></div><button class="btn" onclick="toast(\'発送済みに更新しました\')">発送登録</button></div></section></div>`;document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const p=state.created.find(x=>x.id==b.dataset.approve);if(p)p.status='published';save();toast('商品を承認しました');admin()})}
function toast(msg){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function route(){const [page,id]=(location.hash.slice(2)||'market').split('/');({market,login,cart,orders,creator,admin}[page]||(()=>page==='product'&&detail(id)))()}save();route();
</script>
</body></html>
