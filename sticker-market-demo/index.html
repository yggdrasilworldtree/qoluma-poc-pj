<!doctype html>
<html lang="ja" data-theme="light">
<head>

<title>Sticker Market — Public Demo v0.2</title>
<style>
:root{--bg:#fffaf5;--card:#fff;--ink:#171719;--muted:#747078;--line:#e8e1dc;--soft:#f7f2ed;--accent:#ff5d72;--fs:1;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}html[data-theme=dark]{--bg:#111214;--card:#1b1d20;--ink:#f6f2ef;--muted:#aaa5a1;--line:#34363a;--soft:#25272b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:calc(16px * var(--fs));transition:.2s}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.header{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto minmax(180px,460px) auto;gap:18px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px)}.brand{font-size:22px;font-weight:900;letter-spacing:-.05em}.brand small{display:block;font-size:9px;letter-spacing:.15em}.searchbar{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;overflow:hidden}.searchbar input{border:0;background:transparent;outline:0;padding:11px 14px;flex:1}.searchbar button{border:0;background:transparent;padding:0 14px}.topnav{display:flex;gap:6px}.topnav button,.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 13px;font-weight:700}.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.soft{background:var(--soft)}.btn.danger{color:#d43f56}.block{width:100%}.wrap{max-width:1200px;margin:auto;padding:18px 18px 100px}.demo{max-width:1200px;margin:10px auto 0;padding:9px 16px;border:1px solid #f2b7bf;background:#fff0f2;color:#8b3846;border-radius:12px;font-size:12px}.hero{display:grid;grid-template-columns:1.05fr .95fr;min-height:410px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(125deg,#fff0de,#ffe4cf)}html[data-theme=dark] .hero{background:linear-gradient(125deg,#33251f,#291f22)}.heroCopy{padding:48px 42px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(40px,6vw,72px);line-height:.98;letter-spacing:-.06em;margin:10px 0 18px}.hero p{color:var(--muted);max-width:620px;line-height:1.8}.heroArt{display:grid;place-items:center;position:relative;min-height:340px}.sticker{position:absolute;width:160px;aspect-ratio:1;background:#fff;border:8px solid #fff;border-radius:40% 60% 52% 48%;box-shadow:0 18px 45px #0003;display:grid;place-items:center;font-size:70px}.sticker:nth-child(1){transform:translate(-80px,15px) rotate(-12deg)}.sticker:nth-child(2){transform:translate(60px,-30px) rotate(9deg)}.sticker:nth-child(3){width:120px;transform:translate(80px,90px) rotate(-6deg)}.heroActions,.rowBtns{display:flex;gap:9px;flex-wrap:wrap}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:32px 0 14px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px}.card{overflow:hidden;transition:.2s}.card:hover{transform:translateY(-2px)}.art{aspect-ratio:1;background:linear-gradient(145deg,var(--a),var(--b));display:grid;place-items:center;font-size:64px}.pad{padding:13px}.pad h3{margin:5px 0 8px}.muted{color:var(--muted)}.price{font-size:20px;font-weight:900}.badge{display:inline-flex;padding:4px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;font-weight:800;margin:2px}.panel{padding:18px}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.feature{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.feature b{display:block;margin-bottom:4px}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px}.filters{position:sticky;top:80px;height:max-content}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:10px;outline:none}.checks{display:grid;gap:8px;font-size:13px}.product{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}.gallery{background:var(--soft);border:1px solid var(--line);border-radius:20px;aspect-ratio:1;display:grid;place-items:center;font-size:150px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tabs button.active{background:var(--ink);color:var(--bg)}.summary>div,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.custom{display:grid;grid-template-columns:1fr 390px;gap:22px}.canvas{min-height:560px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 12px,var(--card) 12px,var(--card) 24px);border-radius:20px;display:grid;place-items:center;overflow:hidden}.previewSticker{width:55%;aspect-ratio:1;border:8px solid #fff;background:#fff;box-shadow:0 20px 45px #0003;border-radius:25%;display:grid;place-items:center;overflow:hidden}.previewSticker img{width:100%;height:100%;object-fit:contain}.upload{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:block;background:var(--soft)}.quality{margin-top:12px;padding:11px;border-radius:10px;background:#effbf4;border:1px solid #a9dfbd;color:#176738}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}.step{height:6px;background:var(--line);border-radius:9px}.step.on{background:var(--accent)}.creatorLayout,.settingsLayout,.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.creatorLayout{grid-template-columns:1.3fr .7fr}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.swatch.on{outline:2px solid var(--ink);outline-offset:2px}.footer{border-top:1px solid var(--line);max-width:1200px;margin:30px auto 80px;padding:28px 18px;display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:24px;color:var(--muted)}.footer b{color:var(--ink)}.footer span{display:block;margin:7px 0;font-size:13px}.mobileNav{display:none}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:60;background:#171719;color:#fff;padding:11px 16px;border-radius:999px;box-shadow:0 12px 35px #0005}.empty{text-align:center;padding:60px 20px}.hidden{display:none!important}.count{background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px;font-size:11px}.notice{padding:11px;border:1px solid #ffd0d6;background:#fff0f2;color:#7d3541;border-radius:10px;font-size:12px}.adminHead{background:#20242d;color:#fff;border-color:#353b48}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px}.stat strong{font-size:28px;display:block}
@media(max-width:900px){.header{grid-template-columns:1fr auto}.searchbar{grid-column:1/-1;grid-row:2}.topnav button[data-desktop]{display:none}.hero,.product,.custom,.creatorLayout,.settingsLayout,.split{grid-template-columns:1fr}.heroArt{min-height:300px}.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.filters{position:static}.features,.statGrid{grid-template-columns:repeat(2,1fr)}.footer{grid-template-columns:1fr 1fr}.mobileNav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.mobileNav button{border:0;background:none;font-size:10px}.mobileNav b{display:block;font-size:20px}.mobileNav .make b{background:var(--accent);color:#fff;width:34px;height:34px;line-height:34px;border-radius:50%;margin:auto}.wrap{padding-bottom:110px}}
@media(max-width:480px){.header{padding:10px 12px}.brand{font-size:19px}.topnav .btn{padding:8px}.wrap{padding-left:12px;padding-right:12px}.heroCopy{padding:28px 22px}.hero h1{font-size:42px}.grid{gap:9px}.art{font-size:48px}.pad{padding:10px}.footer{grid-template-columns:1fr}.canvas{min-height:400px}}
</style>
</head>
<body>
<header class="header"><div class="brand" onclick="go('home')">Sticker Market<small>DESIGN × STICKER MARKETPLACE</small></div><div class="searchbar"><input id="globalQ" placeholder="キーワードで検索"><button onclick="globalSearch()">⌕</button></div><nav class="topnav"><button class="btn" data-desktop onclick="go('search')">探す</button><button class="btn" data-desktop onclick="go('create')">作る</button><button class="btn" data-desktop onclick="go('creator')">出品</button><button class="btn" data-desktop onclick="go('settings')">設定</button><button class="btn" id="accountBtn" onclick="accountAction()">ログイン</button><button class="btn" onclick="go('cart')">カート <span class="count" id="cartCount">0</span></button></nav></header>
<div class="demo">GitHub公開操作デモ v0.2 — 自作シール、検索強化、表示/言語設定、5ステップ出品、模擬決済をSafari内で操作できます。実際の請求・アップロード送信はありません。</div>
<main class="wrap" id="app"></main>
<footer class="footer"><div><b>Sticker Market</b><p>デザインデータとシールを、探す・買う・作る・売る。</p></div><div><b>サービス</b><span>シールを探す</span><span>デザインを探す</span><span>オリジナルシールを作る</span><span>出品する</span></div><div><b>サポート</b><span>ご利用ガイド</span><span>よくある質問</span><span>お問い合わせ</span><span>返品・返金</span></div><div><b>法務・安全</b><span>利用規約</span><span>プライバシーポリシー</span><span>セキュリティポリシー</span><span>特定商取引法に基づく表記</span><span>著作権・AI生成ポリシー</span></div></footer>
<nav class="mobileNav"><button onclick="go('home')"><b>⌂</b>ホーム</button><button onclick="go('search')"><b>⌕</b>探す</button><button class="make" onclick="go('create')"><b>＋</b>作る</button><button onclick="go('favorites')"><b>♡</b>お気に入り</button><button onclick="go('settings')"><b>⚙</b>設定</button></nav><div id="toast" class="toast hidden"></div>
<script>
const products=Array.from({length:24},(_,i)=>({id:i+1,name:['星空と山の風景','黒猫のシルエット','花のブーケ','空飛ぶクジラ','レトロマウンテン','幾何学ステンドグラス'][i%6]+(i>5?' '+(i+1):''),creator:['sora_design','hanabi_studio','paper orbit'][i%3],category:['風景','動物','花','アート'][i%4],material:['光沢紙','マット紙','透明PET','耐水PET'][i%4],use:['PC・スマホ','ノート','屋外','梱包'][i%4],shape:['カットライン','円形','四角','角丸'][i%4],finish:['グロス','マット','ホログラム','耐候'][i%4],rating:4+(i%10)/10,digital:300+(i%4)*100,physical:440+(i%5)*120,ai:i%7===0,waterproof:i%3!==1,outdoor:i%4===2,emoji:['🌌','🐈‍⬛','💐','🐋','🏔️','🔶'][i%6],a:['#f2c8a0','#f5d5bf','#ffdcd8','#cbe7f5','#efd1c3','#f2e3ad'][i%6],b:['#f8efe7','#f1e7df','#fff5ef','#edf7fc','#fbefe8','#fbf6df'][i%6]}));
let state=JSON.parse(localStorage.getItem('stickerMarketStaticV2')||'null')||{user:null,cart:[],orders:[],favorites:[],created:[],settings:{lang:'ja',theme:'system',fontSize:100,font:'sans',accent:'#ff5d72'}};
const app=document.querySelector('#app'),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words={ja:{browse:'探す',make:'オリジナルシールを作る',popular:'人気のデザイン',settings:'設定'},en:{browse:'Browse',make:'Create your sticker',popular:'Popular designs',settings:'Settings'},zh:{browse:'搜索',make:'制作原创贴纸',popular:'热门设计',settings:'设置'},ko:{browse:'찾기',make:'나만의 스티커 만들기',popular:'인기 디자인',settings:'설정'}};const t=k=>(words[state.settings.lang]||words.ja)[k]||k;
function save(){localStorage.setItem('stickerMarketStaticV2',JSON.stringify(state));$('#cartCount').textContent=state.cart.reduce((a,x)=>a+(+x.qty||1),0);$('#accountBtn').textContent=state.user?state.user.name:'ログイン'}
function applySettings(){let th=state.settings.theme;if(th==='system')th=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=th;document.documentElement.style.setProperty('--fs',state.settings.fontSize/100);document.documentElement.style.setProperty('--accent',state.settings.accent);document.documentElement.style.setProperty('--font',state.settings.font==='serif'?'"Yu Mincho","Hiragino Mincho ProN",serif':state.settings.font==='rounded'?'"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif':'-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif');document.documentElement.lang=state.settings.lang==='zh'?'zh-CN':state.settings.lang}
function toast(m){const el=$('#toast');el.textContent=m;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),1700)}function go(x){location.hash='#/'+x}function globalSearch(){go('search?q='+encodeURIComponent($('#globalQ').value))}$('#globalQ').addEventListener('keydown',e=>{if(e.key==='Enter')globalSearch()});window.addEventListener('hashchange',route);function accountAction(){state.user?logout():go('login')}function logout(){state.user=null;save();toast('ログアウトしました');go('home')}
function art(p){return `<div class="art" style="--a:${p.a};--b:${p.b}">${p.emoji}</div>`}function card(p){const fav=state.favorites.includes(p.id);return `<article class="card"> <div onclick="go('product/${p.id}')">${art(p)}</div><div class="pad"><div class="eyebrow">${p.category} · ★${p.rating.toFixed(1)}</div><h3 onclick="go('product/${p.id}')">${esc(p.name)}</h3><span class="badge">DATA</span><span class="badge">STICKER</span>${p.ai?'<span class="badge">AI</span>':''}<div class="muted">by ${p.creator}</div><div class="row"><span class="price">${yen(Math.min(p.digital,p.physical))}〜</span><button class="btn soft" onclick="fav(${p.id},event)">${fav?'♥':'♡'}</button></div></div></article>`}function fav(id,e){e?.stopPropagation();const i=state.favorites.indexOf(id);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(id);save();toast(i>=0?'お気に入りから削除':'お気に入りに追加');route()}
function home(){app.innerHTML=`<section class="hero"><div class="heroCopy"><div class="eyebrow">Design files + printed stickers</div><h1>お気に入りの<br>デザインを、シールに。</h1><p>デザインデータの購入も、オリジナルシールの注文も。クリエイターの作品が見つかるマーケットプレイス。</p><div class="heroActions"><button class="btn accent" onclick="go('search')">作品を探す</button><button class="btn" onclick="go('create')">シールを作る</button></div></div><div class="heroArt"><div class="sticker">🌌</div><div class="sticker">🐈‍⬛</div><div class="sticker">💐</div></div></section><section class="features"><div class="feature"><b>デザインデータが買える</b><span class="muted">商用利用条件も確認</span></div><div class="feature"><b>シールにしてお届け</b><span class="muted">サイズ・素材・加工を選択</span></div><div class="feature"><b>自分の画像から作れる</b><span class="muted">アップロードして即見積</span></div><div class="feature"><b>安心の取引設計</b><span class="muted">模擬決済で操作確認</span></div></section><div class="sectionHead"><div><div class="eyebrow">Trending</div><h2>${t('popular')}</h2></div><button class="btn" onclick="go('search')">すべて見る</button></div><div class="grid">${products.slice(0,8).map(card).join('')}</div><div class="sectionHead"><div><div class="eyebrow">Make yours</div><h2>${t('make')}</h2></div></div><section class="panel split"><div><h2>画像をアップロードするだけ</h2><p class="muted">PNG/JPG/SVG/PDFを選び、サイズ・素材・形状・加工・数量から見積できます。</p><button class="btn accent" onclick="go('create')">オリジナルシールを作る</button></div><div class="upload"><div style="font-size:56px">✦</div><b>あなたのデザインをシールに</b><p class="muted">Safari上でプレビューできます</p></div></section>`}
function searchPage(qs=''){const q=new URLSearchParams(qs);app.innerHTML=`<div class="eyebrow">Marketplace</div><h1>${t('browse')}</h1><div class="layout"><aside class="panel filters"><form id="filterForm"><div class="field"><label>キーワード</label><input name="q" value="${esc(q.get('q')||'')}" placeholder="例：防水 青 かわいい"></div><div class="field"><label>カテゴリ</label><select name="category"><option value="">すべて</option>${['風景','動物','花','アート'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>素材</label><select name="material"><option value="">すべて</option>${['光沢紙','マット紙','透明PET','耐水PET'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>用途</label><select name="use"><option value="">すべて</option>${['PC・スマホ','ノート','屋外','梱包'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>形状</label><select name="shape"><option value="">すべて</option>${['カットライン','円形','四角','角丸'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="checks"><label><input name="digital" type="checkbox"> デジタル商品あり</label><label><input name="physical" type="checkbox"> 物理商品あり</label><label><input name="commercial" type="checkbox"> 商用利用可能</label><label><input name="waterproof" type="checkbox"> 防水</label><label><input name="outdoor" type="checkbox"> 屋外対応</label><label><input name="excludeAI" type="checkbox"> AI生成を除外</label></div><div class="field"><label>価格上限</label><select name="max"><option value="">指定なし</option><option value="500">¥500</option><option value="1000">¥1,000</option><option value="3000">¥3,000</option></select></div><div class="field"><label>評価</label><select name="rating"><option value="">指定なし</option><option value="4.5">★4.5以上</option><option value="4">★4以上</option></select></div><div class="field"><label>並び順</label><select name="sort"><option value="new">新着順</option><option value="price">価格順</option><option value="rating">評価順</option></select></div><button class="btn primary block">条件を適用</button><button type="button" class="btn block" onclick="go('search')" style="margin-top:6px">クリア</button></form></aside><section><div id="result"></div></section></div>`;const form=$('#filterForm');for(const [k,v] of q){const el=form.elements[k];if(el){if(el.type==='checkbox')el.checked=v==='1';else el.value=v}}const run=()=>{const f=Object.fromEntries(new FormData(form)),term=(f.q||'').toLowerCase();let r=products.filter(p=>(!term||(p.name+' '+p.creator+' '+p.category).toLowerCase().includes(term))&&(!f.category||p.category===f.category)&&(!f.material||p.material===f.material)&&(!f.use||p.use===f.use)&&(!f.shape||p.shape===f.shape)&&(!f.waterproof||p.waterproof)&&(!f.outdoor||p.outdoor)&&(!f.excludeAI||!p.ai)&&(!f.max||Math.min(p.digital,p.physical)<=+f.max)&&(!f.rating||p.rating>=+f.rating));if(f.sort==='price')r.sort((a,b)=>Math.min(a.digital,a.physical)-Math.min(b.digital,b.physical));if(f.sort==='rating')r.sort((a,b)=>b.rating-a.rating);$('#result').innerHTML=`<div class="sectionHead"><div><b>${r.length}件</b><div class="muted">検索条件はURLに保持できます</div></div></div><div class="grid">${r.map(card).join('')||'<div class="empty">該当商品がありません</div>'}</div>`};form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),u=new URLSearchParams();for(const [k,v] of f)if(v)u.set(k,v==='on'?'1':v);location.hash='#/search?'+u.toString()};run()}
function detail(id){const p=products.find(x=>x.id==id);if(!p)return home();app.innerHTML=`<div class="product"><div><div class="gallery">${p.emoji}</div><div class="tabs"><button class="btn soft">${p.emoji}</button><button class="btn">✨</button><button class="btn">📐</button></div></div><section><div class="eyebrow">${p.category} / ${p.creator}</div><h1>${p.name}</h1><div>★★★★★ <b>${p.rating.toFixed(1)}</b> (128)</div><p class="muted">暮らしに馴染むオリジナルデザイン。データとして購入することも、印刷済みシールとして注文することもできます。</p><span class="badge">${p.material}</span><span class="badge">${p.use}</span><span class="badge">商用利用OK</span>${p.ai?'<span class="badge">AI生成</span>':''}<p><b>形状</b> ${p.shape}　<b>加工</b> ${p.finish}</p><button class="btn soft" onclick="fav(${p.id})">${state.favorites.includes(p.id)?'♥ お気に入り済み':'♡ お気に入り'}</button><div class="tabs" id="buyTabs"><button class="btn active" data-mode="digital">データを買う</button><button class="btn" data-mode="physical">シールを買う</button><button class="btn" data-mode="custom">仕様を選んで注文</button></div><div class="panel" id="buyBox"></div><div class="sectionHead"><h3>レビュー</h3></div><div class="panel">★★★★★ 色も質感もイメージ通りでした。</div></section></div>`;let mode='digital';function draw(){$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const base=mode==='digital'?p.digital:mode==='physical'?p.physical:p.physical+400;$('#buyBox').innerHTML=`<div class="notice">公開デモでは模擬購入です。実際の請求はありません。</div>${mode!=='digital'?'<div class="field"><label>数量</label><select id="qty"><option>1</option><option>5</option><option>10</option><option>20</option><option>50</option></select></div>':''}<div class="field"><label>ライセンス</label><select id="license"><option value="personal">個人利用</option><option value="commercial">商用利用 +¥800</option><option value="extended">拡張商用 +¥2,000</option></select></div><div class="row"><span>基本価格</span><b class="price">${yen(base)}</b></div><button class="btn accent block" id="addProduct">カートに追加</button>`;$('#addProduct').onclick=()=>{state.cart.push({id:p.id,name:p.name,mode,qty:+($('#qty')?.value||1),license:$('#license').value,base});save();toast('カートに追加しました')}}$$('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});draw()}
function createSticker(){app.innerHTML=`<div class="eyebrow">Custom studio</div><h1>${t('make')}</h1><div class="custom"><section><div class="canvas"><div class="previewSticker" id="previewSticker"><div id="ph"><div style="font-size:68px;text-align:center">⬆</div><b>画像をアップロード</b></div><img id="preview" class="hidden"></div></div><div id="quality"></div></section><aside class="panel"><h2>1. デザイン</h2><label class="upload"><input id="file" type="file" accept="image/png,image/jpeg,image/svg+xml,application/pdf" hidden><b>ファイルを選択</b><div class="muted">PNG / JPG / SVG / PDF・最大2MB</div></label><h2>2. 仕様</h2><div class="split"><div class="field"><label>幅(mm)</label><input id="w" type="number" value="50" min="20" max="200"></div><div class="field"><label>高さ(mm)</label><input id="h" type="number" value="50" min="20" max="200"></div></div><div class="field"><label>素材</label><select id="mat"><option>耐水PET</option><option>上質紙</option><option>透明フィルム</option><option>クラフト紙</option></select></div><div class="field"><label>形状</label><select id="shape"><option>自由形</option><option>円形</option><option>四角</option><option>角丸</option></select></div><div class="field"><label>加工</label><select id="finish"><option>マット</option><option>グロス</option><option>ホログラム</option><option>耐候ラミネート</option></select></div><div class="field"><label>数量</label><select id="qty"><option>1</option><option>5</option><option selected>10</option><option>20</option><option>50</option><option>100</option><option>500</option><option>1000</option></select></div><h2>3. 見積</h2><div class="summary" id="quote"></div><button class="btn accent block" id="addCustom" disabled>カートに追加</button></aside></div>`;let fileName='';function unit(){const w=Math.max(20,+$('#w').value||50),h=Math.max(20,+$('#h').value||50),q=+$('#qty').value||1;let u=180+Math.ceil(w*h/180)+({'上質紙':0,'耐水PET':80,'透明フィルム':110,'クラフト紙':40}[$('#mat').value]??80)+({'マット':0,'グロス':40,'ホログラム':130,'耐候ラミネート':160}[$('#finish').value]??0);if(q>=500)u=Math.floor(u*.5);else if(q>=100)u=Math.floor(u*.63);else if(q>=50)u=Math.floor(u*.72);else if(q>=20)u=Math.floor(u*.82);else if(q>=10)u=Math.floor(u*.9);return Math.max(90,u)}function quote(){const u=unit(),q=+$('#qty').value,sub=u*q,ship=600,tax=Math.floor((sub+ship)*.1);$('#quote').innerHTML=`<div><span>単価</span><b>${yen(u)}</b></div><div><span>商品小計</span><b>${yen(sub)}</b></div><div><span>送料</span><b>${yen(ship)}</b></div><div><span>税込見込</span><b class="price">${yen(sub+ship+tax)}</b></div>`}function shape(){const s=$('#shape').value;$('#previewSticker').style.borderRadius=s==='円形'?'50%':s==='角丸'?'22px':s==='四角'?'4px':'28% 72% 54% 46%'}['w','h','mat','shape','finish','qty'].forEach(id=>$('#'+id).onchange=()=>{shape();quote()});$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2e6)return toast('2MB以下のファイルを選んでください');fileName=f.name;const r=new FileReader();r.onload=()=>{if(f.type==='application/pdf'){$('#ph').innerHTML='<div style="font-size:64px;text-align:center">PDF</div><b>'+esc(f.name)+'</b>'}else{$('#preview').src=r.result;$('#preview').classList.remove('hidden');$('#ph').classList.add('hidden')}$('#quality').innerHTML='<div class="quality"><b>✓ 印刷用データを確認しました</b><div>公開デモではブラウザ内のみで処理されます。</div></div>';$('#addCustom').disabled=false};r.readAsDataURL(f)};$('#addCustom').onclick=()=>{state.cart.push({name:'オリジナルシール '+fileName,mode:'upload',qty:+$('#qty').value,custom:{w:+$('#w').value,h:+$('#h').value,material:$('#mat').value,shape:$('#shape').value,finish:$('#finish').value},base:unit()});save();toast('カートに追加しました');setTimeout(()=>go('cart'),300)};shape();quote()}
function cart(){if(!state.cart.length){app.innerHTML='<div class="empty"><h2>カートは空です</h2><button class="btn accent" onclick="go(\'search\')">商品を探す</button></div>';return}let subtotal=0,shipping=0;for(const x of state.cart){let u=x.base||500;if(x.license==='commercial')u+=800;if(x.license==='extended')u+=2000;subtotal+=u*(+x.qty||1);if(x.mode!=='digital')shipping=600}const tax=Math.floor((subtotal+shipping)*.1),total=subtotal+shipping+tax;app.innerHTML=`<div class="eyebrow">Cart</div><h1>カート</h1><div class="split"><section class="panel">${state.cart.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b><div class="muted">${x.mode} / 数量 ${x.qty}</div>${x.custom?`<small>${x.custom.w}×${x.custom.h}mm・${x.custom.material}・${x.custom.finish}</small>`:''}</div><button class="btn danger" data-del="${i}">削除</button></div>`).join('')}</section><section class="panel"><div class="summary"><div><span>商品</span><b>${yen(subtotal)}</b></div><div><span>送料</span><b>${yen(shipping)}</b></div><div><span>税</span><b>${yen(tax)}</b></div><div><span>合計</span><b class="price">${yen(total)}</b></div></div><div class="notice">公開デモではブラウザ内で価格を再計算します。</div><button class="btn accent block" id="checkout" style="margin-top:12px">注文を作成</button></section></div>`;$$('[data-del]').forEach(b=>b.onclick=()=>{state.cart.splice(+b.dataset.del,1);save();cart()});$('#checkout').onclick=()=>{if(!state.user)return go('login');app.innerHTML=`<section class="panel" style="max-width:620px;margin:auto"><div class="eyebrow">Mock payment</div><h1>ご注文手続き</h1><div class="notice">模擬決済です。実際の請求はありません。</div><div class="summary"><div><span>商品</span><b>${yen(subtotal)}</b></div><div><span>送料</span><b>${yen(shipping)}</b></div><div><span>税</span><b>${yen(tax)}</b></div><div><span>合計</span><b class="price">${yen(total)}</b></div></div><div class="tabs"><button class="btn accent" data-pay="success">成功をテスト</button><button class="btn" data-pay="fail">失敗をテスト</button><button class="btn" data-pay="cancel">キャンセル</button></div></section>`;$$('[data-pay]').forEach(b=>b.onclick=()=>{state.orders.unshift({id:'ORDER-'+Date.now().toString().slice(-8),date:new Date().toLocaleString('ja-JP'),total,status:b.dataset.pay==='success'?'決済完了':b.dataset.pay==='fail'?'決済失敗':'キャンセル',items:[...state.cart]});if(b.dataset.pay==='success')state.cart=[];save();go('orders')})}}

function creator(){if(!state.user||!['creator','admin'].includes(state.user.role)){app.innerHTML='<div class="empty"><h2>クリエイター権限が必要です</h2><button class="btn" onclick="go(\'login\')">ログイン</button></div>';return}let step=1,d={};app.innerHTML=`<div class="eyebrow">Creator dashboard</div><h1>出品管理</h1><div class="statGrid"><div class="stat"><strong>${state.created.length+3}</strong>商品</div><div class="stat"><strong>2</strong>公開中</div><div class="stat"><strong>${state.created.length}</strong>審査中</div><div class="stat"><strong>¥45,300</strong>売上</div></div><div class="sectionHead"><h2>商品を出品する</h2></div><div class="creatorLayout"><section class="panel"><div class="steps">${[1,2,3,4,5].map(i=>`<span class="step" data-step="${i}"></span>`).join('')}</div><div id="creatorStep"></div></section><aside class="panel"><h3>商品プレビュー</h3><div class="art" style="--a:#f2c8a0;--b:#fff5ef">🌌</div><h3 id="pvName">商品名</h3><p class="muted" id="pvDesc">説明がここに表示されます。</p><div class="price" id="pvPrice">¥0〜</div></aside></div>`;function capture(){if(step===1){d.name=$('#cName').value;d.desc=$('#cDesc').value;d.category=$('#cCat').value}else if(step===2){d.digital=$('#cDigital').checked;d.physical=$('#cPhysical').checked;d.custom=$('#cCustom').checked}else if(step===3){d.material=$('#cMat').value;d.size=$('#cSize').value;d.shape=$('#cShape').value;d.finish=$('#cFinish').value}else if(step===4){d.dp=+$('#cDP').value;d.pp=+$('#cPP').value;d.cost=+$('#cCost').value}}function draw(){$$('[data-step]').forEach((x,i)=>x.classList.toggle('on',i<step));const e=$('#creatorStep');if(step===1)e.innerHTML=`<h2>STEP 1 基本情報</h2><div class="field"><label>商品名</label><input id="cName" value="${esc(d.name||'')}"></div><div class="field"><label>説明</label><textarea id="cDesc" rows="5">${esc(d.desc||'')}</textarea></div><div class="field"><label>カテゴリ</label><select id="cCat"><option>風景</option><option>動物</option><option>花</option><option>アート</option></select></div><button class="btn primary" id="next">次へ</button>`;if(step===2)e.innerHTML=`<h2>STEP 2 画像・販売形式</h2><label class="upload"><b>商品画像をアップロード</b><p class="muted">公開デモではプレビューのみ</p></label><div class="checks"><label><input id="cDigital" type="checkbox" checked> データ販売</label><label><input id="cPhysical" type="checkbox" checked> シール販売</label><label><input id="cCustom" type="checkbox"> カスタム注文</label></div><div class="tabs"><button class="btn" id="back">戻る</button><button class="btn primary" id="next">次へ</button></div>`;if(step===3)e.innerHTML=`<h2>STEP 3 商品仕様</h2><div class="field"><label>素材</label><select id="cMat"><option>耐水PET</option><option>光沢紙</option><option>マット紙</option><option>透明PET</option></select></div><div class="field"><label>サイズ</label><select id="cSize"><option>30mm</option><option selected>50mm</option><option>70mm</option><option>100mm</option></select></div><div class="field"><label>形状</label><select id="cShape"><option>カットライン</option><option>円形</option><option>四角</option><option>角丸</option></select></div><div class="field"><label>加工</label><select id="cFinish"><option>マット</option><option>グロス</option><option>ホログラム</option></select></div><div class="tabs"><button class="btn" id="back">戻る</button><button class="btn primary" id="next">次へ</button></div>`;if(step===4)e.innerHTML=`<h2>STEP 4 価格・収益</h2><div class="field"><label>データ価格</label><input id="cDP" type="number" value="${d.dp||500}"></div><div class="field"><label>シール価格</label><input id="cPP" type="number" value="${d.pp||900}"></div><div class="field"><label>製造原価</label><input id="cCost" type="number" value="${d.cost||300}"></div><div class="notice" id="profit"></div><div class="tabs"><button class="btn" id="back">戻る</button><button class="btn primary" id="next">次へ</button></div>`;if(step===5)e.innerHTML=`<h2>STEP 5 確認・審査申請</h2><div class="notice">申請後、管理者の承認まで公開されません。</div><div class="summary"><div><span>商品名</span><b>${esc(d.name)}</b></div><div><span>素材</span><b>${esc(d.material)}</b></div><div><span>データ価格</span><b>${yen(d.dp)}</b></div><div><span>シール価格</span><b>${yen(d.pp)}</b></div></div><div class="tabs"><button class="btn" id="back">戻る</button><button class="btn accent" id="submitProduct">審査申請する</button></div>`;if(step===1){$('#cName').oninput=x=>$('#pvName').textContent=x.target.value||'商品名';$('#cDesc').oninput=x=>$('#pvDesc').textContent=x.target.value||'説明がここに表示されます。'}if(step===4){const p=()=>{const v=+$('#cPP').value,c=+$('#cCost').value,fee=Math.floor(v*.1);$('#profit').innerHTML=`販売価格 ${yen(v)} − 原価 ${yen(c)} − 手数料想定 ${yen(fee)} = <b>収益目安 ${yen(v-c-fee)}</b>`;$('#pvPrice').textContent=yen(Math.min(+$('#cDP').value||999999,v||999999))+'〜'};['cDP','cPP','cCost'].forEach(id=>$('#'+id).oninput=p);p()}$('#back')&&($('#back').onclick=()=>{capture();step--;draw()});$('#next')&&($('#next').onclick=()=>{capture();if(step===1&&!d.name)return toast('商品名を入力してください');step++;draw()});$('#submitProduct')&&($('#submitProduct').onclick=()=>{state.created.push({...d,status:'審査中',id:Date.now()});save();toast('審査申請しました');setTimeout(()=>creator(),400)})}draw()}
function admin(){if(!state.user||state.user.role!=='admin'){app.innerHTML='<div class="empty"><h2>管理者権限が必要です</h2></div>';return}app.innerHTML=`<section class="panel adminHead"><div class="eyebrow">Admin console</div><h1>管理者ダッシュボード</h1></section><div class="statGrid" style="margin-top:14px"><div class="stat"><strong>7</strong>ユーザー</div><div class="stat"><strong>${products.length+state.created.length}</strong>商品</div><div class="stat"><strong>${state.created.length}</strong>審査待ち</div><div class="stat"><strong>${state.orders.length}</strong>注文</div></div><div class="split" style="margin-top:18px"><section class="panel"><h2>商品審査</h2>${state.created.length?state.created.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b><div class="muted">${x.material||'未設定'}</div></div><div><button class="btn primary" data-ok="${i}">承認</button> <button class="btn" data-ng="${i}">差し戻し</button></div></div>`).join(''):'<p class="muted">審査待ちはありません</p>'}</section><section class="panel"><h2>管理メニュー</h2>${['ユーザー管理','注文管理','製造・発送管理','売上管理','支払い記録','通報管理','問い合わせ管理','カテゴリ管理','素材管理','ライセンス管理','監査ログ'].map(x=>`<button class="btn block" style="margin:4px 0" onclick="toast('${x}を開くデモ')">${x}</button>`).join('')}</section></div>`;$$('[data-ok]').forEach(b=>b.onclick=()=>{state.created.splice(+b.dataset.ok,1);save();toast('商品を承認しました');admin()});$$('[data-ng]').forEach(b=>b.onclick=()=>toast('差し戻しました'))}
function settings(){const s=state.settings;app.innerHTML=`<div class="eyebrow">Preferences</div><h1>${t('settings')}</h1><div class="settingsLayout"><aside class="panel"><button class="btn soft block">表示・アクセシビリティ</button><button class="btn block" style="margin-top:6px">言語</button><button class="btn block" style="margin-top:6px">通知</button><button class="btn block" style="margin-top:6px">プライバシー</button></aside><section class="panel"><h2>表示・アクセシビリティ</h2><div class="field"><label>テーマ</label><select id="theme"><option value="system">端末設定</option><option value="light">ライト</option><option value="dark">ダーク</option></select></div><div class="field"><label>フォントサイズ: <span id="fsVal">${s.fontSize}%</span></label><input id="fs" type="range" min="80" max="150" step="10" value="${s.fontSize}"></div><div class="field"><label>フォントスタイル</label><select id="font"><option value="sans">システム標準</option><option value="rounded">丸ゴシック</option><option value="serif">明朝</option></select></div><div class="field"><label>カラーパレット</label><div class="swatches">${['#ff5d72','#ff7a45','#2f80ed','#7c5cff','#14a67b','#222222'].map(c=>`<button class="swatch ${s.accent===c?'on':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h2>言語</h2><div class="field"><label>使用言語</label><select id="lang"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="ko">한국어</option></select></div><label><input type="checkbox" checked> 商品説明を自動翻訳表示する</label><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h2>プライバシー</h2><button class="btn danger" onclick="toast('閲覧履歴を削除しました')">閲覧履歴を削除</button></section></div>`;$('#theme').value=s.theme;$('#font').value=s.font;$('#lang').value=s.lang;$('#theme').onchange=e=>{s.theme=e.target.value;applySettings();save()};$('#fs').oninput=e=>{s.fontSize=+e.target.value;$('#fsVal').textContent=s.fontSize+'%';applySettings();save()};$('#font').onchange=e=>{s.font=e.target.value;applySettings();save()};$('#lang').onchange=e=>{s.lang=e.target.value;save();applySettings();settings()};$$('[data-color]').forEach(b=>b.onclick=()=>{s.accent=b.dataset.color;save();applySettings();settings()})}
function route(){const raw=location.hash.slice(2)||'home',[path,qs='']=raw.split('?'),[page,id]=path.split('/');if(page==='home')home();else if(page==='search')searchPage(qs);else if(page==='product')detail(id);else if(page==='create')createSticker();else if(page==='cart')cart();else if(page==='login')login();else if(page==='orders')orders();else if(page==='favorites')favorites();else if(page==='creator')creator();else if(page==='admin')admin();else if(page==='settings')settings();else home();window.scrollTo({top:0,behavior:'instant'})}applySettings();save();route();
</script>
</body></html>
