Subs()};$('#advancedBtn').onclick=()=>{SEARCH_STATE.advanced=!SEARCH_STATE.advanced;$('#advanced').classList.toggle('hidden');$('#advancedBtn').textContent=SEARCH_STATE.advanced?'詳細検索を閉じる':'詳細検索';saveSearchState()};$('#searchDo').onclick=()=>{Object.assign(f,{q:$('#sq').value,cat:$('#scat').value,material:$('#smat').value,use:$('#suse').value,shape:$('#sshape').value,maxPrice:$('#smax').value,rating:$('#srating').value,excludeAi:$('#sai').checked});SEARCH_STATE.page=1;saveSearchState();renderSearchResults();toast(`${getSearchResults().length}件見つかりました`)};renderSearchResults()}function renderProduct(id){const p=products.find(x=>x.id===id)||state.created.find(x=>x.id===id);if(!p){go('home');return}const baseEmoji=p.emoji||'🎨',alts=[baseEmoji,p.category==='動物・ペット'?'🐾':p.category==='アウトドア'?'🏕️':'✨',p.category==='アート'?'🖼️':'🔎',p.category==='かわいい'?'💗':'📦','🔍'];const colors=[p.color||'#ffc0cb','#9fd7d0','#c9b2f1','#f8b36a','#82b7ff'];let gidx=0;const gallery=alts.map((e,i)=>({e,c:colors[i%colors.length]}));appShell(`<button class="btn link" onclick="history.length>1?history.back():go('home')">← 戻る</button><div class="product"><div class="product-gallery"><div id="pgMain" class="product-gallery-main" title="タップで拡大"><div id="pgVisual" class="product-gallery-visual" style="--gc:${gallery[0].c}">${esc(gallery[0].e)}</div><span id="pgCount" class="product-gallery-counter">1/${gallery.length}</span></div><div class="product-thumbs">${gallery.map((g,i)=>`<button class="product-thumb ${i===0?'active':''}" data-gidx="${i}" style="--gc:${g.c}">${esc(g.e)}</button>`).join('')}</div></div><section><div class="eyebrow">${esc(displayText(p.category)||'アート')} / ${esc(displayText(p.creator)||'Creator')}</div><h1>${esc(displayText(p.name)||'名称未設定')}</h1><div class="row" style="justify-content:flex-start;gap:8px;border:0;padding-top:0"><span class="badge">★${Number(p.rating||4.8).toFixed(1)}</span><span class="badge">商用利用可</span>${p.ai?'<span class="badge">AI生成</span>':''}</div><p class="muted">デザインデータとして購入するほか、シールとして注文できます。画像を確認してから販売形式を選択してください。</p>${p.recommendedMaterial?`<div class="panel" style="padding:12px;margin:12px 0"><b>クリエイターおすすめ</b><div>${esc(p.recommendedMaterial)}${p.recommendedShape?' / '+esc(p.recommendedShape):''}</div></div>`:''}<div class="tabs" style="margin:18px 0"><button class="btn active">データを買う</button><button class="btn">シールを買う</button><button class="btn">仕様を選ぶ</button></div><div class="panel"><div class="row"><span>価格</span><b class="price">${yen(p.digital||500)}〜</b></div><div class="product-actions"><button class="btn accent" id="addCart">カートに追加</button><button class="btn" id="favBtn">${state.fav.includes(p.id)?'♥ お気に入り済み':'♡ お気に入り'}</button><button class="btn" id="shareBtn">共有</button></div></div><h3>クリエイター</h3><button class="btn" onclick="go('creator/${p.creatorId||'c1'}')">${esc(displayText(p.creator)||'Creator')} の販売ページを見る</button></section></div><div id="imageLightbox" class="image-lightbox" hidden><div class="lb-card"><button class="btn lb-close" id="lbClose">× 閉じる</button><div id="lbVisual" class="lb-visual" style="--gc:${gallery[0].c}">${esc(gallery[0].e)}</div></div></div>`);const selectGallery=i=>{gidx=i;const g=gallery[i];$('#pgVisual').style.setProperty('--gc',g.c);$('#pgVisual').textContent=g.e;$('#pgCount').textContent=`${i+1}/${gallery.length}`;$$('.product-thumb').forEach((b,j)=>b.classList.toggle('active',j===i))};$$('.product-thumb').forEach(b=>b.onclick=()=>selectGallery(+b.dataset.gidx));$('#pgMain').onclick=()=>{const g=gallery[gidx];$('#lbVisual').style.setProperty('--gc',g.c);$('#lbVisual').textContent=g.e;$('#imageLightbox').hidden=false};$('#lbClose').onclick=()=>$('#imageLightbox').hidden=true;$('#imageLightbox').onclick=e=>{if(e.target.id==='imageLightbox')e.currentTarget.hidden=true};$('#addCart').onclick=()=>{state.cart.push({id:p.id,name:p.name,price:p.digital||500});save();toast('カートに追加しました')};$('#favBtn').onclick=e=>{e.preventDefault();const y=scrollY;state.fav=state.fav.includes(p.id)?state.fav.filter(x=>x!==p.id):[...state.fav,p.id];save();$('#favBtn').textContent=state.fav.includes(p.id)?'♥ お気に入り済み':'♡ お気に入り';requestAnimationFrame(()=>scrollTo(0,y));toast(state.fav.includes(p.id)?'お気に入りに追加':'お気に入りを解除')};$('#shareBtn').onclick=async()=>{try{if(navigator.share)await navigator.share({title:displayText(p.name)||'Sticker Market',text:'Sticker Marketの商品'});else{await navigator.clipboard?.writeText(location.href);toast('URLをコピーしました')}}catch{}}}function renderCreate(){const draft={file:null,dataUrl:'',shape:'diecut',material:'waterproof',finish:'none',size:50,qty:10,width:0,height:0};const materials={matte:{label:'マット紙',icon:'◯',mult:1},gloss:{label:'光沢紙',icon:'✦',mult:1.05},waterproof:{label:'耐水PET',icon:'💧',mult:1.15},transparent:{label:'透明PET',icon:'◌',mult:1.25},holo:{label:'ホログラム',icon:'◇',mult:1.4},craft:{label:'クラフト紙',icon:'▧',mult:1.1}};const finishes={none:{label:'加工なし',mult:1},matte:{label:'マットラミネート',mult:1.08},gloss:{label:'グロスラミネート',mult:1.1},holo:{label:'ホログラム加工',mult:1.25}};const shapes=[['diecut','ダイカット','✿'],['circle','円形','●'],['square','正方形','■'],['rounded','角丸','▣'],['oval','楕円','⬭'],['heart','ハート','♥'],['star','星','★']];const quote=()=>{const sizeFactor=Math.pow(draft.size/50,1.35),bulk=draft.qty>=500?.48:draft.qty>=100?.62:draft.qty>=50?.72:draft.qty>=20?.84:draft.qty>=10?.92:1;const unit=Math.max(70,Math.round(220*sizeFactor*materials[draft.material].mult*finishes[draft.finish].mult*bulk));const subtotal=unit*draft.qty,shipping=subtotal>=5000?0:350,tax=Math.floor((subtotal+shipping)*.1);return{unit,subtotal,shipping,tax,total:subtotal+shipping+tax}};appShell(`<div class="eyebrow">CUSTOM STICKER</div><h1>オリジナルシールを作る</h1><div class="create-steps"><div class="create-step on"><i></i>1 画像</div><div class="create-step on"><i></i>2 仕様</div><div class="create-step on"><i></i>3 確認・注文</div></div><div class="custom-builder"><div class="custom-left"><section class="panel"><h2>1. 画像をアップロード</h2><div class="upload-zone"><input id="customFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><p class="muted">PNG / JPG / WEBP / SVG。印刷用途では高解像度画像を推奨します。</p></div><div id="qualityBox" class="quality-box">画像を選択すると印刷品質の目安を表示します。</div></section><section class="panel" style="margin-top:14px"><h2>2. 仕様を選択</h2><div class="field"><label>形状</label><div class="choice-grid" id="shapeChoices">${shapes.map(([v,l,ic])=>`<button class="choice ${v===draft.shape?'selected':''}" data-shape="${v}"><b>${ic}</b>${l}</button>`).join('')}</div></div><div class="field"><label>素材</label><div class="choice-grid" id="materialChoices">${Object.entries(materials).map(([v,m])=>`<button class="choice ${v===draft.material?'selected':''}" data-material="${v}"><b>${m.icon}</b>${m.label}</button>`).join('')}</div></div><div class="field"><label>仕上げ加工</label><select id="finishSel">${Object.entries(finishes).map(([v,m])=>`<option value="${v}">${m.label}</option>`).join('')}</select></div><div class="split"><div class="field"><label>サイズ</label><select id="sizeSel">${[30,50,70,100].map(v=>`<option value="${v}" ${v===50?'selected':''}>${v}mm</option>`).join('')}</select></div><div class="field"><label>数量</label><select id="qtySel">${[1,5,10,20,50,100,500,1000].map(v=>`<option value="${v}" ${v===10?'selected':''}>${v}枚</option>`).join('')}</select></div></div></section></div><aside class="custom-right"><div id="customStage" class="custom-stage"><div id="stickerPreview" class="sticker-preview shape-diecut"><div class="empty-art">＋</div></div></div><div class="panel" style="margin-top:12px"><h3>仕上がりイメージ</h3><div class="row"><span>形状</span><b id="sumShape">ダイカット</b></div><div class="row"><span>素材</span><b id="sumMat">耐水PET</b></div><div class="row"><span>サイズ</span><b id="sumSize">50mm</b></div><div class="row"><span>数量</span><b id="sumQty">10枚</b></div><p class="muted">※画面上のプレビューは仕上がりの簡易イメージです。</p></div><div class="quote-card"><div class="row"><span>単価</span><b id="qUnit"></b></div><div class="row"><span>商品小計</span><b id="qSub"></b></div><div class="row"><span>送料</span><b id="qShip"></b></div><div class="row"><span>税</span><b id="qTax"></b></div><div class="row"><span>合計</span><span class="quote-total" id="qTotal"></span></div><button class="btn accent" id="customCart" style="width:100%;margin-top:10px">この仕様でカートに追加</button></div></aside></div>`,{hideSearch:true});const shapeLabel=()=>shapes.find(x=>x[0]===draft.shape)?.[1]||draft.shape;const redraw=()=>{const pr=$('#stickerPreview'),stage=$('#customStage');pr.className=`sticker-preview shape-${draft.shape}`;stage.classList.remove('mat-transparent','mat-holo','mat-craft','finish-gloss','finish-matte','finish-holo');if(draft.material==='transparent')stage.classList.add('mat-transparent');if(draft.material==='holo')stage.classList.add('mat-holo');if(draft.material==='craft')stage.classList.add('mat-craft');if(draft.finish==='gloss')stage.classList.add('finish-gloss');if(draft.finish==='matte')stage.classList.add('finish-matte');if(draft.finish==='holo')stage.classList.add('finish-holo');pr.innerHTML=draft.dataUrl?`<img src="${draft.dataUrl}" alt="アップロード画像">`:'<div class="empty-art">＋</div>';$('#sumShape').textContent=shapeLabel();$('#sumMat').textContent=materials[draft.material].label;$('#sumSize').textContent=`${draft.size}mm`;$('#sumQty').textContent=`${draft.qty}枚`;const q=quote();$('#qUnit').textContent=yen(q.unit);$('#qSub').textContent=yen(q.subtotal);$('#qShip').textContent=yen(q.shipping);$('#qTax').textContent=yen(q.tax);$('#qTotal').textContent=yen(q.total)};$('#customFile').onchange=e=>{const f=e.target.files[0];if(!f)return;draft.file=f;const r=new FileReader();r.onload=()=>{draft.dataUrl=r.result;redraw();if(f.type==='image/svg+xml'){$('#qualityBox').className='quality-box quality-good';$('#qualityBox').textContent=`${f.name}：ベクターデータのため拡大印刷に向いています。`;return}const im=new Image();im.onload=()=>{draft.width=im.naturalWidth;draft.height=im.naturalHeight;const inch=draft.size/25.4,dpi=Math.min(draft.width,draft.height)/inch;const good=dpi>=250;$('#qualityBox').className=`quality-box ${good?'quality-good':'quality-warn'}`;$('#qualityBox').textContent=`${f.name} / ${draft.width}×${draft.height}px / 推定 ${Math.round(dpi)}dpi。${good?'印刷に十分な解像度です。':'推奨300dpiに満たない可能性があります。'}`};im.src=r.result};r.readAsDataURL(f)};$$('[data-shape]').forEach(b=>b.onclick=()=>{draft.shape=b.dataset.shape;$$('[data-shape]').forEach(x=>x.classList.toggle('selected',x===b));redraw()});$$('[data-material]').forEach(b=>b.onclick=()=>{draft.material=b.dataset.material;$$('[data-material]').forEach(x=>x.classList.toggle('selected',x===b));redraw()});$('#finishSel').onchange=e=>{draft.finish=e.target.value;redraw()};$('#sizeSel').onchange=e=>{draft.size=+e.target.value;redraw()};$('#qtySel').onchange=e=>{draft.qty=+e.target.value;redraw()};$('#customCart').onclick=()=>{if(!draft.file){toast('先に画像を選択してください');return}const q=quote();state.cart.push({id:'custom'+Date.now(),name:`オリジナルシール / ${shapeLabel()} / ${materials[draft.material].label} / ${draft.size}mm × ${draft.qty}枚`,price:q.total});save();toast('カートに追加しました');go('cart')};redraw()}function renderFavorites(){appShell(`<h1>お気に入り</h1><div class="grid">${products.filter(p=>state.fav.includes(p.id)).map(p=>productCard(p)).join('')||'<div class="panel">お気に入りはまだありません。</div>'}</div>`)}function renderCart(){const total=state.cart.reduce((a,x)=>a+(x.price||0),0);appShell(`<div class="eyebrow">CART</div><h1>カート</h1><div class="split"><section class="panel">${state.cart.length?state.cart.map((x,i)=>`<div class="row"><span>${esc(x.name)}</span><span>${yen(x.price)} <button class="btn" onclick="state.cart.splice(${i},1);save();renderCart()">削除</button></span></div>`).join(''):'カートは空です'}</section><section class="panel"><div class="row"><span>商品合計</span><b>${yen(total)}</b></div><div class="row"><span>送料</span><b>${total?yen(350):yen(0)}</b></div><div class="row"><span>税</span><b>${yen(Math.floor((total+(total?350:0))*.1))}</b></div><button class="btn accent" id="payBtn" ${!total?'disabled':''}>模擬決済へ</button></section></div>`);if(total)$('#payBtn').onclick=()=>{state.orders.unshift({id:'ORD-'+Date.now().toString().slice(-6),total,status:'決済完了',date:new Date().toLocaleDateString('ja-JP')});state.cart=[];save();toast('模擬決済が完了しました');go('orders')}}function renderOrders(){appShell(`<h1>注文履歴</h1><section class="panel">${state.orders.length?state.orders.map(o=>`<div class="row"><div><b>${o.id}</b><div class="muted">${o.date}</div></div><div>${yen(o.total)}<br><span class="badge">${o.status}</span></div></div>`).join(''):'注文履歴はありません'}</section>`)}function renderAccount(){if(!state.user){go('login');return}appShell(`<button class="btn" onclick="history.length>1?history.back():go('home')">× 閉じる</button><h1>アカウント</h1><section class="panel"><div class="row"><span>表示名</span><b>${esc(state.user.name)}</b></div><div class="row"><span>メール</span><b>${esc(state.user.email)}</b></div><div class="row"><span>権限</span><b>${state.user.role}</b></div><div class="rowBtns"><button class="btn" onclick="go('settings')">設定</button><button class="btn" onclick="go('orders')">注文履歴</button><button class="btn danger" onclick="go('logout')">ログアウト</button></div></section>`)}function renderLogout(){appShell(`<section class="panel" style="max-width:520px;margin:auto"><h1>ログアウト</h1><p>このアカウントからログアウトしますか？</p><div class="rowBtns"><button class="btn" onclick="go('account')">キャンセル</button><button class="btn danger" id="logoutDo">ログアウトする</button></div></section>`);$('#logoutDo').onclick=()=>{state.user=null;save();go('landing')}}let settingsDraft=null;function renderSettings(){settingsDraft=JSON.parse(JSON.stringify(state.settings));appShell(`<h1>設定</h1><div class="tree"><details><summary>表示・アクセシビリティ</summary><div class="treebody"><div class="field"><label>テーマ</label><select id="setTheme"><option value="system">端末設定</option><option value="light">ライト</option><option value="dark">ダーク</option></select></div><div class="field"><label>フォントサイズ</label><select id="setSize"><option value="90">小</option><option value="100">標準</option><option value="115">大</option><option value="130">特大</option></select></div><div class="field"><label>アクセントカラー</label><p class="muted">主要ボタン、選択中の項目、通知バッジなどの強調色に適用します。</p><div class="chip-wrap">${['#ff5d72','#4d8dff','#31a36d','#9b64db','#f08b35'].map(c=>`<button class="chip" data-accent="${c}" style="border-color:${c}">${c}</button>`).join('')}</div><button class="btn accent" style="margin-top:8px">プレビュー：主要ボタン</button></div></div></details><details><summary>言語</summary><div class="treebody"><select id="setLang"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="ko">한국어</option></select></div></details><details><summary>通知</summary><div class="treebody">注文・発送・フォロー通知を管理します。</div></details><details><summary>プライバシー</summary><div class="treebody">閲覧履歴・レコメンド設定を管理します。</div></details></div><div class="savebar"><span class="muted" id="unsaved">変更後に「変更する」を押してください</span><button class="btn" id="settingCancel">キャンセル</button><button class="btn accent" id="settingSave">変更する</button></div>`);$('#setTheme').value=settingsDraft.theme;$('#setSize').value=String(settingsDraft.fontSize);$('#setLang').value=settingsDraft.lang;$('#setTheme').onchange=e=>settingsDraft.theme=e.target.value;$('#setSize').onchange=e=>settingsDraft.fontSize=+e.target.value;$('#setLang').onchange=e=>settingsDraft.lang=e.target.value;$$('[data-accent]').forEach(b=>b.onclick=()=>{settingsDraft.accent=b.dataset.accent;$$('[data-accent]').forEach(x=>x.classList.toggle('selected',x===b))});$('#settingCancel').onclick=()=>{settingsDraft=JSON.parse(JSON.stringify(state.settings));toast('変更を破棄しました');renderSettings()};$('#settingSave').onclick=()=>{state.settings=settingsDraft;save();toast('設定を変更しました');renderSettings()}}function renderCreator(id){const c=creators.find(x=>x.id===id)||creators[0];appShell(`<section class="panel"><div class="creator-avatar">${esc(c.name[0])}</div><h1>${esc(c.name)}</h1><p>${esc(c.genre)}</p><b>${esc(c.followers)}</b> followers</section><h2>販売中の商品</h2><div class="grid">${products.filter(p=>p.creatorId===c.id).slice(0,8).map(p=>productCard(p)).join('')}</div>`)}function renderCreatorDash(){appShell(`<h1>クリエイターダッシュボード</h1><div class="kpis"><div class="panel kpi"><b>¥45,300</b>今月売上</div><div class="panel kpi"><b>320</b>ダウンロード</div><div class="panel kpi"><b>1,248</b>お気に入り</div><div class="panel kpi"><b>${state.created.length}</b>登録商品</div></div><div class="rowBtns" style="margin-top:16px"><button class="btn accent" onclick="go('sell')">新しい商品を販売</button><button class="btn" onclick="go('creator/c1')">自分の販売ページを見る</button></div>`)}function renderSell(){appShell(`<h1>商品を販売</h1><div class="stepper">${['デザイン','基本情報','検索設定','販売設定','確認'].map((x,i)=>`<div class="step-item ${sellDraft.step>=i+1?'on':''}"><div class="step-line"></div>${i+1} ${x}</div>`).join('')}</div><section class="panel" id="sellBody"></section><div class="rowBtns" style="margin-top:12px"><button class="btn" id="sellPrev">戻る</button><button class="btn accent" id="sellNext">次へ</button></div>`);drawSellStep()}function drawSellStep(){const b=$('#sellBody');if(sellDraft.step===1)b.innerHTML=`<h2>STEP 1：デザイン登録</h2><div class="split"><div><h3>公開用商品画像</h3><div class="upload-zone"><input id="publicImages" type="file" accept="image/png,image/jpeg,image/svg+xml" multiple></div></div><div><h3>購入者限定販売データ</h3><div class="upload-zone"><input id="saleFiles" type="file" accept="image/png,image/jpeg,image/svg+xml,application/pdf,.zip" multiple></div></div></div>`;if(sellDraft.step===2)b.innerHTML=`<h2>STEP 2：基本情報</h2><div class="field"><label>商品名</label><input id="sellName" value="${esc(sellDraft.name)}"></div><div class="field"><label>商品説明</label><textarea id="sellDesc">${esc(sellDraft.description)}</textarea></div><div class="field"><label>カテゴリ</label><select id="sellCat"><option>アート</option><option>動物・ペット</option><option>アウトドア</option></select></div>`;if(sellDraft.step===3)b.innerHTML=`<h2>STEP 3：検索設定</h2><div class="field"><label>検索タグ</label><input id="tagInput" placeholder="星空, 山, 夜"><div class="chip-wrap" style="margin-top:8px">${['星空','山','夜','青','キャンプ','風景'].map(t=>`<button class="chip" data-tag="${t}">${t}</button>`).join('')}</div></div><div class="field"><label>検索用キーワード</label><input id="kwInput" placeholder="夜景 星空 山岳 アウトドア"></div><div class="field"><label>色タグ</label><div class="chip-wrap">${['黒','白','赤','青','緑','黄','ピンク','紫'].map(t=>`<button class="chip">${t}</button>`).join('')}</div></div>`;if(sellDraft.step===4)b.innerHTML=`<h2>STEP 4：販売設定</h2><div class="field"><label>販売価格</label><input id="sellPrice" type="number" value="${sellDraft.price}"></div><div class="split"><div class="field"><label>おすすめ素材（任意）</label><select id="recMat"><option value="">設定しない</option><option>耐水PET</option><option>透明PET</option><option>上質紙</option></select></div><div class="field"><label>おすすめ形状（任意）</label><select id="recShape"><option value="">設定しない</option><option>ダイカット</option><option>円形</option><option>角丸</option></select></div></div>`;if(sellDraft.step===5)b.innerHTML=`<h2>STEP 5：確認・審査申請</h2><p><b>${esc(sellDraft.name||'商品名未入力')}</b></p><p>${esc(sellDraft.description||'説明未入力')}</p><button class="btn accent" id="submitSell">審査申請</button>`;$('#sellPrev').disabled=sellDraft.step===1;$('#sellNext').textContent=sellDraft.step===5?'完了':'次へ';$('#sellPrev').onclick=()=>{collectSellStep();sellDraft.step--;renderSell()};$('#sellNext').onclick=()=>{collectSellStep();if(sellDraft.step<5){sellDraft.step++;renderSell()}else go('creatorDash')};$('#publicImages')&&($('#publicImages').onchange=e=>sellDraft.images=[...e.target.files].map(f=>f.name));$('#saleFiles')&&($('#saleFiles').onchange=e=>sellDraft.saleFiles=[...e.target.files].map(f=>f.name));$$('[data-tag]').forEach(x=>x.onclick=()=>{if(!sellDraft.tags.includes(x.dataset.tag))sellDraft.tags.push(x.dataset.tag);x.classList.add('selected')});$('#submitSell')&&($('#submitSell').onclick=()=>{state.created.push({id:'u'+Date.now(),name:sellDraft.name||'新しい作品',creator:state.user.name,creatorId:'c1',category:sellDraft.category,digital:sellDraft.price,physical:sellDraft.price+300,rating:0,favs:0,sales:0,color:'#ffb66e',emoji:'🎨',recommendedMaterial:sellDraft.recommendedMaterial,recommendedShape:sellDraft.recommendedShape});save();toast('審査申請しました');go('creatorDash')})}function collectSellStep(){if(sellDraft.step===2){sellDraft.name=$('#sellName')?.value||sellDraft.name;sellDraft.description=$('#sellDesc')?.value||sellDraft.description;sellDraft.category=$('#sellCat')?.value||sellDraft.category}if(sellDraft.step===3){const t=($('#tagInput')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);sellDraft.tags=[...new Set([...sellDraft.tags,...t])];sellDraft.keywords=($('#kwInput')?.value||'').split(/[,\s]+/).filter(Boolean)}if(sellDraft.step===4){sellDraft.price=+($('#sellPrice')?.value||sellDraft.price);sellDraft.recommendedMaterial=$('#recMat')?.value||'';sellDraft.recommendedShape=$('#recShape')?.value||''}}function renderAdmin(){appShell(`<h1>管理者ダッシュボード</h1><div class="kpis"><div class="panel kpi"><b>1,248</b>ユーザー</div><div class="panel kpi"><b>342</b>今月注文</div><div class="panel kpi"><b>12</b>審査待ち</div><div class="panel kpi"><b>¥1,248,600</b>今月売上</div></div><div class="panel" style="margin-top:14px"><h2>売上推移</h2><svg viewBox="0 0 600 180" style="width:100%;height:220px"><polyline fill="none" stroke="var(--accent)" stroke-width="5" points="20,150 90,130 160,140 230,90 300,105 370,65 440,78 510,35 580,50"/></svg></div><h2>管理メニュー</h2><div class="adminmenu"><button class="btn" onclick="go('admin-review')">商品審査</button><button class="btn" onclick="go('admin-orders')">注文管理</button><button class="btn" onclick="go('admin-users')">ユーザー管理</button><button class="btn" onclick="go('admin-sales')">売上管理</button></div>`)}function adminPage(title,body){if(state.user?.role!=='admin'){go('home');return}appShell(`<button class="btn" onclick="go('admin')">← 管理ダッシュボード</button><h1>${title}</h1>${body}`)}function renderAdminReview(){adminPage('商品審査',`<section class="panel">${['星空ステッカー','花束ラベル','黒猫シール'].map(x=>`<div class="row"><div><b>${x}</b><div class="muted">審査申請中</div></div><div><button class="btn accent" onclick="toast('承認しました')">承認</button> <button class="btn" onclick="toast('差し戻しました')">差し戻し</button></div></div>`).join('')}</section>`)}function renderAdminOrders(){adminPage('注文管理',`<section class="panel"><table class="table"><tr><th>注文</th><th>購入者</th><th>金額</th><th>状態</th></tr><tr><td>ORD-1001</td><td>Demo User</td><td>¥1,903</td><td>発送準備</td></tr><tr><td>ORD-1002</td><td>user02</td><td>¥2,320</td><td>発送済み</td></tr></table></section>`)}function renderAdminUsers(){adminPage('ユーザー管理',`<section class="panel"><table class="table"><tr><th>ユーザー</th><th>権限</th><th>状態</th></tr><tr><td>Demo User</td><td>buyer</td><td>有効</td></tr><tr><td>Haru Creator</td><td>creator</td><td>有効</td></tr></table></section>`)}function renderAdminSales(){adminPage('売上管理',`<div class="kpis"><div class="panel kpi"><b>¥4.8M</b>総売上</div><div class="panel kpi"><b>¥1.2M</b>今月</div><div class="panel kpi"><b>¥620K</b>デジタル</div><div class="panel kpi"><b>¥580K</b>物理</div></div>`)}function route(){closeModal();const [page,id]=(location.hash.slice(2)|| (state.user?'home':'landing')).split('/');if(!state.user&&!['landing','login','signup'].includes(page)){renderLP();return}({landing:renderLP,login:()=>renderLogin(false),signup:()=>renderLogin(true),home:renderHome,search:renderSearch,create:renderCreate,favorites:renderFavorites,cart:renderCart,orders:renderOrders,account:renderAccount,logout:renderLogout,settings:renderSettings,creatorDash:renderCreatorDash,sell:renderSell,admin:renderAdmin,'admin-review':renderAdminReview,'admin-orders':renderAdminOrders,'admin-users':renderAdminUsers,'admin-sales':renderAdminSales}[page]||(()=>page==='product'?renderProduct(id):page==='creator'?renderCreator(id):renderHome))();scrollTo({top:0,behavior:'instant'})}window.onhashchange=route;applySettings();route();
</script></body></html>
