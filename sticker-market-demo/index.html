<!doctype html>
<html lang="ja" data-theme="light">
<head>

<title>Sticker Market — Public Demo v0.3</title>
<style>
:root{--bg:#fff9f5;--card:#fff;--soft:#f6f1ec;--text:#1e1b19;--muted:#746d68;--line:#e6ddd6;--accent:#ff5d72;--fs:1;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}html[data-theme=dark]{--bg:#111214;--card:#1b1d20;--soft:#25272b;--text:#f7f3ef;--muted:#aaa4a0;--line:#37383d}*{box-sizing:border-box}html{font-size:calc(16px * var(--fs))}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.header{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto minmax(180px,460px) auto;gap:15px;align-items:center;padding:12px 18px;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font-weight:900;font-size:20px;letter-spacing:-.04em;cursor:pointer}.searchbar{display:flex;border:1px solid var(--line);background:var(--soft);border-radius:999px;overflow:hidden}.searchbar input{border:0;background:none;outline:0;padding:10px 14px;flex:1}.searchbar button{border:0;background:none;padding:0 14px}.nav{display:flex;gap:4px}.nav button,.btn{border:1px solid var(--line);background:var(--card);padding:10px 12px;border-radius:11px;font-weight:750}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.soft{background:var(--soft)}.count{background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px;font-size:11px}.demo{max-width:1180px;margin:10px auto 0;padding:9px 14px;border:1px solid #f1b7c1;background:#fff0f3;color:#853a48;border-radius:12px;font-size:12px}main{max-width:1180px;margin:auto;padding:20px 16px 100px}.hero{display:grid;grid-template-columns:1.05fr .95fr;min-height:380px;border-radius:24px;overflow:hidden;background:linear-gradient(125deg,#fff0de,#ffdcd4)}html[data-theme=dark] .hero{background:linear-gradient(125deg,#36271f,#2c2022)}.hero-copy{padding:44px 38px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(40px,7vw,70px);line-height:.96;letter-spacing:-.06em;margin:9px 0 16px}.hero p{color:var(--muted);max-width:600px}.hero-art{display:grid;place-items:center;position:relative}.blob{width:220px;height:220px;border:13px solid #fff;border-radius:36% 64% 58% 42%;background:linear-gradient(145deg,#80bfff,#ffc96a);box-shadow:0 20px 55px #0003;display:grid;place-items:center;font-size:68px;transform:rotate(-8deg)}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}.rowBtns,.tabs,.search-actions{display:flex;gap:8px;flex-wrap:wrap}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:30px 0 13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px}.card{overflow:hidden}.art{aspect-ratio:1;display:grid;place-items:center;font-size:58px;background:linear-gradient(145deg,var(--c),var(--soft))}.pad{padding:13px}.pad h3{margin:5px 0}.muted{color:var(--muted)}.price{font-size:19px;font-weight:900}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 6px;font-size:10px;font-weight:850;margin-right:3px}.panel{padding:18px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.search-simple{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px;align-items:end}.sub-searches{display:grid;gap:8px;margin-top:10px}.sub-row{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center}.advanced{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.advanced-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.checks{display:grid;gap:7px;font-size:13px}.hidden{display:none!important}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:22px}.product .art{border-radius:22px;min-height:480px}.empty{text-align:center;padding:60px 18px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:90;background:#191919;color:#fff;padding:11px 16px;border-radius:999px;box-shadow:0 12px 35px #0004}.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0008;padding:18px}.modal[hidden]{display:none}.modal-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}.settings{display:grid;grid-template-columns:270px 1fr;gap:18px}.tree{display:grid;gap:8px}.tree details{border:1px solid var(--line);border-radius:12px;overflow:hidden}.tree summary{padding:13px;font-weight:850;cursor:pointer;list-style:none}.tree summary:after{content:'＋';float:right}.tree details[open] summary:after{content:'−'}.tree-body{border-top:1px solid var(--line);padding:12px}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}.creatorHero{display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center}.avatar{width:92px;height:92px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:34px;font-weight:900}.steps{display:flex;gap:6px;margin:14px 0}.step{height:6px;flex:1;background:var(--line);border-radius:99px}.step.on{background:var(--accent)}.footer{border-top:1px solid var(--line);max-width:1180px;margin:auto;padding:30px 16px 90px;display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:22px;color:var(--muted)}.footer b{color:var(--text)}.footer span{display:block;margin:6px 0;font-size:13px}.mobile{display:none}
@media(max-width:860px){.header{grid-template-columns:1fr auto}.searchbar{grid-column:1/-1;grid-row:2}.nav button[data-hide]{display:none}.hero,.product,.split,.settings{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.search-simple{grid-template-columns:1fr 1fr}.search-simple .keyword{grid-column:1/-1}.advanced-grid{grid-template-columns:1fr 1fr}.creatorHero{grid-template-columns:70px 1fr}.avatar{width:70px;height:70px}.creatorHero>.btn{grid-column:1/-1}.mobile{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.mobile button{border:0;background:none;font-size:10px}.mobile b{display:block;font-size:19px}.footer{grid-template-columns:1fr 1fr}.product .art{min-height:auto}}
</style></head>
<body>
<header class="header"><div class="brand" onclick="nav('market')">Sticker Market</div><div class="searchbar"><input id="globalQ" placeholder="キーワードで検索"><button id="globalGo">⌕</button></div><nav class="nav"><button data-hide onclick="nav('search')">探す</button><button data-hide onclick="guardNav('create')">作る</button><button data-hide onclick="guardNav('creator')">出品</button><button data-hide onclick="nav('settings')">設定</button><button id="account">ログイン</button><button onclick="nav('cart')">カート <span class="count" id="cartCount">0</span></button></nav></header>
<div class="demo">GitHub公開操作デモ v0.3 — 検索UX、ログイン制御、設定ツリー、クリエイター販売ページを追加。</div><main id="app"></main>
<footer class="footer"><div><b>Sticker Market</b><span>デザインデータとシールを、探す・買う・作る・売る。</span></div><div><b>サービス</b><span>シールを探す</span><span>オリジナルシールを作る</span><span>出品する</span></div><div><b>サポート</b><span>ご利用ガイド</span><span>お問い合わせ</span><span>返品・返金</span></div><div><b>法務・安全</b><span>利用規約</span><span>プライバシーポリシー</span><span>セキュリティポリシー</span><span>特商法表記</span></div></footer>
<nav class="mobile"><button onclick="nav('market')"><b>⌂</b>ホーム</button><button onclick="nav('search')"><b>⌕</b>探す</button><button onclick="guardNav('create')"><b>＋</b>作る</button><button onclick="guardNav('favorites')"><b>♡</b>お気に入り</button><button onclick="nav('settings')"><b>⚙</b>設定</button></nav>
<div id="toast" class="toast" hidden></div><div id="loginModal" class="modal" hidden><div class="modal-card"><div class="eyebrow">Login required</div><h2>ログインが必要です</h2><p class="muted">この機能を利用するにはログインしてください。</p><div class="rowBtns"><button class="btn" id="modalCancel">キャンセル</button><button class="btn accent" id="modalLogin">ログインする</button></div></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$('#app'),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const products=Array.from({length:24},(_,i)=>({id:'p'+(i+1),name:['Night Bloom','Tiny Signal','Paper Orbit','Daily Label','Quiet Beast','Soft Geometry'][i%6]+' '+(i+1),creator:['Haru Shapes','Mono Garden','Tiny Orbit'][i%3],creatorId:['c1','c2','c3'][i%3],category:['アート','植物','動物','仕事'][i%4],material:['耐水PET','上質紙','透明PET','クラフト紙'][i%4],use:['PC','スマホ','屋外','梱包'][i%4],shape:['自由形','円形','四角','角丸'][i%4],rating:4+(i%10)/10,digital:300+(i%5)*80,physical:560+(i%6)*90,ai:i%7===0,color:['#ffb66e','#8ecae6','#cdb4db','#90be6d','#f28482','#84a59d'][i%6]}));
let state={user:JSON.parse(localStorage.getItem('smUser')||'null'),cart:JSON.parse(localStorage.getItem('smCart')||'[]'),fav:JSON.parse(localStorage.getItem('smFav')||'[]'),orders:JSON.parse(localStorage.getItem('smOrders')||'[]'),settings:JSON.parse(localStorage.getItem('smSettings')||'null')||{theme:'system',fontSize:100,font:'system',accent:'#ff5d72',lang:'ja'},created:JSON.parse(localStorage.getItem('smCreated')||'[]')};
function save(){localStorage.setItem('smUser',JSON.stringify(state.user));localStorage.setItem('smCart',JSON.stringify(state.cart));localStorage.setItem('smFav',JSON.stringify(state.fav));localStorage.setItem('smOrders',JSON.stringify(state.orders));localStorage.setItem('smSettings',JSON.stringify(state.settings));localStorage.setItem('smCreated',JSON.stringify(state.created));$('#cartCount').textContent=state.cart.length;$('#account').textContent=state.user?state.user.name:'ログイン';applySettings()}
function toast(m,d=1000){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,d)}function nav(p){location.hash='#/'+p}const protectedPages=new Set(['create','favorites','orders','creator']);function guardNav(p){if(!state.user&&protectedPages.has(p.split('/')[0])){showLogin(p);return}nav(p)}function showLogin(target){$('#loginModal').hidden=false;$('#modalCancel').onclick=()=>$('#loginModal').hidden=true;$('#modalLogin').onclick=()=>{sessionStorage.setItem('afterLogin',target);$('#loginModal').hidden=true;nav('login')}}
function applySettings(){let theme=state.settings.theme;if(theme==='system')theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=theme;document.documentElement.style.setProperty('--fs',state.settings.fontSize/100);document.documentElement.style.setProperty('--accent',state.settings.accent);document.documentElement.style.setProperty('--font',state.settings.font==='serif'?'Georgia,"Noto Serif JP",serif':state.settings.font==='rounded'?'"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",sans-serif':'-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif')}
function card(p){const fav=state.fav.includes(p.id);return `<article class="card"><div class="art" style="--c:${p.color}" onclick="nav('product/${p.id}')">✦</div><div class="pad"><div class="eyebrow">${p.category} · ★${p.rating.toFixed(1)}</div><h3>${esc(p.name)}</h3><span class="badge">DATA</span><span class="badge">STICKER</span>${p.ai?'<span class="badge">AI</span>':''}<div class="muted">${p.creator}</div><div class="row" style="border:0"><b class="price">${yen(Math.min(p.digital,p.physical))}〜</b><button type="button" class="btn soft" data-fav="${p.id}">${fav?'♥':'♡'}</button></div></div></article>`}function bindFav(){$$('[data-fav]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const y=window.scrollY,id=b.dataset.fav,i=state.fav.indexOf(id);i>=0?state.fav.splice(i,1):state.fav.push(id);save();b.textContent=i>=0?'♡':'♥';requestAnimationFrame(()=>window.scrollTo(0,y));toast(i>=0?'お気に入りから削除':'お気に入りに追加')})}
function market(){app.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Design + Sticker Marketplace</div><h1>好きなデザインを、<br>好きなかたちで。</h1><p>データ購入、印刷済みシール、自分の画像からのオリジナル制作まで。</p><div class="rowBtns"><button class="btn accent" onclick="nav('search')">作品を探す</button><button class="btn" onclick="guardNav('create')">オリジナルシールを作る</button></div></div><div class="hero-art"><div class="blob">✦</div></div></section><div class="sectionHead"><div><div class="eyebrow">Trending</div><h2>人気のデザイン</h2></div><button class="btn" onclick="nav('search')">すべて見る</button></div><div class="grid">${products.slice(0,8).map(card).join('')}</div>`;bindFav()}
function searchPage(raw=''){const q=new URLSearchParams(raw),main=q.get('q')||'',subs=[];for(let i=1;i<=5;i++)if(q.get('sub'+i))subs.push({term:q.get('sub'+i),op:q.get('op'+i)||'AND'});let r=[...products];const text=(p,t)=>[p.name,p.creator,p.category,p.material,p.use,p.shape].join(' ').toLowerCase().includes(t.toLowerCase());if(main)r=r.filter(p=>text(p,main));subs.forEach(s=>{if(s.op==='AND')r=r.filter(p=>text(p,s.term));else{const ids=new Set(r.map(p=>p.id));products.filter(p=>text(p,s.term)).forEach(p=>ids.add(p.id));r=products.filter(p=>ids.has(p.id))}});['category','material','use','shape'].forEach(k=>{if(q.get(k))r=r.filter(p=>p[k]===q.get(k))});if(q.get('ai')==='exclude')r=r.filter(p=>!p.ai);if(q.get('max'))r=r.filter(p=>Math.min(p.digital,p.physical)<=+q.get('max'));if(q.get('rating'))r=r.filter(p=>p.rating>=+q.get('rating'));if(q.get('sort')==='price')r.sort((a,b)=>Math.min(a.digital,a.physical)-Math.min(b.digital,b.physical));if(q.get('sort')==='rating')r.sort((a,b)=>b.rating-a.rating);const adv=q.get('advanced')==='1';app.innerHTML=`<div class="eyebrow">Marketplace</div><h1>シールを探す</h1><section class="panel"><form id="searchForm"><div class="search-simple"><div class="field keyword"><label>キーワード</label><input name="q" value="${esc(main)}" placeholder="例：防水 青 かわいい"></div><div class="field"><label>カテゴリ</label><select name="category"><option value="">すべて</option>${['アート','植物','動物','仕事'].map(x=>`<option ${q.get('category')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>素材</label><select name="material"><option value="">すべて</option>${['耐水PET','上質紙','透明PET','クラフト紙'].map(x=>`<option ${q.get('material')===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn primary">検索</button></div><div class="search-actions"><button type="button" class="btn soft" id="addSub">＋ サブ検索バーを追加する</button><button type="button" class="btn" id="toggleAdvanced">${adv?'詳細検索を閉じる':'詳細検索'}</button><button type="button" class="btn" id="clearSearch">クリア</button></div><div id="subs" class="sub-searches">${subs.map((s,i)=>`<div class="sub-row"><select name="op${i+1}"><option ${s.op==='AND'?'selected':''}>AND</option><option ${s.op==='OR'?'selected':''}>OR</option></select><input name="sub${i+1}" value="${esc(s.term)}" placeholder="追加キーワード"><button type="button" class="btn removeSub">削除</button></div>`).join('')}</div><div id="advanced" class="advanced ${adv?'':'hidden'}"><input type="hidden" name="advanced" value="${adv?'1':''}"><div class="advanced-grid"><div class="field"><label>用途</label><select name="use"><option value="">すべて</option>${['PC','スマホ','屋外','梱包'].map(x=>`<option ${q.get('use')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>形状</label><select name="shape"><option value="">すべて</option>${['自由形','円形','四角','角丸'].map(x=>`<option ${q.get('shape')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>価格上限</label><select name="max"><option value="">指定なし</option><option value="500">¥500</option><option value="1000">¥1,000</option><option value="3000">¥3,000</option></select></div><div class="field"><label>評価</label><select name="rating"><option value="">指定なし</option><option value="4.5">★4.5以上</option><option value="4">★4以上</option></select></div><div class="field"><label>並び順</label><select name="sort"><option value="new">新着順</option><option value="price">価格順</option><option value="rating">評価順</option></select></div><div class="checks"><label><input type="checkbox" name="ai" value="exclude" ${q.get('ai')==='exclude'?'checked':''}> AI生成を除外</label><label><input type="checkbox"> 防水</label><label><input type="checkbox"> 即納</label></div></div></div></form></section><div class="sectionHead"><div><b>${r.length}件</b><div class="muted">必要なときだけ詳細条件を展開できます</div></div></div><div class="grid">${r.map(card).join('')||'<div class="empty">該当商品がありません</div>'}</div>`;let n=subs.length;$('#addSub').onclick=()=>{if(n>=5)return toast('サブ検索は最大5件です');n++;const d=document.createElement('div');d.className='sub-row';d.innerHTML=`<select name="op${n}"><option>AND</option><option>OR</option></select><input name="sub${n}" placeholder="追加キーワード"><button type="button" class="btn removeSub">削除</button>`;$('#subs').appendChild(d);d.querySelector('.removeSub').onclick=()=>d.remove()};$$('.removeSub').forEach(b=>b.onclick=()=>b.closest('.sub-row').remove());$('#toggleAdvanced').onclick=()=>{const a=$('#advanced'),open=a.classList.contains('hidden');a.classList.toggle('hidden',!open);a.querySelector('[name=advanced]').value=open?'1':'';$('#toggleAdvanced').textContent=open?'詳細検索を閉じる':'詳細検索'};$('#clearSearch').onclick=()=>nav('search');$('#searchForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),sp=new URLSearchParams();for(const [k,v] of f)if(v)sp.set(k,v);location.hash='#/search?'+sp.toString()};bindFav();if(raw)toast(`${r.length}件見つかりました`,1000)}
function detail(id){const p=products.find(x=>x.id===id);if(!p)return market();app.innerHTML=`<div class="product"><div class="art" style="--c:${p.color}">✦</div><section><div class="eyebrow">${p.category} / ${p.creator}</div><h1>${p.name}</h1><p class="muted">オリジナルデザイン。データ購入・印刷済み・カスタム注文に対応。</p><p><span class="badge">${p.material}</span><span class="badge">${p.shape}</span><span class="badge">商用利用可</span></p><div class="tabs"><button class="btn primary">データを買う</button><button class="btn">シールを買う</button><button class="btn">仕様を選ぶ</button></div><div class="panel"><div class="row"><span>価格</span><b class="price">${yen(p.digital)}〜</b></div><button class="btn accent" id="addCart">カートに追加</button></div><div class="sectionHead"><h2>クリエイター</h2><button class="btn" onclick="nav('creator-store/${p.creatorId}')">販売ページを見る</button></div></section></div>`;$('#addCart').onclick=()=>{state.cart.push({id:p.id,name:p.name,price:p.digital});save();toast('カートに追加しました')}}
function login(){app.innerHTML=`<div class="split"><section class="panel"><div class="eyebrow">Demo login</div><h1>ログイン</h1><div class="field"><label>役割</label><select id="role"><option value="buyer">購入者</option><option value="creator">クリエイター</option><option value="admin">管理者</option></select></div><button class="btn accent" id="doLogin">デモログイン</button></section><section class="panel"><h2>公開デモ</h2><p class="muted">認証結果はこのSafari内だけに保存されます。</p></section></div>`;$('#doLogin').onclick=()=>{const r=$('#role').value;state.user={role:r,id:r==='creator'?'c1':r,name:r==='creator'?'Haru Shapes':r==='admin'?'管理者':'デモ購入者'};save();toast('ログインしました');const target=sessionStorage.getItem('afterLogin')||'market';sessionStorage.removeItem('afterLogin');setTimeout(()=>nav(target),300)}}
function createSticker(){app.innerHTML=`<div class="eyebrow">Custom studio</div><h1>オリジナルシールを作る</h1><div class="split"><section class="panel"><div id="preview" class="art" style="--c:#ffcf8a">画像プレビュー</div><div class="field"><label>画像ファイル</label><input id="file" type="file" accept="image/png,image/jpeg,image/svg+xml,application/pdf"></div></section><section class="panel"><div class="field"><label>サイズ</label><select id="size"><option>30mm</option><option selected>50mm</option><option>70mm</option></select></div><div class="field"><label>素材</label><select id="mat"><option>耐水PET</option><option>上質紙</option><option>透明PET</option></select></div><div class="field"><label>数量</label><select id="qty"><option>10</option><option>50</option><option>100</option></select></div><div class="row"><span>見積</span><b class="price" id="quote">¥2,680</b></div><button class="btn accent" id="customCart">カートへ追加</button></section></div>`;$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>$('#preview').innerHTML=`<img src="${r.result}" style="max-width:90%;max-height:90%">`;r.readAsDataURL(f)}toast('ファイルを読み込みました')};const quote=()=>{$('#quote').textContent=yen((+$('#qty').value||10)*220+480)};$('#qty').onchange=quote;$('#customCart').onclick=()=>{state.cart.push({id:'custom-'+Date.now(),name:'オリジナルシール',price:(+$('#qty').value||10)*220+480});save();toast('カートに追加しました')}}
function favorites(){const ps=products.filter(p=>state.fav.includes(p.id));app.innerHTML=`<div class="eyebrow">Favorites</div><h1>お気に入り</h1><div class="grid">${ps.map(card).join('')||'<div class="empty">お気に入りはまだありません</div>'}</div>`;bindFav()}
function cart(){const total=state.cart.reduce((a,x)=>a+x.price,0);app.innerHTML=`<div class="eyebrow">Cart</div><h1>カート</h1><section class="panel">${state.cart.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b></div><div>${yen(x.price)} <button class="btn" data-del="${i}">削除</button></div></div>`).join('')||'<div class="empty">カートは空です</div>'}${state.cart.length?`<div class="row"><span>合計</span><b class="price">${yen(total)}</b></div><button class="btn accent" id="order">模擬注文する</button>`:''}</section>`;$$('[data-del]').forEach(b=>b.onclick=()=>{state.cart.splice(+b.dataset.del,1);save();cart()});if($('#order'))$('#order').onclick=()=>{if(!state.user)return showLogin('cart');state.orders.unshift({id:'ORD-'+Date.now().toString().slice(-6),total});state.cart=[];save();toast('模擬注文が完了しました');setTimeout(()=>guardNav('orders'),300)}}
function orders(){app.innerHTML=`<div class="eyebrow">Orders</div><h1>注文履歴</h1><section class="panel">${state.orders.map(o=>`<div class="row"><b>${o.id}</b><span>${yen(o.total)} / 注文確定</span></div>`).join('')||'<div class="empty">注文はありません</div>'}</section>`}
function creator(){let step=1,d={};app.innerHTML=`<div class="eyebrow">Creator dashboard</div><h1>出品管理</h1><div class="rowBtns"><button class="btn accent" onclick="nav('creator-store/${state.user.id||'c1'}')">自分の販売ページを見る</button></div><div class="split" style="margin-top:14px"><section class="panel"><div class="steps">${[1,2,3,4,5].map(x=>`<span class="step"></span>`).join('')}</div><div id="creatorStep"></div></section><aside class="panel"><h3>商品プレビュー</h3><div class="art" style="--c:#ffbd75">✦</div><h3 id="pv">商品名</h3></aside></div>`;function draw(){$$('.step').forEach((x,i)=>x.classList.toggle('on',i<step));const e=$('#creatorStep');if(step===1)e.innerHTML=`<h2>STEP 1 基本情報</h2><div class="field"><label>商品名</label><input id="cName" value="${esc(d.name||'')}"></div><div class="field"><label>説明</label><textarea id="cDesc"></textarea></div><button class="btn primary" id="next">次へ</button>`;else if(step===2)e.innerHTML=`<h2>STEP 2 画像・販売形式</h2><div class="checks"><label><input type="checkbox" checked> データ販売</label><label><input type="checkbox" checked> シール販売</label></div><div class="rowBtns"><button class="btn" id="back">戻る</button><button class="btn primary" id="next">次へ</button></div>`;else if(step===3)e.innerHTML=`<h2>STEP 3 仕様</h2><div class="field"><label>素材</label><select><option>耐水PET</option><option>上質紙</option></select></div><div class="rowBtns"><button class="btn" id="back">戻る</button><button class="btn primary" id="next">次へ</button></div>`;else if(step===4)e.innerHTML=`<h2>STEP 4 価格</h2><div class="field"><label>販売価格</label><input id="cPrice" type="number" value="900"></div><div class="notice">販売価格から原価・手数料を差し引いた収益目安を表示します。</div><div class="rowBtns"><button class="btn" id="back">戻る</button><button class="btn primary" id="next">次へ</button></div>`;else e.innerHTML=`<h2>STEP 5 確認・審査申請</h2><p><b>${esc(d.name||'名称未設定')}</b></p><button class="btn" id="back">戻る</button> <button class="btn accent" id="submit">審査申請する</button>`;if($('#cName'))$('#cName').oninput=x=>$('#pv').textContent=x.target.value||'商品名';if($('#back'))$('#back').onclick=()=>{step--;draw()};if($('#next'))$('#next').onclick=()=>{if(step===1){d.name=$('#cName').value;if(!d.name)return toast('商品名を入力してください')}step++;draw()};if($('#submit'))$('#submit').onclick=()=>{state.created.push({name:d.name||'新商品'});save();toast('審査申請しました')}}draw()}
function creatorStore(id){const names={c1:'Haru Shapes',c2:'Mono Garden',c3:'Tiny Orbit'},name=names[id]||'Creator',ps=products.filter(p=>p.creatorId===id);app.innerHTML=`<div class="eyebrow">Creator storefront</div><h1>クリエイター販売ページ</h1><section class="panel creatorHero"><div class="avatar">${name[0]}</div><div><h2>${name}</h2><p class="muted">オリジナルデザインとシールを販売しています。</p><div class="tabs"><button class="btn primary">商品 ${ps.length}</button><button class="btn">プロフィール</button><button class="btn">レビュー</button></div></div><button class="btn accent" onclick="toast('フォローしました')">フォロー</button></section><div class="sectionHead"><h2>販売中の商品</h2></div><div class="grid">${ps.map(card).join('')}</div>`;bindFav()}
function settings(){const s=state.settings;app.innerHTML=`<div class="eyebrow">Settings</div><h1>設定</h1><div class="settings"><aside class="panel"><div class="tree"><details open><summary>表示・アクセシビリティ</summary><div class="tree-body"><button class="btn" data-set="appearance">テーマ・文字・色</button></div></details><details><summary>言語</summary><div class="tree-body"><button class="btn" data-set="language">表示言語・翻訳</button></div></details><details><summary>通知</summary><div class="tree-body muted">注文・発送・フォロー通知</div></details><details><summary>プライバシー</summary><div class="tree-body"><button class="btn" data-set="privacy">履歴・初期化</button></div></details></div></aside><section class="panel" id="settingContent"></section></div>`;let page='appearance';function draw(){if(page==='appearance')$('#settingContent').innerHTML=`<h2>表示・アクセシビリティ</h2><div class="field"><label>テーマ</label><select id="theme"><option value="system">端末設定</option><option value="light">ライト</option><option value="dark">ダーク</option></select></div><div class="field"><label>フォントサイズ <span id="fv">${s.fontSize}%</span></label><input id="fontSize" type="range" min="80" max="150" step="10" value="${s.fontSize}"></div><div class="field"><label>フォントスタイル</label><select id="font"><option value="system">標準</option><option value="rounded">丸ゴシック</option><option value="serif">明朝</option></select></div><div class="field"><label>カラーパレット</label><div class="swatches">${['#ff5d72','#ff7a45','#2f80ed','#7c5cff','#14a67b'].map(c=>`<button class="swatch" data-color="${c}" style="background:${c}"></button>`).join('')}</div></div>`;else if(page==='language')$('#settingContent').innerHTML=`<h2>言語</h2><div class="field"><label>使用言語</label><select id="lang"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="ko">한국어</option></select></div><label><input type="checkbox" checked> 商品説明を自動翻訳表示する（デモ）</label>`;else $('#settingContent').innerHTML=`<h2>プライバシー</h2><button class="btn" onclick="toast('閲覧履歴を削除しました')">閲覧履歴を削除</button>`;bind()}function bind(){if($('#theme')){$('#theme').value=s.theme;$('#font').value=s.font;$('#theme').onchange=e=>{s.theme=e.target.value;save()};$('#fontSize').oninput=e=>{s.fontSize=+e.target.value;$('#fv').textContent=s.fontSize+'%';save()};$('#font').onchange=e=>{s.font=e.target.value;save()};$$('[data-color]').forEach(b=>b.onclick=()=>{s.accent=b.dataset.color;save()})}if($('#lang')){$('#lang').value=s.lang;$('#lang').onchange=e=>{s.lang=e.target.value;save()}}}$$('[data-set]').forEach(b=>b.onclick=()=>{page=b.dataset.set;draw()});draw()}
function route(){const raw=location.hash.slice(2)||'market',path=raw.split('?')[0],qs=raw.includes('?')?raw.split('?')[1]:'',parts=path.split('/'),page=parts[0];if(protectedPages.has(page)&&!state.user){showLogin(raw);history.replaceState(null,'',location.pathname+location.search+'#/market');return market()}if(page==='market')market();else if(page==='search')searchPage(qs);else if(page==='product')detail(parts[1]);else if(page==='login')login();else if(page==='create')createSticker();else if(page==='favorites')favorites();else if(page==='cart')cart();else if(page==='orders')orders();else if(page==='creator')creator();else if(page==='creator-store')creatorStore(parts[1]);else if(page==='settings')settings();else market()}
$('#account').onclick=()=>state.user?(()=>{state.user=null;save();toast('ログアウトしました');nav('market')})():nav('login');$('#globalGo').onclick=()=>nav('search?q='+encodeURIComponent($('#globalQ').value));$('#globalQ').onkeydown=e=>{if(e.key==='Enter')$('#globalGo').click()};window.addEventListener('hashchange',route);save();route();
</script></body></html>
