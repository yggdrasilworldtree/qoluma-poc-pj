>$('#uns').classList.remove('hidden');['th','sz','fo','lang','nt','hs'].forEach(id=>$('#'+id).onchange=()=>{SD.theme=$('#th').value;SD.size=+$('#sz').value;SD.font=$('#fo').value;SD.lang=$('#lang').value;SD.notify=$('#nt').checked;SD.history=$('#hs').checked;mark()});$$('.sw').forEach(b=>b.onclick=()=>{SD.accent=b.dataset.c;$$('.sw').forEach(x=>x.classList.toggle('on',x===b));$('#pv').style.background=SD.accent;$('#pv').style.borderColor=SD.accent;$('#pb').style.background=SD.accent;$('#pb').style.color='white';mark()});$('#cancel').onclick=settings;$('#save').onclick=()=>{S.settings=structuredClone(SD);save();toast('設定を変更しました');settings()}}function creatorPage(id){let c=C.find(x=>x.id===id)||C[0],ps=P.filter(p=>p.cid===c.id).concat(S.created.filter(p=>p.cid===c.id));app(`<section class="panel"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${c.a}</div><div><h1>${c.name}</h1><div class="muted">${c.g} / ${c.f} followers</div></div></div></section><h2>販売中の作品</h2><div class="grid">${ps.map(prod).join('')}</div>`)}function creatorDash(){app(`<h1>クリエイターダッシュボード</h1><div class="kpis"><div class="panel kpi"><b>¥45,300</b>今月売上</div><div class="panel kpi"><b>320</b>ダウンロード</div><div class="panel kpi"><b>1,248</b>お気に入り</div><div class="panel kpi"><b>${S.created.length}</b>登録商品</div></div><div class="split" style="margin-top:14px"><section class="panel"><h2>販売中</h2>${P.filter(p=>p.cid==='c1').slice(0,4).map(p=>`<div class="row"><span>${p.e} ${p.name}</span><b>${p.sales}</b></div>`).join('')}</section><section class="panel"><h2>メニュー</h2><div class="buttons"><button class="btn" onclick="go('sell')">商品を登録</button><button class="btn" onclick="go('creator/c1')">販売ページを見る</button></div></section></div>`)}function stepbar(){return `<div class="steps">${['デザイン','基本情報','検索設定','販売設定','確認・申請'].map((x,i)=>`<div class="step ${SELL.step>=i+1?'on':''}"><i></i><b>STEP ${i+1}</b><div>${x}</div></div>`).join('')}</div>`}function sell(){app(`<h1>商品を販売する</h1><p class="muted">デザイン登録から審査申請まで順番に進めます。</p><section class="panel">${stepbar()}<div id="sellbody"></div><div class="buttons" style="justify-content:space-between;margin-top:16px"><button class="btn" id="prev">← 戻る</button><button class="btn accent" id="next">次へ →</button></div></section>`);drawSell();$('#prev').onclick=()=>{if(SELL.step>1){collect();SELL.step--;drawSell()}};$('#next').onclick=()=>{collect();if(SELL.step<5){SELL.step++;drawSell()}else submitSell()}}function drawSell(){$$('.step').forEach((x,i)=>x.classList.toggle('on',SELL.step>=i+1));let b=$('#sellbody');if(SELL.step===1)b.innerHTML=`<h2>STEP 1：デザイン登録</h2><div class="split"><div><h3>公開用商品画像</h3><p class="muted">商品ページで誰でも閲覧できる画像です。</p><div class="upload"><input id="imgs" type="file" accept="image/*" multiple></div><div class="previews" id="ip">${SELL.imgs.map((f,i)=>`<div class="preview"><img src="${f.url}"><small>${f.name}</small><button class="btn" onclick="SELL.imgs.splice(${i},1);drawSell()">削除</button></div>`).join('')}</div></div><div><h3>購入者限定の販売データ</h3><p class="muted">購入済みユーザーへ渡す元データです。</p><div class="upload"><input id="files" type="file" accept="image/*,application/pdf,.zip" multiple></div><div>${SELL.files.map((f,i)=>`<div class="file"><span>📦 ${f.name}<br><small>${(f.size/1024/1024).toFixed(2)}MB</small></span><button class="btn" onclick="SELL.files.splice(${i},1);drawSell()">削除</button></div>`).join('')}</div></div></div>`;if(SELL.step===2)b.innerHTML=`<h2>STEP 2：基本情報</h2><div class="field"><label>商品名</label><input id="sn" value="${esc(SELL.name)}"></div><div class="field"><label>商品説明</label><textarea id="sd" rows="7">${esc(SELL.desc)}</textarea></div><div class="field"><label>カテゴリ</label><select id="sc">${['アート','動物・ペット','アウトドア','かわいい','和風','ビジネス'].map(x=>`<option ${x===SELL.cat?'selected':''}>${x}</option>`).join('')}</select></div>`;if(SELL.step===3)b.innerHTML=`<h2>STEP 3：検索設定</h2><div class="field"><label>検索タグ（手入力可）</label><input id="ti" placeholder="例：星空, 山, 夜"><div>${SELL.tags.map(t=>tag(t,'tags (SELL.step===5)b.innerHTML=`<h2>STEP 5：確認・審査申請</h2><div class="split"><div><h3>${SELL.name||'商品名未入力'}</h3><p>${SELL.desc||'説明未入力'}</p>${SELL.tags.map(t=>`<span class="badge">${t}</span>`).join('')}<p><b>価格：</b>${yen(SELL.price)}</p><p><b>おすすめ：</b>${SELL.rm||'なし'} / ${SELL.rs||'なし'}</p></div><div class="panel"><div class="row"><span>公開画像</span><b>${SELL.imgs.length}</b></div><div class="row"><span>販売データ</span><b>${SELL.files.length}</b></div><div class="row"><span>検索タグ</span><b>${SELL.tags.length}</b></div><p class="muted">申請後、管理者が商品内容を審査します。</p></div></div>`;wireSell()}function collect(){if(SELL.step===2){SELL.name=$('#sn')?.value||SELL.name;SELL.desc=$('#sd')?.value||SELL.desc;SELL.cat=$('#sc')?.value||SELL.cat}if(SELL.step===3)SELL.ai=$('#ai')?.checked||false;if(SELL.step===4){SELL.digital=$('#dig')?.checked||false;SELL.physical=$('#phy')?.checked||false;SELL.license=$('#lic')?.value||SELL.license;SELL.price=+$('#pr')?.value||500;SELL.rm=$('#rm')?.value||'';SELL.rs=$('#rs')?.value||''}}function wireSell(){if(SELL.step===1){$('#imgs').onchange=e=>[...e.target.files].forEach(f=>{let r=new FileReader;r.onload=()=>{SELL.imgs.push({name:f.name,url:r.result});drawSell()};r.readAsDataURL(f)});$('#files').onchange=e=>{[...e.target.files].forEach(f=>SELL.files.push({name:f.name,size:f.size}));drawSell()}}if(SELL.step===3){$('#ti').onfocus=()=>$('#ts').classList.remove('hidden');$('#ki').onfocus=()=>$('#ks').classList.remove('hidden');$('#ti').onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();add($('#ti').value,'tags')}};$('#ki').onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();add($('#ki').value,'keys')}};$$('[data-tag]').forEach(b=>b.onclick=()=>add(b.dataset.tag,'tags'));$$('[data-key]').forEach(b=>b.onclick=()=>add(b.dataset.key,'keys'));$$('[data-color]').forEach(b=>b.onclick=()=>{let t=b.dataset.color,i=SELL.colors.indexOf(t);i<0?SELL.colors.push(t):SELL.colors.splice(i,1);b.classList.toggle('on')});setTimeout(()=>document.addEventListener('click',hideSug,{once:true,capture:true}),0)}}function hideSug(e){if(!e.target.closest('#ti')&&!e.target.closest('#ts'))$('#ts')?.classList.add('hidden');if(!e.target.closest('#ki')&&!e.target.closest('#ks'))$('#ks')?.classList.add('hidden')}function tag(t,a){return `<span class="tag">${t}<button onclick="SELL.${a}=SELL.${a}.filter(x=>x!=='${t}');drawSell()">×</button></span>`}function add(t,a){t=t.trim().replace(/,+$/,'');if(t&&!SELL[a].some(x=>x.toLowerCase()===t.toLowerCase()))SELL[a].push(t);drawSell();setTimeout(()=>$(a==='tags'?'#ti':'#ki')?.focus(),0)}function submitSell(){collect();if(!SELL.name)return toast('商品名を入力してください');S.created.push({id:'u'+Date.now(),name:SELL.name,creator:'Haru Creator',cid:'c1',cat:SELL.cat,rating:0,digital:SELL.price,physical:SELL.price+300,ai:SELL.ai,c:'#ffb3c2',e:'🎨',rm:SELL.rm,rs:SELL.rs,status:'review'});save();SELL={step:1,imgs:[],files:[],name:'',desc:'',cat:'アート',tags:[],keys:[],colors:[],digital:true,physical:true,license:'個人利用・商用利用',price:500,rm:'',rs:'',ai:false};toast('審査申請しました');go('creatorDash')}function admin(){let pending=12+S.created.filter(x=>x.status==='review').length;app(`<h1>管理者ダッシュボード</h1><div class="buttons"><button class="btn" data-p="7">7日</button><button class="btn" data-p="30">30日</button><button class="btn" data-p="90">3か月</button><button class="btn" data-p="365">1年</button></div><div class="kpis" style="margin-top:12px"><div class="panel kpi"><b>1,248</b>ユーザー</div><div class="panel kpi"><b>342</b>今月注文</div><div class="panel kpi"><b>¥1.24M</b>今月売上</div><div class="panel kpi"><b>${pending}</b>審査待ち</div><div class="panel kpi"><b>318</b>公開商品</div><div class="panel kpi"><b>46</b>クリエイター</div><div class="panel kpi"><b>¥3,651</b>平均注文単価</div><div class="panel kpi"><b>18</b>未処理注文</div></div><div class="charts"><section class="panel chart"><div class="row"><b>売上・注文推移</b><span id="period">直近7日</span></div><svg viewBox="0 0 600 190"><polyline fill="none" stroke="var(--a)" stroke-width="5" points="10,160 90,130
