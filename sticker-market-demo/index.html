<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sticker Market v0.4</title><style>:root{--bg:#fffaf6;--card:#fff;--soft:#f5f1ed;--text:#1b1b1d;--muted:#777;--line:#e5ded8;--a:#ff5d72;--fs:1;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}html.dark{--bg:#101113;--card:#191b1e;--soft:#232529;--text:#f7f4f1;--muted:#aaa;--line:#383a3e}*{box-sizing:border-box}html{font-size:calc(16px * var(--fs))}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}button,input,select,textarea{font:inherit;color:inherit}.head{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.brand{font-weight:900;font-size:21px}.search{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:30px;overflow:hidden}.search input{flex:1;border:0;background:none;padding:11px 14px;outline:0}.search button{border:0;background:none;padding:0 15px}.top{display:flex;gap:6px}.btn,.top button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 13px;font-weight:750}.primary{background:var(--text)!important;color:var(--bg)!important}.accent{background:var(--a)!important;color:white!important;border-color:var(--a)!important}.wrap{max-width:1180px;margin:auto;padding:22px 16px 110px}.hero{padding:42px;border-radius:24px;background:linear-gradient(120deg,#ffe8d2,#ffd9dc);margin-bottom:24px}.dark .hero{background:#282125}.hero h1{font-size:clamp(38px,7vw,70px);line-height:.95;margin:8px 0}.muted{color:var(--muted)}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.panel{padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{overflow:hidden}.art{aspect-ratio:1;display:grid;place-items:center;font-size:55px;background:linear-gradient(145deg,var(--c),var(--soft));cursor:pointer}.pad{padding:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.field{margin:12px 0}.field label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:10px;border:1px solid var(--line);padding:4px 7px;border-radius:20px}.mobile{display:none}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:30px;z-index:50}.tree details{border:1px solid var(--line);border-radius:13px;margin:9px 0;overflow:hidden}.tree summary{padding:15px;font-weight:850;cursor:pointer;list-style:none}.tree summary:after{content:'＋';float:right}.tree details[open] summary:after{content:'−'}.treebody{padding:15px;border-top:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--soft);padding:15px;border-radius:13px}.stat b{font-size:25px;display:block}.stepbar{display:flex;gap:5px;margin:15px 0}.stepbar i{height:6px;background:var(--line);flex:1;border-radius:9px}.stepbar i.on{background:var(--a)}.footer{border-top:1px solid var(--line);padding:25px 16px 100px;color:var(--muted);max-width:1180px;margin:auto}.hidden{display:none!important}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:850}@media(max-width:800px){.head{grid-template-columns:1fr auto}.search{grid-column:1/-1;grid-row:2}.top .desk{display:none}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.hero{padding:28px 22px}.mobile{display:flex;position:fixed;z-index:40;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));overflow-x:auto}.mobile button{flex:1;min-width:62px;border:0;background:none;font-size:10px;padding:5px 2px}.mobile b{display:block;font-size:20px}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header class="head"><div class="brand" onclick="go('home')">Sticker Market</div><div class="search"><input id="gq" placeholder="キーワードで検索"><button onclick="globalSearch()">⌕</button></div><div class="top"><button class="desk" onclick="go('search')">探す</button><button id="accountBtn" onclick="accountAction()">ログイン</button><button onclick="go('cart')">カート <span id="cc">0</span></button></div></header><main class="wrap" id="app"></main><footer class="footer">利用規約　｜　プライバシーポリシー　｜　セキュリティポリシー　｜　お問い合わせ　｜　特定商取引法に基づく表記</footer><nav class="mobile" id="mobile"></nav><div id="toast" class="toast hidden"></div><script>const $=s=>document.querySelector(s),app=$('#app'),yen=n=>'¥'+Number(n).toLocaleString('ja-JP');const ps=Array.from({length:20},(_,i)=>({id:i+1,name:['星空ステッカー','黒猫シール','花束ラベル','海のステッカー','山のシール'][i%5]+' '+(i+1),cat:['アート','動物','植物'][i%3],tags:['夜','かわいい','防水',i%2?'青':'ギフト'],price:300+i%5*80,c:['#8ecae6','#f28482','#90be6d','#cdb4db'][i%4]}));let s=JSON.parse(localStorage.sm4||'null')||{user:null,cart:[],fav:[],created:[],settings:{theme:'system',size:100,font:'system',accent:'#ff5d72'}};function save(){localStorage.sm4=JSON.stringify(s);$('#cc').textContent=s.cart.length;$('#accountBtn').textContent=s.user?s.user.name:'ログイン';apply();mobile()}function apply(){let d=s.settings.theme==='dark'||(s.settings.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.classList.toggle('dark',d);document.documentElement.style.setProperty('--fs',s.settings.size/100);document.documentElement.style.setProperty('--a',s.settings.accent)}function toast(x){let e=$('#toast');e.textContent=x;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),1000)}function go(p){let h='#/'+p;if(location.hash===h){route();scrollTo({top:0,behavior:'instant'})}else location.hash=h}function guard(p,roles){if(!s.user){if(confirm('この機能にはログインが必要です。ログイン画面へ移動しますか？'))go('login');return}if(roles&&!roles.includes(s.user.role)){toast('このアカウントでは利用できません');return}go(p)}function accountAction(){s.user?go('account'):go('login')}function mobile(){let a=[['⌂','ホーム',"go('home')"],['⌕','探す',"go('search')"],['＋','作る',"guard('create')"],['♡','お気に入り',"guard('favorites')"]];if(s.user?.role==='admin')a.push(['▦','管理',"go('admin')"]);if(s.user?.role==='creator'){a.push(['▦','管理',"go('creatorDash')"]);a.push(['売','販売',"go('sell')"])}if(s.user)a.push(['⚙','設定',"go('settings')"]);$('#mobile').innerHTML=a.map(x=>`<button onclick="${x[2]}"><b>${x[0]}</b>${x[1]}</button>`).join('')}function card(p){return `<article class="card"><div class="art" style="--c:${p.c}" onclick="go('product/${p.id}')">✦</div><div class="pad"><b>${p.name}</b><div class="muted">${p.cat} · ${p.tags.slice(0,2).join(' / ')}</div><div class="row"><strong>${yen(p.price)}〜</strong><button class="btn" onclick="like(event,${p.id})">${s.fav.includes(p.id)?'♥':'♡'}</button></div></div></article>`}function like(e,id){e.preventDefault();e.stopPropagation();let i=s.fav.indexOf(id);i<0?s.fav.push(id):s.fav.splice(i,1);save();toast(i<0?'お気に入りに追加':'お気に入りを解除');route(false)}function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">Design × Sticker</div><h1>お気に入りの<br>デザインを、シールに。</h1><p>作品を探す。データを買う。自分の画像から作る。クリエイターとして販売する。</p><div class="tabs"><button class="btn accent" onclick="go('search')">作品を探す</button><button class="btn" onclick="guard('create')">オリジナルシールを作る</button></div></section><h2>人気のデザイン</h2><div class="grid">${ps.slice(0,8).map(card).join('')}</div>`}function search(){app.innerHTML=`<h1>商品を探す</h1><section class="panel"><div class="field"><label>キーワード</label><input id="q"></div><div id="subs"></div><button class="btn" onclick="addSub()">＋ サブ検索バーを追加</button><div class="split"><div class="field"><label>カテゴリ</label><select id="cat"><option value="">すべて</option><option>アート</option><option>動物</option><option>植物</option></select></div><div class="field"><label>素材</label><select><option>すべて</option><option>耐水PET</option><option>上質紙</option></select></div></div><button class="btn" id="advBtn" onclick="$('#adv').classList.toggle('hidden')">詳細検索</button><div id="adv" class="hidden split"><div class="field"><label>用途</label><select><option>すべて</option><option>屋外</option><option>PC・スマホ</option></select></div><div class="field"><label>評価</label><select><option>指定なし</option><option>4.5以上</option></select></div><div class="field"><label>価格上限</label><input type="number" placeholder="3000"></div><div class="field"><label>AI作品</label><select><option>含む</option><option>除外</option></select></div></div><button class="btn accent" onclick="doSearch()">検索</button></section><h2>検索結果</h2><div class="grid" id="results">${ps.map(card).join('')}</div>`}function addSub(){let d=document.createElement('div');d.className='split';d.innerHTML='<div class="field"><label>条件</label><select class="logic"><option>AND</option><option>OR</option></select></div><div class="field"><label>サブキーワード</label><input class="subq"></div>';$('#subs').appendChild(d)}function doSearch(){let q=$('#q').value.toLowerCase(),cat=$('#cat').value,r=ps.filter(p=>(!q||(p.name+' '+p.tags.join(' ')).toLowerCase().includes(q))&&(!cat||p.cat===cat));let subs=[...document.querySelectorAll('.subq')];subs.forEach((x,i)=>{let v=x.value.toLowerCase();if(!v)return;let logic=document.querySelectorAll('.logic')[i].value;if(logic==='AND')r=r.filter(p=>(p.name+' '+p.tags.join(' ')).toLowerCase().includes(v));else{let add=ps.filter(p=>(p.name+' '+p.tags.join(' ')).toLowerCase().includes(v));r=[...new Map([...r,...add].map(p=>[p.id,p])).values()]}});$('#results').innerHTML=r.map(card).join('');toast(`${r.length}件見つかりました`)}function globalSearch(){go('search');setTimeout(()=>{$('#q').value=$('#gq').value;doSearch()},30)}function login(){app.innerHTML=`<section class="panel"><h1>ログイン</h1><div class="field"><label>デモアカウント</label><select id="role"><option value="buyer">購入者</option><option value="creator">クリエイター</option><option value="admin">管理者</option></select></div><div class="field"><label>メールアドレス</label><input value="demo@example.test"></div><div class="field"><label>パスワード</label><input type="password" value="Demo123!"></div><button class="btn accent" onclick="loginDo()">ログイン</button></section>`}function loginDo(){let r=$('#role').value;s.user={role:r,name:r==='admin'?'管理者':r==='creator'?'Haru Creator':'デモ購入者',email:'demo@example.test'};save();toast('ログインしました');go(r==='admin'?'admin':r==='creator'?'creatorDash':'home')}function account(){app.innerHTML=`<h1>アカウント</h1><section class="panel"><div class="row"><span>表示名</span><b>${s.user.name}</b></div><div class="row"><span>メール</span><b>${s.user.email}</b></div><div class="row"><span>権限</span><b>${s.user.role}</b></div><div class="tabs"><button class="btn" onclick="go('settings')">設定</button><button class="btn" onclick="go('orders')">注文履歴</button><button class="btn accent" onclick="go('logout')">ログアウト</button></div></section>`}function logout(){app.innerHTML=`<section class="panel"><h1>ログアウト</h1><p>このアカウントからログアウトしますか？</p><div class="tabs"><button class="btn" onclick="go('account')">キャンセル</button><button class="btn accent" onclick="logoutDo()">ログアウトする</button></div></section>`}function logoutDo(){s.user=null;save();toast('ログアウトしました');go('home')}function settings(){app.innerHTML=`<h1>設定</h1><section class="panel tree"><details><summary>表示・アクセシビリティ</summary><div class="treebody"><div class="field"><label>テーマ</label><select id="theme" onchange="setv('theme',this.value)"><option value="system">端末設定</option><option value="light">ライト</option><option value="dark">ダーク</option></select></div><div class="field"><label>文字サイズ</label><input type="range" min="85" max="130" value="${s.settings.size}" onchange="setv('size',+this.value)"></div><div class="field"><label>アクセントカラー</label><input type="color" value="${s.settings.accent}" onchange="setv('accent',this.value)"></div></div></details><details><summary>言語</summary><div class="treebody"><select><option>日本語</option><option>English</option><option>한국어</option><option>简体中文</option></select></div></details><details><summary>通知</summary><div class="treebody"><label><input type="checkbox" checked> 注文・発送通知</label><br><label><input type="checkbox" checked> 新作通知</label></div></details><details><summary>プライバシー</summary><div class="treebody">閲覧履歴・レコメンド・データ管理</div></details></section>`;$('#theme').value=s.settings.theme}function setv(k,v){s.settings[k]=v;save()}function admin(){app.innerHTML=`<h1>管理者ダッシュボード</h1><div class="stats"><div class="stat"><b>1,248</b>ユーザー</div><div class="stat"><b>342</b>今月注文</div><div class="stat"><b>12</b>審査待ち</div></div><section class="panel"><h2>管理メニュー</h2><div class="grid"><button class="btn">商品審査</button><button class="btn">注文管理</button><button class="btn">ユーザー管理</button><button class="btn">売上管理</button></div></section>`}function creatorDash(){app.innerHTML=`<h1>クリエイターダッシュボード</h1><div class="stats"><div class="stat"><b>${yen(45300)}</b>今月売上</div><div class="stat"><b>320</b>DL数</div><div class="stat"><b>1,248</b>お気に入り</div></div><section class="panel"><h2>販売中の商品</h2>${[...ps.filter((_,i)=>i%3===0).slice(0,4),...s.created].map(p=>`<div class="row"><span>${p.name}</span><span>${yen(p.price)}</span></div>`).join('')}<button class="btn accent" onclick="go('sell')">新しい商品を販売する</button></section>`}function sell(){app.innerHTML=`<h1>商品を販売する</h1><p class="muted">検索に見つかりやすい商品情報まで設定できます。</p><section class="panel"><div class="stepbar"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div><div class="split"><div><div class="field"><label>商品名</label><input id="sn" placeholder="例：星空と山の風景ステッカー"></div><div class="field"><label>商品説明</label><textarea rows="5" placeholder="特徴・用途・デザインの説明"></textarea></div><div class="field"><label>カテゴリ</label><select id="sc"><option>アート</option><option>動物</option><option>植物</option><option>ビジネス</option></select></div><div class="field"><label>検索タグ（カンマ区切り）</label><input id="stags" placeholder="星空, 山, 夜, 青, キャンプ"></div><div class="field"><label>検索用キーワード</label><input placeholder="夜景 星空 山岳 アウトドア"></div></div><div><div class="field"><label>販売形式</label><select><option>データ＋シール</option><option>データのみ</option><option>シールのみ</option></select></div><div class="field"><label>素材</label><select><option>耐水PET</option><option>上質紙</option><option>透明PET</option></select></div><div class="field"><label>形状</label><select><option>自由形</option><option>円形</option><option>四角</option></select></div><div class="field"><label>用途</label><select><option>PC・スマホ</option><option>屋外</option><option>梱包</option></select></div><div class="field"><label>価格</label><input id="sp" type="number" value="500"></div><label><input type="checkbox"> AI生成作品</label><br><label><input type="checkbox" checked> 商用利用を許可</label></div></div><button class="btn accent" onclick="publish()">審査申請する</button></section>`}function publish(){let n=$('#sn').value.trim();if(!n)return toast('商品名を入力してください');s.created.push({id:1000+Date.now(),name:n,cat:$('#sc').value,tags:$('#stags').value.split(',').map(x=>x.trim()).filter(Boolean),price:+$('#sp').value||500,c:'#ffb66e'});save();toast('審査申請しました');go('creatorDash')}function create(){app.innerHTML=`<h1>オリジナルシールを作る</h1><section class="panel"><div class="field"><label>画像</label><input type="file" accept="image/*"></div><div class="split"><div class="field"><label>サイズ</label><select><option>50×50mm</option><option>70×70mm</option></select></div><div class="field"><label>素材</label><select><option>耐水PET</option><option>上質紙</option></select></div></div><button class="btn accent" onclick="toast('カートに追加しました')">カートへ追加</button></section>`}function favorites(){let r=ps.filter(p=>s.fav.includes(p.id));app.innerHTML=`<h1>お気に入り</h1><div class="grid">${r.map(card).join('')||'まだありません'}</div>`}function product(id){let p=ps.find(x=>x.id==id)||s.created.find(x=>x.id==id);app.innerHTML=`<div class="split"><div class="art" style="--c:${p.c};border-radius:20px;font-size:100px">✦</div><section><div class="eyebrow">${p.cat}</div><h1>${p.name}</h1><p>${p.tags.join(' / ')}</p><h2>${yen(p.price)}〜</h2><button class="btn accent" onclick="s.cart.push(${p.id});save();toast('カートに追加しました')">カートに追加</button></section></div>`}function cart(){app.innerHTML=`<h1>カート</h1><section class="panel">${s.cart.length?s.cart.map(id=>`<div class="row"><span>商品 #${id}</span><b>¥500</b></div>`).join(''):'カートは空です'}</section>`}function orders(){app.innerHTML='<h1>注文履歴</h1><section class="panel">デモ注文 ORD-20260809-001　<span class="badge">配送済み</span></section>'}function route(top=true){let [p,id]=(location.hash.slice(2)||'home').split('/');if(['account','logout','settings','orders'].includes(p)&&!s.user){go('login');return}if(['admin'].includes(p)&&s.user?.role!=='admin'){go('home');return}if(['creatorDash','sell'].includes(p)&&s.user?.role!=='creator'){go('home');return}({home,search,login,account,logout,settings,admin,creatorDash,sell,create,favorites,cart,orders}[p]||(()=>p==='product'&&product(id)))();save();if(top)requestAnimationFrame(()=>scrollTo({top:0,left:0,behavior:'instant'}))}window.addEventListener('hashchange',()=>route(true));save();route(true);</script></body></html>
