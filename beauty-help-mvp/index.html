<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beauty Help MVP</title></head><body style="font-family:-apple-system,sans-serif;background:#f5f2ec;color:#1c1a18;padding:24px">Beauty Help MVP を読み込み中…<script>(async()=>{try{const files=['p0_0.txt','p0_1.txt','p0_2.txt','p0_3.txt','payload1.txt','payload2.txt','payload3.txt'];const b64=(await Promise.all(files.map(x=>fetch(x).then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()})))).join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<h1>読み込みに失敗しました</h1><pre>'+String(e)+'</pre>'}})()</script></body></html>
