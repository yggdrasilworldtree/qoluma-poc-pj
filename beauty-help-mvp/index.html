<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffdfc"><title>SALON LINK</title></head><body style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fffdfc;color:#27211f;padding:24px">SALON LINK を読み込み中…<script>(async()=>{try{const files=['v3_00.txt', 'v3_01.txt', 'v3_02.txt', 'v3_03.txt', 'v3_04.txt'];const b64=(await Promise.all(files.map(x=>fetch(x+'?v=3').then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()})))).join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<h1>読み込みに失敗しました</h1><p>Safariで再読み込みしてください。</p><pre>'+String(e)+'</pre>'}})()</script></body></html>
