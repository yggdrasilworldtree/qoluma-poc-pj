<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><title>Beauty Help MVP</title></head><body style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f2ec;color:#1c1a18;padding:24px">Beauty Help MVP を読み込み中…<script>(async()=>{try{const files=["v2c_00.txt", "v2c_01.txt", "v2c_02.txt", "v2c_03.txt", "v2c_04.txt", "v2c_05.txt", "v2c_06.txt", "v2c_07.txt", "v2c_08.txt", "v2c_09.txt", "v2c_10.txt", "v2c_11.txt", "v2c_12.txt", "v2c_13.txt", "v2c_14.txt", "v2c_15.txt", "v2c_16.txt"];const b64=(await Promise.all(files.map(x=>fetch(x+'?v=2').then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()})))).join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<h1>読み込みに失敗しました</h1><p>Safariでページを再読み込みしてください。</p><pre>'+String(e)+'</pre>'}})()</script></body></html>
